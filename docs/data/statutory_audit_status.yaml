apply_elderly_credit_before_1987:
  source: '26 CFR 1.37-2 (2002 edition, govinfo.gov, Treasury regulation for the former IRC 37 credit for the elderly, with 1977 examples): credit is 15 percent of the section 37 amount; initial amount
    $2,500 for a single person and $3,750 on a joint return of two people 65 or older; reduced by Social Security and railroad retirement benefits and by one-half of AGI over $7,500 (single) or $10,000
    (joint: ''since the adjusted gross income ... is not greater than $10,000, no reduction''); a married person gets it only on a joint return, which statutory mode now applies before 1984 (it had given
    married separate returns half the joint amounts); 1984-86 amounts $5,000 / $7,500 / $3,750 and the $7,500 / $10,000 / $5,000 income limits are IRC 22 (law.cornell.edu/uscode/text/26/22); the 1977 regulation
    examples show the amounts for 1977, and the amounts are taken as unchanged through 1983 (not separately checked for each year); checked 2026-11-14'
  status: verified
apply_federal_investment_income_limit_to_wisconsin_eitc_per_statute:
