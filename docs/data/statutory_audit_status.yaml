# Verdicts for the statutory side of each switch (status: logic | verified | partial | unverified | no_switch).
count_colorado_credit_children_per_statute:
  source: 'Colorado DOR child tax credit page and Family Affordability Tax Credit coverage: FATC up to 3,200 per child under 6 and 2,400 per child 6-16 in 2024 and 2025, phase-out 85,000 single / 95,000
    joint; CTC AGI limits 75,000/85,000 (2024) and 77,000/87,000 (2025); numbers from news and agency summaries, not the DR 0104CN text; checked 2026-11-13'
  status: partial
count_other_property_income_from_2024:
  source: IRC 32(i)(2) (same rule, applied to the 2024 on federal routine); checked 2026-11-13
  status: verified
count_other_property_income_in_eitc_disqualified_income_per_statute:
  source: 'IRC 32(i)(2): disqualified income includes interest, dividends, net rent and royalty income, capital gain net income and passive activity income, so other property income counts in every year;
    checked 2026-11-13'
  status: verified
count_vermont_child_credit_by_statutory_age:
  source: 'Vermont Dept of Taxes, 2025 tax changes and Act 71 of 2025: child credit up to $1,000 for a child under 6 before 2025 and age 6 or younger from 2025; checked 2026-11-13'
  status: verified
double_kentucky_standard_deduction_for_joint_returns:
  source: Kentucky Form 740 gives one standard deduction amount by year that does not vary by filing status; no source found that a joint return takes two, so TAXSIM's one-per-return was not shown wrong.
    Statutory mode now uses it (switch removed); 2026-11-14
  status: no_switch
exclude_hawaii_pensions:
  source: 'Hawaii Schedule J instructions: pension distributions after 1997 are exempt to the extent attributable to employer contributions; the part traceable to the employee''s own contributions is taxable.
    Statutory mode excludes all of the pension input, which overstates the exemption when part of the pension is employee-funded (the inputs cannot say); checked 2026-11-13'
  status: partial
exclude_transfers_from_provisional_income:
  source: 'IRC 86(b)(2): provisional income is modified AGI plus tax-exempt interest plus half of benefits; transfers are not in it; checked 2026-11-13'
  status: verified
exempt_pennsylvania_pensions_from_age_65_per_statute:
  source: Pennsylvania exempts retirement distributions from the plan's retirement age (REV-636) with no fixed age and no per-person rule the inputs can apply, so TAXSIM's reading (a couple's pension to
    the spouse 55 or older, exempt from 60) is a defensible implementation and was not shown wrong. Statutory mode now uses it; the switch was removed; 2026-11-14
  status: no_switch
file_kentucky_combined_returns_per_statute:
  source: Allocating non-wage income between spouses on a combined return is a modelling convention, so TAXSIM's split was not shown wrong; to be moved to KEEP_TAXSIM_BEHAVIOR once the Rust engine can run
    TAXSIM's split (not yet ported); 2026-11-14
  status: partial
floor_child_credit_phaseout_at_zero:
  source: 'IRC 24(b): the credit is reduced by $50 per $1,000 of income over the threshold and cannot go below zero (it is a reduction of the credit amount); checked 2026-11-13'
  status: verified
halve_salt_phaseout_for_separate_returns_per_statute:
  source: 'IRC 164(b)(7): separate returns get half the cap and half the threshold ($20,000 / $250,000 for 2025; $20,200 / $252,500 for 2026); secondary summaries; checked 2026-11-13'
  status: verified
index_salt_cap_from_2026:
  source: 'IRC 164(b)(7) as amended by the 2025 reconciliation act: cap $40,000 for 2025, $40,400 for 2026 (1% a year), phase-down threshold $500,000 / $505,000 at 30% to a $10,000 floor; figures from several
    secondary summaries (the revenue procedure does not cover it); checked 2026-11-13'
  status: verified
keep_itemized_inputs_when_taking_standard_deduction:
  source: 'IRC 63(b), (e): a taxpayer who elects the standard deduction takes no itemized deductions; checked 2026-11-13'
  status: verified
leave_missouri_federal_tax_deduction_uncapped_before_1994:
  source: 'RSMo 143.171 (as amended; text quoted in Missouri bills such as SB 806 (2014) and HB 571 (2017)): the $5,000 per-individual cap applies to tax years beginning on or after January 1, 1994, so
    earlier years are uncapped as statutory mode computes; checked 2026-11-13'
  status: verified
leave_out_one_time_state_rebates:
  source: Rebates are payments by the state, not tax liability, so statutory mode leaves them out by design; not a legal question
  status: partial
limit_arkansas_low_income_table_to_its_range:
  source: 'Arkansas AR1000F instructions (2023): the low-income tax tables apply when total income from all sources is within the table''s limits; the table range and the step table below it were not compared
    with the form; checked 2026-11-13'
  status: partial
pay_kansas_credits_per_statute:
  source: ''
  status: unverified
pay_kansas_homestead_refund_from_2007_per_statute:
  source: 'Kansas Dept of Revenue K-40H booklets 2008-2025 (ksrevenue.gov/pdf/k-40hbookYY.pdf): refund is a percentage of property tax, maximum $700, income limit by year (29,700 in 2008 ... 36,600 in 2021,
    37,750 / 40,500 / 42,600 / 43,389 for 2022-2025), percentage table identical to the 1997-2021 rows in the parameters (100% to 6,000 down to 5%); senior relief income limits 16,800 (2008) ... 25,380
    (2025). The 2022-2025 limits were missing from the parameters and were added; checked 2026-11-13'
  status: verified
pay_minnesota_property_tax_refund_through_2023:
  source: Minnesota Form M-1PR (homestead credit refund, renter's property tax refund) is a real refundable credit in these years; the refund tables have not been compared line by line; checked 2026-11-13
  status: partial
pay_new_york_empire_child_credit_per_statute:
  source: 'NY Tax Dept Empire State child credit page and IT-213 instructions: 330 per child at least 4 and under 17, with children under 4 added at 330 before 2025 and 1,000 from 2025; phase-out over 75,000
    / 110,000. The pre-2018 statutory rules (which years counted children under 4 and 4-16) were not compared line by line; checked 2026-11-13'
  status: partial
phase_out_amt_exemption_at_half_rate_from_2026:
  source: 'Rev. Proc. 2025-32 (irs.gov/pub/irs-drop/rp-25-32.pdf) section 3.10: 2026 AMT exemption $140,200 joint / $90,100 single / $70,100 separate with phaseout starting at $1,000,000 / $500,000 / $500,000
    and complete at $1,280,400 / $680,200 / $640,200, which implies a 50% phaseout rate ((1,280,400-1,000,000) x 50% = 140,200); checked 2026-11-13'
  status: verified
subtract_state_tax_in_georgia_itemized_deduction:
  source: 'Georgia Form 500 and Schedule 1 (IT-511 booklet): state income tax claimed on federal Schedule A is added back, and Georgia keeps a 10,000 SALT limit; confirmed from Georgia DOR forms and Intuit/TurboTax
    expert answers, IT-511 text itself not read; checked 2026-11-13'
  status: partial
tax_nebraska_before_1987_per_statute:
  source: 'Nebraska Legislature, individual income tax chronology (nebraskalegislature.gov/app_rev/source/chrono_incometax.htm): through 1986 the tax was a percentage of federal liability, 18/16/18/15/15/18/20/19/20/19%
    for 1977-86, identical to federal_tax_share in ne/income_tax.yaml; checked 2026-11-13'
  status: verified
use_additional_medicare_separate_threshold:
  source: 'IRC 3101(b)(2): the Additional Medicare Tax threshold is $125,000 for a married individual filing a separate return ($250,000 joint, $200,000 other); checked 2026-11-13'
  status: verified
use_colorado_statutory_sales_tax_refund:
  source: 'Senior housing credit: Colorado DOR page (tax.colorado.gov/income-qualified-senior-housing-income-tax-credit) and HB22-1205 summary (leg.colorado.gov): $1,000 (2022) / $800 (2024) refundable
    to 65+, reduced per $500 of AGI over $25,000, halved per spouse on joint returns, exactly TAXSIM''s formula, so it is now computed in both modes (no switch). The other parts (sales tax refund steps
    vs interpolation, 2000-01 child credit age) are TAXSIM logic; checked 2026-11-13'
  status: partial
use_form_8995a_qbi_streams:
  source: IRS Form 8995-A and its instructions (qualified business income by trade or business, separate W-2 wage and UBIA limits); checked 2026-11-13
  status: verified
use_maine_year_standard_deduction:
  source: 'Maine 2012 1040ME booklet and conformity summary: Maine conformed its standard deduction to the federal amount from 2012; earlier years used Maine''s own amounts (joint 9,800 against 15,000 under
    conformity in the fiscal summary). The amounts statutory mode uses for 1989-2011 are not yet compared with the Maine booklets; checked 2026-11-13'
  status: partial
use_published_capital_gains_thresholds:
  source: 'Rev. Proc. 2025-32 (irs.gov/pub/irs-drop/rp-25-32.pdf) section 3.03 (2026: 0% to $98,900 joint, $49,450 single or separate, $66,200 head of household; 15% to $613,700 / $545,500 / $306,850 /
    $579,600), matching the parameters; earlier years Rev. Proc. 2021-45 (2022: 20% above $459,750 single) and later yearly revenue procedures; checked 2026-11-13'
  status: verified
use_published_dependent_standard_deduction_minimum:
  source: 'IRC 63(c)(5)(A) and the yearly revenue procedures: minimum $650 in 1995-1996, $1,150 in 2022, $1,250 in 2023, $1,350 in 2026 (Rev. Proc. 2025-32 section 3.14); checked 2026-11-13'
  status: verified
