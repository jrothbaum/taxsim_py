# Earned income credit from 2000: a share of the federal credit for filers
# with qualifying children. Source for 2022 on: PolicyEngine-US
# gov.states.dc.tax.income.credits.eitc.with_children.match.
eitc_federal_share: {2000: 0.10, 2001: 0.25, 2005: 0.35, 2008: 0.40, 2022: 0.70, 2025: 1.0}
# From 2015, DC's own credit for childless filers: `phase_in_rate` of earned
# income up to `max_credit`, less `phaseout_rate` of the higher of earned
# income and AGI above `phaseout_start`; none above `max_earned`, with
# investment income above `disqualified_income_limit`, under `minimum_age`
# (or over `maximum_age` with a spouse under it; 2021: under 19 only).
# 2022 on: the federal childless maximum and phaseout start, and the D-40
# investment income limit.
