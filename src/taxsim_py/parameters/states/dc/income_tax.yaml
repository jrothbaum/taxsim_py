# District of Columbia individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`dctax`/`dcstax`); 2022 on, D.C. Code
# Title 47 Chapter 18, D-40 and Schedule H instructions and PolicyEngine-US
# `gov.states.dc.tax.income`. The campaign contribution credit has no
# TAXSIM input.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Rate schedules, [start of bracket, rate]. Source for 2022 on:
# PolicyEngine-US gov.states.dc.tax.income.rates.
brackets:
  1977: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.05], [4000, 0.06], [5000, 0.07], [10000, 0.08], [13000, 0.09], [17000, 0.10], [25000, 0.11]]
  1987: [[0, 0.06], [10000, 0.08], [20000, 0.10]]
  1988: [[0, 0.06], [10000, 0.08], [20000, 0.095]]
  2000: [[0, 0.05], [10000, 0.075], [20000, 0.095]]
  2001: [[0, 0.05], [10000, 0.075], [30000, 0.093]]
  2005: [[0, 0.05], [10000, 0.075], [30000, 0.09]]
  2006: [[0, 0.045], [10000, 0.07], [40000, 0.087]]
  2007: [[0, 0.04], [10000, 0.06], [40000, 0.085]]
  2012: [[0, 0.04], [10000, 0.06], [40000, 0.085], [350000, 0.0895]]
  2015: [[0, 0.04], [10000, 0.06], [40000, 0.07], [60000, 0.085], [350000, 0.0895]]
  2016: [[0, 0.04], [10000, 0.06], [40000, 0.065], [60000, 0.085], [350000, 0.0875], [1000000, 0.0895]]
  2022: [[0, 0.04], [10000, 0.06], [40000, 0.065], [60000, 0.085], [250000, 0.0925], [500000, 0.0975], [1000000, 0.1075]]
# Joint returns pay the lesser of the joint tax and the tax on each earner's
# share. TAXSIM uses this older schedule for the split in 2007 only.
earner_split_brackets:
  2007: [[0, 0.045], [10000, 0.07], [40000, 0.085]]
  2008: null

# --- Standard deduction ---
# Through 1981: a share of AGI up to the cap, halved on separate returns.
standard_deduction_percent:
  1977: {rate: 0.1, cap: 1000}
  1982: null
# 1982-2014 a flat amount halved on separate returns; 2015-2017 by filing
# status (separate returns get the `single` amount). From 2018 the federal
# standard deduction.
standard_deduction:
  1982: 1000
  1987: 2000
  2006: 2500
  2008: 4000
  2013: 4100
  2014: 4150
  2015: {married_joint: 8350, head_of_household: 6500, single: 5200}
  2017: {married_joint: 10275, head_of_household: 7800, single: 5650}
  2018: null
# 2008-2009: property tax up to this amount per taxpayer is added.
standard_deduction_property_tax_addition: {2008: 500, 2010: null}
# From 2025 DC keeps the federal amounts before the 2025 federal increase
# (PolicyEngine-US gov.states.dc.tax.income.deductions.standard).
standard_deduction_nonconforming:
  2025: {single: 15000, married_joint: 30000, head_of_household: 22500}

# --- Itemized deductions ---
# Itemized deductions fall by `rate` of AGI above `threshold` (halved on
# separate returns).
itemized_reduction: {threshold: 200000, rate: 0.05}
# From 2018 property, other and state taxes are deductible up to this
# amount per return (halved on separate returns).
state_tax_deduction_cap: {2018: 10000}

# --- Exemptions ---
# Per taxpayer, dependent and taxpayer 65 or older (heads of household get
# one more); none for dependent filers or from 2018.
personal_exemption: {1977: 750, 1987: 885, 1988: 1025, 1989: 1160, 1990: 1270, 1991: 1370, 2006: 1500, 2008: 1675, 2014: 1725, 2015: 1775, 2018: 0}
# 2015-2017: exemptions fall by `share_per_band` for each `band` (halved on
# separate returns) of AGI above `floor`, and end above `ceiling`.
exemption_phaseout:
  2015: {floor: 150000, ceiling: 275000, band: 2500, share_per_band: 0.02}
  2018: null

# --- Credits ---
# Child and dependent care credit: a share of the federal credit before its
# liability limit.
child_care_credit_federal_share: {1982: 0.30, 1989: 0.32}

# Property tax credit (Schedule H). Rent counts at `property_credit_rent_share`
# (through 2021 the larger of property tax and the rent share; from 2022
# their sum). Dependent filers under 65 get none.
property_credit_rent_share: {1977: 0.15, 2014: 0.20}
# Through 2013: property tax less a share of household income, up to `cap`,
# for household income up to `income_limit`. Taxpayers 65 or older: the share
# is `aged_base_rate` plus income / `aged_rate_income` percent. Others:
# (`base_pct` + income / `divisor`) percent, and the result times
# `low_income_share` below `low_income_limit` and `share` above.
property_credit_by_income:
  1977:
    cap: 750
    income_limit: 20000
    aged_base_rate: 0.01
    aged_rate_income: 20000
    base_pct: 1.5
    divisor: 8000
    low_income_limit: 3000
    low_income_share: 0.95
    share: 0.75
  2014: null
# 2014-2021: property tax less `low_rate` of AGI below `low_income` (and for
# taxpayers 65 or older up to `aged_income_limit`); above it `rate` (from
# 2019 `rate` up to `middle_income` and `high_rate` above) up to
# `income_limit`; at most `max`.
property_credit_rates: {low_income: 25000, low_rate: 0.03, rate: 0.04, middle_income: 52000, high_rate: 0.05}
property_credit_limits:
  2014: {income_limit: 40000, aged_income_limit: 60000, max: 1000}
  2016: {income_limit: 50000, aged_income_limit: 60000, max: 1000}
  2017: {income_limit: 50500, aged_income_limit: 61900, max: 1025}
  2018: {income_limit: 51000, aged_income_limit: 62600, max: 1025}
  2019: {income_limit: 55000, aged_income_limit: 75000, max: 1200}
  2020: {income_limit: 55700, aged_income_limit: 75900, max: 1200}
  2021: {income_limit: 56200, aged_income_limit: 76700, max: 1225}
  2022: null
# From 2022: AGI rate tiers (upper bounds, with no credit above the last
# finite bound) for filers under and over `elderly_age`, up to `max`.
# Source: PolicyEngine-US gov.states.dc.tax.income.credits.ptc.
property_credit_schedule:
  2022:
    max: 1250
    nonelderly_upper_bounds: [25000, 52000, 57600, .inf]
    nonelderly_rates: [0.03, 0.04, 0.05, 0.0]
    elderly_upper_bounds: [78600, .inf]
    elderly_rates: [0.03, 0.0]
    elderly_age: 70
    rent_share: 0.20
  2023:
    max: 1325
    nonelderly_upper_bounds: [25000, 52000, 61300, .inf]
    nonelderly_rates: [0.03, 0.04, 0.05, 0.0]
    elderly_upper_bounds: [83700, .inf]
    elderly_rates: [0.03, 0.0]
    elderly_age: 70
    rent_share: 0.20
  2024:
    max: 1375
    nonelderly_upper_bounds: [25000, 52000, 63900, .inf]
    nonelderly_rates: [0.03, 0.04, 0.05, 0.0]
    elderly_upper_bounds: [87100, .inf]
    elderly_rates: [0.03, 0.0]
    elderly_age: 70
    rent_share: 0.20
  2025:
    max: 1425
    nonelderly_upper_bounds: [25000, 52000, 66000, .inf]
    nonelderly_rates: [0.03, 0.04, 0.05, 0.0]
    elderly_upper_bounds: [90000, .inf]
    elderly_rates: [0.03, 0.0]
    elderly_age: 70
    rent_share: 0.20


