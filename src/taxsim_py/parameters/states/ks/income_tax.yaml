# From 2008, property tax relief for low-income seniors replaces it: this
# share of property tax when household income is under the limit.
senior_property_relief_share: {2008: 0.45, 2011: 0.75}
senior_property_relief_income_limit: {2008: 16800, 2009: 17500, 2011: 17700, 2012: 18200, 2013: 18600, 2014: 18900, 2015: 19100, 2016: 19200, 2017: 19500, 2018: 19800, 2019: 20300, 2020: 20700, 2021: 20900}

# Food sales tax refund. Through 1985: `amount` per taxpayer 65 or older (up
# to the number of exemptions) at household income up to `income_limit`.
food_refund_aged:
  1977: {amount: 20, income_limit: 10000}
  1986: null
# 1986-1997: [income limit, base, per additional exemption]; the first two
# limits are exclusive, the last inclusive.
food_refund_tiers:
  1986: [[5000, 40, 30], [10000, 30, 25], [13000, 20, 15]]
  1998: null
# From 1998, with a dependent or taxpayer 65 or older: per exemption, twice
# the amount up to the AGI ceiling and the amount up to twice it (from 2013
# the amount up to the ceiling). Repealed for 2025.
food_sales_tax_credit_amount: {1998: 30.0, 1999: 30.0, 2000: 30.0, 2001: 30.0, 2002: 30.0, 2003: 36.0, 2004: 36.0, 2005: 36.0, 2006: 37.0, 2007: 38.0, 2008: 39.0, 2009: 41.0, 2010: 45.0, 2011: 45.0, 2012: 47.0, 2013: 125.0, 2025: 0.0}
