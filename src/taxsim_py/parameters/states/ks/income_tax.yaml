# Kansas individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`kstax`); 2022 on, K.S.A. 79-32 and
# PolicyEngine-US `gov.states.ks.tax.income`. Not modeled (no TAXSIM input):
# blindness, medical and casualty deductions and the energy credit.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Rate schedules, [start of bracket, rate]. A single schedule: joint returns
# are taxed on half their income, doubled, or on each earner's share if
# lower. By status: `joint` for joint returns, `other` for the rest.
brackets:
  1977: [[0, 0.02], [2000, 0.035], [3000, 0.04], [5000, 0.05], [7000, 0.065], [10000, 0.075], [20000, 0.085], [25000, 0.09]]
  1988:
    other: [[0, 0.048], [27500, 0.061]]
    joint: [[0, 0.0405], [35000, 0.053]]
  1990:
    other: [[0, 0.045], [27500, 0.0595]]
    joint: [[0, 0.0365], [35000, 0.0515]]
  1992:
    other: [[0, 0.044], [20000, 0.075], [30000, 0.0775]]
    joint: [[0, 0.035], [30000, 0.0625], [60000, 0.0645]]
  1997:
    other: [[0, 0.041], [20000, 0.075], [30000, 0.0775]]
    joint: [[0, 0.035], [30000, 0.0625], [60000, 0.0645]]
  1998:
    other: [[0, 0.035], [15000, 0.0625], [30000, 0.0645]]
    joint: [[0, 0.035], [30000, 0.0625], [60000, 0.0645]]
  2013: [[0, 0.03], [15000, 0.049]]
  2014: [[0, 0.027], [15000, 0.048]]
  2015: [[0, 0.027], [15000, 0.046]]
  2017: [[0, 0.029], [15000, 0.049], [30000, 0.052]]
  2018: [[0, 0.031], [15000, 0.0525], [30000, 0.057]]
  2024:
    other: [[0, 0.052], [23000, 0.0558]]
    joint: [[0, 0.052], [46000, 0.0558]]
# 2015-2023: no tax at taxable income up to these amounts. From 2024: no tax
# at Kansas AGI up to `zero_tax_agi`.
zero_tax_taxable_income:
  2015: {single: 5000, joint: 12500}
  2018: {single: 2500, joint: 5000}
  2024: null
zero_tax_agi:
  2024: {joint: 26560, other: 12765}

# --- Income ---
# Social Security benefits are exempt at federal AGI up to this amount.
social_security_agi_limit: {2007: 50000, 2008: 75000, 2024: 1.0e+20}
# Federal tax deduction: in full through 1982 and 1987-1988; 1983-1984 up to
# `cap` per taxpayer, `cap` again up to `upper_cap`, and half above;
# 1985-1986 in proportion to Kansas AGI; none from 1989.
federal_tax_deduction_caps:
  1983: {cap: 5000, upper_cap: 10000}
  1985: null

# --- Deductions ---
# Through 1987: `rate` of AGI between a floor and a cap (`married` halved on
# separate returns; `single` covers head of household).
standard_deduction_percent:
  1977:
    rate: 0.16
    single: {floor: 1700, cap: 2400}
    married: {floor: 2100, cap: 2800}
  1988: null
standard_deduction:
  1988: {single: 3000, married_joint: 5000, head_of_household: 4400, married_separate: 2500}
  1998: {single: 3000, married_joint: 6000, head_of_household: 4500, married_separate: 3000}
  2013: {single: 3000, married_joint: 7500, head_of_household: 5500, married_separate: 3750}
  2021: {single: 3500, married_joint: 7800, head_of_household: 6000, married_separate: 4000}
  2022: {single: 3500, married_joint: 8000, married_separate: 4000, head_of_household: 6000}
  2024: {single: 3605, married_joint: 8240, married_separate: 4120, head_of_household: 6180}
# Additional standard deduction per taxpayer 65 or older (single-type,
# married-type).
aged_standard_deduction: {1988: [750, 600], 1998: [850, 700]}
# From 1998 a dependent filer's standard deduction is at most the greater of
# this and earned income.
dependent_standard_deduction_minimum: {1998: 500}
# Through 1987 payroll and self-employment tax are deductible up to these
# amounts per taxpayer (no cap 1985-1987).
payroll_tax_deduction_cap:
  1977: {payroll: 965.25, self_employment: 1303.5}
  1978: {payroll: 1070.8, self_employment: 1433.7}
  1979: {payroll: 1403.8, self_employment: 1854.9}
  1980: {payroll: 1587.7, self_employment: 2097.9}
  1981: {payroll: 1975.05, self_employment: 2405.7}
  1982: {payroll: 2170.8, self_employment: 3029.4}
  1983: {payroll: 2391.9, self_employment: 3337.95}
  1984: {payroll: 2532.6, self_employment: 4271.4}
  1985: null
# 1991-2009 itemized limitation: the state tax deduction is reduced in the
# share of the federal limitation, `rate` of AGI above the threshold (times
# `itemized_limitation_index`, halved on separate returns) at most
# `cap_rate` of itemized deductions.
itemized_limitation:
  1991: {threshold: 100000, rate: 0.03, cap_rate: 0.8}
  2010: null
itemized_limitation_index: {1991: 1.0, 1992: 1.0525, 1993: 1.0845, 1994: 1.118, 1995: 1.147, 1996: 1.1795, 1997: 1.212, 1998: 1.245, 1999: 1.266, 2000: 1.2895, 2001: 1.3295, 2002: 1.373, 2003: 1.395, 2004: 1.427, 2005: 1.4595, 2006: 1.505, 2007: 1.564, 2008: 1.5995, 2009: 1.668}
# From 2013 itemized deductions are scaled by this share.
itemized_scaling: {2013: 0.7, 2014: 0.65, 2015: 0.5, 2019: 0.75, 2020: 1.0}

# --- Exemptions ---
# Per federal exemption, plus one for a head of household. From 2024 by
# filing status, plus an amount per dependent and a head-of-household
# addition.
personal_exemption: {1977: 750, 1979: 1000, 1988: 1950, 1989: 2000, 1998: 2250}
exemptions_by_status:
  2024:
    by_status: {single: 9160, married_joint: 18320, married_separate: 9160, head_of_household: 9160}
    dependent: 2320
    head_of_household_addition: 2320

# --- Credits ---
# Child care credit: a share of the federal credit (up to regular tax), by
# Kansas AGI ([AGI, share] interpolated) or a single share; none 2013-2018.
child_care_credit_federal_share:
  1977:
    - [5000, 1.0]
    - [6000, 0.9]
    - [7000, 0.8]
    - [8000, 0.7]
    - [9000, 0.6]
    - [10000, 0.5]
    - [11000, 0.4]
    - [12000, 0.3]
    - [13000, 0.2]
    - [14000, 0.1]
    - [100000000, 0.0]
  1988: 0.25
  2013: 0
  2019: 0.1875
  2020: 0.25

