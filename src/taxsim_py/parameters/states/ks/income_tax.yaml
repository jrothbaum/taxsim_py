homestead_refund_income_limit: {1997: 25001, 2004: 26301, 2005: 27001, 2006: 28001, 2007: 29101, 2008: 29701, 2009: 31301, 2010: 30801, 2011: 31201, 2012: 32401, 2013: 32901, 2014: 33401, 2015: 34001, 2016: 34101, 2017: 34451, 2018: 35000, 2019: 35700, 2020: 36300, 2021: 36600}
