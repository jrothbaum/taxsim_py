# full amount up to `homestead_full_refund_income`, otherwise up to `cap`
# less the reduction schedule ([income, rate] brackets).
homestead_rent_share: {1977: 0.12, 1979: 0.15, 1997: 0.2, 2008: 0.15, 2013: 0.0}
homestead_refund:
