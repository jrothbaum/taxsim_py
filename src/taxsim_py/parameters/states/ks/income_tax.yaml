  1979: [[0, 0.0], [3400, 0.01], [3500, 0.02], [4000, 0.03], [4600, 0.04], [8600, 0.05]]
  1989: [[0, 0.0], [3400, 0.02], [4200, 0.04], [4600, 0.045]]
# From 1997: property tax (up to `homestead_property_tax_cap`) times a share
