# Colorado individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`cotax`); 2022 on, C.R.S. Title 39
# Article 22, DR 0104 instructions and PolicyEngine-US
# `gov.states.co.tax.income`. Not modeled (no TAXSIM input): the investment,
# energy and targeted-jobs credits, and the 1999-2001 child tax credit.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# --- Tax ---
# Through 1986 Colorado computes its own taxable income and applies these
# schedules, [start of bracket, rate], with starts times `indexing_factor`;
# the tax is then multiplied by `tax_multiplier`.
brackets:
  1977: [[0, 0.025], [1000, 0.03], [2000, 0.035], [3000, 0.04], [4000, 0.045], [5000, 0.05], [6000, 0.055], [7000, 0.06], [8000, 0.065], [9000, 0.07], [10000, 0.075]]
  1979: [[0, 0.025], [1000, 0.03], [2000, 0.035], [3000, 0.04], [4000, 0.045], [5000, 0.05], [6000, 0.055], [6500, 0.06], [8000, 0.065], [9000, 0.075], [10000, 0.08]]
  1984: [[0, 0.03], [1000, 0.035], [2000, 0.04], [3000, 0.045], [4000, 0.05], [5000, 0.055], [6000, 0.06], [6500, 0.065], [8000, 0.07], [9000, 0.075], [10000, 0.08]]
  1987: null
tax_multiplier: {1977: 1.0, 1979: 0.90, 1980: 0.80, 1981: 0.84, 1982: 1.0, 1987: null}
indexing_factor: {1977: 1.0, 1978: 1.060, 1979: 1.1342, 1980: 1.236278, 1981: 1.33518, 1982: 1.415291, 1986: 1.420, 1987: null}
# From 1987: a flat rate on federal taxable income with Colorado's
# additions and subtractions. Source for 2022 on: PolicyEngine-US
# gov.states.co.tax.income.rate.
flat_rate: {1987: 0.05, 1999: 0.0475, 2000: 0.0463, 2019: 0.045, 2020: 0.0455, 2021: 0.045, 2022: 0.044, 2023: 0.044, 2024: 0.0425, 2025: 0.044}
# Minimum tax from 1987: this rate on the federal AMT base, when larger
# than the regular tax.
amt_rate: {1987: 0.0375, 2000: 0.0347}
# Surcharge through 1986: `rate` of interest and dividends above
# `threshold_per_taxpayer`.
investment_income_surcharge:
  1977: {rate: 0.02, threshold_per_taxpayer: 5000}
  1979: {rate: 0.02, threshold_per_taxpayer: 15000}
  1987: null

# --- Income, through 1986 ---
# Interest and dividends excluded per taxpayer, 1980-1986.
interest_exclusion_per_taxpayer: {1980: 200, 1987: null}
dividend_exclusion_per_taxpayer: {1980: 200, 1987: null}

# --- Pensions and Social Security ---
# Through 2021: pensions plus taxable Social Security excluded up to this
# amount per taxpayer, for returns with a taxpayer 65 or older.
pension_exclusion: {1977: 3000, 1978: 4000, 1979: 5000, 1982: 20000, 2000: 24000, 2022: null}
# From 2022 (C.R.S. 39-22-104(4)(f)-(g); DR 0104AD): each taxpayer
# subtracts pension income up to the cap for their age, less their Social
# Security subtraction. Taxpayers 65 or older subtract all taxable Social
# Security; those 55-64 subtract it within `cap_younger`, or in full when
# federal AGI is at most `social_security_full_agi_limit` (HB24-1142).
pension_subtraction:
  2022:
    age_older: 65
    age_younger: 55
    cap_older: 24000
    cap_younger: 20000
    social_security_full_agi_limit: {joint: 0, other: 0}
  2025:
    age_older: 65
    age_younger: 55
    cap_older: 24000
    cap_younger: 20000
    social_security_full_agi_limit: {joint: 95000, other: 75000}

# --- Deductions and exemptions, through 1986 ---
# Through 1979: the federal percentage standard deduction and low-income
# allowance, before `indexing_factor`.
standard_deduction_percent:
  1977:
    rate: 0.1
    cap: 1000
    cap_separate: 500
    allowance_separate_base: 100
    allowance_separate_cap: 500
    allowance_base: 200
    allowance_per_exemption: 100
    allowance_cap: 1000
    allowance_bonus: 800
    bonus_income_floor: 1000
    bonus_income_per_exemption: 750
    bonus_phaseout_rate: 0.5
  1980: null
# 1980-1986: a flat amount times `indexing_factor`, halved on separate
# returns.
standard_deduction: {1980: 1000, 1987: null}
# Gasoline tax added to itemized deductions through 1986, per taxpayer and
# per dependent.
gasoline_tax_deduction:
  1977: {per_taxpayer: 49, per_dependent: 26}
  1987: null
# Exemption per federal exemption, times `indexing_factor` where `indexed`.
personal_exemption:
  1977: {amount: 750, indexed: false}
  1978: {amount: 850, indexed: true}
  1987: null

# --- Subtractions from 1987 ---
# 2000-2002 marriage penalty subtraction for joint returns, less the federal
# standard deduction (or itemized deductions).
marriage_penalty_subtraction: {2000: 8800, 2001: 9100, 2002: 9400, 2003: null}
# 2001-2002 joint returns: subtraction per taxpayer 65 or older.
aged_marriage_subtraction: {2001: 900, 2003: null}
# From 2022: federal deductions above `limit_joint`/`limit_other` are added
# back when federal AGI exceeds `agi_threshold` (2022: itemized deductions
# only), as is the qualified business income deduction above the QBI AGI
# limits.
high_income_addback:
  2022: {agi_threshold: 400000, limit_joint: 60000, limit_other: 30000, itemized_only: true, qbi_agi_limit_joint: 1000000, qbi_agi_limit_other: 500000}
  2023: {agi_threshold: 300000, limit_joint: 16000, limit_other: 12000, itemized_only: false, qbi_agi_limit_joint: 1000000, qbi_agi_limit_other: 500000}

# --- Credits ---
# Through 1986, property tax and heating credits for taxpayers 65 or older,
# by household income (doubled for married separate filers): the maximum,
# reduced at `phaseout_rate` above the start, up to property tax plus
# `property_credit_rent_share` of rent (heating: `heating_credit_rent_share`
# of rent, from 1979), zero above the income limit. `single` covers head of
# household.
property_credit:
  maximum: {1977: 410, 1980: 500}
  phaseout_start: {single: {1977: 3000, 1978: 3300, 1980: 5000}, other: {1977: 4300, 1978: 6700, 1980: 8700}}
  phaseout_rate: {1977: 0.10, 1980: 0.20}
  income_limit: {single: {1977: 7300, 1980: 7500}, other: {1977: 8300, 1978: 10800, 1980: 11200}}
property_credit_rent_share: 0.2
# 1977 adds `rate` of property tax plus `rent_share` of rent.
property_credit_addition:
  1977: {rate: 0.1, rent_share: 0.15}
  1978: null
heating_credit:
  maximum: 160
  phaseout_start: {single: {1977: 3000, 1978: 3300, 1980: 5000}, other: {1977: 4300, 1978: 6700, 1980: 8700}}
  phaseout_rate: {1977: 0.04, 1978: 0.064}
heating_credit_rent_share: 0.1
# 1977-1979 food credit per person by AGI per person, [AGI, amount]
# interpolated, times `indexing_factor`. From 1978 separate returns get the
# last amount.
food_credit:
  1977:
    - [3000, 16.0]
    - [4000, 11.0]
    - [1.0e+20, 7.0]
  1980: null

# Sales tax refund (TABOR) per taxpayer by modified AGI, including all
# Social Security: a flat amount, or [AGI, amount] rows interpolated
# through 2021 and steps from 2022. Source for 2022 on: PolicyEngine-US
# gov.states.co.tax.income.credits.sales_tax_refund.
sales_tax_refund:
  1977: 0
  1997: [[15000, 37], [100000, 60], [1.0e+20, 80]]
  1998: [[20000, 142], [50000, 195], [95000, 276], [1.0e+20, 384]]
  1999: [[25000, 159], [50000, 212], [75000, 244], [100000, 290], [125000, 312], [1.0e+20, 502]]
  2000: [[26000, 182], [53000, 245], [78000, 288], [103000, 325], [126000, 363], [1.0e+20, 574]]
  2001: [[27000, 144], [56000, 187], [83000, 220], [110000, 252], [135000, 283], [1.0e+20, 451]]
  2002: 0
  2005: 15
  2006: 0
  2015: [[36000, 13], [77000, 18], [120000, 21], [163000, 23], [204000, 24], [1.0e+20, 41]]
  2016: 0
  2021: [[44000, 37], [88000, 49], [139000, 56], [193000, 68], [246000, 74], [1.0e+20, 117]]
  2022: [[-1.0e+99, 153], [48001, 208], [95001, 234], [151001, 285], [209001, 300], [268001, 486]]
  2023: 0
  2024: [[-1.0e+99, 177], [53001, 240], [105001, 277], [166001, 323], [233001, 350], [302001, 565]]
  2025: [[-1.0e+99, 19], [52001, 25], [105001, 29], [168001, 35], [233001, 37], [299001, 59]]

# Child care credit: a share of the federal credit (up to regular tax) by
# federal AGI, a single share or [AGI, share] rows interpolated; 2000-2001
# less `child_care_credit_dependent_offset` per dependent.
child_care_credit_federal_share:
  1977: 0
  1996: [[25000, 0.5], [35000, 0.3], [60000, 0.1], [1.0e+20, 0.0]]
  1998: 0.5
  1999: [[60000, 0.5], [1.0e+20, 0.0]]
  2000: [[64000, 0.7], [1.0e+20, 0.0]]
  2002: [[25000, 0.5], [35000, 0.3], [60000, 0.1], [1.0e+20, 0.0]]
child_care_credit_dependent_offset: {2000: 300, 2002: null}

# Earned income credit: a share of the federal credit. Source for 2022 on:
# PolicyEngine-US gov.states.co.tax.income.credits.eitc.match.
eitc_federal_share: {1977: 0, 1999: 0.085, 2000: 0.10, 2002: 0, 2015: 0.10, 2022: 0.20, 2023: 0.50}
# From 2022 childless filers qualify from this age instead of 25 (the
# homeless and foster-youth exception at 18 has no input).
eitc_minimum_age: {2022: 19}

# Refundable child tax credit from 2022 for children under six, by AGI and
# filing status, [AGI, amount] steps. 2022-2023 the amount is a share of
# the federal credit for those children (amount / federal flat amount);
# from 2024 a flat amount per child. Source: PolicyEngine-US
# gov.states.co.tax.income.credits.ctc.amount.
child_tax_credit_amount:
  2022:
    single: [[-1.0e+99, 1200], [25000, 600], [50000, 200], [75000, 0]]
    head_of_household: [[-1.0e+99, 1200], [25000, 600], [50000, 200], [75000, 0]]
    married_joint: [[-1.0e+99, 1200], [35000, 600], [60000, 200], [85000, 0]]
    married_separate: [[-1.0e+99, 1200], [25000, 600], [50000, 200], [75000, 0]]
  2025:
    single: [[-1.0e+99, 1200], [26000, 600], [51000, 200], [77000, 0]]
    head_of_household: [[-1.0e+99, 1200], [26000, 600], [51000, 200], [77000, 0]]
    married_joint: [[-1.0e+99, 1200], [36000, 600], [61000, 200], [87000, 0]]
    married_separate: [[-1.0e+99, 1200], [26000, 600], [51000, 200], [77000, 0]]

# Family Affordability Credit from 2024 (HB24-1311), refundable: `amount`
# per child under 6 and `older_child_share` of it for ages 6-16, reduced by
# `reduction_rate` of the maximum for each `reduction_increment` (or part)
# of federal AGI above the threshold. Source: PolicyEngine-US
# gov.states.co.tax.income.credits.family_affordability.
family_affordability_credit:
  2024:
    amount: 3200
    older_child_share: 0.75
    reduction_rate: 0.06875
    reduction_increment: 5000
    reduction_threshold: {single: 15000, head_of_household: 15000, married_separate: 15000, married_joint: 25000}
  2025:
    amount: 3273
    older_child_share: 0.75
    reduction_rate: 0.06875
    reduction_increment: 5000
    reduction_threshold: {single: 15000, head_of_household: 15000, married_separate: 15000, married_joint: 26000}
