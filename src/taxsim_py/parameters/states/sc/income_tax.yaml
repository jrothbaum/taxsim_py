# South Carolina individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`sctax`); 2022 on, S.C. Code Title 12
# Chapter 6, SC1040 instructions and PolicyEngine-US `gov.states.sc.tax.income`.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# --- Rate schedule ---
# [start of bracket, rate], thresholds times `bracket_index`; 1985-1986 single
# and married (everyone else) schedules on income after the exemption. 2022 on:
# S.C. Code 12-6-510; source PolicyEngine-US gov.states.sc.tax.income.rates.
brackets:
  1977: [[0, 0.02], [2000, 0.03], [4000, 0.04], [6000, 0.05], [8000, 0.06], [10000, 0.07]]
  1985:
    single:
      - [0, 0.02]
      - [1600, 0.025]
      - [2600, 0.03]
      - [3600, 0.036]
      - [4600, 0.04]
      - [5600, 0.046]
      - [6600, 0.05]
      - [7600, 0.055]
      - [8600, 0.06]
      - [9600, 0.064]
      - [10600, 0.07]
    married: [[0, 0.02], [2000, 0.03], [4000, 0.04], [6000, 0.05], [8000, 0.06], [10000, 0.066], [12000, 0.07]]
  1987: [[0, 0.03], [4000, 0.04], [6000, 0.05], [8000, 0.06], [10000, 0.07]]
  1990: [[0, 0.0275], [2030, 0.03], [4060, 0.04], [6090, 0.05], [8120, 0.06], [10150, 0.07]]
  1991: [[0, 0.025], [2000, 0.03], [4000, 0.04], [6000, 0.05], [8000, 0.06], [10000, 0.07]]
  2001:
    - [0, 0.025]
    - [2000, 0.028]
    - [3000, 0.03]
    - [4000, 0.032]
    - [5000, 0.04]
    - [6000, 0.041]
    - [7000, 0.048]
    - [9000, 0.057]
    - [11000, 0.0655]
    - [13000, 0.07]
  2002: [[0, 0.025], [2400, 0.03], [4800, 0.04], [7200, 0.05], [9600, 0.06], [12000, 0.07]]
  2009: [[0, 0.0], [2400, 0.03], [4800, 0.04], [7200, 0.05], [9600, 0.06], [12000, 0.07]]
  2022: [[0, 0.0], [3200, 0.03], [16040, 0.065]]
  2023: [[0, 0.0], [3330, 0.03], [16680, 0.064]]
  2024: [[0, 0.0], [3460, 0.03], [17330, 0.062]]
  2025: [[0, 0.0], [3560, 0.03], [17830, 0.06]]
# Index for bracket thresholds (and through 1984 the deductions and exemption).
bracket_index:
  1977: 1.0
  1984: 1.009
  1985: 1.0
  1991: 1.111
  1996: 1.125
  1997: 1.14
  1998: 1.155
  2001: 1.0
  2002: 0.9625
  2003: 1.0
  2005: 1.025
  2006: 1.054
  2007: 1.0708
  2008: 1.0958
  2009: 1.1125
  2010: 1.1417
  2011: 1.15
  2012: 1.167
  2013: 1.1875
  2014: 1.2
  2016: 1.21666
  2017: 1.22083
  2018: 1.2375
  2019: 1.279167
  2022: 1.0

# --- Through 1984: South Carolina's own AGI and deductions ---
# Long-term gains counted at this share in place of the federal gain.
long_term_gain_share: {1977: 0.5, 1985: null}
# Interest and dividend exclusion per taxpayer.
interest_dividend_exclusion: {1982: 200.0, 1985: null}
# Standard deduction: a share of AGI up to a cap per taxpayer.
standard_deduction_share:
  1977: {rate: 0.1, cap_per_taxpayer: 500.0}
  1985: null
# Federal income tax deducted, up to this per taxpayer.
federal_tax_deduction_cap: {1977: 500.0, 1985: null}
# Gasoline tax deduction per taxpayer.
gasoline_deduction: {1977: 78.0, 1980: 91.0, 1981: 101.0, 1982: null}
# Charitable contributions limited to this share of AGI.
charity_limit_share: {1977: 0.3, 1983: 0.2, 1984: 0.1, 1985: null}
# Child care deduction: expenses up to the base plus an amount per dependent (up
# to the maximum), less a share of AGI above the phaseout start.
child_care_deduction:
  1977:
    base: 1200.0
    per_dependent: 1200.0
    max_dependents: 3.0
    phaseout_agi: 18000.0
    phaseout_rate: 0.5
  1985: null
# Through 1984 per federal exemption (one more for heads of household);
# 1985-1986
# by single or married, subtracted before the tax table.
exemption_amount:
  1977: 800.0
  1985: {single: 2400.0, married: 3550.0}
  1986: {single: 2550.0, married: 3700.0}
  1987: null
# Through 1983: no tax for a return with a taxpayer 65 or older and income up to
# the limit (higher with dependents).
aged_no_tax_limit:
  1977: {alone: 2800, with_dependents: 4000}
  1984: null
# 1984: food credit per person.
food_credit: {1984: 12.5, 1985: null}

# --- From 1985: federal taxable income ---
# State income tax added back for federal itemizers, 1991-2017 reduced in
# proportion to the federal limitation above the threshold times the index
# (halved on separate returns; from 2013 times the status factor).
itemized_limit_threshold: {1991: 100000.0, 2013: 250000.0, 2018: null}
itemized_limit_index:
  1991: 1.0
  1992: 1.0525
  1993: 1.0845
  1994: 1.118
  1995: 1.147
  1996: 1.1795
  1997: 1.212
  1998: 1.245
  1999: 1.266
  2000: 1.2895
  2001: 1.3295
  2002: 1.373
  2003: 1.395
  2004: 1.427
  2005: 1.4595
  2006: 1.505
  2007: 1.564
  2008: 1.5995
  2009: 1.668
  2010: 1.6955
  2012: 1.7365
  2013: 1.0
  2014: 1.0168
  2015: 1.033
  2016: 1.0376
  2017: 1.046
itemized_limit_status_factor:
  2013: {single: 1.0, married_joint: 1.2, head_of_household: 1.1, married_separate: 0.6}
# 2018-2024 the federal SALT cap; from 2025 the state and local taxes the
# federal return actually deducted.
salt_cap: {2018: 10000.0, 2025: null}
# Long-term capital gain deduction share.
capital_gain_deduction: {1990: 0.14, 1991: 0.29, 1995: 0.44}
# 2003: the married federal standard deduction above this is added back.
married_standard_deduction_addback: {2003: 7950.0, 2004: null}
# Federal charitable deduction for nonitemizers added back: 2020 per return
# (halved on separate returns), 2021 per taxpayer.
charity_nonitemizer_addback: {2020: 300.0, 2022: null}
# From 2025 South Carolina has not adopted the July 2025 federal law (SC1040
# instructions): filers who took the federal standard deduction add back the
# part that law added, and every filer adds back the federal senior deduction.
federal_standard_deduction_increase_addback:
  2025: {single: 750, married_joint: 1500, head_of_household: 1125, married_separate: 750}
# From 2018, exemption per dependent and per child under six.
dependent_exemption:
  2018: 4110.0
  2019: 4190.0
  2020: 4260.0
  2021: 4300.0
  2022: 4430.0
  2023: 4610.0
  2024: 4790.0
  2025: 4930
# Retirement income deduction from 1983: pensions up to this per taxpayer; from
# 1993 taxpayers 65 or older get the higher amount (a joint return with one such
# taxpayer gets one of each); from 1999 returns with a taxpayer 65 or older
# deduct the age amount per such taxpayer whatever their income.
retirement_deduction_per_taxpayer: {1983: 1200, 1985: 2100, 1986: 3000}
retirement_deduction_aged_per_taxpayer: {1993: 10000}
aged_deduction_per_taxpayer: {1999: 15000}

# --- Credits (nonrefundable) ---
# Child care credit: a share of expenses up to an amount per child (two
# children), from 2002 capped per child; none on separate returns.
child_care_rate: 0.07
child_care_expense_per_child: {1977: 2000.0, 1987: 2400.0, 2002: 3000.0}
child_care_cap_per_child: {2002: 168.0, 2003: 210.0}
# From 1987, two-earner credit on the lower earner's earnings up to the maximum.
two_earner_credit_rate: 0.007
two_earner_earnings_max:
  1987: 30000.0
  2018: 33333.0
  2019: 36667.0
  2020: 40000.0
  2021: 43333.0
  2022: 46667.0
  2023: 50000.0
# From 2018, earned income credit as a share of the federal credit.
eitc_rate: {2018: 0.2083, 2019: 0.4167, 2020: 0.625, 2021: 0.833, 2022: 1.0417, 2023: 1.25}
