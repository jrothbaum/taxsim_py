# Alabama individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`altax`); 2022 on, Alabama Code Title 40
# Chapter 18, ADOR Form 40 instructions and PolicyEngine-US
# `gov.states.al.tax.income`. The solar energy credit and other items with
# no TAXSIM input are not modeled.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Rate schedule, [start of bracket, rate]. From 1982 joint returns are taxed
# on half their income and the tax doubled.
brackets:
  1977: [[0, 0.015], [1000, 0.03], [3000, 0.045], [5000, 0.05]]
  1982: [[0, 0.02], [500, 0.04], [3000, 0.05]]

# --- Standard deduction ---
# Through 2006: a percentage of AGI, capped per taxpayer.
standard_deduction_percent:
  1977: {rate: 0.10, cap_per_taxpayer: 1000}
  1982: {rate: 0.20, cap_per_taxpayer: 2000}
  2007: null
# 2007-2021: falls linearly from the maximum to the minimum as AGI rises
# from `income_floor` to `income_ceiling`. The minimum is per taxpayer; the
# income range and the married maximum are halved on separate returns.
standard_deduction_phasedown:
  2007:
    income_floor: 20500
    income_ceiling: 30000
    min_per_taxpayer: 2000
    max: {single: 2500, head_of_household: 4700, married: 7500}
  2019:
    income_floor: 23500
    income_ceiling: 33000
    min_per_taxpayer: 2000
    max: {single: 2500, head_of_household: 4700, married: 7500}
  2022: null
# From 2022 (Act 2022-297): the maximum less `reduction` for each
# `increment` of AGI above `threshold`, but not below the minimum.
# Source: ADOR Form 40 instructions.
standard_deduction_steps:
  2022:
    single: {minimum: 2500, maximum: 3000, threshold: 25500, increment: 500, reduction: 25}
    head_of_household: {minimum: 2500, maximum: 5200, threshold: 25500, increment: 500, reduction: 135}
    married_joint: {minimum: 5000, maximum: 8500, threshold: 25500, increment: 500, reduction: 175}
    married_separate: {minimum: 2500, maximum: 4250, threshold: 12750, increment: 500, reduction: 88}

# --- Exemptions ---
personal_exemption:
  joint_or_hoh: 3000
  other: 1500
dependent_exemption_flat: {1977: 300, 2007: null}
# From 2007, per dependent by AGI: `high` up to the first breakpoint, `mid`
# up to the second, `low` above. Through 2021 TAXSIM moves linearly between
# the amounts; from 2022 they are steps. Act 2022-297 raised the first
# breakpoint.
dependent_exemption_by_agi:
  2007: {high: 1000, mid: 500, low: 300, breakpoints: [20000, 100000]}
  2022: {high: 1000, mid: 500, low: 300, breakpoints: [50000, 100000]}

# --- Adjustments to income ---
# 2011-2012 federal self-employment tax deduction during the payroll tax
# holiday, as TAXSIM rounds it: a rate on the tax up to the threshold, then
# half the tax plus a flat amount. Other years add back half the tax.
se_deduction_holiday:
  2011: {threshold: 14204, rate: 0.5751, flat: 1067}
  2013: null
# Retirement income exemption per taxpayer 65 or older (source:
# PolicyEngine-US gov.states.al.tax.income.exemptions.retirement).
retirement_exemption_cap: {2022: 6000}
