# Bracket thresholds are multiplied by this index for every schedule...
bracket_index:
  1977: 1
  1979: 1
  1980: 1.1
  1981: 1.2
  1982: 1.3
  1986: 1
  1998: 1
  1999: 1.016
  2000: 1
  2001: 1
  2002: 1.0677
  2003: 1.0867
  2004: 1.1105
  2005: 1
# ...except 2014-2018, when single and head-of-household thresholds use this one
# instead (the joint schedule is not indexed in TAXSIM).
single_bracket_index: {2014: 1, 2015: 1.017, 2016: 1.019, 2017: 1.03, 2018: 1.05, 2019: null}
# 1979 tax reduction: a share of tax up to the cap.
tax_reduction:
  1979: {rate: 0.16, cap: 900}
  1980: null
# 1983 surtax multiplier.
surtax: {1983: 1.1, 1984: null}

# --- Income ---
# Through 1981 a net capital loss is reduced: for losses above -`range` per
# taxpayer, AGI changes by min(loss floored at -`limit` per taxpayer, minus
# `share` of the loss, 0). TAXSIM uses only the long-term loss when the
# short-term result is a loss.
capital_loss_reduction:
  1977: {range_per_taxpayer: 2000, limit_per_taxpayer: 1000, share: 0.5}
  1982: null
# From 1987 net capital losses above this amount are added back.
capital_loss_limit: {1987: 500}
# Through 1983, share of the federal capital gain exclusion added back to AGI.
capital_gain_exclusion_addback: {1977: 1.0, 1982: 0.6666666666666666, 1983: 0.3333333333333333, 1984: null}
# Share of long-term gains excluded from income (subtracted from 1987).
capital_gain_exclusion: {1977: 0.5, 1978: 0.6, 1982: 0.4, 1983: 0.2, 1984: 0, 1987: 0.4, 2009: 0.3}
# Unemployment compensation is taxable up to half of federal AGI above a base.
unemployment_base: {single: 12000, married_joint: 18000, married_separate: 0, head_of_household: 12000}
unemployment_share: 0.5
# 2021: unemployment above half of federal AGI over this base is subtracted.
unemployment_subtraction_base:
  2021: {married_joint: 18000, other: 12000}
  2022: null
# From 2011, child and dependent care expenses (with a federal credit) per
# child, two children.
child_care_subtraction_per_child: {2011: 750, 2012: 1500, 2013: 2250, 2014: 3000}

# --- Standard deduction and exemptions ---
# Through 1978: a share of AGI, capped, plus the dependent add-on. Through 1985
# also at least the low-income deduction.
standard_deduction_share:
  1977: {rate: 0.15, cap: 2000}
  1979: null
