# Dependent filers: at most earned income plus an addition, with a floor.
dependent_standard_deduction: {floor: 1050, earned_addition: 350}
# From 2000, exemption per taxpayer and dependent, and per taxpayer 65 or older.
exemption: {2000: 600, 2001: 700}
exemption_aged: {2000: 200, 2001: 250}

# --- Credits ---
# From 1986 itemized deductions (charity and mortgage interest) above the
# standard deduction give a credit at this rate.
itemized_credit_rate: {1986: 0.05}
# Personal exemption credits through 1999: through 1985 per taxpayer, taxpayer
# 65 or older and dependent, plus one for heads of household; 1986-1996 per
# taxpayer 65 or older and dependent; 1997-1999 the aged credit phases out over
# `width` of household income above a limit (joint returns: per aged taxpayer,
# phased out once).
exemption_credit:
  1977: {taxpayer: 20, aged: 5, dependent: 20, head_of_household: 20}
  1986: {aged: 25, dependent: 50}
  1997:
    dependent: 50
    aged: 25
    phaseout_rate: 0.025
    width: 1000
    income_limit: {single: 30000, head_of_household: 30000, married_joint: 40000, married_separate: 20000}
  2000: null
# School property tax credit. 1978: renters get the renter amount; owners a
# share of property tax between the minimum and maximum. From 1979 owners get
# the owner rate per divisor of property tax and renters the renter rate (which
# multiplies the renter indicator, not rent, as TAXSIM does), up to the
# maximum (halved on separate returns).
school_property_credit_flat:
  1978: {renter: 40, rate: 0.1, minimum: 40, maximum: 100}
  1979: null
school_property_credit_max: {1979: 149, 1983: 99, 1986: 158, 1987: 138, 1988: 170, 1989: 200, 1998: 350, 1999: 0, 2000: 300}
school_property_credit_owner_rate: {1979: 1.2, 1983: 1, 1986: 0.785, 1987: 0.69, 1988: 0.85, 1989: 1, 1998: 1.4, 1999: 0, 2000: 1.22}
school_property_credit_renter_rate: {1979: 2.4, 1983: 2, 1986: 1.58, 1987: 1.38, 1988: 1.7, 1989: 2, 1998: 2.8, 1999: 0, 2000: 2.4}
school_property_credit_renter_divisor: 100
school_property_credit_owner_divisor: 10
# 1984-1985 child care credit: a share of the federal credit.
child_care_credit_share: {1984: 0.3, 1986: null}
# Working families credit from 1998: the whole tax up to an income limit per
# taxpayer, then (intercept - slope * AGI) times tax after other credits.
working_families_credit:
  1998:
    full_income_per_taxpayer: 9000
    income_limit: {other: 10000, married_joint: 19000}
    intercept: {other: 10, married_joint: 19}
    slope: 0.001
# Earned income credit as a share of the federal credit: 1984-1985 one share;
# from 1989 by number of dependents (refundable).
eitc_share:
  1984: 0.3
  1986: null
  1989: {one: 0.05, two: 0.25, three: 0.75}
  1995: {one: 0.04, two: 0.16, three: 0.5}
  1996: {one: 0.04, two: 0.14, three: 0.43}
  2011: {one: 0.04, two: 0.11, three: 0.34}
# 1994: an own schedule on earned income by number of dependents, phased out
# above a start.
eitc_own_schedule:
  1994:
    phaseout_start: 12570
    one: {rate: 0.012, maximum: 92, phaseout_rate: 0.008}
    two: {rate: 0.063, maximum: 499, phaseout_rate: 0.045}
    three: {rate: 0.188, maximum: 1496, phaseout_rate: 0.134}
  1995: null

# --- Minimum tax ---
# 1981-1985, when itemized deductions exceed the threshold: a rate on
# preferences (excluded capital gains and deductions above a share of AGI)
# above an exemption. 1986 a share of the federal minimum tax.
