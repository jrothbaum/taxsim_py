# Missouri individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`motax`); 2022 on, RSMo Chapter 143,
# MO-1040 instructions and PolicyEngine-US `gov.states.mo.tax.income`.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Rate schedule, [start of bracket, rate], with starts times
# `bracket_inflation`. Married couples may instead be taxed as two returns,
# each on their share of income. Source for 2022 on: PolicyEngine-US
# gov.states.mo.tax.income.rates.

brackets:
  1977: [[0, 0.015], [1000, 0.02], [2000, 0.025], [3000, 0.03], [4000, 0.035], [5000, 0.04], [6000, 0.045], [7000, 0.05], [8000, 0.055], [9000, 0.06]]
  2018: [[0, 0.015], [1000, 0.02], [2000, 0.025], [3000, 0.03], [4000, 0.035], [5000, 0.04], [6000, 0.045], [7000, 0.05], [8000, 0.055], [9000, 0.059]]
  2019: [[0, 0.015], [1000, 0.02], [2000, 0.025], [3000, 0.03], [4000, 0.035], [5000, 0.04], [6000, 0.045], [7000, 0.05], [8000, 0.054]]
  2022: [[0, 0.015], [1121, 0.02], [2242, 0.025], [3363, 0.03], [4484, 0.035], [5605, 0.04], [6726, 0.045], [7847, 0.05], [8968, 0.053]]
  2023: [[0, 0.0], [1207, 0.02], [2414, 0.025], [3621, 0.03], [4828, 0.035], [6035, 0.04], [7242, 0.045], [8449, 0.0495]]
  2024: [[0, 0.0], [1273, 0.02], [2546, 0.025], [3819, 0.03], [5092, 0.035], [6365, 0.04], [7638, 0.045], [8911, 0.048]]
  2025: [[0, 0.0], [1313, 0.02], [2626, 0.025], [3939, 0.03], [5252, 0.035], [6565, 0.04], [7878, 0.045], [9191, 0.047]]
bracket_inflation:
  1977: 1.0
  2017: 1.008
  2018: 1.028
  2019: 1.053
  2020: 1.073
  2021: 1.088
  2022: 1.0
# No tax when taxable income is below this amount (times the inflation factor).
minimum_taxable_income: {1977: 100}

# --- Exemptions ---
# Single, married joint and married separate: per taxpayer plus per
# dependent. Head of household: a flat amount plus per dependent.
exemption_per_taxpayer:
  1977: 1200
  1999: 2100
  2018: 0
exemption_head_of_household:
  1977: 2000
  1999: 3500
  2018: 0
  2022: 1400
exemption_per_dependent:
  1977: 400
  1998: 1200
  2018: 0
# 2017: an extra exemption for each spouse with income below the limit.
low_income_exemption:
  2017: {amount: 500, income_limit: 20000}
  2018: null

# --- Itemized deductions ---
# Itemizers add payroll taxes (TAXSIM `socsec`), capped per taxpayer.
payroll_tax_deduction_cap:
  1977: 965
  1978: 1071
  1979: 1404
  1980: 1588
  1981: 1975
  1982: 2170
  1983: 2391
  1984: 2533
  1985: 2791
  1986: 3003
  1987: 3132
  1988: 3380
  1989: 3605
  1990: 3925
  1991: 5123
  1992: 3411
  1993: 3571
  1994: 3757
  1995: 3794
  1996: 3887
  1997: 4055
  1998: 4241
  1999: 4501
  2000: 4724
  2001: 4985
  2002: 5264
  2003: 5394
  2004: 5450
  2005: 5580
  2006: 5840
  2007: 6000
  2008: 6324
  2009: 6621.6
  2011: 4486
  2012: 4624
  2013: 7049
  2014: 7254
  2015: 7347
  2017: 7886
  2018: 7961
  2019: 8240
  2020: 8537
  2021: 8614
# Itemizers subtract the federal deduction for half of self-employment
# tax; 1993 instead self-employment tax capped per taxpayer; 2011-2012 the
# payroll-tax-holiday deduction as TAXSIM rounds it (`lower_rate` of the tax
# up to `threshold`, else `upper_rate` plus `amount`).
self_employment_tax_deduction_rate: {1977: 0.5}
self_employment_tax_deduction_cap: {1993: 11058, 1994: null}
self_employment_tax_deduction_holiday:
  2011: {threshold: 14204, lower_rate: 0.5751, upper_rate: 0.5, amount: 1067}
  2013: null
# 1993-2017: the state income tax subtraction is reduced in proportion to
# the federal high-income limit on itemized deductions.
itemized_limit_rate: {1993: 0.03, 2018: null}
itemized_limit_max_share: {1993: 0.8}
itemized_limit_threshold_base: {1991: 100000, 2013: 250000}
itemized_limit_inflation:
  1991: 1.0
  1992: 1.0525
  1993: 1.0845
  1994: 1.118
  1995: 1.147
  1996: 1.1795
  1997: 1.212
  1998: 1.245
  1999: 1.266
  2000: 1.2895
  2001: 1.3295
  2002: 1.373
  2003: 1.395
  2004: 1.427
  2005: 1.4595
  2006: 1.505
  2007: 1.564
  2008: 1.5995
  2009: 1.668
  2010: 1.6955
  2012: 1.7365
  2013: 1.0
  2014: 1.0168
  2015: 1.033
  2016: 1.0376
  2017: 1.046
itemized_limit_status_multiplier:  # 2013-2017; earlier years divide by `sep`
  single: 1.0
  married_joint: 1.2
  married_separate: 0.6
  head_of_household: 1.1

# --- Deduction for federal income tax ---
# 1994-2018: capped per taxpayer. From 2019: a share by Missouri AGI,
# [AGI upper bound, share], none above the last bound (the cap continues in
# law but cannot bind at these shares).
federal_tax_deduction_cap_per_taxpayer: {1994: 5000, 2019: null}
federal_tax_deduction_share:
  2019: [[25000, 0.35], [50000, 0.25], [100000, 0.15], [125000, 0.05]]

# Married couples may be taxed as two separate returns: the higher earner
# takes their own wages plus this share of the couple's other income.
joint_split_other_income_share: {1977: 0.5}

# Social Security exemption (2007+): this share of taxable benefits, less
# AGI over the phaseout start (`perc`).
social_security_exemption_share:
  2007: 0.2
  2008: 0.35
  2009: 0.5
  2010: 0.65
  2011: 0.8
  2012: 1.0
social_security_exemption_phaseout_start:
  single: 85000
  married_joint: 100000

# Public pension exemption for taxpayers 65 or older (1990+). Through
# 1998 up to $1,000 when income less taxable benefits is within the limit
# (`slim`); 1999-2006 up to $6,000 when that income is within the limit
# plus $6,000 per taxpayer; from 2007 up to the Social Security maximum
# (`ssmax`, a share of pensions through 2013), less benefits exempted and
# income over the phaseout start.
pension_exemption_income_limit:
  single: 25000
  married: 32000
pension_exemption_flat: {1990: 1000, 1999: 6000, 2014: null}
pension_exemption_maximum:
  2007: 32500
  2008: 33703
  2011: 34141
  2012: 35234
  2013: 35939
  2014: 36442
  2015: 36976
  2017: 37089
  2018: 37720
  2019: 38437
  2020: 39014
  2021: 39365

# Property tax credit for taxpayers 65 or older: rent counts at this share;
# the credit is the maximum less a percentage of household income that
# rises 0.0625 points per income step above the base. Married couples
# subtract an amount from household income (`addm`; from 2008 $4,000 for
# owners plus `addm` for renters). From 2008 homeowners have their own
# limits.
property_credit_rent_share: 0.2
property_credit_income_limit:
  1977: 8500
  1982: 10000
  1984: 11000
  1985: 11500
  1986: 12000
  1987: 12500
  1988: 13000
  1989: 13500
  1990: 14000
  1991: 14500
  1992: 15000
  1998: 25000
  2008: 27500
  2019: 20000
  2020: 27200
property_credit_maximum:
  1977: 500
  1985: 750
property_credit_married_subtraction:
  1977: 500
  1989: 2000
property_credit_married_owner_subtraction: {2008: 4000}
property_credit_owner:
  2008: {income_limit: 30000, maximum: 1100, steps: 54}
property_credit_schedule:
  1977: {base: 4300, step: 200, steps: 45}
  1998: {base: 13000, step: 300, steps: 40}
  2008: {base: 14300, step: 300, steps: 45}
property_credit_rate_step: 0.000625

# Working Family Tax Credit from 2023: a nonrefundable share of the federal
# EITC, none above the investment income limit. Source: PolicyEngine-US
# gov.states.mo.tax.income.credits.wftc.
working_family_credit:
  2023: {match: 0.1, investment_income_limit: 4050}
  2024: {match: 0.2, investment_income_limit: 4300}
  2025: {match: 0.2, investment_income_limit: 4400}

# From 2025: this share of net capital gain is subtracted from taxable income.
# Source: PolicyEngine-US gov.states.mo.tax.income.subtractions.net_capital_gain.
capital_gains_subtraction: {2025: 1.0}
