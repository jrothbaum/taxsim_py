# Mississippi individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`mstax`); 2022 on, Miss. Code Title 27
# Chapter 7 and PolicyEngine-US `gov.states.ms.tax.income`. Not modeled (no
# TAXSIM input): IRA/Keogh, blindness, and charitable and medical detail
# before 1979.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Rate schedule, [start of bracket, rate]. Married couples may instead be
# taxed as two returns, each on their share. Source for 2022 on:
# PolicyEngine-US gov.states.ms.tax.income.rate.
brackets:
  1977: [[0, 0.03], [5000, 0.04]]
  1983: [[0, 0.03], [5000, 0.04], [10000, 0.05]]
  2018: [[0, 0.0], [1000, 0.03], [5000, 0.04], [10000, 0.05]]
  2019: [[0, 0.0], [2000, 0.03], [5000, 0.04], [10000, 0.05]]
  2020: [[0, 0.0], [3000, 0.03], [5000, 0.04], [10000, 0.05]]
  2021: [[0, 0.0], [4000, 0.03], [5000, 0.04], [10000, 0.05]]
  2022: [[0, 0.0], [5000, 0.04], [10000, 0.05]]
  2023: [[0, 0.0], [10000, 0.05]]
  2024: [[0, 0.0], [10000, 0.047]]
  2025: [[0, 0.0], [10000, 0.044]]

# --- Income ---
# Mississippi adds back the federal deduction for half of self-employment
# tax (2011-2012 the payroll-tax-holiday deduction as TAXSIM rounds it), then
# phases in its own deduction (a share of self-employment tax).
self_employment_tax_addback_rate:
  1977: 0.5
self_employment_tax_addback_holiday:
  2011: {threshold: 14204, lower_rate: 0.5751, upper_rate: 0.5, amount: 1067}
  2013: null
self_employment_tax_deduction_rate:
  1977: 0.0
  2017: 0.17
  2018: 0.34
  2019: 0.5
# 2020: the federal nonitemizer charitable deduction is added back.
charity_nonitemizer_addback: {2020: 300, 2021: null}

# --- Exemptions ---
# By filing status, plus per dependent and per taxpayer 65 or older; all
# halved on separate returns.
exemption:
  single:
    1977: 4500
    1979: 5250
    1981: 6000
  married_joint:
    1977: 6500
    1979: 8000
    1981: 9500
    1998: 10000
    1999: 11000
    2000: 12000
  married_separate:  # the married amount, halved with dependents below
    1977: 6500
    1979: 8000
    1981: 9500
    1998: 10000
    1999: 11000
    2000: 12000
  head_of_household:
    1977: 8000
dependent_exemption:
  1977: 750
  1979: 1500

# --- Standard deduction ---
# Through 1979: a share of AGI, capped per taxpayer. From 1980 by filing
# status (separate returns half the married amount).
standard_deduction_pct: {1977: 0.15, 1980: null}
standard_deduction_cap_per_taxpayer: {1977: 750, 1979: 1500, 1980: null}
standard_deduction:
  single:
    1980: 2300
  married_joint:
    1980: 3400
    1998: 4200
    1999: 4600
  married_separate:
    1980: 3400
    1998: 4200
    1999: 4600
  head_of_household:
    1980: 3400

# --- Itemized deductions ---
# Through 1978, excess charitable contributions over this share of AGI are
# removed from itemized deductions.
charity_agi_limit: {1977: 0.2, 1979: null}
# 1991-2017: above this AGI threshold (times the inflation factor; before
# 2013 halved on separate returns, then times the status multiplier) the
# federal limited itemized deductions less the state tax share are used.
itemized_limit_threshold_base: {1991: 100000, 2013: 250000, 2018: null}
itemized_limit_inflation:
  1991: 1.0
  1992: 1.0525
  1993: 1.0845
  1994: 1.118
  1995: 1.147
  1996: 1.1795
  1997: 1.212
  1998: 1.245
  1999: 1.266
  2000: 1.2895
  2001: 1.3295
  2002: 1.373
  2003: 1.395
  2004: 1.427
  2005: 1.4595
  2006: 1.505
  2007: 1.564
  2008: 1.5995
  2009: 1.668
  2010: 1.6955
  2012: 1.7365
  2013: 1.0
  2014: 1.0168
  2015: 1.033
  2016: 1.0376
  2017: 1.046
itemized_limit_status_multiplier:  # 2013 on; earlier years divide by `sep`
  single: 1.0
  married_joint: 1.2
  married_separate: 0.6
  head_of_household: 1.1

# Married couples may be taxed as two separate returns: the higher earner
# takes their own wages plus this share of the couple's other income.
joint_split_other_income_share: {1977: 0.5}

# Retirement income exclusion per taxpayer through 1993; all retirement
# income is excluded from 1994.
retirement_exclusion_per_taxpayer:
  1977: 5000
  1990: 6000
  1994: null
# Exemption per taxpayer 65 or older.
aged_exemption:
  1977: 750
  1979: 1500
