# Maine individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`metax`); 2022 on, 36 M.R.S. Part 8,
# Form 1040ME instructions and PolicyEngine-US `gov.states.me.tax.income`.
# Not modeled (no TAXSIM input): the IRA add-on, the solar and jobs
# credits.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Rate schedules, [start of bracket, rate], applied to taxable income
# divided by `bracket_income_divisor` (2 joint, 1.5 head of household) and
# by `bracket_inflation`; the tax is multiplied back. Source for 2022 on:
# PolicyEngine-US gov.states.me.tax.income.main.
brackets:
  1977: [[0, 0.01], [2000, 0.02], [4000, 0.04], [6000, 0.06], [8000, 0.07], [10000, 0.08], [15000, 0.09], [25000, 0.1]]
  1978: [[0, 0.01], [2000, 0.02], [4000, 0.035], [6000, 0.06], [8000, 0.07], [10000, 0.08], [15000, 0.091], [25000, 0.1]]
  1979: [[0, 0.01], [2000, 0.02], [4000, 0.03], [6000, 0.06], [8000, 0.07], [10000, 0.08], [15000, 0.092], [25000, 0.1]]
  1983: [[0, 0.01], [2000, 0.02], [4000, 0.03], [6000, 0.0585], [8000, 0.0685], [10000, 0.0796], [15000, 0.0916], [25000, 0.1]]
  1984: [[0, 0.01], [2000, 0.01975], [4000, 0.0295], [6000, 0.0575], [8000, 0.0685], [10000, 0.0792], [15000, 0.0914], [25000, 0.1]]
  1985: [[0, 0.01], [2000, 0.02], [4000, 0.029], [6000, 0.056], [8000, 0.0675], [10000, 0.0788], [15000, 0.091], [25000, 0.1]]
  1986: [[0, 0.01], [2000, 0.02], [4000, 0.0285], [6000, 0.0545], [8000, 0.067], [10000, 0.0784], [15000, 0.0908], [25000, 0.1]]
  1987: [[0, 0.01], [2000, 0.02], [4000, 0.028], [6000, 0.053], [8000, 0.0665], [10000, 0.0782], [15000, 0.0905], [25000, 0.1]]
  1988: [[0, 0.02], [6000, 0.04], [10000, 0.06], [16250, 0.08]]
  1989: [[0, 0.02], [4000, 0.045], [8000, 0.07], [16000, 0.085]]
  1991: [[0, 0.021], [4150, 0.04725], [8250, 0.0735], [16500, 0.08925], [37500, 0.0989]]
  1993: [[0, 0.02], [4000, 0.045], [8000, 0.07], [16000, 0.085]]
  2013: [[0, 0.0], [5200, 0.065], [20900, 0.0795]]
  2016: [[0, 0.058], [21050, 0.0675], [37500, 0.0715]]
  2017: [[0, 0.058], [21100, 0.0675], [50000, 0.0715]]
  2022: [[0, 0.058], [23000, 0.0675], [54450, 0.0715]]
  2023: [[0, 0.058], [24500, 0.0675], [58050, 0.0715]]
  2024: [[0, 0.058], [26050, 0.0675], [61600, 0.0715]]
  2025: [[0, 0.058], [26800, 0.0675], [63450, 0.0715]]
bracket_income_divisor: {married_joint: 2, head_of_household: 1.5, other: 1}
bracket_inflation: {1977: 1.0, 1993: 1.0375, 2002: 1.05, 2003: 1.0625, 2004: 1.0875, 2005: 1.125, 2006: 1.1375, 2007: 1.1875, 2008: 1.2125, 2009: 1.2625, 2010: 1.2375, 2011: 1.25, 2012: 1.275, 2013: 1.0, 2017: 1.0, 2018: 1.015, 2019: 1.035, 2020: 1.052, 2021: 1.063, 2022: 1.0}
# 1997-2002: no tax at taxable income up to this amount.
low_income_taxable_income_limit: {1997: 2000, 2003: null}
# Minimum tax: through 1985 and 1991-2011 a share of federal AMT above
# federal regular tax; 1986-1990 `minimum_tax_rate` of federal AMT income
# less Maine tax; both only with federal AMT.
minimum_tax_share_of_federal_amt: {1977: 0.15, 1986: null, 1991: 0.27, 2012: null}
minimum_tax_rate: {1986: 0.03, 1991: null}

# --- Income ---
# 1981: the federal interest and dividend exclusion is added back and this
# dividend exclusion per taxpayer allowed instead.
dividend_exclusion_per_taxpayer: {1981: 100, 1982: null}
# From 2000, pension deduction per taxpayer, less Social Security benefits;
# from 2025 phased out above `start` over `width` of federal AGI (36 M.R.S.
# 5122(2)(M-3)). Source for 2022 on: PolicyEngine-US
# gov.states.me.tax.income.agi.subtractions.pension_exclusion.
pension_deduction_per_taxpayer: {2000: 6000, 2014: 10000, 2022: 25000, 2023: 30000, 2024: 45864, 2025: 48216}
pension_deduction_phaseout:
  2025:
    start: {single: 125000, married_joint: 250000, head_of_household: 187500, married_separate: 125000}
    width: {single: 100000, married_joint: 100000, head_of_household: 100000, married_separate: 50000}

# --- Deductions ---
# Through 1987: `rate` of AGI between a floor and ceiling (`single` covers
# head of household; through 1982 `married` halved on separate returns, then
# its own `separate` limits). 1988: none (a credit instead). From 1989 the
# federal standard deduction.
standard_deduction_percent:
  1977:
    rate: 0.16
    single: {floor: 1700, ceiling: 2400}
    married: {floor: 2100, ceiling: 2800}
  1983:
    rate: 0.16
    single: {floor: 1700, ceiling: 2500}
    married: {floor: 2100, ceiling: 2900}
    separate: {floor: 1100, ceiling: 1400}
  1988: null
# Joint and separate returns instead (separate halved), plus
# `standard_deduction_aged_addition` per taxpayer 65 or older; 2003-2011 and
# 2013-2017.
standard_deduction_married_override: {2003: 7950, 2004: 8150, 2005: 8300, 2006: 8600, 2007: 8900, 2008: 9100, 2009: 9500, 2010: 9550, 2011: 9650, 2012: null, 2013: 10150, 2014: 12400, 2015: 12600, 2016: 23200, 2018: null}
standard_deduction_aged_addition: {2003: 1000, 2007: 1050, 2009: 1100, 2011: 1150, 2012: 1200, 2015: 1250, 2018: null}
# 2016-2017: single and head-of-household amounts, plus `aged` per taxpayer
# 65 or older.
standard_deduction_single_and_hoh:
  2016: {single: 11600, head_of_household: 17400, aged: 1550}
  2018: null
# From 2025 Maine keeps the federal amounts before the 2025 federal increase,
# plus an amount per taxpayer 65 or older.
standard_deduction_nonconforming:
  2025: {single: 15000, married_joint: 30000, head_of_household: 22500, married_separate: 15000, aged_single: 2000, aged_married: 1600}
# From 2013 itemized deductions (less the state tax share) are capped.
# Source for 2022 on: PolicyEngine-US gov.states.me.tax.income.deductions.itemized.cap.
itemized_deduction_cap: {2013: 27500, 2014: 27950, 2015: 28350, 2016: 28450, 2017: 28600, 2018: 29050, 2019: 29550, 2020: 30050, 2021: 30400, 2022: 31150, 2023: 33200, 2024: 35250, 2025: 36300}
# 2016-2017: deductions fall in proportion to AGI above `phased` over
# `threshold` (per taxpayer, except for heads of household).
deduction_phaseout_proportional:
  2016:
    head_of_household: {phased: 105000, threshold: 112500}
    per_taxpayer: {phased: 70000, threshold: 75000}
  2018: null
# From 2018: deductions fall linearly to zero over the range above the start
# (times `phaseout_index`).
deduction_phaseout_start:
  2018: {single: 80000, married_joint: 160000, head_of_household: 120000, married_separate: 80000}
  2022: {single: 85850, married_joint: 171700, married_separate: 85850, head_of_household: 128750}
  2023: {single: 91500, married_joint: 183050, married_separate: 91500, head_of_household: 137300}
  2024: {single: 97150, married_joint: 194300, married_separate: 97150, head_of_household: 145750}
  2025: {single: 100000, married_joint: 200050, married_separate: 100000, head_of_household: 150000}
deduction_phaseout_range: {single: 75000, married_joint: 150000, head_of_household: 112500, married_separate: 75000}
phaseout_index: {2018: 1.0, 2019: 1.018, 2020: 1.03625, 2021: 1.048125, 2022: 1.0}

# --- Exemptions ---
# Per federal exemption through 2012; 2013-2017 the federal exemption amount;
# from 2018 per taxpayer, phased out over `exemption_phaseout_range` (halved
# on separate returns) above the start (times `phaseout_index`), none for
# dependent filers. Source for 2022 on: PolicyEngine-US
# gov.states.me.tax.income.deductions.personal_exemption.
personal_exemption: {1977: 1000, 1978: 1200, 1979: 1000, 1988: 0, 1989: 2000, 1993: 2100, 1997: 2150, 1998: 2400, 1999: 2750, 2000: 2850, 2013: null, 2018: 4150, 2019: 4200, 2020: 4300, 2022: 4450, 2023: 4700, 2024: 5000, 2025: 5150}
exemption_phaseout_start:
  2018: {single: 266700, married_joint: 320000, head_of_household: 293350, married_separate: 160000}
  2022: {single: 286200, married_joint: 343400, married_separate: 171700, head_of_household: 314800}
  2023: {single: 305150, married_joint: 366100, married_separate: 183050, head_of_household: 335650}
  2024: {single: 323900, married_joint: 388650, married_separate: 194325, head_of_household: 356300}
  2025: {single: 333450, married_joint: 400100, married_separate: 200050, head_of_household: 366750}
exemption_phaseout_range: 125000

# --- Credits ---
# Child care credit: a share of the federal credit (up to federal tax),
# refundable up to the cap.
child_care_credit_rate: {1977: 0.15, 1986: 0.16, 1987: 0.2, 1988: 0.25, 2003: 0.215, 2006: 0.25}
child_care_credit_refundable_cap: 500
# 2018-2021 dependent credit per child under 17 (nonrefundable).
dependent_credit_per_child: {2018: 300, 2022: null}
# From 2022 the dependent exemption credit: `amount` per dependent (counted
# `young_multiplier` times under 6), less `step` per `increment` (or part) of
# Maine AGI over the start; refundable from 2024. Source: PolicyEngine-US
# gov.states.me.tax.income.credits.dependent_exemption.
dependent_exemption_credit:
  2022: {amount: 300, young_multiplier: 1, start_joint: 400000, start_other: 200000, increment: 1000, step: 7.5}
  2025: {amount: 305, young_multiplier: 2, start_joint: 150000, start_hoh: 125000, start_single: 100000, start_separate: 75000, increment: 500, step: 20}

# Credit for the elderly 1987-2016: a share of the federal credit.
elderly_credit_share: {1987: 0.2, 2017: null}
# 1987: a credit per exemption.
credit_per_exemption: {1987: 9.0, 1988: null}
# 1978: a credit of the larger of rent and property tax, each capped.
rent_or_property_tax_credit:
  1978: {rent_cap: 32.0, property_tax_cap: 64.0}
  1979: null
# 1988: the standard deduction and exemptions became credits: `earned_income_pct`
# of earned income between `earned_income_floor` and the cap by filing
# status, plus an exemption credit by Maine AGI ([AGI, amount] interpolated).
deduction_credits:
  1988:
    earned_income_pct: 0.02
    earned_income_floor: 10.0
    std_deduction_cap: {single: 60.0, married_joint: 100.0, head_of_household: 88.0, married_separate: 50.0}
    exemption_table:
      single: [[20000, 55.0], [25000, 65.0], [100000000, 30.0]]
      married: [[40000, 55.0], [50000, 65.0], [100000000, 30.0]]
      head_of_household: [[30000, 55.0], [37500, 65.0], [100000000, 30.0]]
  1989: null
# Through 1988, property tax credit for taxpayers 65 or older: property tax
# (rent counts at `property_tax_credit_rent_share`) up to the cap, at
# household income up to the limit; 1977 less a share of income above a
# floor; 1988 by income tier, [income up to, maximum, share of property tax].
property_tax_credit_rent_share: 0.25
property_tax_credit_cap: 400
property_tax_credit_income_limit:
  one_taxpayer: {1977: 4500, 1978: 5000, 1981: 5600, 1982: 6200, 1985: 7400}
  two_taxpayers: {1977: 5000, 1978: 6000, 1981: 6700, 1982: 7400, 1985: 9200}
property_tax_credit_reduction:
  1977: {rate: 0.1, income_floor: 3000}
  1978: null
property_tax_credit_tiers:
  1988:
    one_taxpayer: [[6800, 400, 1.0], [7000, 300, 0.75], [7200, 200, 0.5], [7400, 100, 0.25]]
    two_taxpayers: [[8100, 400, 1.0], [8500, 300, 0.75], [8800, 200, 0.5], [9200, 100, 0.25]]
  1989: null
# Earned income credit from 2000: a share of the federal credit (2020:
# `eitc_rate_childless` for filers without qualifying children);
# refundable from 2016. From 2022 by children, childless filers from age 18
# on the credit before the federal age test.
eitc_rate: {2000: 0.05, 2003: 0.0492, 2006: 0.05, 2009: 0.04, 2011: 0.05, 2020: 0.12, 2021: 0.2}
eitc_rate_childless: {2020: 0.25, 2021: null}
eitc_rates_by_children:
  2022: {with_child: 0.25, childless: 0.5}
eitc_refundable: {2000: false, 2016: true}
# Property tax fairness credit from 2013 (refundable): property tax (rent at
# `ptfc_rent_share`) less a share of income. 2013: `benefit_share` of the
# excess over `income_share` of AGI up to `income_ceiling`. 2014-2021: the
# base and income capped by exemptions (single, two, more; halved on
# separate returns through 2017), `benefit_share` of the excess over
# `income_share` of income, up to `cap` (`elderly_cap` 65 or older). None
# for separate filers from 2017.
ptfc_rent_share: {2013: 0.2125, 2014: 0.1275}
property_tax_fairness_credit:
  2013: {income_ceiling: 40000, cap: 300, elderly_cap: 400, income_share: 0.1, benefit_share: 0.4}
  2014:
    base_cap: {single: 2000, two: 2600, more: 3200}
    income_cap: {single: 33333, two: 43333, more: 53333}
    cap: 600
    elderly_cap: 900
    income_share: 0.06
    benefit_share: 0.5
  2018:
    base_cap: {single: 2050, two: 2650, more: 3250}
    income_cap: {single: 34167, two: 44167, more: 54167}
    cap: 750
    elderly_cap: 1200
    income_share: 0.06
  2022: null
# From 2022: the benefit base (by filing status and children, or 65 or
# older) limited to property tax plus `rent_share` of rent, less
# `income_rate` of income, at most `cap`. Source: PolicyEngine-US
# gov.states.me.tax.income.credits.fairness.property_tax.
property_tax_fairness_credit_schedule:
  2022: {single: 2200, hoh_one_child: 2800, joint_or_multi: 3450, senior: 0, cap: 1000, cap_senior: 1500, income_rate: 0.04, rent_share: 0.15}
  2023: {single: 2300, hoh_one_child: 3000, joint_or_multi: 3700, senior: 0, cap: 1000, cap_senior: 1500, income_rate: 0.04, rent_share: 0.15}
  2024: {single: 2450, hoh_one_child: 3200, joint_or_multi: 3900, senior: 4000, cap: 1000, cap_senior: 2000, income_rate: 0.04, rent_share: 0.15}
  2025: {single: 2550, hoh_one_child: 3300, joint_or_multi: 4050, senior: 4100, cap: 1000, cap_senior: 2000, income_rate: 0.04, rent_share: 0.15}

# Sales tax fairness credit from 2016 (refundable): the amount by exemptions
# (1-4), less $1 per `stfc_phaseout_step` of income above the threshold.
sales_tax_fairness_credit:
  2016: {threshold: {single: 20000, head_of_household: 30000, married_joint: 40000}, amount: [100, 140, 160, 180]}
  2017: {threshold: {single: 20050, head_of_household: 30100, married_joint: 40100}, amount: [125, 175, 200, 225]}
  2018: {threshold: {single: 20350, head_of_household: 30550, married_joint: 40750}, amount: [125, 175, 200, 225]}
  2019: {threshold: {single: 20750, head_of_household: 31100, married_joint: 41500}, amount: [125, 175, 200, 225]}
  2020: {threshold: {single: 21100, head_of_household: 31650, married_joint: 42200}, amount: [125, 180, 205, 230]}
  2021: {threshold: {single: 21350, head_of_household: 32000, married_joint: 42700}, amount: [130, 180, 205, 235]}
  2022: null
stfc_phaseout_step: 50
