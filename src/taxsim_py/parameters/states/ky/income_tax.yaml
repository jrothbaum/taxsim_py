# Kentucky individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`kytax`); 2022 on, KRS Chapter 141, Form
# 740 instructions and PolicyEngine-US `gov.states.ky.tax.income`. Not
# modeled (no TAXSIM input): blindness, self-employed health insurance, IRA
# and charitable adjustments and the solar credit.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Rate schedules, [start of bracket, rate], through 2017; then a flat rate.
# Joint returns may file combined, each spouse on their own share (through
# 2017 and, in statutory mode, from 2022).
brackets:
  1977: [[0, 0.02], [3000, 0.03], [4000, 0.04], [5000, 0.05], [8000, 0.06]]
  2005: [[0, 0.02], [3000, 0.03], [4000, 0.04], [5000, 0.05], [8000, 0.058], [75000, 0.06]]
  2018: null
flat_rate: {2018: 0.05, 2023: 0.045, 2024: 0.04}

# --- Income ---
# Federal income tax (less self-employment tax and AMT) is deductible
# through 1989; 1990 adds back federal income tax.
# 1985: `rate` of interest up to `cap_per_taxpayer` is excluded.
interest_exclusion:
  1985: {rate: 0.15, cap_per_taxpayer: 450}
  1986: null
# Through 1997 dividends are excluded up to this amount per taxpayer.
dividend_exclusion_per_taxpayer: {1977: 100, 1998: null}
# 1987-1989: this share of long-term gains is excluded when net gains are
# positive.
capital_gains_exclusion: {1987: 0.6, 1990: null}
# From 1995: this share of pensions is excluded, up to the cap (statutory
# mode: per taxpayer, with joint pensions split evenly).
retirement_exclusion_share: {1995: 0.25, 1996: 0.5, 1997: 0.75, 1998: 1.0}
retirement_exclusion_cap: {1995: 6250, 1996: 12500, 1997: 18750, 1998: 35000, 1999: 35700, 2000: 36414, 2001: 37500, 2002: 38775, 2003: 39400, 2004: 40200, 2005: 41110, 2018: 31110}

# --- Deductions ---
# Standard deduction, per taxpayer until 2022 (one per return from 2022,
# Form 740 instructions). Source for 2022 on: PolicyEngine-US
# gov.states.ky.tax.income.deductions.standard.
standard_deduction: {1977: 650, 1997: 900, 1998: 1200, 1999: 1500, 2000: 1700, 2001: 1750, 2002: 1800, 2003: 1830, 2004: 1870, 2005: 1910, 2006: 1970, 2007: 2050, 2008: 2100, 2009: 2190, 2010: 2210, 2011: 2240, 2012: 2290, 2013: 2360, 2014: 2400, 2015: 2440, 2016: 2460, 2017: 2480, 2018: 2530, 2019: 2590, 2020: 2650, 2021: 2690, 2022: 2770, 2023: 2980, 2024: 3160, 2025: 3270}
standard_deduction_per_taxpayer: {1977: true, 2022: false}
# 1991-2017 itemized limitation: `itemized_phaseout_rate` of AGI above the
# threshold (times `itemized_limitation_index`, halved on separate
# returns), at most `itemized_phaseout_cap_rate` of itemized deductions,
# times `reduction_share`; none 2010-2012 (the 2011 Schedule A has no
# limitation; TAXSIM suspends it in 2010 only). From 2018 only mortgage
# interest is deductible.
itemized_limitation_threshold: 100000
itemized_limitation_index: {1977: 1.0, 1992: 1.0525, 1993: 1.0845, 1994: 1.118, 1995: 1.147, 1996: 1.1795, 1997: 1.212, 1998: 1.245, 1999: 1.266, 2000: 1.2895, 2001: 1.3295, 2002: 1.373, 2003: 1.395, 2004: 1.427, 2005: 1.4595, 2006: 1.505, 2007: 1.564, 2008: 1.5995, 2009: 1.668, 2010: 1.6955, 2012: 1.7365, 2013: 1.7815, 2014: 1.8115, 2015: 1.84, 2016: 1.8485, 2017: 1.8635, 2018: null}
itemized_limitation_reduction_share: {1991: 1.0, 2006: 0.6666666666666666, 2008: 0.3333333333333333, 2010: 0.0, 2013: 1.0, 2018: null}
itemized_phaseout_rate: 0.03
itemized_phaseout_cap_rate: 0.8
# Through 1989, an itemized deduction for child care: the federal credit up
# to a cap by dependents (1, 2, 3+), less half of AGI plus federal tax above
# `phaseout_start`; none above `income_ceiling`.
child_care_deduction:
  1977: {caps: [2400, 3600, 4800], phaseout_start: 35000, income_ceiling: 44600}
  1990: null

# --- Credits (from 1990) ---
# Personal tax credits per taxpayer and dependent, and per taxpayer 65 or
# older.
personal_credit:
  1990: {per_person: 20, per_aged: 40}
  2004: {per_person: 0, per_aged: 0}
  2014: {per_person: 10, per_aged: 40}
  2018: {per_person: 0, per_aged: 40}
# Child and dependent care credit: this share of the federal credit before
# its liability limit.
child_care_credit_federal_share: {1990: 0.2}
# 1990-2004 low-income credit: a share of tax for the first AGI ceiling
# covering AGI, [AGI ceiling, share].
low_income_credit:
  1990: [[5000, 1.0], [10000, 0.5], [15000, 0.25], [20000, 0.15], [25000, 0.05], [100000000, 0.0]]
  2005: null
# Family size tax credit from 2005: a share of tax by family size (1-4+) and
