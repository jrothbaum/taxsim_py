family_size_credit_poverty_share: [[1.0, 1.0], [1.04, 0.9], [1.08, 0.8], [1.12, 0.7], [1.16, 0.6], [1.2, 0.5], [1.24, 0.4], [1.27003, 0.3], [1.3, 0.2], [1.33003, 0.1], [1e+20, 0.0]]
family_size_credit_poverty_guideline:
  2022: {first_person: 13590, additional_person: 4720}
  2023: {first_person: 14580, additional_person: 5140}
  2024: {first_person: 15060, additional_person: 5380}
  2025: {first_person: 15650, additional_person: 5500}
