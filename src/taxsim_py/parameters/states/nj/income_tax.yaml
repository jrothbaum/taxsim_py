# --- Income ---
# Pension exclusion for taxpayers 65 or older, by filing status; 2005-2021 only
# for household income up to the limit; from 2022 times a share by household
# income ([upper income limit, share] steps). Unused exclusion covers other
# income when wages and self-employment income are at most the earnings limit.
pension_exclusion:
  single:
    1977: 7500
    2000: 9375
    2001: 11250
    2002: 13125
    2003: 15000
    2017: 30000
    2018: 45000
    2019: 60000
    2020: 75000
  married_joint:
    1977: 10000
    2000: 12500
    2001: 15000
    2002: 17500
    2003: 20000
    2017: 40000
    2018: 60000
    2019: 80000
    2020: 100000
  married_separate:
    1977: 5000
    2000: 6250
    2001: 7500
    2002: 8750
    2003: 10000
    2017: 20000
    2018: 30000
    2019: 40000
    2020: 50000
  head_of_household:
    1977: 7500
    2000: 9375
    2001: 11250
    2002: 13125
    2003: 15000
    2017: 30000
    2018: 45000
    2019: 60000
    2020: 75000
pension_exclusion_household_income_limit: {2005: 100000, 2022: null}
pension_exclusion_phaseout:
  2022:
    single: [[100000, 1.0], [125000, 0.375], [150000, 0.1875], [1.0e+20, 0.0]]
    married_joint: [[100000, 1.0], [125000, 0.5], [150000, 0.25], [1.0e+20, 0.0]]
    married_separate: [[100000, 1.0], [125000, 0.25], [150000, 0.125], [1.0e+20, 0.0]]
    head_of_household: [[100000, 1.0], [125000, 0.375], [150000, 0.1875], [1.0e+20, 0.0]]
other_retirement_exclusion_earnings_limit: 3000

# --- Property tax relief ---
# From 1985 rent counts toward property tax at this share.
property_tax_rent_share: 0.18
# Through 1984: a credit for renters, larger for taxpayers 65 or older.
renter_credit:
  1977: {amount: 65, aged_addition: 35}
  1985: null
# 1985-1989: a property tax deduction of the larger of property tax and a floor
# falling with taxable income ([income, floor] interpolated); renters without
# property tax deduct the larger of `share` of rent and `floor_share` of the
# floor; a credit of `property_tax_excess_credit_rate` on any deduction above
# income; and a credit at income at or below the no-tax threshold.
property_tax_floor:
  1985: [[20000, 3250], [50000, 2600], [1.0e+20, 1857]]
  1990: null
property_tax_excess_credit_rate: 0.02
rent_deduction:
  1985: {share: 0.18, floor_share: 0.54}
  1990: null
low_income_property_credit:
  1985: {homeowner: 65, renter: 35}
  1990: null
# 1990-2003 homestead rebate (2004-2008 only when rent is paid). Under 65:
# homeowners with income under the limit; renters (the renter amount) under the
# renter limit. 65 or older: property tax over `income_share` of income, between
# a minimum and maximum, by income tier (from 2001 renters above the first tier
# get a flat amount).
homestead_rebate: {1990: 90, 2009: null}
homestead_rebate_income_limit: {1990: 40000}
homestead_rebate_renter: {1990: 30, 1999: 40, 2000: 60, 2001: 100, 2004: 150}
homestead_rebate_renter_income_limit: {1990: 40000, 1999: 100000, 2004: 1.0e+20}
homestead_rebate_aged:
  income_share: 0.05
  tier_limits: [35000, 70000, 100000]
  maximum: {1990: 500, 2001: 775}
  owner_minimum: {1990: 150}
  owner_middle_other: {1990: 150}
  owner_top: {1990: 100}
  renter_minimum: {1990: 65, 2001: 100}
  renter_middle_flat: {2001: 100}
  renter_middle_other: {1990: 65, 2001: 100}
  renter_top: {1990: 35, 1999: 40, 2000: 60, 2001: 100, 2004: 150}
# From 1996: a property tax deduction (`share` of property tax up to the cap,
# halved on separate returns), or the credit when the deduction saves less.
property_tax_deduction_cap: {1996: 2500, 1997: 5625, 1998: 10000, 2018: 15000}
property_tax_deduction_share: {1996: 0.5, 1997: 0.75, 1998: 1.0}
property_tax_credit: {1996: 25, 1997: 37.5, 1998: 50}

# --- Credits ---
# Earned income credit: a share of the federal credit.
eitc_match_rate:
  1977: 0.0
  2000: 0.1
  2001: 0.15
  2002: 0.175
  2003: 0.2
  2008: 0.225
  2009: 0.25
  2010: 0.2
  2015: 0.3
  2016: 0.35
  2018: 0.37
  2019: 0.39
  2020: 0.4
# 2000-2006: only with dependents and income up to this limit.
eitc_income_limit: {2000: 20000, 2007: null}
# Minimum age for the childless credit (N.J.S.A. 54A:4-7; NJ-1040 line 58),
# statutory mode from 2020; through 2020 filers 65 and older are excluded.
eitc_childless_minimum_age: {1977: 25, 2020: 21, 2021: 18}
eitc_childless_maximum_age_applies: {1977: true, 2021: false}
# From 2022, refundable child tax credit per child under six, by NJ taxable
# income ([income above, amount]; the tier at a threshold belongs to the lower
# row). Source: PolicyEngine-US gov.states.nj.tax.income.credits.ctc.
child_tax_credit:
  2022: [[0, 500], [30000, 400], [40000, 300], [50000, 200], [60000, 100], [80000, 0]]
  2023: [[0, 1000], [30000, 800], [40000, 600], [50000, 400], [60000, 200], [80000, 0]]
