# New Jersey gross income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`njtax`); 2022 on, N.J.S.A. 54A, NJ-1040
# instructions and PolicyEngine-US `gov.states.nj.tax.income`. Blindness and
# the medical expense deduction have no TAXSIM input.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# No tax on income at or below: through 1999 one amount (halved for married
# separate; 1994-1996 strictly below); 2000 by status (other halved for
# married separate); from 2001 per taxpayer (heads of household count two).
no_tax_threshold:
  1977: 3000
  1994: 7500
  1999: 10000
  2000: {single: 10000, other: 15000}
  2001: {per_taxpayer: 10000}
head_of_household_no_tax_taxpayers: 2

# --- Exemptions ---
exemption_per_taxpayer: {1977: 1000}
exemption_per_aged_taxpayer: {1977: 1000}
exemption_per_dependent: {1977: 1000, 1991: 1500}

# Rate schedules, [start of bracket, rate]: through 1990 one schedule; from
# 1991 `single` (also married separate) and `married` (joint and head of
# household). 2018 on: real law (P.L.2018, c.45 and P.L.2020, c.94); TAXSIM
# keeps the 2010 schedule.
brackets:
  1977: [[0, 0.02], [20000, 0.025], [50000, 0.025]]
  1983: [[0, 0.02], [20000, 0.025], [50000, 0.035]]
  1991:
    single: [[0, 0.02], [20000, 0.025], [35000, 0.05], [40000, 0.065], [75000, 0.07]]
