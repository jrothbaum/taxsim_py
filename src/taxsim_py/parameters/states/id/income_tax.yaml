# Idaho individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`idtax`); 2022 on, Idaho Code Title 63
# Chapter 30, Form 40 instructions and PolicyEngine-US
# `gov.states.id.tax.income`. Not modeled (no TAXSIM input): blindness, the
# alternative energy deduction and the political contribution, jobs and
# investment credits.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Rate schedules, [start of bracket, rate], applied to taxable income per
# taxpayer (joint and head-of-household returns halve it and double the
# tax) divided by `bracket_inflation`. Source for 2022 on: PolicyEngine-US
# gov.states.id.tax.income.main.
brackets:
  1977: [[0, 0.02], [1000, 0.04], [2000, 0.045], [3000, 0.055], [4000, 0.065], [5000, 0.075]]
  1987: [[0, 0.02], [1000, 0.04], [2000, 0.045], [3000, 0.055], [4000, 0.065], [5000, 0.075], [7500, 0.078], [20000, 0.082]]
  2000: [[0, 0.019], [1000, 0.039], [2000, 0.044], [3000, 0.054], [4000, 0.064], [5000, 0.074], [7500, 0.077], [20000, 0.081]]
  2001: [[0, 0.016], [1000, 0.036], [2000, 0.041], [3000, 0.051], [4000, 0.061], [5000, 0.071], [7500, 0.074], [20000, 0.078]]
  2012: [[0, 0.016], [1000, 0.036], [2000, 0.041], [3000, 0.051], [4000, 0.061], [5000, 0.071], [7500, 0.074]]
  2018: [[0, 0.01125], [1000, 0.03125], [2000, 0.03625], [3000, 0.04625], [4000, 0.05625], [5000, 0.06625], [7500, 0.06925]]
  2021: [[0, 0.01], [1000, 0.031], [3000, 0.045], [4000, 0.055], [5000, 0.065]]
  2022: [[0, 0.01], [1662, 0.03], [4987, 0.045], [8311, 0.06], [1000000000000, 0.065]]
  2023: [[0, 0.0], [4490, 0.058]]
  2024: [[0, 0.0], [4673, 0.05695]]
  2025: [[0, 0.0], [4811, 0.053]]
bracket_inflation: {1977: 1.0, 2001: 1.0, 2003: 1.086, 2005: 1.104, 2006: 1.159, 2007: 1.198, 2009: 1.272, 2010: 1.32288, 2011: 1.338, 2012: 1.38, 2013: 1.409, 2014: 1.429, 2015: 1.452, 2016: 1.454, 2017: 1.472, 2018: 1.504, 2019: 1.541, 2020: 1.567, 2021: 1.588, 2022: 1.0}

# --- Deductions ---
# 1977: `rate` of AGI between a floor and ceiling (`single` covers head of
# household). 1978-1992: the federal standard deduction (zero bracket
# amount through 1986).
standard_deduction_percent:
  1977:
    rate: 0.16
    single: {floor: 1700, ceiling: 2400}
    married: {floor: 2100, ceiling: 2800}
  1978: null
# From 1993 Idaho's own amounts; before 1999 separate returns get half the
# joint amount, from 1999 half of `married_separate`. From 2022 the federal
# amounts (Rev. Proc. 2021-45, 2022-38, 2023-34).
standard_deduction:
  single: {1993: 3700, 1994: 3800, 1995: 3900, 1996: 4000, 1997: 4150, 1998: 4250, 1999: 4300, 2000: 4400, 2001: 4550, 2002: 4700, 2003: 4750, 2004: 4850, 2005: 5000, 2006: 5150, 2007: 5350, 2008: 5450, 2009: 5700, 2011: 5800, 2012: 5950, 2013: 6100, 2014: 6200, 2015: 6300, 2017: 6350, 2018: 12000, 2019: 12200, 2020: 12400, 2021: 12500, 2022: 12950, 2023: 13850, 2024: 14600, 2025: 15750}
  head_of_household: {1993: 5450, 1994: 5600, 1995: 5750, 1996: 5900, 1997: 6050, 1998: 6250, 1999: 6350, 2000: 6450, 2001: 6650, 2002: 6900, 2003: 7000, 2004: 7150, 2005: 7300, 2006: 7550, 2007: 7850, 2008: 8000, 2009: 8350, 2010: 8400, 2011: 8500, 2012: 8700, 2013: 8950, 2014: 9100, 2015: 9250, 2016: 9300, 2017: 9350, 2018: 18000, 2019: 18350, 2020: 18650, 2021: 18800, 2022: 19400, 2023: 20800, 2024: 21900, 2025: 23625}
  married_joint: {1993: 6200, 1994: 6350, 1995: 6550, 1996: 6700, 1997: 6900, 1998: 7100, 1999: 7350, 2000: 8800, 2001: 9100, 2002: 9400, 2003: 9500, 2004: 9700, 2005: 10000, 2006: 10300, 2007: 10700, 2008: 10900, 2009: 11400, 2011: 11600, 2012: 11900, 2013: 12200, 2014: 12400, 2015: 12600, 2017: 12700, 2018: 24000, 2019: 24400, 2020: 24800, 2021: 25100, 2022: 25900, 2023: 27700, 2024: 29200, 2025: 31500}
  married_separate: {1999: 7200, 2000: 7350, 2001: 7600, 2002: 7850, 2003: 9500, 2004: 9700, 2005: 10000, 2006: 10300, 2007: 10700, 2008: 10900, 2009: 11400, 2011: 11600, 2012: 11900, 2013: 12200, 2014: 12400, 2015: 12600, 2017: 12700, 2018: 24000, 2019: 24400, 2020: 24800, 2021: 25500, 2022: 25900, 2023: 27700, 2024: 29200, 2025: 31500}
# 1990: separate returns add this amount.
standard_deduction_separate_addition: {1990: 25, 1991: null}
# 2008-2009: property tax up to this amount per taxpayer is added.
standard_deduction_property_tax_addition: {2008: 500, 2010: null}
# 1987: the standard deduction with taxpayers 65 or older, by filing status:
# the first amount plus the step for each further aged taxpayer.
aged_standard_deduction:
  1987:
    single: [3750, 750]
    married_joint: [5600, 600]
    married_separate: [3100, 600]
    head_of_household: [5100, 800]
  1988: null
# 1988-1992: separate returns lose this amount per aged taxpayer.
separate_aged_reduction: {1988: 150, 1991: 200, 1993: null}
# From 1987: a dependent filer's standard deduction is at most the greater
# of the minimum and earned income plus `dependent_standard_deduction_earned_addition`.
dependent_standard_deduction_minimum: {1987: 500, 1991: 550, 1992: 600, 1995: 650, 1998: 700, 2001: 750, 2004: 800, 2006: 850, 2009: 900, 2010: 950, 2013: 1000, 2015: 1050, 2019: 1100, 2022: 1150, 2023: 1250, 2024: 1300, 2025: 1350}
dependent_standard_deduction_earned_addition: 350
# Child care deduction from 1978, per dependent (up to two).
child_care_deduction_per_dependent: {1978: 2400, 2003: 3000}
# Itemized deductions over the 1991-2017 federal limitation threshold
# (times `itemized_limitation_index`; before 2013 halved on separate
# returns) are the federal limited amount less the state tax share.
itemized_limitation_threshold:
  1977: 100000
  2013: {single: 250000, married_joint: 300000, head_of_household: 275000, married_separate: 150000}
itemized_limitation_index: {1977: 1.0, 1992: 1.0525, 1993: 1.0845, 1994: 1.118, 1995: 1.147, 1996: 1.1795, 1997: 1.212, 1998: 1.245, 1999: 1.266, 2000: 1.2895, 2001: 1.3295, 2002: 1.373, 2003: 1.395, 2004: 1.427, 2005: 1.4595, 2006: 1.505, 2007: 1.564, 2008: 1.5995, 2009: 1.668, 2010: 1.6955, 2011: 1.6955, 2012: 1.7365, 2013: 1.0, 2014: 1.0168, 2015: 1.033, 2016: 1.0376, 2017: 1.046, 2018: null}

# --- Credits ---
# Nonrefundable child tax credit from 2018, per child under 17.
child_tax_credit_per_child: {2018: 205}
# Grocery credit per taxpayer and dependent, plus `grocery_credit_aged` per
# taxpayer 65 or older. Source for 2023 on: PolicyEngine-US
# gov.states.id.tax.income.credits.grocery.
grocery_credit: {1977: 15, 2001: 20, 2008: 30, 2009: 40, 2010: 50, 2011: 60, 2012: 70, 2013: 80, 2014: 90, 2015: 100, 2023: 120, 2025: 155}
# The supplement for taxpayers 65 or older ends in 2025 (H.B. 231).
grocery_credit_aged: {1977: 5, 1978: 15, 2008: 20, 2025: 0}
# 2008-2014: an extra amount per taxpayer and dependent at taxable income up
# to the limit.
grocery_credit_low_income_bonus:
  2008: {amount: 20, taxable_income_limit: 1000}
  2014: {amount: 10, taxable_income_limit: 1000}
  2015: null
# 2012-2016: no credit for separate filers without a taxpayer 65 or older.
grocery_credit_excludes_separate_filers: {1977: false, 2012: true, 2017: false}

# Permanent building fund tax from 1978: a flat amount when household income
# exceeds the limit (raised by `building_fund_limit_aged` per taxpayer 65 or
# older, except on separate returns).
building_fund_tax:
  1978:
    amount: 10
    limit: {single_or_hoh: 2300, married_joint: 3400, married_separate: 750}
  1981:
    amount: 10
    limit: {single_or_hoh: 3300, married_joint: 5400, married_separate: 1000}
building_fund_limit_aged: 1000
