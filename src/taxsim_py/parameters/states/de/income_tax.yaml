# Delaware individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`detax`); 2022 on, Del. Code Title 30
# Chapter 11, PIT-RES instructions and PolicyEngine-US
# `gov.states.de.tax.income`. The energy credit has no TAXSIM input.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Rate schedules, [start of bracket, rate]. Joint returns pay the lesser of
# the joint tax and the tax on each earner's share.
