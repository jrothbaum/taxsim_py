  1977: [[0, 0.016], [1000, 0.022], [2000, 0.033], [3000, 0.044], [4000, 0.055], [5000, 0.066], [6000, 0.077], [8000, 0.088], [10000, 0.088], [15000, 0.088], [20000, 0.093], [25000, 0.099], [30000, 0.121], [40000, 0.132], [50000, 0.154], [75000, 0.165], [100000, 0.198]]
