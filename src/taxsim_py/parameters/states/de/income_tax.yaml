# --- Income ---
# Pension exclusion: with no taxpayer 65 or older, pensions up to
# `pension_exclusion_young_per_taxpayer` per taxpayer; otherwise pensions
# plus interest, dividends and gains (half of them with one aged taxpayer)
# up to `pension_exclusion_aged` per aged taxpayer.
pension_exclusion_young_per_taxpayer: 2000
pension_exclusion_aged: {1977: 3000, 1999: 5000, 2000: 12500}
# From 1984: `exclusion` per taxpayer 65 or older when earned income is
# below `earned_limit` and AGI at most `agi_limit` per aged taxpayer.
aged_low_income_exclusion:
  1984: {exclusion: 2000, earned_limit: 2500, agi_limit: 10000}

# --- Deductions ---
# Through 1987: the lesser of `cap_per_taxpayer` (halved on separate
# returns) and `rate` of AGI.
standard_deduction_percent:
  1977: {rate: 0.1, cap_per_taxpayer: 1000}
  1988: null
# 1988-1999: a flat amount, `married` halved on separate returns.
standard_deduction:
  1988: {single_or_hoh: 1300, married: 1600}
  1999: {single_or_hoh: 3250, married: 4000}
  2000: null
# From 2000: per taxpayer.
standard_deduction_per_taxpayer: {2000: 3250}
# Additional standard deduction per taxpayer 65 or older.
aged_standard_deduction: {1987: 1000, 1999: 2500}
# 1987 itemized deductions are multiplied by this factor.
itemized_deduction_multiplier: {1987: 1.12, 1988: null}
# 2018: property, other and state taxes deductible up to this amount per
# return (halved on separate returns).
state_tax_deduction_cap: {2018: 10000, 2019: null}
# Itemized deduction limitation, 1991-2017: `rate` of AGI above the
# threshold (times `itemized_limitation_index`; before 2013 halved on
# separate returns), at most `cap_rate` of itemized deductions, times
# `reduction_share` (phased out 2006-2009, suspended 2010-2012).
itemized_limitation:
  1991: {rate: 0.03, cap_rate: 0.8, reduction_share: 1.0, threshold: 100000}
  2006: {rate: 0.03, cap_rate: 0.8, reduction_share: 0.6666666666666666, threshold: 100000}
  2008: {rate: 0.03, cap_rate: 0.8, reduction_share: 0.3333333333333333, threshold: 100000}
  2010: {rate: 0.03, cap_rate: 0.8, reduction_share: 0.0, threshold: 100000}
  2013:
    rate: 0.03
    cap_rate: 0.8
    reduction_share: 1.0
    threshold: {single: 250000, married_joint: 300000, head_of_household: 275000, married_separate: 150000}
  2018: null
itemized_limitation_index: {1991: 1.0, 1992: 1.0525, 1993: 1.0845, 1994: 1.118, 1995: 1.147, 1996: 1.1795, 1997: 1.212, 1998: 1.245, 1999: 1.266, 2000: 1.2895, 2001: 1.3295, 2002: 1.373, 2003: 1.395, 2004: 1.427, 2005: 1.4595, 2006: 1.505, 2007: 1.564, 2008: 1.5995, 2009: 1.668, 2010: 1.6955, 2011: 1.6955, 2012: 1.7365, 2013: 1.0, 2014: 1.0168, 2015: 1.033, 2016: 1.0376, 2017: 1.046, 2018: null}

# --- Exemptions ---
# Per federal exemption, through 1995.
personal_exemption: {1977: 600, 1985: 800, 1986: 1000, 1988: 1250, 1996: null}
# Through 1987 federal income tax up to this amount per taxpayer adds to
# exemptions.
federal_tax_exemption_per_taxpayer: {1977: 300, 1988: null}
# From 1996: a credit per federal exemption and taxpayer 65 or older.
personal_exemption_credit: {1996: 100, 2000: 110}

# --- Credits ---
# Child and dependent care credit: a share of the federal credit, capped
# from 1999.
child_care_credit_federal_share: {1977: 0.0, 1987: 0.25, 1989: 0.50}
child_care_credit_cap: {1999: 720, 2003: 1050, 2021: 4000}
# Earned income credit from 2006: a nonrefundable share of the federal
# credit; from 2021 a refundable share instead when that is larger than the
# remaining tax.
eitc_federal_share: {2006: 0.20}
eitc_refundable_share: {2021: 0.045}
