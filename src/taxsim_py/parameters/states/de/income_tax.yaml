  1986: [[0, 0.012], [1000, 0.016], [2000, 0.024], [3000, 0.035], [4000, 0.043], [5000, 0.051], [6000, 0.059], [8000, 0.066], [10000, 0.067], [15000, 0.069], [20000, 0.072], [25000, 0.077], [30000, 0.09], [40000, 0.097], [50000, 0.097], [75000, 0.097], [100000, 0.097]]
