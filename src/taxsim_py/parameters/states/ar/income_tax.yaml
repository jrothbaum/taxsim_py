# Arkansas individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`artax`); 2022 on, Arkansas Code Title 26
# Chapter 51, the AR1000F tax tables and PolicyEngine-US
# `gov.states.ar.tax.income`. Low-income tax tables are in
# low_income_formula_table.csv (1991-2021) and low_income_step_table.csv (2022 on).

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Joint returns may instead split income and deductions between spouses,
# tax each half on the same schedule and pay the lesser total.

# Through 1997, returns taking the standard deduction are taxed on AGI with
# these schedules, [upper bound, rate %]; `separate` is for married filing
# separately, `other` for everyone else.
standard_deduction_tables:
  1977:
    other:
      - [3000, 0.90]
      - [4000, 1.70]
      - [5000, 2.20]
      - [6000, 2.30]
      - [7000, 2.50]
      - [10000, 3.150]
      - [16000, 4.50]
      - [17000, 5.90]
      - [25000, 6.0]
      - [1.0e+20, 7.0]
    separate:
      - [3000, 0.90]
      - [4000, 1.70]
      - [5000, 2.20]
      - [6000, 2.50]
      - [7000, 3.0]
      - [9000, 3.50]
      - [10000, 3.90]
      - [15000, 4.50]
      - [16000, 5.20]
      - [24000, 6.0]
      - [25000, 6.50]
      - [1.0e+20, 7.0]
  1998: null

