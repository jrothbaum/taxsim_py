# 2003-2004 temporary income tax surcharge.
surcharge: {2003: 0.03, 2005: null}

# --- Income ---
# Share of a net long-term gain that is excluded, from 1999.
capital_gains_exclusion: {1999: 0.30, 2015: 0.45, 2016: 0.50}
# Cap on the taxable net gain, from 2014.
capital_gains_cap: {2014: 10000000}
# Pension exclusion: in 1983 up to a flat amount per return; 1984-1989 up to
# an amount per taxpayer; from 1990 per taxpayer 65 or older (as TAXSIM
# models it).
pension_exclusion_amount: {1983: 1000, 1984: 2000, 1985: 6000}
pension_exclusion_basis: {1983: return, 1984: taxpayer, 1990: aged}

# --- Deductions ---
# Through 1997: a percentage of AGI, capped per taxpayer (halved on
# separate returns).
standard_deduction_percent:
  1977: {rate: 0.10, cap_per_taxpayer: 4000}
  1987: {rate: 0.10, cap_per_taxpayer: 2000}
  1998: null
# From 1998: a flat amount per taxpayer.
standard_deduction: {1998: 2000, 2015: 2200, 2022: 2270, 2023: 2340, 2024: 2410, 2025: 2470}
# Itemized deduction limitation, 1991-2017 (suspended 2010-2012): `rate` of
# AGI above the threshold, at most `cap_rate` of itemized deductions. The
# threshold is indexed (state_adjustments.yaml itemized_phaseout_inflation);
# before 2013 a single amount halved on separate returns.
itemized_limitation:
  1991: {rate: 0.03, cap_rate: 0.8, threshold: 100000}
  2009: {rate: 0.01, cap_rate: 0.8, threshold: 100000}
  2010: null
  2013:
    rate: 0.03
    cap_rate: 0.8
    threshold: {single: 250000, married_joint: 300000, head_of_household: 275000, married_separate: 150000}
  2018: null

# --- Credits ---
# Personal tax credit per taxpayer, taxpayer 65 or older and (from 1987)
# dependent, with one more for a head of household and, from 1987, for a
# taxpayer 65 or older with no pension income.
personal_credit: {1977: 17.5, 1987: 20, 2005: 21, 2006: 22, 2007: 23, 2013: 26, 2020: 29}
# Credit per dependent before 1987.
dependent_credit: {1977: 6.0, 1987: null}
# Child care credit: a share of the federal credit; in 1982 at most a
# fixed amount per dependent (up to two).
child_care_credit_federal_share: {1977: 0.10, 1998: 0.20}
child_care_credit_cap_per_dependent: {1982: 40, 1983: null}
# 1991-1998 capital gains credit: `rate` on gains within a band of taxable
# income above the threshold.
capital_gains_credit:
  1991: {rate: 0.01, threshold: 25000, maximum: 15000}
  1999: null
# 1998-2002 working taxpayer credit: `rate` of each earner's wages (and
# self-employment income for the higher earner) above `floor`, up to `cap`.
working_taxpayer_credit:
  1998: {rate: 0.00125, cap: 50, floor: 400}
  2003: null
# Inflationary relief credit, 2022-2023: the maximum, less `reduction` for
# each `increment` of AGI above `start`.
inflationary_relief_credit:
  2022:
    single: {maximum: 150, start: 87000, reduction: 10, increment: 1000}
    married_joint: {maximum: 300, start: 174000, reduction: 20, increment: 2000}
    married_separate: {maximum: 150, start: 87000, reduction: 10, increment: 1000}
    head_of_household: {maximum: 150, start: 87000, reduction: 10, increment: 1000}
  2023:
    single: {maximum: 150, start: 89600, reduction: 10, increment: 1000}
    married_joint: {maximum: 300, start: 179200, reduction: 20, increment: 2000}
    married_separate: {maximum: 150, start: 89600, reduction: 10, increment: 1000}
    head_of_household: {maximum: 150, start: 89600, reduction: 10, increment: 1000}
  2024: null
# Additional credit for qualified individuals, from 2022: `amount` per
# taxpayer, less `reduction` per taxpayer for each `increment` (or part) of
# taxable income above `start`. Age and disability are not inputs, so every
# taxpayer is treated as qualified.
qualified_individual_credit:
  2022: {amount: 60, reduction: 5, start: 24300, increment: 100}
  2023: {amount: 60, reduction: 5, start: 25000, increment: 100}
  2024: {amount: 60, reduction: 5, start: 25800, increment: 100}
  2025: {amount: 60, reduction: 5, start: 26500, increment: 100}

# Before 1991, low-income tax schedules: from `start` to `end` the tax is
# `multiplier` times whole `step`s above `offset`, and 0 below `start`.
low_income_schedule:
  1977:
    step: 10
    single: {start: 3010, end: 3100, offset: 2990, multiplier: 1.0}
    married_no_dependents: {start: 4008, end: 4100, offset: 3990, multiplier: 1.2}
    married_or_hoh_up_to_one_dependent: {start: 4505, end: 4600, offset: 4490, multiplier: 1.7}
    married_or_hoh_two_dependents: {start: 5004, end: 5100, offset: 4990, multiplier: 1.1}
  1991: null
