# Alaska individual income tax, 1977-1979 (repealed from 1980).
#
# Source: NBER TAXSIM (`aktax`). Taxable income is federal AGI less the
# standard deduction; there are no exemptions. Separate returns use the
# single schedule with their own standard deduction; heads of household have
# their own schedule and the single standard deduction. The minimum tax and
# the small nonrefundable credit have no TAXSIM input.

standard_deduction_single:
  1977: 2200
standard_deduction_married_joint:
  1977: 3200
standard_deduction_married_separate:
  1977: 1600
standard_deduction_head_of_household:
  1977: 2200
# Flat credit, doubled on joint returns.
flat_credit:
  1977: 0
  1978: 100
  1979: 200

# Rate schedules, [start of bracket, rate].
