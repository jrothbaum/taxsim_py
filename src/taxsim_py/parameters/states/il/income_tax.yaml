# Illinois individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`iltax`); 2022 on, 35 ILCS 5 and
# PolicyEngine-US `gov.states.il.tax.income`. Not modeled (no TAXSIM
# input): education expense credit and state refund subtraction.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# A flat rate on base income less exemptions.
rate: {1977: 0.0250, 1983: 0.0300, 1984: 0.0275, 1985: 0.0250, 1989: 0.0275, 1990: 0.0300, 2011: 0.0500, 2015: 0.0375, 2017: 0.043549, 2018: 0.0495}
# Exemption per federal exemption; a dependent filer gets one only when
# income is at most the amount.
personal_exemption: {1977: 1000, 1998: 1300, 1999: 1650, 2000: 2000, 2012: 2050, 2013: 2100, 2014: 2125, 2015: 2150, 2016: 2175, 2018: 2225, 2019: 2275, 2020: 2325, 2021: 2375, 2022: 2425, 2024: 2775, 2025: 2850}
# Additional exemption per taxpayer 65 or older from 1990.
aged_exemption: {1990: 1000}
# From 2017 (statutory mode): no exemption allowance when base income
# exceeds these amounts.
exemption_income_limit: {joint: 500000, other: 250000}

# Property tax: 1983-1990 a deduction of this multiple of property tax paid;
# from 1991 a nonrefundable credit of `property_tax_credit_rate`, none from
# 2017 when federal AGI exceeds the cap per taxpayer.
property_tax_deduction_multiple: {1983: 1.0, 1989: 2.0, 1991: null}
property_tax_credit_rate: {1991: 0.05}
property_tax_credit_income_cap: {2017: 250000}

# Earned income credit from 2000: a share of the federal credit,
# nonrefundable through 2002. From 2023 childless filers qualify from
# `eitc_childless_minimum_age`.
eitc_match_rate: {2000: 0.05, 2012: 0.075, 2013: 0.10, 2017: 0.14, 2018: 0.18, 2023: 0.20}
eitc_refundable: {2000: false, 2003: true}
eitc_childless_minimum_age: {2023: 18}
# Child tax credit from 2024 (P.A. 103-0592): this share of the state EITC
# for a return with a child under 12.
child_tax_credit_rate: {2024: 0.20, 2025: 0.40}
