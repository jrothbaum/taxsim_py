# Georgia individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`gatax`); 2022 on, Georgia Code Title 48
# Chapter 7 as encoded in PolicyEngine-US `gov.states.ga.tax.income`.
# Solar-energy and other credits with no TAXSIM input are not modeled.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Rate schedules, [start of bracket, rate]. Single returns use `single`;
# joint, separate and head-of-household returns use `married`, with separate
# returns taxed on twice their income and the tax halved. Replaced by a flat
# rate in 2024.
brackets:
  1977:
    single: [[0, 0.01], [750, 0.02], [2250, 0.03], [3750, 0.04], [5250, 0.05], [7000, 0.06]]
    married: [[0, 0.01], [1000, 0.02], [3000, 0.03], [5000, 0.04], [7000, 0.05], [10000, 0.06]]
  2019:
    single: [[0, 0.01], [750, 0.02], [2250, 0.03], [3750, 0.04], [5250, 0.05], [7000, 0.0575]]
    married: [[0, 0.01], [1000, 0.02], [3000, 0.03], [5000, 0.04], [7000, 0.05], [10000, 0.0575]]
  2024: null
# Source: PolicyEngine-US gov.states.ga.tax.income.main.
flat_rate: {2024: 0.0539, 2025: 0.0519}

# --- Exemptions ---
# The exemption amount. Before 1987 it applies to dependents and taxpayers
# 65 or older; from 1987 to taxpayers, and also to dependents through 2002.
# Personal exemptions were repealed with the 2024 flat-rate law.
exemption: {1977: 700, 1987: 1500, 1994: 2000, 1995: 2500, 1998: 2700, 2024: null}
# Flat exemption per taxpayer before 1987 and in 1994-1997.
taxpayer_exemption: {1977: 1500, 1987: null, 1994: 1500, 1998: null}
# Extra exemption for a head of household with dependents before 1987.
head_of_household_dependent_exemption: {1977: 800, 1987: null}
# Exemption per dependent from 2003 (source for 2024: PolicyEngine-US
# gov.states.ga.tax.income.exemptions.dependent).
dependent_exemption: {2003: 3000, 2024: 4000}
# Exemption per taxpayer on joint and separate returns, 2013-2023.
married_exemption: {2013: 3700, 2024: null}

# --- Standard deduction ---
# Before 1987: a percentage of Georgia AGI between a floor and a ceiling,
# both halved on separate returns. `single` covers head of household.
standard_deduction_percent:
  1977:
    single: {rate: 0.15, floor: 1300, ceiling: 2000}
    married: {rate: 0.15, floor: 1300, ceiling: 2000}
  1983:
    single: {rate: 0.15, floor: 1500, ceiling: 2000}
    married: {rate: 0.18, floor: 1700, ceiling: 3000}
  1987: null
# From 1987: a flat amount, halved on separate returns. `single` covers head
# of household.
standard_deduction:
  1987: {single: 2300, married: 3000}
  2018: {single: 4600, married: 6000}
  2022: {single: 5400, married: 7100}
  2024: {single: 12000, married: 24000}
# Additional standard deduction per taxpayer 65 or older.
aged_standard_deduction: {1987: 700, 1998: 1300, 2024: 0}

# --- Retirement income exclusion ---
# Per taxpayer 65 or older. Before 1989: the lesser of federal AGI and this
# amount, and none in 1986-1988 when earned income exceeds `earned_limit`
# per taxpayer. From 1989 it covers up to `earnings_cap` of earnings plus
# retirement and investment income, split between spouses.
retirement_exclusion_max: {1977: 0, 1982: 2000, 1986: 4000, 1989: 8000, 1993: 10000, 1994: 11000, 1995: 12000, 1999: 13000, 2000: 13500, 2001: 14000, 2002: 14500, 2003: 15000, 2006: 25000, 2007: 30000, 2008: 35000, 2012: 65000}
retirement_exclusion_earned_limit: {1986: 1200, 1989: null}
retirement_exclusion_earnings_cap: {1989: 4000}
# The federal net capital loss limit (halved on separate returns) and the
# share of losses counted for a spouse.
retirement_exclusion_capital_loss_limit: 3000
retirement_exclusion_spouse_loss_share: 0.25

# --- 1982-1986 additions (Georgia kept 1981 federal law) ---
# IRA adjustment: `amount` less the federal IRA limit (earnings up to the
# limit) is added back when positive.
ira_addback:
  1982: {amount: 500, limit_joint: 4000, limit_other: 2000}
  1987: null
# Unemployment compensation: the difference between the taxable amounts
# under Georgia's and the federal income thresholds is added back.
unemployment_threshold:
  1982:
    georgia: {single: 20000, married_joint: 25000, head_of_household: 20000, married_separate: 0}
    federal: {single: 12000, married_joint: 18000, head_of_household: 20000, married_separate: 0}
  1987: null

# --- Credits ---
# Child and dependent care credit, 1978-1986: a share of expenses up to a
# cap per dependent, kept between a minimum and maximum, and up to wages.
child_care_credit_expenses:
  1978: {rate: 0.02, cap_per_dependent: 2000, cap_min: 2000, cap_max: 4000}
  1987: null
# From 2006: a share of the federal credit before its liability limit.
child_care_credit_federal_share: {2006: 0.10, 2007: 0.20, 2008: 0.30, 2025: 0.5}

# Low-income credit before 1987: an amount per taxpayer (heads of household
# count as two), reduced dollar for dollar above an AGI threshold.
low_income_credit_flat:
  1977: {per_taxpayer: 15, agi_threshold_per_taxpayer: 3000}
  1987: null
# From 1992: an amount per exemption (taxpayers, dependents and taxpayers
# 65 or older) by federal AGI, [AGI, amount], interpolated. None for
# dependent filers.
low_income_credit_per_exemption:
  1992:
    - [6000, 26]
    - [8000, 20]
    - [10000, 14]
    - [15000, 8]
    - [20000, 5]
    - [100000000, 0]
# Whether the low-income credit is refundable.
low_income_credit_refundable: {1977: true, 2010: false}
