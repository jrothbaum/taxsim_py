# --- Income ---
# Through 1986 California builds its own income: this share of long-term
# gains is included, and a net loss is limited to `capital_loss_limit`
# (halved on separate returns).
capital_gains_inclusion: {1977: 0.65, 1987: null}
capital_loss_limit: {1977: 1000, 1987: null}
# 1985-1986 exclusion per taxpayer 65 or older, reduced by half of income
# above `income_limit` per aged taxpayer (halved on separate returns).
aged_exclusion:
  1985: {amount: 1000, income_limit: 25000}
  1987: null
# 2011-2012: the federal self-employment tax deduction's payroll-tax-holiday
# excess over half the tax is added back, as TAXSIM rounds it: a rate on the
# tax up to the threshold, a flat amount above.
se_deduction_holiday_addback:
  2011: {threshold: 14204, rate: 0.5751, flat: 1067}
  2013: null

# --- Deductions ---
# Standard deduction per taxpayer (heads of household count as two),
# multiplied by `indexing_factor` from 1979.
standard_deduction_per_taxpayer: 1000
# AGI threshold for the itemized deduction limitation and (through 2021) the
# exemption credit phaseout, times `phaseout_index` from 1992.
phaseout_threshold: {single: 100000, married_joint: 200000, head_of_household: 150000, married_separate: 100000}
phaseout_index: {1991: 1.0, 1992: 1.036, 1993: 1.0619, 1994: 1.07464, 1995: 1.09936, 1996: 1.11695, 1997: 1.14152, 1998: 1.16777, 1999: 1.19813, 2000: 1.24246, 2001: 1.30831, 2002: 1.32793, 2003: 1.35714, 2004: 1.39921, 2005: 1.43839, 2006: 1.50743, 2007: 1.55416, 2008: 1.63187, 2009: 1.60739, 2010: 1.62185, 2011: 1.66565, 2012: 1.6973, 2013: 1.72615, 2014: 1.76413, 2015: 1.78706, 2016: 1.82459, 2017: 1.87203, 2018: 1.94504, 2019: 2.00534, 2020: 2.03341, 2021: 2.12288, 2022: 2.29908, 2023: 2.37035, 2024: 2.44857, 2025: 2.52203}
# Itemized deduction limitation from 1991: `rate` of federal AGI above the
# threshold, at most `cap_rate` of itemized deductions.
itemized_limitation:
  1991: {rate: 0.06, cap_rate: 0.8}

# --- Exemption credits ---
# Through 1986: per taxpayer (heads of household count as two) and per
# dependent (heads of household claim one fewer), times `indexing_factor`
# and rounded where `indexed`.
exemption_credit_amounts:
  1977: {per_taxpayer: 25, per_dependent: 8, indexed: true}
  1978: {per_taxpayer: 100, per_dependent: 8, indexed: false}
  1979: {per_taxpayer: 25, per_dependent: 8, indexed: true}
  1987: null
# 1987-2021: `exemption_credit_base` times `exemption_credit_index` per
# taxpayer and taxpayer 65 or older, and through 1997 per dependent too.
exemption_credit_base: 50
exemption_credit_index: {1987: 1.020, 1988: 1.040, 1989: 1.10, 1990: 1.160, 1991: 1.20, 1992: 1.240, 1993: 1.280, 1994: 1.30, 1995: 1.320, 1996: 1.340, 1997: 1.360, 1998: 1.40, 1999: 1.440, 2000: 1.50, 2001: 1.580, 2002: 1.60, 2003: 1.640, 2004: 1.70, 2005: 1.740, 2006: 1.820, 2007: 1.880, 2008: 1.98, 2009: 1.960, 2010: 1.980, 2011: 2.040, 2012: 2.08, 2013: 2.12, 2014: 2.160, 2015: 2.180, 2016: 2.22, 2017: 2.28, 2018: 2.36, 2019: 2.44, 2020: 2.48, 2021: 2.58, 2022: null}
# From 2022: the credit per taxpayer and taxpayer 65 or older.
exemption_credit_personal: {2022: 140, 2023: 144, 2024: 149, 2025: 153}
# Credit per dependent from 1998.
exemption_credit_per_dependent: {1998: 253, 1999: 227, 2000: 235, 2001: 247, 2002: 251, 2003: 257, 2004: 265, 2005: 272, 2006: 285, 2007: 294, 2008: 309, 2009: 98, 2010: 99, 2011: 315, 2012: 321, 2013: 326, 2014: 333, 2015: 337, 2016: 344, 2017: 353, 2018: 367, 2019: 378, 2020: 383, 2021: 400, 2022: 433, 2023: 446, 2024: 461, 2025: 475}
# From 1991 each credit falls by `per_credit` for each `step` of AGI above
# the threshold (step halved on separate returns). Before 1998 the
# reduction is proportional and the credits end `upper` (times
# `exemption_credit_upper_index`) above the threshold.
exemption_credit_phaseout: {per_credit: 6, step: 2500}
exemption_credit_phaseout_upper: {1991: 25000, 1998: null}
exemption_credit_upper_index: {1991: 0.90, 1992: 1.0, 1997: 1.1452, 1998: 1.1678, 1999: null}
# From 2022 the phaseout thresholds are published directly.
exemption_credit_phaseout_start:
  2022: {single: 229908, married_joint: 459821, head_of_household: 344867, married_separate: 229908}
  2023: {single: 237035, married_joint: 474075, head_of_household: 355558, married_separate: 237035}
  2024: {single: 244857, married_joint: 489719, head_of_household: 367291, married_separate: 244857}
  2025: {single: 252203, married_joint: 504411, head_of_household: 378310, married_separate: 252203}

# 1994-1998 limit on the credits, with income floors times `floor_index`
# and the upper thresholds times `exemption_credit_upper_index`. TAXSIM's
# `min(agi_share * agi, 0)` term is always 0.
exemption_credit_limit:
  1994: {rate: 0.085, floor_index: 1.0, floor_single_or_hoh: 30000, floor_other: 20000, upper_hoh: 150000, upper_other: 100000, agi_share: 0.025}
  1996: {rate: 0.070, floor_index: 1.0, floor_single_or_hoh: 30000, floor_other: 20000, upper_hoh: 150000, upper_other: 100000, agi_share: 0.025}
  1997: {rate: 0.070, floor_index: 1.125, floor_single_or_hoh: 30000, floor_other: 20000, upper_hoh: 150000, upper_other: 100000, agi_share: 0.025}
  1998: {rate: 0.070, floor_index: 1.4315, floor_single_or_hoh: 30000, floor_other: 20000, upper_hoh: 150000, upper_other: 100000, agi_share: 0.025}
  1999: null

# --- Other credits ---
# Low-income credit through 1983, when household income is at most
# `household_income_limit` per taxpayer: `base` (times `indexing_factor`)
# less `reduction_rate` of AGI above `agi_floor`.
low_income_credit_flat:
  1977: {base: 0, agi_floor: 5000, reduction_rate: 0.5, household_income_limit: 10000}
  1979: {base: 40, agi_floor: 5000, reduction_rate: 0.5, household_income_limit: 10000}
  1984: null
# 1985-1991: a share of tax by AGI, [AGI, share] interpolated, with AGI
# bounds times `low_income_credit_index` and halved for single and separate
# returns.
low_income_credit_share:
  1985:
    - [10900, 1.00]
    - [12600, 0.80]
    - [14300, 0.60]
    - [16000, 0.40]
    - [17700, 0.20]
    - [1.0e+20, 0.0]
  1992: null
low_income_credit_index: {1985: 1.0, 1986: 1.035, 1987: 1.072, 1988: 1.12, 1989: 1.18}

# Child and dependent care credit. Through 1984: `rate` of expenses up to
# `cap_per_child` (at most `cap_total`) and up to wages.
child_care_credit_expenses:
  1977: {rate: 0.03, cap_per_child: 2000, cap_total: 4000}
  1985: null
# From 1985 a share of the federal credit (before its liability limit from
# 2000): a single share; `below`/`above` an AGI `threshold`; or rows of
# [AGI upper bound, share] with no credit above the last row. Refundable
# through 2010.
child_care_credit_federal_share:
  1985: {threshold: 20000, below: 0.10, above: 0.05}
  1987: 0.30
  1991: [[40000, 0.30], [70000, 0.25], [100000, 0.20], [1.0e+20, 0.15]]
  1993: 0
  2000: [[40000, 0.63], [70000, 0.53], [100000, 0.42]]
  2003: [[40000, 0.50], [70000, 0.43], [100000, 0.34]]
child_care_credit_refundable: {1977: true, 2011: false}

# Renter's credit, for renters paying no property tax. 1977-1992: a flat
# amount (before 1979 the single amount for everyone; separate filers half
# the `other` amount through 1990). 1991-1992 only up to the AGI limit and
# half in the band above it, both times `renter_credit_index`. From 1998:
# `per_taxpayer` (joint and head of household count as two) up to
# `agi_limit_per_taxpayer` times `renter_credit_index`.
renter_credit:
  1977: {single: 37, other: 37}
  1979: {single: 60, other: 137}
  1990: {single: 60, other: 120}
  1991: {single: 60, other: 120, agi_limit: {single: 20000, other: 40000}, half_band: {single: 500, other: 1000}}
  1993: null
  1998: {per_taxpayer: 60, agi_limit_per_taxpayer: 25000}
renter_credit_index: {1991: 1.0, 1992: 1.036, 1993: null, 1998: 1.0, 1999: 1.026, 2000: 1.06396, 2001: 1.12036, 2002: 1.13716, 2003: 1.16216, 2004: 1.1982, 2005: 1.23176, 2006: 1.29088, 2007: 1.33088, 2008: 1.35744, 2009: 1.37648, 2010: 1.38888, 2011: 1.42636, 2013: 1.4782, 2014: 1.51072, 2015: 1.53036, 2016: 1.56248, 2017: 1.60312, 2018: 1.66564, 2019: 1.71728, 2020: 1.74132, 2022: 1.9688, 2023: 2.02984, 2024: 2.09684, 2025: 2.15976}

