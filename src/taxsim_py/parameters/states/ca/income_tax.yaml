# Sources: 1977-2021 NBER TAXSIM (`catax`); 2022 on, the Revenue and
# Taxation Code, FTB Form 540 instructions and PolicyEngine-US
# `gov.states.ca.tax.income`. Not modeled: the 1979-1986 minimum tax on
# preference income, the credit for the elderly, and other items with no
# TAXSIM input.

