# Age limits that turn the child ages `age1`-`age3` into dependent counts.
#
# Sources: NBER TAXSIM.

# A child counts toward a credit when younger than the limit: child care credit
# (`dep13`), EITC (`dep18`) and child tax credit (`dep17`; none before 1998).
# Children under `young_child_age` are counted in `dep6`.
child_care_age: {1960: 12, 1964: 13, 1972: 15, 1989: 13}
eitc_age: {1960: 100, 1975: 19}
child_tax_credit_age: {1960: 0, 1998: 17}
young_child_age: 6
