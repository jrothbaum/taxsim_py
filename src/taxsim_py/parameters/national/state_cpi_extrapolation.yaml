# Price index for projecting state law past its last coded year.
#
# Sources: NBER TAXSIM (`xndxa`).

# TAXSIM's last year of coded state law. In TAXSIM mode a later year runs this
# year's state law on incomes deflated by `xndxa(year) / xndxa(lastat)`, with
# the state tax reinflated by the same ratio; statutory mode does the same only
# after a state's `law_coded_through`.
lastat: 2021
# TAXSIM's price index by year (2022-2023 from the 2024 TAXSIM release; from
# 2024 an assumed 2.5% a year).
xndxa:
  1981: 0.768
  1982: 0.815
  1983: 0.842
  1984: 0.879
  1985: 0.91
  1986: 0.927
  1987: 1.0
  1988: 1.0
  1989: 1.041
  1990: 1.091
  1991: 1.144
  1992: 1.204
  1993: 1.241
  1994: 1.279
