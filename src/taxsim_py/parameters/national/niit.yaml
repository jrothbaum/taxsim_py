# Net investment income tax (3.8% Medicare tax on investment income).
#
# Sources: 2013-2021 NBER TAXSIM; 2022 on, Internal Revenue Code section 1411
# and Form 8960 instructions.

# Rate on the lesser of net investment income (interest, dividends, capital
# gains and other property income) and AGI over the threshold; zero before 2013.
rate: {1987: 0.0, 2013: 0.038}
threshold:
  single: {1987: 200000}
  head_of_household: {1987: 200000}
  married_separate: {1987: 125000}
  married_joint: {1987: 250000}
# The state and local tax deduction attributable to investment income (its share
# of AGI) is subtracted from net investment income; from 2018 capped at this per
# return.
expense_cap: {2018: 10000}
