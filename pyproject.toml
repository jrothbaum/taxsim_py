[project]
name = "taxsim-py"
version = "0.2.0"
description = "A dataframe-oriented Python implementation of NBER TAXSIM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "polars>=1.28.1",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/jrothbaum/taxsim_py"
Documentation = "https://jrothbaum.github.io/taxsim_py/"

[project.optional-dependencies]
readstat = [
    "polars-readstat>=0.20.2",
]

[project.scripts]
taxsim-py = "taxsim_py.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
test = [
    "policyengine-taxsim>=2.31.1; python_version >= '3.10'",
    "psutil>=6.1.1",
    "pytest>=8.4.2",
    "taxcalc>=6.2.1; python_version >= '3.10'",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
