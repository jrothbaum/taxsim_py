[project]
name = "taxsim-py"
version = "0.4.1"
description = "A dataframe-oriented Python implementation of NBER TAXSIM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "polars>=1.28.1",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/jrothbaum/taxsim_py"
Documentation = "https://jrothbaum.github.io/taxsim_py/"

[project.optional-dependencies]
readstat = [
    "polars-readstat>=0.20.2",
]

[project.scripts]
taxsim-py = "taxsim_py.cli:main"

# One package: the Python code, the parameter tables and the compiled calculators (the
# Polars plugin in rust/, built into taxsim_py/_internal*.so/.pyd). maturin builds one
# abi3 wheel per platform; scripts/build_pure_wheel.py builds the Python-only wheel.
[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "taxsim_py._internal"
python-source = "src"
strip = true

[dependency-groups]
dev = [
    "maturin>=1.0,<2.0",
    "ruff>=0.16.10",
]
test = [
    "policyengine-taxsim>=2.31.1; python_version >= '3.10'",
    "psutil>=6.1.1",
    "pytest>=8.4.2",
    "taxcalc>=6.2.1; python_version >= '3.10'",
]

# Rebuild the editable install (which compiles the Rust code) when the Rust code changes.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "rust/Cargo.toml" }, { file = "rust/Cargo.lock" }, { file = "rust/src/**/*.rs" }]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
