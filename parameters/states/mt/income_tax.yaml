  2023: 1.405556

# Social Security (1984+): Montana taxes benefits on its own worksheet,
# with its subtractions counted against provisional income.
social_security_base:
  single: 25000
  married: 32000
social_security_second_base:
  single: 9000
  married: 12000
social_security_rate_1: 0.5
social_security_rate_2: 0.85

# Elderly homeowner/renter credit (1981+), for taxpayers 65 or older. Rent
# counts at this share (in 1981 the larger of property tax and rent share).
elderly_credit_rent_share: 0.15
# 1981-1982: up to the maximum. From 1983: property tax less a share of
# household income over an exclusion, up to the maximum.
elderly_credit_income_exclusion:
  1983: 4000
  1998: 6300
elderly_credit_income_share: [[1999, 0.0], [2999, 0.006], [3999, 0.016], [4999, 0.024], [5999, 0.028], [6999, 0.032], [7999, 0.035], [8999, 0.039], [9999, 0.042], [10999, 0.045], [11999, 0.048], [1.0e+20, 0.05]]
elderly_credit_max:
  1981: 150
  1983: 400
  1995: 1000
# 1998: no credit at household income of this amount or more.
elderly_credit_income_limit: {1998: 35000, 1999: null}
# From 1999 a multiplier by household income; in 1981-1982 the same table is
# a share of income subtracted from property tax.
elderly_credit_multiplier: [[35000, 1.0], [37500, 0.4], [40000, 0.3], [42500, 0.2], [44999, 0.1], [1.0e+20, 0.0]]

