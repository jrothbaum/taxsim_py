# --- Credits ---
# A credit of this share of net capital gains.
capital_gains_credit_rate: {1977: 0.0, 2005: 0.01, 2007: 0.02}
# 2007 homeowner credit.
homeowner_credit: {2007: 140, 2008: null}
# Earned income credit: a share of the federal credit.
eitc_match_rate: {1977: 0.0, 2019: 0.03, 2022: 0.03, 2023: 0.03, 2024: 0.1}

# Married couples may be taxed as two separate returns: the higher earner
# takes their own wages plus this share of the couple's other income, and
# itemized deductions are split by `joint_split_itemized_share`.
joint_split_other_income_share: {1977: 0.5}
joint_split_itemized_share: {1977: 0.5}

# Interest exclusion per taxpayer 65 or older, 1981-2023.
aged_interest_exclusion: {1981: 800, 2024: null}

# Retirement income exclusion for taxpayers 65 or older (1991-2023): up to
# the maximum, per taxpayer 65 or older from 2010; reduced by twice federal
# AGI (per taxpayer 65 or older) over the income start. From 2010 the
# amounts are indexed.
retirement_exclusion_max: {1991: 3600}
retirement_exclusion_per_taxpayer: {1991: 1800}
retirement_exclusion_income_start: {1991: 30000}
retirement_exclusion_phaseout_rate: {1991: 2}
