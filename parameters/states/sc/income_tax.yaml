# Retirement income deduction (1983+): pensions up to this per taxpayer;
# from 1993 taxpayers 65 or older get the higher amount (a joint return with
# one such taxpayer gets one of each). From 1999 returns with a taxpayer 65
# or older deduct $15,000 per such taxpayer whatever their income (TAXSIM).
retirement_deduction_per_taxpayer: {1977: 0, 1983: 1200, 1985: 2100, 1986: 3000}
retirement_deduction_aged_per_taxpayer: 10000
aged_deduction_per_taxpayer_1999: 15000
