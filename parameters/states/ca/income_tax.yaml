# Renter's credit (for renters paying no property tax): single-filer and
# other-filer amounts, 1977-1992; 1991-1992 only below the AGI limits
# (half the credit in the top $500/$1,000 band); from 1998 $60 per
# taxpayer ($120 for joint and head of household) up to an indexed AGI
# limit of $25,000 per taxpayer. Married separate filers get half the
# other-filer amount 1979-1990.
renter_credit_single: {1977: 37, 1979: 60}
renter_credit_other: {1977: 37, 1979: 137, 1990: 120}
renter_credit_1991_agi_limit: {single: 20000, other: 40000}
renter_credit_1991_half_band: {single: 500, other: 1000}
renter_credit_1991_inflation: {1991: 1.0, 1992: 1.036}
renter_credit_1998_amount: 60
renter_credit_1998_agi_limit: 25000
renter_credit_1998_inflation: {1998: 1.0, 1999: 1.026, 2000: 1.06396, 2001: 1.12036, 2002: 1.13716, 2003: 1.16216, 2004: 1.1982, 2005: 1.23176, 2006: 1.29088, 2007: 1.33088, 2008: 1.35744, 2009: 1.37648, 2010: 1.38888, 2011: 1.42636, 2013: 1.4782, 2014: 1.51072, 2015: 1.53036, 2016: 1.56248, 2017: 1.60312, 2018: 1.66564, 2019: 1.71728, 2020: 1.74132, 2022: 1.9688, 2023: 2.02984, 2024: 2.09684, 2025: 2.15976}
# 1985-1986 exclusion per taxpayer 65 or older, reduced by half of income
# above $25,000 per aged taxpayer.
aged_exclusion_1985: 1000
aged_exclusion_income_limit_1985: 25000

# Through 1986, the share of long-term gains included in income.
capital_gains_inclusion_pre1987: 0.65

# 2011-2012: the federal self-employment tax deduction's payroll-tax-holiday
# excess over half the tax, as the source rounds it: a rate on the tax up to
# the threshold, a flat amount above.
se_deduction_holiday_addback:
  threshold: 14204
  rate: 0.5751
  flat: 1067

# Itemized deduction limitation (1991+): a share of AGI above the
# threshold, at most a share of itemized deductions.
itemized_phaseout_rate: 0.06
itemized_phaseout_cap_rate: 0.8

# Exemption credits through 1986 (inflated and rounded), 1978's own amounts,
# and the 1987+ base per credit (times the inflation factor).
exemption_credit_pre1987: {per_taxpayer: 25, per_dependent: 8}
exemption_credit_1978: {per_taxpayer: 100, per_dependent: 8}
exemption_credit_base_1987plus: 50

# 1991+ exemption credit phaseout: a reduction per credit for each step of
# income above the threshold (before 1998 proportional, and none above the
# upper limit).
exemption_credit_phaseout_per_credit: 6
exemption_credit_phaseout_step: 2500
exemption_credit_phaseout_upper_pre1998: 25000
# 1994-1998 limit: income floors by filing status and the upper thresholds
# (times the inflation factors); `min(share * agi, 0)` is always 0 in TAXSIM.
exemption_credit_limit_1994_1998:
  floor_single_or_hoh: 30000
  floor_other: 20000
  upper_hoh: 150000
  upper_other: 100000
  agi_share: 0.025

# Low Income Credit through 1983: a base (times the inflation factor from
# 1979) less half the amount by which AGI exceeds the floor.
