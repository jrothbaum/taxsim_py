# California individual income tax (`catax`, taxsim_2022_10_21.f:2198-2929,
# state id 5). Seventh state (alphabetical order) - the largest and
# richest so far: its OWN full Alternative Minimum Tax (1987+, plus a
# distinct 1979-1986 "minimum tax on preference income" predecessor), a
# Renter's Credit (3 eras), a Low Income Credit (2 eras, expired after
# 1991), a Child/Dependent Care Credit (5 formula eras), a Credit for the
# Elderly (2 eras), an Exemption Credit with THREE overlapping phaseout
# mechanisms (a federal-AGI-based one since 1991, plus a separate,
# narrower California-AMT-based one 1994-1998 only), a 2005+ Mental
# Health Services surtax (1% on taxable income over $1M), and its own
# EITC + Young Child Tax Credit (2015+/2019+).
#
# Confirmed inert given this project's schema (every one of these
# `data()` fields is never assigned anywhere in the whole 29,414-line
# file): data(17), (19), (21), (23), (24), (25), (27), (28), (29), (32),
# (42), (52), (66), (67), (69), (71), (73)-(78), (80), (81), (107), (108),
# (116), (210) - and the already-established cross-state list (data(9)/
# (10) elderly/blind, data(22) generic override, data(38) energy credit,
# data(65) political contributions, data(91) gross SS). This kills IRA/
# Keogh limits entirely (pre-1987 AGI), the energy credit and political-
# contribution credit outright, the Young Child Tax Credit outright
# (`data(210)`, fed by the generic `opt1` slot, never populated by this
# project's named-column input), and the whole Social-Security-benefit
# AGI subtraction (comnew(78)/(79), both federal-computed from `gssi`,
# always $0 here) except its own 2011-2012 FICA-holiday adjustment
# (`comnew(175)`=setax, real whenever SE income is nonzero - same
# hardcoded-rate quantity discovered building Alabama/Arizona).
#
# `comnew(2)`=agi is reused DIRECTLY for 1987+ (California conforms to
# federal AGI, unlike Alabama/Arizona/Arkansas which each recompute their
# own from scratch) - the commented-out `cg`/`cacg`/`adjcg` block in the
# source (taxsim_2022_10_21.f:~2484-2502) confirms `addit` is a real,
# permanent no-op for 1987+, not a gap.

