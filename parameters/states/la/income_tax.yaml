# Louisiana combines its standard deduction and personal exemption into
# ONE flat dollar figure (`stxmp`, by "txp" - 1 for single/separate, 2 for
# married/HoH/widow).
combined_stded_exemption_txp1:
  1977: 3500
  1980: 6000
  1983: 4500
combined_stded_exemption_txp2:
  1977: 6000
  1980: 12000
  1983: 9000

# A real, additional per-dependent exemption-style reduction applied
# DIRECTLY to `statax` (not AGI/deduc) - `xmpd(law)`.
dependent_tax_reduction_amount:
  1977: 400
  1980: 1000

# Federal itemized-deduction phaseout/scaling (2000-2008 eras, real
# percentages of the excess-itemized-over-federal-standard amount).
