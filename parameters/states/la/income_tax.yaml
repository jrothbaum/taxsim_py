  - [6000, 0.04]
  - [45000, 0.053]
  - [46000, 0.06]
brackets_1983_2002_married:
  - [0, 0.02]
  - [10500, 0.033]
  - [11500, 0.04]
  - [90500, 0.053]
  - [91500, 0.06]
brackets_1983_2002_hoh:
  - [0, 0.0275]
  - [2000, 0.04]
  - [41000, 0.06]
brackets_2003_2008_single:
  - [0, 0.02]
  - [8000, 0.04]
  - [20000, 0.06]
brackets_2003_2008_married:
