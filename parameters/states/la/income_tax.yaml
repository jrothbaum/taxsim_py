# Louisiana individual income tax (`latax`, taxsim_2024_09_21.f:7224-7431,
# state id 19). See calculators/states/la.py for the full mechanism.
#
# Confirmed inert given this project's input schema (not silent gaps):
# elderly/blind (`data(9)`/`data(10)`, unpopulated page/sage); pension/
# retirement income (`data(20)`/`data(72)`, unpopulated "pensions" input,
# the same schema-level gap already documented for Iowa/Kansas/Kentucky -
# makes the ENTIRE retirement-income exemption a permanent no-op);
# `data(34)` (never assigned).
#
# `comnew(52)` is live-probe-confirmed to be federal's own `regular_tax`
# (NOT `tax_before_credits`, which already bakes AMT in - `comnew(70)` is
# ADDED separately in the same formula, so using `tax_before_credits`
# here would double-count AMT). `comnew(58)` is live-probe-confirmed to
# be the combined CCC+ODC/CTC nonrefundable-credit total (federal.py's
# own `ccc`+`odc` columns) - confirmed via a case where the nonrefundable
# CTC was capped by remaining tax liability after CCC, and `comnew(58)`
# exactly equaled `ccc + capped_odc`, not `odc` alone.

# Bracket tables (`look`'s own upper_bound/rate% pairs shifted into this
# project's own start/rate_fraction convention) - single/married_separate
# ("s"), married_joint ("m"), and head_of_household ("h") each have their
# own table from 1983 on; 1977-1982 share one flat table for everyone.
brackets_1977_1979:
  - [0, 0.02]
  - [7500, 0.04]
  - [50000, 0.06]
brackets_1980_1982:
  - [0, 0.02]
  - [10000, 0.04]
  - [50000, 0.06]
