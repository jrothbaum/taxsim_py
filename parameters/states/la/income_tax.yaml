# Louisiana individual income tax (`latax`, taxsim_2024_09_21.f:7224-7431,
# state id 19). See calculators/states/la.py for the full mechanism.
#
# Not TAXSIM inputs, so always zero: blindness and `data(34)`.
#
# `comnew(52)` is live-probe-confirmed to be federal's own `regular_tax`
# (NOT `tax_before_credits`, which already bakes AMT in - `comnew(70)` is
# ADDED separately in the same formula, so using `tax_before_credits`
# here would double-count AMT). `comnew(58)` is live-probe-confirmed to
# be the combined CCC+ODC/CTC nonrefundable-credit total (federal.py's
# own `ccc`+`odc` columns) - confirmed via a case where the nonrefundable
# CTC was capped by remaining tax liability after CCC, and `comnew(58)`
# exactly equaled `ccc + capped_odc`, not `odc` alone.

# Bracket tables (`look`'s own upper_bound/rate% pairs shifted into this
# project's own start/rate_fraction convention) - single/married_separate
# ("s"), married_joint ("m"), and head_of_household ("h") each have their
# own table from 1983 on; 1977-1982 share one flat table for everyone.
brackets_1977_1979:
  - [0, 0.02]
  - [7500, 0.04]
  - [50000, 0.06]
brackets_1980_1982:
  - [0, 0.02]
  - [10000, 0.04]
  - [50000, 0.06]
brackets_1983_2002_single:
  - [0, 0.02]
  - [5000, 0.033]
  - [6000, 0.04]
  - [45000, 0.053]
  - [46000, 0.06]
brackets_1983_2002_married:
  - [0, 0.02]
  - [10500, 0.033]
  - [11500, 0.04]
  - [90500, 0.053]
  - [91500, 0.06]
brackets_1983_2002_hoh:
  - [0, 0.0275]
  - [2000, 0.04]
  - [41000, 0.06]
brackets_2003_2008_single:
  - [0, 0.02]
  - [8000, 0.04]
  - [20000, 0.06]
brackets_2003_2008_married:
  - [0, 0.02]
  - [16000, 0.04]
  - [41000, 0.06]
brackets_2003_2008_hoh:
  - [0, 0.02]
  - [3750, 0.04]
  - [17000, 0.06]
brackets_2009plus_single:
  - [0, 0.02]
  - [7500, 0.04]
  - [45500, 0.06]
brackets_2009plus_married:
  - [0, 0.02]
  - [16000, 0.04]
  - [91000, 0.06]
brackets_2009plus_hoh:
  - [0, 0.02]
  - [3500, 0.04]
  - [41000, 0.06]

# Louisiana combines its standard deduction and personal exemption into
# ONE flat dollar figure (`stxmp`, by "txp" - 1 for single/separate, 2 for
# married/HoH/widow).
combined_stded_exemption_txp1:
  1977: 3500
  1980: 6000
  1983: 4500
combined_stded_exemption_txp2:
  1977: 6000
  1980: 12000
  1983: 9000

# A real, additional per-dependent exemption-style reduction applied
# DIRECTLY to `statax` (not AGI/deduc) - `xmpd(law)`.
dependent_tax_reduction_amount:
  1977: 400
  1980: 1000

# Federal itemized-deduction phaseout/scaling (2000-2008 eras, real
# percentages of the excess-itemized-over-federal-standard amount).
excess_itemized_pct_2000_2001:
  1960: 0.5
excess_itemized_pct_2002:
  1960: 0.57
excess_itemized_pct_2007:
  1960: 0.575
excess_itemized_pct_2008:
  1960: 0.65
excess_itemized_2008_proptax_addback_cap_per_filer:
  1960: 500

# Credits.
education_credit_per_dependent_1979_1985_1996_1999:
  1960: 25
education_credit_per_dependent_2015_2016:
  1960: 18
federal_credit_pct:
  1960: 0.1
federal_credit_cap_1986plus:
  1960: 25.0
blind_credit_per_blind:
  1960: 100.0
child_care_credit_rate_by_agi_tier:  # [agi_ceiling, rate, refundable?]
  - [25000, 0.5, true]
  - [35000, 0.3, false]
  - [60000, 0.1, false]
child_care_credit_cap_over_60k:
  1960: 25.0
eitc_rate_2008_2018:
  1960: 0.035
eitc_rate_2019plus:
  1960: 0.05

# Retirement income exemption per taxpayer 65 or older (1981+).
aged_pension_exemption: 6000
# Federal tax attributable to exempt income (pensions and Social Security):
# 25% of exempt income over $15,000, or $8,750 plus 40% over $50,000, up to
# federal tax times exempt income's share of federal AGI.
exempt_income_tax_floor: 15000
exempt_income_tax_rate_low: 0.25
exempt_income_tax_break: 50000
exempt_income_tax_base_high: 8750
exempt_income_tax_rate_high: 0.4

# Dependent credit as a share of the dependent exemption amount: single and
# married returns per dependent; head of household through 2002 (first
# dependent, then each additional), and from 2003 (first three, the fourth
# and fifth, then each additional).
dependent_credit_rate: 0.02
dependent_credit_hoh_pre2003: {first: 0.02, additional: 0.04}
dependent_credit_hoh_2003plus: {first_three: 0.02, fourth: 0.03, additional: 0.04}

# Child care credit above the top income tier: this share of the federal
# credit, up to the cap.
child_care_credit_top_tier_rate: 0.1
