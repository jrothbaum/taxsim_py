# Louisiana individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`latax`); 2022 on, La. R.S. 47:290-300,
# IT-540 instructions and PolicyEngine-US `gov.states.la.tax.income`.
# Blindness has no TAXSIM input.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Rate schedules, [start of bracket, rate]; from 1983 by filing status
# (separate returns use `single`). From 2025 a flat rate (Act 11 of the 2024
# Third Extraordinary Session).
brackets:
  1977: [[0, 0.02], [7500, 0.04], [50000, 0.06]]
  1980: [[0, 0.02], [10000, 0.04], [50000, 0.06]]
  1983:
    single: [[0, 0.02], [5000, 0.033], [6000, 0.04], [45000, 0.053], [46000, 0.06]]
    married_joint: [[0, 0.02], [10500, 0.033], [11500, 0.04], [90500, 0.053], [91500, 0.06]]
    head_of_household: [[0, 0.0275], [2000, 0.04], [41000, 0.06]]
  2003:
    single: [[0, 0.02], [8000, 0.04], [20000, 0.06]]
    married_joint: [[0, 0.02], [16000, 0.04], [41000, 0.06]]
    head_of_household: [[0, 0.02], [3750, 0.04], [17000, 0.06]]
  2009:
    single: [[0, 0.02], [7500, 0.04], [45500, 0.06]]
    married_joint: [[0, 0.02], [16000, 0.04], [91000, 0.06]]
    head_of_household: [[0, 0.02], [3500, 0.04], [41000, 0.06]]
  2022:
    single: [[0, 0.0185], [12500, 0.035], [50000, 0.0425]]
    married_joint: [[0, 0.0185], [25000, 0.035], [100000, 0.0425]]
    head_of_household: [[0, 0.0185], [12500, 0.035], [50000, 0.0425]]
  2025: null
flat_rate: {2025: 0.03}

# --- Income ---
# Retirement income exemption per taxpayer 65 or older, from 1981.
aged_pension_exemption: {1981: 6000, 2025: 12000}
# Federal income tax is deductible through 2021, less the federal tax
# attributable to exempt pensions and Social Security: `rate_low` of exempt
# income over `floor`, or `base_high` plus `rate_high` over `break`, up to
# federal tax times exempt income's share of federal AGI.
federal_tax_deduction: {1977: true, 2022: false}
exempt_income_tax: {floor: 15000, rate_low: 0.25, break: 50000, base_high: 8750, rate_high: 0.4}

# --- Deductions and exemptions ---
# From 1980, this share of federal itemized deductions in excess of the
# federal standard deduction is deductible; in 2008 the excess over the
# standard deduction plus property tax up to
# `excess_itemized_property_tax_addition` per taxpayer.
excess_itemized_share: {1980: 1.0, 2000: 0.5, 2002: 0.57, 2003: 0.0, 2007: 0.575, 2008: 0.65, 2009: 1.0}
excess_itemized_property_tax_addition: {2008: 500, 2009: null}
# Combined standard deduction and personal exemption by taxpayers (one for
# single and separate returns, two for joint and head of household). From
# 2022 dependents and taxpayers 65 or older add `additional_exemption` each,
# and the total reduces tax at the lowest rate instead of income.
combined_deduction_exemption:
  1977: {one: 3500, two: 6000}
  1980: {one: 6000, two: 12000}
  1983: {one: 4500, two: 9000}
  2025: null
additional_exemption: {2022: 1000, 2025: null}
# From 2025: a standard deduction by filing status replaces them.
standard_deduction:
  2025: {single: 12500, married_joint: 25000, head_of_household: 25000, married_separate: 12500}

# --- Credits ---
# Through 2021, tax is reduced by `dependent_credit_rate` of this amount per
# dependent and taxpayer 65 or older (heads of household: the rates below).
dependent_tax_reduction_amount: {1977: 400, 1980: 1000, 2022: null}
dependent_credit_rate: 0.02
dependent_credit_hoh:
  1977: {first: 0.02, additional: 0.04}
  2003: {first_three: 0.02, fourth: 0.03, additional: 0.04}
# Education credit per dependent.
education_credit_per_dependent: {1979: 25, 1986: 0, 1996: 25, 2000: 0, 2015: 18, 2017: 0}
# From 1980: this share of the federal child care and elderly credits
# (from 2022 child care only), capped from 1986.
federal_credit_share: {1980: 0.1}
federal_credit_cap: {1986: 25.0}
# Child care credit from 2003: a share of the federal credit by Louisiana
# AGI, [AGI ceiling, share, refundable]; above the last tier `top_rate` up to
# `top_cap`.
child_care_credit:
  2003:
    tiers: [[25000, 0.5, true], [35000, 0.3, false], [60000, 0.1, false]]
    top_rate: 0.1
    top_cap: 25.0
# Earned income credit from 2008: a share of the federal credit.
eitc_federal_share: {2008: 0.035, 2019: 0.05}
