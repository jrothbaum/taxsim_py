# Maryland individual income tax (state tax only; local income taxes are
# not modeled).
#
# Sources: 1977-2021 NBER TAXSIM (`mdtax`); 2022 on, Md. Code Tax-General
# Title 10, Form 502 instructions and PolicyEngine-US
# `gov.states.md.tax.income`. The jobs and political contribution credits
# have no TAXSIM input.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Rate schedules, [start of bracket, rate]; by group from 1992, with single
# and separate returns reaching the top rates at lower incomes. From 2025
# two new top rates (Budget Reconciliation and Financing Act of 2025).
brackets:
  1977: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.05]]
  1992:
    single_or_separate: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.05], [100000, 0.06]]
    joint_or_hoh: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.05], [150000, 0.06]]
  1995: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.05]]
  1998: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.04875]]
  1999: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.0485]]
  2001: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.048]]
  2002: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.0475]]
  2008:
    single_or_separate: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.0475], [150000, 0.05], [300000, 0.0525], [500000, 0.055], [1000000, 0.0625]]
    joint_or_hoh: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.0475], [200000, 0.05], [350000, 0.0525], [500000, 0.055], [1000000, 0.0625]]
  2012:
    single_or_separate: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.0475], [100000, 0.05], [125000, 0.0525], [150000, 0.055], [250000, 0.0575]]
    joint_or_hoh: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.0475], [150000, 0.05], [175000, 0.0525], [225000, 0.055], [300000, 0.0575]]
  2025:
    single_or_separate: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.0475], [100000, 0.05], [125000, 0.0525], [150000, 0.055], [250000, 0.0575], [500000, 0.0625], [1000000, 0.065]]
    joint_or_hoh: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.0475], [150000, 0.05], [175000, 0.0525], [225000, 0.055], [300000, 0.0575], [600000, 0.0625], [1200000, 0.065]]
# From 2025: a surtax of `rate` on net capital gains when Maryland AGI
# exceeds `threshold`.
capital_gains_surtax:
  2025: {rate: 0.02, threshold: 350000}

# --- Income ---
# Pension exclusion per taxpayer 65 or older, less Social Security benefits.
# Source for 2022 on: PolicyEngine-US gov.states.md.tax.income.agi.subtractions.pension.
pension_exclusion: {1977: 3200, 1978: 5200, 1979: 5700, 1980: 6400, 1981: 7400, 1982: 8700, 1983: 8500, 1986: 8600, 1987: 9100, 1988: 9500, 1989: 10100, 1990: 10800, 1991: 11800, 1992: 12300, 1993: 13100, 1994: 13600, 1995: 13800, 1996: 14400, 1997: 15000, 1998: 15900, 1999: 16100, 2000: 16500, 2001: 17300, 2002: 18500, 2003: 19900, 2004: 20700, 2005: 21500, 2006: 22600, 2007: 23600, 2008: 24000, 2009: 24500, 2010: 26100, 2011: 26300, 2012: 27100, 2013: 27800, 2014: 29000, 2015: 29200, 2016: 29400, 2017: 29900, 2018: 30600, 2019: 31100, 2020: 33100, 2021: 34300, 2022: 34300, 2023: 36200, 2024: 39500, 2025: 41200}
# Child care expense subtraction per child (up to two).
child_care_subtraction_per_child: {1977: 0, 1978: 2400, 2003: 3000}
child_care_subtraction_max_children: 2
# Through 1986: `preference_addback_share` of federal preference income above
# `preference_exclusion_per_taxpayer` per taxpayer is added.
preference_addback_share: {1977: 0.5, 1987: null}
preference_exclusion_per_taxpayer: {1977: 10000, 1987: null}
# 1980: interest is excluded up to this amount per taxpayer.
interest_exclusion_per_taxpayer: {1980: 200, 1981: null}
# From 1992, two-earner subtraction on joint returns: the lesser of this and
# each spouse's income; 1992-1994 `amount` above the AGI limit.
two_earner_subtraction: {1992: 1200, 1998: 1154, 1999: 1200}
two_earner_subtraction_high_income:
  1992: {amount: 1000, agi_limit: 150000}
  1995: null
# 1987-1990: this share of positive net gains is excluded. 1991: `share` of
# gains up to the cap, less `reduction_rate` of other income above the
# threshold.
capital_gains_exclusion_share: {1987: 0.4, 1991: null}
capital_gains_exclusion_capped:
  1991:
    share: 0.3
    cap: {married_joint: 15000, other: 7500}
    income_threshold: {married_joint: 100000, other: 50000}
    reduction_rate: 0.5
  1992: null

# --- Deductions ---
# Standard deduction: `standard_deduction_rate` of Maryland AGI; through 1986
# capped per exemption; 1987-2018 between limits per exemption (heads of
# household count two taxpayers); 2019-2024 between limits by group. From
# 2025 a flat amount by filing status.
standard_deduction_rate: {1977: 0.1, 1979: 0.13, 1987: 0.15}
standard_deduction_cap_per_exemption: {1977: 500, 1979: 1500, 1987: null}
standard_deduction_limits_per_exemption:
  1987: {floor: 1000, ceiling: 2000}
  1990: {floor: 1500, ceiling: 2000}
  2018: {floor: 1500, ceiling: 2250}
  2019: null
# Source 2019-2021: Maryland Resident Booklet, Instruction 16 (TAXSIM's
# arrays fill these out of order); 2022 on: PolicyEngine-US
# gov.states.md.tax.income.deductions.standard.
standard_deduction_limits:
  2019:
    single_or_separate: {floor: 1500, ceiling: 2250}
    joint_or_hoh: {floor: 3050, ceiling: 4550}
  2020:
    single_or_separate: {floor: 1550, ceiling: 2300}
    joint_or_hoh: {floor: 3100, ceiling: 4650}
  2021:
    single_or_separate: {floor: 1550, ceiling: 2350}
    joint_or_hoh: {floor: 3100, ceiling: 4700}
  2022:
    single_or_separate: {floor: 1600, ceiling: 2400}
    joint_or_hoh: {floor: 3200, ceiling: 4850}
  2023:
    single_or_separate: {floor: 1700, ceiling: 2550}
    joint_or_hoh: {floor: 3450, ceiling: 5150}
  2024:
    single_or_separate: {floor: 1800, ceiling: 2700}
    joint_or_hoh: {floor: 3650, ceiling: 5450}
  2025: null
standard_deduction_flat:
  2025: {single: 3350, married_separate: 3350, married_joint: 6700, head_of_household: 6700}
# 1987-1989: additional standard deduction per taxpayer 65 or older.
aged_standard_deduction: {1987: 800, 1990: null}
# Itemized deductions over the 1991-2017 federal limitation threshold
# (times `itemized_limitation_index`; before 2013 halved on separate
# returns) are the federal limited amount less the state tax share.
itemized_limitation_threshold:
  1977: 100000
  2013: {single: 250000, married_joint: 300000, head_of_household: 275000, married_separate: 150000}
itemized_limitation_index: {1977: 1.0, 1992: 1.0525, 1993: 1.084, 1994: 1.118, 1995: 1.147, 1996: 1.1795, 1997: 1.212, 1998: 1.245, 1999: 1.266, 2000: 1.2895, 2001: 1.3295, 2002: 1.373, 2003: 1.395, 2004: 1.427, 2005: 1.4595, 2006: 1.505, 2007: 1.564, 2008: 1.5995, 2009: 1.668, 2010: 1.6955, 2011: 1.6955, 2012: 1.7365, 2013: 1.0, 2014: 1.0168, 2015: 1.033, 2016: 1.0376, 2017: 1.046, 2018: null}
# From 2025: itemized deductions fall by `rate` of federal AGI over the
# threshold.
itemized_deduction_phaseout:
  2025: {rate: 0.075, single: 200000, married_separate: 100000, married_joint: 200000, head_of_household: 200000}

# --- Exemptions ---
# Per exemption; from 1990 per taxpayer and dependent, plus
# `aged_exemption` per taxpayer 65 or older; none for dependent filers from
# 2008.
personal_exemption: {1977: 800, 1987: 1000, 1989: 1100, 1991: 1200, 1998: 1750, 1999: 1850, 2001: 2100, 2002: 2400, 2008: 3200}
aged_exemption: {1990: 1000}
# From 2008, above federal AGI of `exemption_phaseout_agi_floor` the
# exemption per person is replaced by the amount for the AGI tier, [above,
# up to, amount] (from 2012 none when that amount is 0).
exemption_phaseout_agi_floor: 100000
exemption_phaseout:
  2008:
    single_or_separate: [[100000, 125000, 2400], [125000, 150000, 1800], [150000, 200000, 1200], [200000, 1000000000.0, 600]]
    joint_or_hoh: [[150000, 175000, 2400], [175000, 200000, 1800], [200000, 250000, 1200], [250000, 1000000000.0, 600]]
  2012:
    single_or_separate: [[100000, 125000, 1600], [125000, 150000, 800], [150000, 1000000000.0, 0]]
    joint_or_hoh: [[150000, 175000, 1600], [175000, 200000, 800], [200000, 1000000000.0, 0]]

# --- Credits ---
# Earned income credit from 1987: a nonrefundable share of the federal
# credit (from 2022 the whole credit for unmarried childless filers).
eitc_nonrefundable_share: {1987: 0.5}
# From 1998 a refundable share above the tax (through 2008 with dependents
# only; from 2020 childless filers instead get the federal credit up to the
# floor). Source for 2022 on: PolicyEngine-US gov.states.md.tax.income.credits.eitc.
refundable_eitc_rate: {1998: 0.1, 2000: 0.15, 2001: 0.16, 2003: 0.18, 2004: 0.2, 2008: 0.25, 2015: 0.255, 2016: 0.26, 2017: 0.27, 2018: 0.28, 2020: 0.45, 2021: 0.5, 2022: 0.45}
refundable_eitc_childless_floor: {2020: 530, 2023: 1.0e+9}
# Child and dependent care credit: a share of the federal credit (up to
# federal tax), the share falling with federal AGI; 2019 on refundable up to
# `refundable_agi_limit`.
child_care_credit_rate:
  2000: {unit: 0.001, units: 250, start: 30000, step: 40}
  2001: {unit: 0.0001, units: 3250, start: 41000, step_numerator: 1000, step_divisor: 325}
  2019:
    married_joint: {unit: 0.01, units: 32, start: 50000, step: 3000, refundable_agi_limit: 75000}
    other: {unit: 0.01, units: 32, start: 30000, step: 2000, refundable_agi_limit: 50000}
# Poverty level credit from 1997: `poverty_credit_rate` of earned income when
# the higher of federal AGI and earnings is at most the base plus the amount
# per additional exemption.
poverty_credit_rate: 0.05
poverty_credit_income_base: {1997: 7890, 1998: 8050, 1999: 8240, 2000: 8350, 2001: 8590, 2002: 8860, 2003: 8980, 2004: 9310, 2005: 9570, 2006: 9800, 2007: 10210, 2008: 10400, 2009: 10830, 2011: 10890, 2012: 11170, 2013: 11490, 2014: 11670, 2015: 11770, 2016: 11880, 2017: 12060, 2018: 12140, 2019: 12490, 2020: 12760, 2021: 12880}
poverty_credit_income_per_additional_exemption: {1997: 2720, 1998: 2800, 1999: 2820, 2000: 2900, 2001: 3020, 2002: 3080, 2003: 3140, 2004: 3180, 2005: 3260, 2006: 3400, 2007: 3480, 2008: 3600, 2009: 3740, 2011: 3820, 2012: 3960, 2013: 4020, 2014: 4060, 2015: 4160, 2016: 4220, 2017: 4180, 2018: 4320, 2019: 4420, 2020: 4480, 2021: 4540}
# Senior tax credit from 2022 (nonrefundable) for taxpayers 65 or older
# below the federal AGI limit. Source: PolicyEngine-US
# gov.states.md.tax.income.credits.senior_tax.
senior_tax_credit:
  2022: {single: 1000, head_of_household: 1750, joint_one: 1000, joint_two: 1750, limit_other: 100000, limit_joint_or_hoh: 150000}
# Refundable child tax credit from 2023 per child under six, for federal AGI
# up to the cap (2022 covers only disabled children, which have no input).
# From 2025 it phases out by `rate` per `increment` (or part) over
# `threshold` instead. Source: PolicyEngine-US gov.states.md.tax.income.credits.ctc.
child_tax_credit:
  2023: {amount: 500, agi_cap: 15000}
child_tax_credit_phaseout:
  2025: {threshold: 15000, increment: 1000, rate: 50}
