# Maryland individual income tax (`mdtax`, taxsim_2024_09_21.f:7893-8281,
# state id 21). See calculators/states/md.py for the full mechanism.
#
# Not TAXSIM inputs, so always zero: `xjobs()` (the jobs credit) and
# political contributions (`comnew(25)`).
#
# `divexc()` (the federal dividend/interest exclusion swap other states
# only exercise for 1981) is called by Maryland for EVERY year<=1986 -
# reconstructed here as `min(dividends[+intrec if 1981],
# dividend_exclusion_table[status,year])`, generalizing the same
# per-status table (`parameters/national/pre1987.yaml`) every other
# pre-1987 state already reuses, which already covers every year
# 1977-1986 (not just 1981).
#
# `comnew(5)` (raw, unlimited net capital gain) reconstructed as
# `stcg+ltcg` directly (federal.py's own internal `capgn`, not exposed
# as a column, but trivially reproducible from the raw inputs).
#
# `comnew(52)`/`comnew(53)` (the Child/Dependent Care Credit's own cap
# figures) reuse the SAME era-dependent reconstruction Maine's own build
# already established (`regular_tax`<=1979, `fiitax` 1980-1986,
# `regular_tax` 1987+ for comnew(52); the raw federal CCC amount,
# reconstructed pre-1998 the same way, for comnew(53)).
#
# `comnew(32)` (the pre-1987 AGI addback for 1982-1986) is the federal
# two-earner deduction ("twoded") - the SAME quantity DC/Colorado/
# Georgia's own builds already reconstruct from
# `parameters/national/pre1987.yaml`'s two-earner rate/cap.
#
# Maryland's OWN, separate two-earner subtraction (1992+, using
# `data(85)`/`data(86)` = pwages/swages and `data(11)` = total wages,
# matching Iowa's own already-established `agih`/`agiw` husband/wife
# AGI-split mechanic) is a genuinely different, much later provision
# from the pre-1987 `comnew(32)` addback - both apply, in different eras.

# Bracket tables (`look`'s own upper_bound/rate% pairs shifted into this
# project's own start/rate_fraction convention). Single/married_separate
# get a COMPRESSED top-bracket schedule from 2008 on (lower dollar
