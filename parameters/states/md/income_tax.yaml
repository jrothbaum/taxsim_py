# `stds(1/2,law)` - single/married_separate 2019-2021 floor/ceiling;
# `stdm(1/2,law)` - joint/HoH 2019-2021 floor/ceiling. The source's own
# DATA statement lists all 6 values in strict Fortran column-major order
# for a `(2,2019:2021)` array (NOT grouped as "3 floors then 3
# ceilings" the way the continuation-line layout visually suggests) -
# confirmed via a live oracle probe (a 2019 head-of-household case
# showed `stded=3100`, matching floor=3050/ceiling=3100 for 2019 under
# the column-major reading, not the much wider 3050/4550 band the
# visual grouping would imply).
standard_deduction_single_separate_floor_2019_2021:
  2019: 1500
  2020: 1550
  2021: 2300
standard_deduction_single_separate_ceiling_2019_2021:
  2019: 1550
  2020: 2250
  2021: 2350
standard_deduction_joint_hoh_floor_2019_2021:
  2019: 3050
  2020: 3100
  2021: 4650
standard_deduction_joint_hoh_ceiling_2019_2021:
  2019: 3100
  2020: 4550
  2021: 4700

