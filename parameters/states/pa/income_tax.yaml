# Pennsylvania personal income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`patax`); 2022 on, 72 P.S. Article III and
# PolicyEngine-US `gov.states.pa.tax.income`. A flat rate on positive income
# classes (no capital losses, no unemployment compensation), less the tax
# forgiveness credit.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

rate: {1977: 0.02, 1978: 0.022, 1983: 0.0245, 1984: 0.024, 1985: 0.0235, 1986: 0.0216, 1987: 0.021, 1991: 0.026, 1992: 0.0295, 1993: 0.028, 2004: 0.0307}

# Tax forgiveness: the income allowance is `base` plus amounts for the first
# and the other claimants (see the calculator); tax is forgiven in full at
# or below it and phased out over `forgiveness_phaseout` above it.
forgiveness_allowance:
  1977: {base: 3000.0, first: 1200.0, other: 750.0}
  1987: {base: 4500.0, first: 1500.0, other: 1000.0}
  1988: {base: 6300.0, first: 1500.0, other: 1000.0}
  # 1994: per dependent, with a larger base for joint claims.
  1994: {base: 6300.0, joint_base: 9300.0, dependent: 3000.0}
  1995: {base: 6300.0, dependent: 3000.0}
  1997: {first: 6300.0, other: 4000.0}
  # 1998: single claimants count their first dependent at the first amount.
  1998: {first: 6500.0, other: 6000.0}
  1999: {first: 6500.0, other: 6500.0}
  2000: {first: 6500.0, other: 7500.0}
  2001: {first: 6500.0, other: 8500.0}
  2002: {first: 6500.0, other: 9000.0}
  2004: {first: 6500.0, other: 9500.0}
forgiveness_phaseout: {1977: 1000.0, 1998: 2500.0}
# From 2022 forgiveness falls by `share` for each `income` (or part) over the
# allowance.
forgiveness_step:
  2022: {income: 250, share: 0.1}

# Working Pennsylvanians Tax Credit from 2025 (Act 56 of 2025): a refundable
# share of the federal earned income credit. Source: PolicyEngine-US
# gov.states.pa.tax.income.credits.eitc.match.
eitc_federal_share: {2025: 0.10}
