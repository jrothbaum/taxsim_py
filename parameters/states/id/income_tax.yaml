# Idaho individual income tax (`idtax`, taxsim_2024_09_21.f:5508-5782,
# state id 13). See calculators/states/id.py for the full mechanism.
#
# Not TAXSIM inputs, so always zero: blindness, the alt-energy-cost
# subtraction (`data(38)`), the political-contribution credit (`data(65)`),
# the Wages-from-Jobs credit (`xjobs()`, `data(37)`), the investment tax
# credit (`data(33)`) and `comnew(23)` (the <=1986 state-tax-phaseout
# addback, $0 in the oracle).
#
# `comnew(83)`=federal's own computed personal-exemption total and
# `comnew(3)`=federal's own zero-bracket-amount/standard-deduction total
# are both reused directly from federal.py's own already-computed
# `standard_deduction` column (`comnew(3)`) - `comnew(83)` isn't exposed
# as its own column, so it's reconstructed locally in id.py via the same
# `personal_exemption.yaml`-based formula federal.py itself uses
# internally (not otherwise duplicated across this project before now).
#
# `comnew(181)` (the 2018+ Qualified Business Income deduction) is a
# GENUINE, ACKNOWLEDGED SCOPE GAP, not a confirmed-inert field - this
# project's own federal.py has never implemented QBI at all (a real,
# unmodeled federal provision, not something this schema drives to zero),
# so `taxinc -= comnew(181)` is treated as a no-op pending that federal-
# level work, not because it's confirmed to be $0.
#
# Bracket tables are transcribed directly from the source's own (upper_
# bound, rate%) DATA statements. Married_joint AND head_of_household
# (`txp=2`) both halve taxable income before the lookup then double the
# resulting tax; married_separate and single (`txp=1`) use their full
# taxable income directly - ALL FOUR statuses share the SAME table (no
# separate HoH table, unlike most other states built so far). 2001+
# additionally deflates income by a real inflation-adjustment factor
# (`aif01`) before the lookup and reinflates the result by the same
# factor - matching the shared `look`/`look2` subroutine's own generic
# `aif` parameter (already documented in AZ's own bracket-table note).
brackets_pre1987:
  - [0, 0.02]
  - [1000, 0.04]
  - [2000, 0.045]
  - [3000, 0.055]
  - [4000, 0.065]
  - [5000, 0.075]
