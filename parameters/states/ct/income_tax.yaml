# --- Income adjustments ---
# Social Security benefits are exempt below an AGI limit (`single` covers
# separate returns, `joint` head of household); above it only part is
# exempt: through 1999 the benefits over half the excess of household income
# (less half of benefits and federal adjustments) over the federal base
# amount; from 2000 `social_security_partial_share` of benefits up to the
# base amount (from 2022, of combined income above it, IRC section 86).
social_security_agi_limit:
  single: {1985: 50000, 2019: 75000}
  joint: {1985: 60000, 2019: 100000}
social_security_base_amount: {single: 25000, joint: 32000, married_separate: 0}
social_security_partial_share: 0.25
# 2019-2021 pension deduction: this share of pensions, phased out as AGI
# rises from the limit to twice the limit.
pension_deduction_share: {2019: 0.14, 2020: 0.28, 2021: 0.42, 2022: null}
pension_deduction_agi_limit: {single: 75000, joint: 100000}
# From 2022: the share of pensions deducted by AGI, [AGI, share] steps.
# Source: PolicyEngine-US gov.states.ct.tax.income.subtractions.pensions_or_annuity.
pension_deduction_rates:
  2022:
    non_joint: [[0, 1.0], [75000, 0.0]]
    joint: [[0, 1.0], [100000, 0.0]]
  2024:
    non_joint: [[0, 1.0], [75000, 0.85], [77500, 0.70], [80000, 0.55], [82500, 0.40], [85000, 0.25], [87500, 0.10], [90000, 0.05], [95000, 0.025], [100000, 0.0]]
    joint: [[0, 1.0], [100000, 0.85], [105000, 0.70], [110000, 0.55], [115000, 0.40], [120000, 0.25], [125000, 0.10], [130000, 0.05], [140000, 0.025], [150000, 0.0]]

# --- Minimum tax (1993 on), when there is federal AMT ---
# Separate returns add back part of AMT income; an exemption phased out
# above a threshold (married amounts halved on separate returns); a
# two-rate tentative tax; then the lesser of a share of it and a share of
# preference income.
amt:
  separate_addback_start: 165000
  separate_addback_end: 255000
  separate_addback_max: 22500
  separate_addback_rate: 0.25
  exemption_married: 45000
  exemption_other: 33750
  exemption_phaseout_married: 150000
  exemption_phaseout_other: 112500
  exemption_phaseout_rate: 0.25
  rate_breakpoint: 175000
  tax_at_breakpoint: 45500
  breakpoint_offset: {1960: 0, 1994: 3500}
  rate_low: 0.26
  rate_high: 0.28
  tentative_tax_share:
    1993: 0.23
    1994: 0.19
  preference_income_share:
    1994: 0.05
    2013: 0.055

# --- Credits ---
# Property tax credit from 1996: property tax up to the cap, reduced from
# 1997 by `property_credit_phaseout_rate` for each `step_width` of AGI above
# the start (interpolated through 2021). Separate returns use half the
# `joint` start. 2017-2021 only with a dependent or a taxpayer 65 or older.
# Source for 2022 on: PolicyEngine-US gov.states.ct.tax.income.credits.property_tax.
property_credit_cap: {1996: 100, 1997: 215, 1998: 350, 1999: 425, 2000: 500, 2003: 350, 2006: 500, 2011: 300, 2016: 200, 2022: 300}
property_credit_phaseout_start:
  single: {1997: 52500, 2000: 53500, 2001: 54500, 2004: 55000, 2007: 55500, 2008: 56500, 2013: 60500, 2014: 62500, 2015: 47500, 2016: 49500}
  head_of_household: {1997: 78500, 2016: 54500}
  joint: {1997: 100500, 2016: 70500}
property_credit_phaseout_step_width: 10000.0
property_credit_phaseout_rate: 0.15
# Through 2021, the reduction share at each step (interpolated), and far above.
property_credit_phaseout_steps: [0.0, 0.15, 0.30, 0.45, 0.60, 0.75, 0.90]
property_credit_phaseout_final: [1.0e+20, 1.0]
property_credit_requires_dependent_or_elderly: {1996: false, 2017: true, 2022: false}

# Earned income credit from 2011: a share of the federal credit, plus from
# 2025 a flat bonus for a return with a qualifying child. Source for 2022
# on: PolicyEngine-US gov.states.ct.tax.income.credits.eitc.
eitc_federal_share: {2011: 0.30, 2013: 0.25, 2014: 0.275, 2017: 0.23, 2021: 0.305, 2023: 0.40}
eitc_child_bonus: {2011: 0, 2025: 250}
