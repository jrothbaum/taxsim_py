# Sources: 1977-2021 NBER TAXSIM (`cttax`); 2022 on, Conn. Gen. Stat.
# Chapter 229, the CT-1040 instructions and PolicyEngine-US
# `gov.states.ct.tax.income`.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# --- Before 1991: tax on capital gains, dividends and interest only ---
# `capital_gains_rate` on gains less the exemption; in 1987-1988 a further
# share of long-term gains is excluded.
capital_gains_rate: {1977: 0.07, 1991: null}
capital_gains_exclusion: {1987: 0.6, 1989: null}
# Dividends (from 1983 also interest) are taxed in full at the rate for the
# row covering AGI, [AGI upper bound, rate]. 1991 also has the income tax.
