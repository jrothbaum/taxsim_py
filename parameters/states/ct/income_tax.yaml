# Connecticut individual income tax (`cttax`, taxsim_2022_10_21.f:3261-3834,
# state id 7). Ninth state (alphabetical order) - the largest and richest
# yet: a genuinely different pre-1991 structure (tax ONLY on capital
# gains/dividends/interest - no wage tax existed at all), then for 1991+
# a real income tax with its own Personal Tax Credit (13 dense year-
# variant phaseout tables for single filers, 2 fixed ones for HoH/joint),
# its own full AMT (1993+, including a genuine nested full federal
# recompute for 2013+), a 2011+ high-income "Tax Recapture" clawback, a
# Property Tax Credit with its own phaseout, and an EITC (2011+).
#
# Confirmed inert given this project's schema (every field below is never
# assigned anywhere in the whole 29,414-line file, or is gated on one
# that isn't): `data(18)`, `data(22)` (temporarily zeroed/restored by
# `cttax` itself for its own nested AMT recompute, never externally
# assigned), `data(26)`, `data(163)` - which makes `subrac` (used in the
# AGI and AMT preference-income formulas) permanently $0, so CT's own AGI
# is just federal AGI directly, with no adjustment. Also inert: the
# entire Social-Security-benefit exclusion block (gated on `comnew(79)`
# [ssagi], itself computed from `gssi`, never populated) and the 2019+
# retirement-income exclusion (gated on `data(72)+data(20)` [pensions],
# never populated) - both large, real mechanics in the source, but
# unreachable here.

