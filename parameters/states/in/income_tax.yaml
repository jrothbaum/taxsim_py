# Indiana individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`intax`); 2022 on, IC 6-3 and
# PolicyEngine-US `gov.states.in.tax.income`. Blindness and the solar/wind
# credit carryover have no TAXSIM input.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# A flat rate on Indiana AGI less deductions and exemptions. Source for
# 2022 on: PolicyEngine-US gov.states.in.tax.income.agi_rate.
rate: {1977: 0.02, 1980: 0.019, 1983: 0.03, 1987: 0.032, 1988: 0.034, 2015: 0.033, 2017: 0.0323, 2023: 0.0315, 2024: 0.0305, 2025: 0.03}
# 1979: the tax is this share of the computed tax.
tax_share: {1979: 0.85, 1980: null}

# --- Income ---
# 1981: the federal interest and dividend exclusion is added back and this
# dividend exclusion per taxpayer allowed instead.
dividend_exclusion_per_taxpayer: {1981: 100, 1982: null}
# Indiana's unemployment compensation exclusion: half of income above the
# threshold is taxable (capped by what was excluded federally).
ui_exclusion_threshold: {single: 12000, married_joint: 18000}
# 2009: the federal unemployment exclusion, up to this amount per taxpayer,
# is added back.
ui_addback_per_taxpayer: {2009: 2400, 2010: null}

# --- Deductions ---
# Renter's deduction from 1979: rent up to the cap (halved on separate
# returns).
renter_deduction_cap: {1979: 1500, 1999: 2000, 2003: 2500, 2008: 3000}
# Homeowner's property tax deduction from 1999: property tax up to the cap
# (halved on separate returns).
homeowner_property_tax_deduction_cap: {1999: 2500}
# 1997-1998 earned income deduction: with dependents, income below the
# limit and earnings above `earnings_share` of income, the limit less income.
earned_income_deduction:
  1997: {income_limit: 12000, earnings_share: 0.8}
  1999: null

# --- Exemptions ---
# Per taxpayer and taxpayer 65 or older (and per federal exemption from
# 1980); through 1979 dependents get `exemption_per_dependent`.
exemption_per_taxpayer: {1977: 1000, 1980: 500, 1985: 1000}
exemption_per_dependent: {1977: 500, 1980: null}
# 1980-1984: plus income above `floor` up to `maximum` (joint returns: per
# spouse, on a third and two thirds of income).
exemption_income_addition:
  1980: {floor: 500, maximum: 500}
  1985: null
# Additional exemption per dependent from 1997.
dependent_exemption_addition: {1977: 0, 1997: 500, 1999: 1500}
# From 1999: additional exemption per taxpayer 65 or older when federal AGI
# is under the limit.
aged_low_income_exemption:
  1999: {amount: 500, agi_limit: 40000}

# --- Credits ---
# Through 1980, property tax credit for taxpayers 65 or older: a share of
# property tax plus `rent_share` of rent by household income, [income,
# share] interpolated, up to `cap`.
property_credit:
  1977:
    share_table: [[500, 0.75], [1000, 0.70], [1500, 0.50], [2000, 0.40], [2500, 0.30], [3000, 0.25], [4000, 0.20], [5000, 0.10]]
    rent_share: 0.2
    cap: 500
  1981: null
# Credit for taxpayers 65 or older with federal AGI under the limit: through
# 1980 a flat amount when household income is under its limit; from 1981 by
# federal AGI, [AGI, amount] interpolated (steps from 2022), plus
# `elderly_credit_second_aged` on joint returns with two aged.
elderly_credit_agi_limit: 10000
elderly_credit_flat:
  1977: {amount: 25, household_income_limit: 15000}
  1981: null
elderly_credit_table:
  1981: [[1000, 65], [3000, 35], [10000, 25], [1.0e20, 0]]
  1985: [[1000, 100], [3000, 50], [10000, 40], [1.0e20, 0]]
elderly_credit_second_aged: {1981: 25, 1985: 40}
# 1999-2002 earned income credit, with dependents: `rate` of the amount by
# which federal total income falls short of `income_cap`, when earnings are
# at least `earnings_share` of it.
eitc_own:
  1999: {rate: 0.034, income_cap: 12000, earnings_share: 0.8}
  2003: null
# From 2003: a share of the federal credit when it is at least
# `eitc_federal_floor` (no floor from 2022). Source for 2022 on:
# PolicyEngine-US gov.states.in.tax.income.credits.earned_income.match_rate.
eitc_federal_share: {2003: 0.06, 2009: 0.09, 2022: 0.10}
eitc_federal_floor: {2003: 9.0, 2009: 6.0}
# 2011-2021: at most Indiana's own schedule, by EITC children (0, 1, 2+):
# `phase_in_rate` of earnings up to `max_credit`, less `phaseout_rate` of
# the higher of earnings and federal AGI above `phaseout_start`.
eitc_schedule:
  2011: {max_credit: [42.0, 279.0, 460.0], phaseout_start: [7600.0, 16750.0, 16750.0]}
  2012: {max_credit: [43.0, 285.0, 471.0], phaseout_start: [7800.0, 17150.0, 17150.0]}
  2013: {max_credit: [44.0, 293.0, 483.0], phaseout_start: [8000.0, 17550.0, 17600.0]}
  2014: {max_credit: [45.0, 297.0, 491.0], phaseout_start: [8200.0, 17900.0, 17950.0]}
  2015: {max_credit: [45.0, 302.0, 499.0], phaseout_start: [8400.0, 18200.0, 18200.0]}
  2016: {max_credit: [46.0, 304.0, 501.0], phaseout_start: [8400.0, 18200.0, 18200.0]}
  2017: {max_credit: [46.0, 306.0, 505.0], phaseout_start: [8400.0, 18350.0, 18400.0]}
  2018: {max_credit: [47.0, 311.0, 514.0], phaseout_start: [8500.0, 18750.0, 18700.0]}
  2019: {max_credit: [48.0, 317.0, 525.0], phaseout_start: [8650.0, 19100.0, 19050.0]}
  2020: {max_credit: [48.0, 323.0, 533.0], phaseout_start: [8900.0, 19350.0, 19350.0]}
  2021: {max_credit: [49.0, 326.0, 538.0], phaseout_start: [8950.0, 19550.0, 19550.0]}
  2022: null
eitc_schedule_rates: {phase_in_rate: [0.006666, 0.0304285, 0.0358571], phaseout_rate: [0.00688, 0.0144, 0.019]}
# 2012 automatic taxpayer refund credit per taxpayer, when tax is positive.
automatic_taxpayer_refund_credit: {2012: 111, 2013: null}
