# Indiana individual income tax (`intax`, taxsim_2024_09_21.f:5870-6077,
# state id 15). See calculators/states/in.py for the full mechanism.
#
# Confirmed inert given this project's input schema (not silent gaps):
# elderly/blind exemption counts (`data(9)`/`data(10)`) are driven by
# `page`/`sage` (filer/spouse age) inputs, which this project's own
# INPUT_COLUMNS never populates - so `data(9)` is ALWAYS $0 here, unlike
# most other states where age/blind is inert because the FIELD itself is
# never assigned at all. This makes the ENTIRE elderly property-tax
# credit (`pcred`, pre-1981), the entire elderly credit (`ecred`, all
# years), and the 1999+ elderly-exemption addback all permanently $0/no-op
# for this schema - not modeled gaps, confirmed inert. Also inert: the
# "dependent of another return" flag (`data(105)`, same field already
# confirmed inert elsewhere - a no-op additive term in the exemption
# formula here, not a zeroing gate) and the Solar/Wind Energy Carry-Over
# Credit (`data(38)`, never assigned, repealed since 1995 anyway).
#
# `comnew(65)` (used in the 1999-2002 EITC-equivalent formula) is real,
# live-probe-confirmed to be federal AGI itself (identical to `comnew(2)`
# in every probe tried, including with dividends present) - just this
# project's own `agi` column, not a separate reconstruction.
# `comnew(68)` (exemps count) and `comnew(59)` (federal EITC) both reuse
# this project's own already-established `federal.py` output columns
# directly (no local reconstruction needed, unlike Idaho's `comnew(83)`).
rate_by_year:  # rate(law) - Indiana's flat tax rate
  1977: 0.02
  1980: 0.019
  1983: 0.03
  1987: 0.032
  1988: 0.034
  2015: 0.033
  2017: 0.0323

# Renter's deduction cap (`dedr`, real; divided by `sep` for
# married_separate).
renter_deduction_cap_1979_1998:
  1960: 1500
renter_deduction_cap_1999_2002:
  1960: 2000
renter_deduction_cap_2003_2007:
  1960: 2500
renter_deduction_cap_2008plus:
  1960: 3000

# Homeowner's Residential Property Tax Deduction (`dedown`, 1999+, real;
# divided by `sep` for married_separate).
homeowner_proptax_deduction_cap_1999plus:
  1960: 2500

# 1981-only dividend/interest exclusion swap: federal's own real $200/
# $400 combined interest+dividends exclusion that year (reused directly
# from `PRE1987_PARAMS["dividend_exclusion"]`, same real one-year
# provision Hawaii's own 1981 handling already documents) is ADDED BACK,
# then Indiana's OWN, smaller, dividends-only $100-per-filer exclusion is
# subtracted instead - a real, narrow one-year state/federal decoupling.
dividend_exclusion_indiana_1981_per_filer:
  1960: 100

# Indiana's own Unemployment Compensation exclusion (real, applies every
# year with nonzero UI, not just 2009/2020) - an AGI-threshold-based
# worksheet matching the classic pre-1987 FEDERAL UI-exclusion mechanic,
# but computed on INDIANA'S OWN $12,000/$18,000(joint) threshold and
# capped by whatever federal itself actually excluded that year
# (`comnew(78)`, real and nonzero only for 2009's $2,400/filer ARRA
# exclusion and 2020's CARES/ARPA exclusion - $0, hence this whole
# mechanism a no-op, for every other year).
ui_exclusion_threshold_single:
  1960: 12000
ui_exclusion_threshold_married_joint:
  1960: 18000
# 2009 add-back: Indiana fully disallows federal's own UI exclusion that
# year (capped at $2,400 per filer) before separately re-applying its own
# threshold-based version above.
ui_2009_addback_cap_per_filer:
  1960: 2400

# 1999-2002 EITC-equivalent (own formula; live-probe-confirmed `comnew(65)`
# = federal AGI, not a separate figure).
eitc_1999_2002_rate:
  1960: 0.034
eitc_1999_2002_income_cap:
  1960: 12000

# 2003-2008: percentage of the FEDERAL EITC, gated on a federal-EITC
# floor.
eitc_2003_2008_rate:
  1960: 0.06
eitc_2003_2008_federal_floor:
  1960: 9.0

# 2009+: percentage of the federal EITC (federal-EITC floor $6) - 2011+
# additionally recomputes its OWN separate credit via `crmax`/`ymax`/
# `rtbase`/`rtless` (by number of EITC-qualifying children, capped at 2)
# and takes the smaller of the two.
eitc_2009plus_rate:
  1960: 0.09
eitc_2009plus_federal_floor:
  1960: 6.0

