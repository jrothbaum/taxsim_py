# Delaware individual income tax (`detax`, taxsim_2024_09_21.f:3860-4162,
# state id 8). See calculators/states/de.py for the full mechanism -
# genuinely richer than Illinois/Arkansas: its own 17-bracket pre-1997
# table (marginal, `look`), a separate smaller table for 1997+ (that keeps
# changing top rate through 2014), an own Pease-style itemized-deduction
# phaseout (1991-2017, same 2/3 -> 1/3 -> 0 multiplier schedule already
# seen in AL/AZ/CA/AR), a personal-exemption era that dies out in 1996 in
# favor of a flat personal-exemption CREDIT, and a real "pick whichever is
# better for the taxpayer" EITC (2021+: either a smaller refundable 4.5%
# credit or a larger nonrefundable 20% one, whichever leaves the filer
# better off).
#
# Confirmed inert given this project's input schema (not silent gaps):
# the entire pension/Social-Security-income exclusion mechanism (data 9/
# 20/72 - age-65+/pension-income fields this project never populates -
# real Social Security itself is already excluded from `agi` unconditionally
# via comnew(79), which IS handled); the elderly/blind additional exemption
# and standard deduction (data 9/10, same "confirmed inert" fields as
# AL/AZ/CT); the $5-per-exemption energy credit (data 38, same field
# AZ/CA/CT already confirmed permanently $0); data(34)'s unconditional
# addback to itemized deductions (law>=1981) - grepped the full source,
# `data(34)` is never assigned by the input reader for any input this
# project's schema drives, so it's always exactly $0.
#
# Brackets are transcribed directly from the source's own DATA statements
# (upper_bound, rate%) pairs, converted to this project's (start, rate
# fraction) convention the same way AR/CA do it.
