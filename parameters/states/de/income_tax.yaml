# Standard deduction: <=1987 the lesser of $1,000/exemption-unit or 10% of
# AGI; 1988-1998 a flat $1,300 (single/HoH) or $1,600/sep (joint/separate);
# 1999 similarly but $3,250/$4,000; 2000+ $3,250 per exemption unit
# (`data(7)`, doubles for joint).
standard_deduction_cap_per_exemption_pre1988:
  1960: 1000
standard_deduction_flat_single_or_hoh_1988_1998:
  1988: 1300
standard_deduction_flat_joint_or_sep_1988_1998:  # /sep
  1988: 1600
standard_deduction_flat_single_or_hoh_1999:
  1999: 3250
standard_deduction_flat_joint_or_sep_1999:  # /sep
  1999: 4000
standard_deduction_per_exemption_2000plus:
  2000: 3250

# Itemized-deduction Pease-style phaseout threshold (1991-2017), same
# 2/3(2006-2007)->1/3(2008-2009)->0(2010-2012) multiplier schedule this
# project has already extracted for AL/AZ/CA/AR - `aif92`/`aif13` are the
# SAME national CPI-adjustment factors those states already carry (each
# state gets its own copy in the source too, not a shared array).
itemized_phaseout_base:
  1960: 100000
itemized_phaseout_aif92_1992_2012:
  1992: 1.0525
  1993: 1.0845
  1994: 1.118
  1995: 1.147
  1996: 1.1795
  1997: 1.212
  1998: 1.245
  1999: 1.266
  2000: 1.2895
  2001: 1.3295
  2002: 1.373
  2003: 1.395
  2004: 1.427
  2005: 1.4595
  2006: 1.505
  2007: 1.564
  2008: 1.5995
  2009: 1.668
  2010: 1.6955
  2011: 1.6955
  2012: 1.7365
itemized_phaseout_aif13_2013_2017:
  2013: 1.0
  2014: 1.0168
  2015: 1.033
  2016: 1.0376
  2017: 1.046
# `phas92 = aif13(law)*250000*filing(mst,1.,1.2,1.1,.6)`, 2013-2017 only -
# per-status multiplier on the (aif13-scaled) $250,000 base, order
# single/joint/hoh/separate matching this project's own `filing()`-style
# helpers elsewhere.
itemized_phaseout_2013_2017_multiplier:
  single: 1.0
  married_joint: 1.2
  head_of_household: 1.1
  married_separate: 0.6

# Personal exemption (`xmp(law,1)`, dies out after 1987 into a flat
# personal-exemption CREDIT below instead - "since 1996 only personal
# exemption credit exists, no exemptions" per the source's own comment,
# though the source's own code stops touching `exemp` after 1995, not
# 1996 exactly - see the module docstring for how this project resolves
# that boundary).
personal_exemption_amount:
  1977: 600
  1985: 800
  1986: 1000
  1988: 1250
  1996: 0

# Child/Dependent Care Credit: `comnew(53)[[fed CCC]] * rate`, capped
# 1999+. Rate (`xmp(law,3)`) 0% through 1986, 25% 1987-1988, 50% 1989+.
child_care_credit_rate:
  1960: 0.0
  1987: 0.25
  1989: 0.50
child_care_credit_cap_1999plus:
  1999: 720
  2003: 1050
  2021: 4000

# Personal Exemption Credit (1996+, replaces the exemption itself) -
# $100/exemption-unit 1996-1999, $110/exemption-unit 2000+.
personal_exemption_credit_per_unit:
  1996: 100
  2000: 110

# EITC (2006+): nonrefundable 20% of federal EITC through 2020. 2021+: the
# BETTER for the taxpayer of a refundable 4.5% credit or a nonrefundable
# 20% credit - the refundable option is only taken when it would exceed
# what the nonrefundable 20% option could actually use against current
# state tax liability (i.e. the taxpayer isn't leaving money on the table
# either way).
eitc_nonrefundable_rate_2006_2020:
  2006: 0.20
eitc_refundable_rate_2021plus:
  2021: 0.045
eitc_nonrefundable_rate_2021plus:
  2021: 0.20

# Pension exclusion: under 60 (no taxpayer 65 or older in TAXSIM's terms),
# pensions up to $2,000 per taxpayer; otherwise pensions plus interest,
# dividends and gains up to `pension_exclusion_aged` (twice that for two
# aged taxpayers).
pension_exclusion_young_per_taxpayer: 2000
pension_exclusion_aged: {1977: 3000, 1999: 5000, 2000: 12500}
# 1984+: $2,000 per taxpayer 65 or older when earned income is below $2,500
# and AGI at most $10,000 per aged taxpayer.
aged_low_income_exclusion: 2000
aged_low_income_earned_limit: 2500
aged_low_income_agi_limit: 10000
# Additional standard deduction per taxpayer 65 or older.
aged_standard_deduction: {1987: 1000, 1999: 2500}

# Through 1987 the standard deduction is at most this share of AGI.
standard_deduction_agi_share_pre1988: 0.1
# 1987 itemized deductions are multiplied by this factor.
itemized_deduction_multiplier_1987: 1.12
# 2018: property, other and state taxes deductible up to this amount per
# return (halved for separate returns).
state_tax_deduction_cap_2018: 10000
# Itemized limitation: 2013-2017 threshold multiple of the base; rates; the
# share applied (phased down 2006-2009, none 2010-2012).
itemized_phaseout_base_multiple_2013_2017: 2.5
itemized_phaseout_rate: 0.03
itemized_phaseout_cap_rate: 0.8
itemized_phaseout_share:
  1991: 1.0
  2006: 0.6666666666666666
  2008: 0.3333333333333333
  2010: 0.0
  2013: 1.0
# Through 1987 federal income tax up to this amount per taxpayer adds to exemptions.
federal_tax_exemption_per_taxpayer_pre1988: 300
