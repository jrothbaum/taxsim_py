  2021: 4540.0
eitc_rate: {2006: 0.2}
# From 2022 the EITC may instead be claimed as this refundable share; the
# larger benefit applies. Source: PolicyEngine-US
# gov.states.va.tax.income.credits.eitc.match.
eitc_refundable_rate: {2022: 0.15, 2025: 0.2}
# 2023-2024 rebate (nonrefundable). Source: PolicyEngine-US
# gov.states.va.tax.income.credits.rebate.
rebate:
  2023: {married_joint: 400, other: 200}
  2025: null
# Through 1989: credit of a share of a Social Security maximum per taxpayer 65
# or older, less benefits and twice income over the start (1989: none with
# retirement income at or above the limit).
old_age_credit_base:
  1977: 4952
  1978: 5518
  1979: 6640
  1980: 6864
  1981: 8124
  1982: 9035
  1983: 8508
  1984: 8436
  1985: 8926
  1986: 9120
  1987: 9468
  1988: 10056
  1989: 10788
  1990: null
old_age_credit_rate: 0.05
old_age_credit_income_start: 12000
old_age_credit_retirement_limit: {1989: 2000}
