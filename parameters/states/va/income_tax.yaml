# Virginia individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`vatax`); 2022 on, Code of Virginia
# 58.1-320 et seq., Form 760 instructions and PolicyEngine-US
# `gov.states.va.tax.income`.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# --- Tax ---
# [start of bracket, rate]. Through 1999 joint returns pay the lesser of joint
# tax and the combined tax of each spouse's share.
brackets:
  1977: [[0, 0.02], [3000, 0.03], [5000, 0.05], [12000.0, 0.0575]]
  1987: [[0, 0.02], [3000, 0.03], [5000, 0.05], [14000.0, 0.0575]]
  1988: [[0, 0.02], [3000, 0.03], [5000, 0.05], [15000.0, 0.0575]]
  1989: [[0, 0.02], [3000, 0.03], [5000, 0.05], [16000.0, 0.0575]]
  1990: [[0, 0.02], [3000, 0.03], [5000, 0.05], [17000.0, 0.0575]]
# No return (no tax) below these AGIs: 1979-1986 one amount; 1987-2004 single
# or married (halved for married filing separately); from 2005 per taxpayer.
filing_minimum:
  1979: 3000.0
  1987: {single: 5000.0, married: 8000.0}
  2005: {per_taxpayer: 7000.0}
# No tax at or below these AGIs: through 2004 single and head of household, or
# an amount per taxpayer for others; from 2005 per taxpayer.
zero_tax_agi:
  1977: {single: 5000.0, married_per_taxpayer: 4000.0}
  2005: {per_taxpayer: 7000.0}
  2008: {per_taxpayer: 11250.0}
  2010: {per_taxpayer: 11650.0}
  2012: {per_taxpayer: 11950.0}

# --- Income ---
# Through 1987: deduction per taxpayer 65 or older.
aged_deduction: {1977: 400, 1987: 200, 1988: null}
# 1989: retirement income subtraction for taxpayers 65 or older: all
# retirement income up to the full limit; from the partial start to the partial
# end, (base less retirement income) over the divisor, up to the cap.
retirement_subtraction:
  1989: {full_limit: 16000, partial_start: 16001, partial_end: 40000, base: 64000, divisor: 6, cap: 7992}
  1990: null
# From 1990: age deduction per taxpayer 65 or older (1992: one amount per
# return), up to federal AGI; from 2004 reduced dollar for dollar by federal AGI
# less taxable Social Security over the income limit.
age_deduction: {1990: 12000, 1992: 12472, 1993: 12944, 1995: 10000, 1996: 12000}
age_deduction_income_limit:
  2004: {single: 50000, married_joint: 75000}

# --- Deductions and exemptions ---
# Standard deduction through 1986: a share of AGI between `low` and `high`
# (halved on separate returns). 1987-1988 joint or other; 1989-2004 single-type
# or married (halved for married filing separately); from 2005 per taxpayer.
standard_deduction_share:
  1977: {rate: 0.15, low: 1300.0, high: 2000.0}
  1987: null
standard_deduction:
  1987: {joint: 2000.0, other: 1000.0}
  1988: {joint: 2700.0, other: 1350.0}
  1989: {single: 3000.0, married: 5000.0}
  2005: {per_taxpayer: 3000.0}
  2019: {per_taxpayer: 4500.0}
  2022: {per_taxpayer: 8000.0}
  2024: {per_taxpayer: 8500.0}
  2025: {per_taxpayer: 8750.0}
# 1991-2017: the state income tax deduction is reduced in proportion to the
# federal-style limitation above the threshold times the index (halved on
# separate returns; from 2013 times the status factor). From 2019 Virginia's own
# limitation above these federal AGIs, with the threshold test times the test
# index.
itemized_limit_threshold:
  1991: 100000.0
  2013: 250000.0
  2018: null
  2019: {single: 271700.0, married_joint: 326050.0, married_separate: 163025.0, head_of_household: 298850.0}
itemized_limit_index:
  1991: 1.0
  1992: 1.0525
  1993: 1.0845
  1994: 1.118
  1995: 1.147
  1996: 1.1795
  1997: 1.212
  1998: 1.245
  1999: 1.266
  2000: 1.2895
  2001: 1.3295
  2002: 1.373
  2003: 1.395
  2004: 1.427
  2005: 1.4595
  2006: 1.505
  2007: 1.564
  2008: 1.5995
  2009: 1.668
  2010: 1.6955
  2012: 1.7365
  2013: 1.0
  2014: 1.0168
  2015: 1.033
  2016: 1.0376
  2017: 1.046
itemized_limit_status_factor:
  2013: {single: 1.0, married_joint: 1.2, head_of_household: 1.1, married_separate: 0.6}
  2018: null
itemized_limit_test_index: {2019: 1.0, 2021: 1.25}
itemized_limit_share: 0.8
itemized_limit_rate: 0.03
salt_cap: {2018: 10000.0}
# Child care expense deduction per child (at most two); the federal expense
# limit from 2003 (TAXSIM has none in 2003).
child_care_deduction_per_child: {1979: 2000.0, 1983: 2400.0, 2003: 3000.0}
# Exemption per taxpayer and dependent (through 2004 also per taxpayer 65 or
# older).
exemption: {1977: 600.0, 1987: 700.0, 1988: 800.0, 2005: 900.0, 2008: 930.0}
# From 2005, exemption per taxpayer 65 or older.
aged_exemption: {2005: 800}

# --- Credits ---
# Spouse tax adjustment from 2000 when taxable income exceeds the minimum,
# capped. A spouse 65 or older has the age deduction and age exemption.
spouse_adjustment_cap: {2000: 259.0}
spouse_adjustment_min_taxable: 3000.0
spouse_adjustment_age_deduction: 12000
spouse_adjustment_aged_exemption: 800
# Credit for low-income individuals from 2000: an amount per person when AGI is
# at or below the limit for the household; from 2006 the larger of that and a
# share of the federal EITC; limited to tax and not with the age deduction.
low_income_credit_per_person: {2000: 300.0}
low_income_limit:
