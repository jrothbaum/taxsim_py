  2019: 12490.0
  2020: 12760.0
  2021: 12880.0
low_income_limit_per_person:
  2000: 2900.0
  2001: 3020.0
  2002: 3080.0
  2003: 3140.0
  2004: 3180.0
  2005: 3260.0
  2006: 3400.0
  2007: 3480.0
