# Statutory mode uses actual law through this year.
law_coded_through: 2025

# --- Tax ---
# [start of bracket, rate]. Through 1986 joint returns use half the income, tax
# doubled; 1983-1986 heads of household have their own schedule (1984's is read
# as 17 rows, so the 13% row above $70,000 is never reached). From 1987 married
# filing separately is taxed on half the joint thresholds. 2023 on: W. Va. Code
# 11-21-4e; source PolicyEngine-US gov.states.wv.tax.income.rates.
