# 2020+: share of taxable Social Security subtracted when federal AGI is at
# most the limit per taxpayer.
# 2022+: the whole benefit is exempt below the AGI limit; above it the exempt share phases in (35% in
# 2024, 65% in 2025, all in 2026) - PolicyEngine-US subtractions.social_security_benefits.
social_security_subtraction_share: {2020: 0.35, 2021: 0.65, 2022: 1.0}
social_security_above_limit_share: {2022: 0.0, 2024: 0.35, 2025: 0.65}
social_security_subtraction_agi_per_taxpayer: 50000
# Senior citizen deduction: up to this per taxpayer 65 or older, from total
# income (federal total income plus taxable Social Security) split between
# spouses by wages.
