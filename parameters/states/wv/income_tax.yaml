# 1983-1985 surtax multiplier on tax when taxable income exceeds the amount per
# taxpayer.
surtax: {1983: 1.09, 1984: 1.12, 1985: 1.06, 1986: null}
surtax_income_per_taxpayer: 10000.0

# --- Income, deductions and exemptions ---
# From 2020: share of taxable Social Security subtracted when federal AGI is at
# most the limit per taxpayer; from 2022 the share subtracted above the limit.
# Source from 2022: PolicyEngine-US
# gov.states.wv.tax.income.subtractions.social_security_benefits.
social_security_subtraction_share: {2020: 0.35, 2021: 0.65, 2022: 1.0}
social_security_above_limit_share: {2022: 0.0, 2024: 0.35, 2025: 0.65}
social_security_subtraction_agi_per_taxpayer: 50000
# Senior citizen deduction: up to this per taxpayer 65 or older, from total
# income (federal total income plus taxable Social Security) split between
# spouses by wages.
senior_deduction: 8000
# Through 1986: a share of AGI up to the cap (no deductions from 1987).
standard_deduction_share:
  1977: {rate: 0.1, cap: 1000.0}
  1987: null
# Exemption per federal exemption; from 1987 a dependent filer gets its own
# amount.
exemption: {1977: 600.0, 1983: 700.0, 1984: 800.0, 1987: 2000.0}
dependent_filer_exemption: {1987: 500}
# From 1997: earned income excluded (up to the limit) when federal AGI is at
# most the limit (halved for married filing separately).
low_income_exclusion: {1997: 10000.0}

# --- Credits ---
# Family tax credit from 2007: tax forgiven at or below an AGI limit by number
# of exemptions (1-8+, halved for married filing separately), phased out by the
# points per step above it. From 2022 tested on federal AGI, in steps: the first
# share for the first step over the limit, then `share_per_step` less for each
# further step.
