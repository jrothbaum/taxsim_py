# Kansas individual income tax (`kstax`, taxsim_2024_09_21.f:6507-6941,
# state id 17). See calculators/states/ks.py for the full mechanism.
#
# Not TAXSIM inputs, so always zero: blindness, medical expenses
# (`data(47)`-`data(49)`), casualty losses (`data(61)`), the childcare addback
# for a dependent filing its own return (`data(34)`) and the solar/energy
# credit (`data(38)`). `comnew(8)`, `comnew(20)`, `comnew(23)` and
# `comnew(25)` are $0 in the oracle.
#
# The 1989-1991 alternative "federal-tax-subtracted" bracket computation
# (`ftabs`/`ftabm`, `taxy=taxinc-fedtax`) is REAL, DEAD CODE in the
# source itself - its own `if(law.ge.1989.and.law.le.1991)` branch can
# never fire, since the two `elseif` branches immediately above it
# already catch law 1988-1989 and law 1990-1991 respectively, leaving no
# year for this branch to ever reach. Confirmed by control-flow reading
# alone, not by probing - not implemented here, matching the oracle's own
# actual (unreachable) behavior.
#
# `look()`'s own real "married filing combined" comparison (splitting
# income between spouses by wages, same shape Iowa's own mechanic uses,
# taking whichever of the plain halved-joint-bracket or the split
# computation is cheaper) is wired to fire ONLY for years<=1987 and
# years>=2013 (the `-data(2)` third argument to `look()`) - 1988-2012
# instead use entirely separate, explicit single-vs-joint bracket tables
# with no halving or splitting at all.

