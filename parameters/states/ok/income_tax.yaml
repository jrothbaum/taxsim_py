# Federal tax deduction through 1978: the threshold plus a share of tax above
# it, capped; federal tax before credits when tax is at most the threshold.
# 1979-2005 federal tax in full.
federal_tax_deduction_cap:
  1977: {threshold: 500.0, rate: 0.05, cap: 1700.0}
  1979: null

# --- Exemptions and deductions ---
# Exemption per taxpayer and dependent, and per taxpayer 65 or older.
exemption_amount: {1977: 750.0, 1982: 1000.0}
# From 1987 the exemption for age only with federal AGI up to the limit.
aged_exemption_agi_limit:
  1987: {single: 15000, married_joint: 25000, married_separate: 12500, head_of_household: 19000}
# Standard deduction through 2005: a share of AGI between a minimum and maximum
# (halved for married filing separately); 2006 flat; from 2007 an amount for
# heads of household and per taxpayer otherwise.
standard_deduction_share:
  1977: {rate: 0.15, minimum: 1000.0, maximum: 2000.0}
  2006: null
standard_deduction_flat:
  2006: {single: 2000.0, married: 3000.0}
  2007: null
standard_deduction_head_of_household:
  2007: 4125.0
  2008: 4875.0
  2009: 6325.0
  2010: 8400.0
  2011: 8500.0
  2012: 8700.0
  2013: 8950.0
  2014: 9100.0
  2015: 9250.0
  2016: 9300.0
  2017: 9350.0
standard_deduction_per_taxpayer:
  2007: 2750.0
  2008: 3250.0
  2009: 4250.0
  2010: 5700.0
  2011: 5800.0
  2012: 5950.0
  2013: 6100.0
  2014: 6200.0
  2015: 6300.0
  2017: 6350.0
# From 2018 itemized deductions other than medical and charity are capped.
itemized_cap: {2018: 17000.0}
salt_cap: {2018: 10000.0}

# --- Income ---
# Retirement income exclusion (pensions) per qualifying taxpayer: through 2006
# per taxpayer 65 or older with AGI up to the limit per such taxpayer; 2007-2009
# per taxpayer 65 or older with AGI up to the limit for one or two taxpayers;
# from 2010 per taxpayer.
pension_exclusion: {1977: 2200, 1999: 3300, 2000: 4400, 2001: 5500, 2005: 7500, 2006: 10000}
pension_exclusion_agi_limit:
  1977: 25000
  2007: {one: 50000, two: 100000}
  2008: {one: 62500, two: 125000}
  2009: {one: 100000, two: 200000}
  2010: null

# --- Credits ---
# Child care credit: a share of the federal credit; from 2008 the larger of that
# and a share of the federal child tax credit, up to the federal AGI limit,
# times the Oklahoma share of AGI.
child_care_credit_rate: 0.2
child_tax_credit_rate: 0.05
child_credit_agi_limit: {2008: 100000.0}
# Earned income credit from 2002: a share of the federal credit times the
# Oklahoma share of AGI; nonrefundable 2016-2021.
eitc_rate: {2002: 0.05}
eitc_refundable: {2002: true, 2016: false, 2022: true}
# From 2022 the federal credit under the rules for this year (68 O.S. 2357.43).
eitc_federal_law_year: {2022: 2020}
# Sales tax credit per person from 1990, below a household income limit: one
# limit for everyone (1990-1998 and 2003), otherwise a limit for households
# without and with dependents (taxpayers 65 or older count as with), where those
# without get the credit only for taxpayers.
sales_tax_credit: 40.0
sales_tax_credit_income_limit:
  1990: 12000.0
  1999: {alone: 15000.0, with_dependents: 20000.0}
  2000: {alone: 30000.0, with_dependents: 50000.0}
  2001: {alone: 20000.0, with_dependents: 50000.0}
  2002: {alone: 15000.0, with_dependents: 30000.0}
  2003: 12000.0
  2004: {alone: 15000.0, with_dependents: 30000.0}
  2005: {alone: 20000.0, with_dependents: 50000.0}
# Property tax credit for taxpayers 65 or older: property tax over a share of
# household income (with the federal EITC), up to the maximum, below the limit.
property_credit_income_limit: {1977: 6600, 1980: 7200, 1984: 8500, 1989: 10000, 1997: 12000}
property_credit_income_share: 0.01
property_credit_max: 200
