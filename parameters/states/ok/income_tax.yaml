# Oklahoma individual income tax (TAXSIM `oktax`, taxsim_2024_09_21.f:16621-17091).
# Brackets are [start, rate] rows converted from TAXSIM's `look2` upper-bound
# tables (the last rate continues beyond the table). "single" tables also
# serve married filing separately; "married" tables serve joint returns and
# heads of household, except the 1977-1978 head-of-household table.

# Through 2005 the tax is the lesser of two schedules: one on income after
# deductions and exemptions (`taxya`), one on that income also less federal
# tax paid (`taxyb`).
