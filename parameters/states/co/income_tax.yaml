# Colorado individual income tax (`cotax`, taxsim_2022_10_21.f:2930-3260,
# state id 6). Eighth state (alphabetical order) - much smaller than
# Arkansas/California: a 2-era structure (its OWN AGI/deduction/bracket
# recompute for 1977-1986, then a flat-rate tax on FEDERAL TAXABLE INCOME
# directly for 1987+ - the simplest federal-conformity mechanism of any
# state built so far), plus its OWN mini-AMT (a flat rate on the FEDERAL
# amt_base, added on top whenever it exceeds CO's own regular tax), a
# Sales Tax Refund (a flat per-exemption credit, 6 distinct year tables),
# a Child Care Credit (federal-credit-based, matching other states'
# reuse pattern), and an EITC (a flat % of the federal EITC).
#
# Confirmed inert given this project's schema: the Investment Tax Credit
# (`data(33)`, never assigned), the Energy Credit (`data(38)`, never
# assigned - matches the cross-state finding), the Property Tax/Fuel Tax
# Credit and the pre-1987 pension exclusion (all gated on `data(9)`/`(10)`
# [elderly/blind, never populated] or the rare `mst.eq.5` widow code this
# project's own mstat mapping never produces), `xjobs()` (targeted-jobs
# credit AGI subtraction, gated on `data(37)`, never assigned), and the
# 1999-2001 Colorado Child Tax Credit (the source's own formula is
# entirely commented out - dead code, not a gap).

