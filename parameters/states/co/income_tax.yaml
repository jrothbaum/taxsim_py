# Family Affordability Credit (HB24-1311, 2024+), refundable. PolicyEngine-US
# gov.states.co.tax.income.credits.family_affordability, queried 2026-09-29:
# $3,200 per child under 6 and 75% of that for ages 6-16, reduced by 6.875% of
# the maximum for each $5,000 (or part) of federal AGI above the threshold.
family_affordability_credit:
  amount: {2024: 3200, 2025: 3273}
  older_child_share: 0.75
  reduction_rate: 0.06875
  reduction_increment: 5000
  reduction_threshold:
    single: {2024: 15000}
    head_of_household: {2024: 15000}
    married_separate: {2024: 15000}
    married_joint: {2024: 25000, 2025: 26000}

# Pension and Social Security exclusion per taxpayer, for returns with a
# taxpayer 65 or older (TAXSIM `pnsion`).
pension_exclusion: {1977: 3000, 1978: 4000, 1979: 5000, 1982: 20000, 2000: 24000}
# 2001-2002 joint returns: subtraction per taxpayer 65 or older.
aged_marriage_subtraction_2001: 900

# Pre-1987 property tax and heating credits for taxpayers 65 or older, by
# household income (doubled for married separate filers): the maximum,
# reduced at `phaseout_rate` above the start, up to property tax plus 20% of
# rent (heating: 10% of rent), zero above the income limit. 1977 adds 10% of
# property tax plus 15% of rent.
property_credit:
  maximum: {1977: 410, 1980: 500}
  phaseout_start: {single: {1977: 3000, 1978: 3300, 1980: 5000}, other: {1977: 4300, 1978: 6700, 1980: 8700}}
  phaseout_rate: {1977: 0.10, 1980: 0.20}
  income_limit: {single: {1977: 7300, 1980: 7500}, other: {1977: 8300, 1978: 10800, 1980: 11200}}
heating_credit:
  maximum: 160
  phaseout_start: {single: {1977: 3000, 1978: 3300, 1980: 5000}, other: {1977: 4300, 1978: 6700, 1980: 8700}}
  phaseout_rate: {1977: 0.04, 1978: 0.064}

# Property and heating credits are limited to property tax plus a share of
# rent (heating: a share of rent); 1977 adds a share of property tax plus
# a smaller rent share.
property_credit_rent_share: 0.2
property_credit_1977_addition: {rate: 0.1, rent_share: 0.15}
heating_credit_rent_share: 0.1

# 1980-1986 interest and dividend exclusions per taxpayer.
interest_exclusion_per_taxpayer_1980_1986: 200
dividend_exclusion_per_taxpayer_1980_1986: 200

# Through 1979 standard deduction (the federal percentage standard
# deduction and low-income allowance), before the inflation factor.
standard_deduction_pre1980:
  rate: 0.1
  cap: 1000
  cap_separate: 500
  allowance_separate_base: 100
  allowance_separate_cap: 500
  allowance_base: 200
  allowance_per_exemption: 100
  allowance_cap: 1000
  allowance_bonus: 800
  bonus_income_floor: 1000
  bonus_income_per_exemption: 750
  bonus_phaseout_rate: 0.5

# 2022+: add-back of federal deductions above a limit when federal AGI exceeds
# the threshold (2022: itemized deductions only; 2023+: standard or itemized),
# and of the qualified business income deduction above the AGI limits.
high_income_addback:
  agi_threshold: {2022: 400000, 2023: 300000}
  limit_joint: {2022: 60000, 2023: 16000}
  limit_other: {2022: 30000, 2023: 12000}
  itemized_only: {2022: true, 2023: false}
  qbi_agi_limit_joint: 1000000
  qbi_agi_limit_other: 500000
