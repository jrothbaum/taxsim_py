# Utah individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`uttax`); 2022 on, Utah Code 59-10, TC-40
# instructions and PolicyEngine-US `gov.states.ut.tax.income`.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# --- Through 2007: graduated tax ---
# [start of bracket, rate]: `single` for single and married-separate filers,
# `married` for joint returns and heads of household.
brackets:
  1977:
    single: [[0, 0.0225], [750, 0.0325], [1500, 0.0425], [2250, 0.0525], [3000, 0.0625], [3750, 0.0725], [4500, 0.0775]]
    married: [[0, 0.0275], [1500, 0.0375], [3000, 0.0475], [4500, 0.0575], [6000, 0.0675], [7500, 0.0775]]
  1982:
    single: [[0, 0.0275], [750, 0.0375], [1500, 0.0475], [2250, 0.0575], [3000, 0.0675], [3750, 0.0775]]
    married: [[0, 0.0275], [1500, 0.0375], [3000, 0.0475], [4500, 0.0575], [6000, 0.0675], [7500, 0.0775]]
  1988:
    single: [[0, 0.0255], [750, 0.035], [1500, 0.044], [2250, 0.0535], [3000, 0.0625], [3750, 0.072]]
    married: [[0, 0.0255], [1500, 0.035], [3000, 0.044], [4500, 0.0535], [6000, 0.0625], [7500, 0.072]]
  1996:
    single: [[0, 0.0255], [750, 0.035], [1500, 0.044], [2250, 0.0535], [3000, 0.06], [3750, 0.07]]
    married: [[0, 0.0255], [1500, 0.035], [3000, 0.044], [4500, 0.0535], [6000, 0.06], [7500, 0.07]]
  1997:
    single: [[0, 0.023], [750, 0.033], [1500, 0.042], [2250, 0.052], [3000, 0.06], [3750, 0.07]]
    married: [[0, 0.023], [1500, 0.033], [3000, 0.042], [4500, 0.052], [6000, 0.06], [7500, 0.07]]
  2001:
    single: [[0, 0.023], [863, 0.033], [1726, 0.042], [2588, 0.052], [3450, 0.06], [4313, 0.07]]
    married: [[0, 0.023], [1726, 0.033], [3450, 0.042], [5176, 0.052], [6900, 0.06], [8626, 0.07]]
  2006:
    single: [[0, 0.023], [1000, 0.033], [2000, 0.042], [3000, 0.052], [4000, 0.06], [5500, 0.0698]]
    married: [[0, 0.023], [2000, 0.033], [4000, 0.042], [6000, 0.052], [8000, 0.06], [11000, 0.0698]]
  2008: null
# 2007 alternative single-rate tax on AGI.
single_rate_alternative: {2007: 0.0535, 2008: null}
# 1988 credit for small tax.
small_tax_credit:
  1988: {tax_limit: 80.0, rate: 0.125, cap: 10.0}
  1989: null
# Exemption per federal exemption through 1986; 1987-2017 a share of the
# federal exemption amount (none in 1987); from 2018 an amount per dependent.
exemption_per_person: {1977: 750.0, 1987: null}
federal_exemption_share: {1987: 0.0, 1988: 0.75, 2018: null}
dependent_exemption: {2018: 565.0, 2019: 579.0, 2020: 590.0, 2021: 1750.0}
# Through 1986: a share of AGI between `low` and `high` (halved on separate
# returns); then the federal standard deduction.
standard_deduction_share:
  1977: {rate: 0.15, low: 1300.0, high: 2000.0}
  1987: null
# Share of federal tax (with the minimum tax, less nonrefundable credits)
# deducted.
federal_tax_share: {1977: 1.0, 1987: 0.0, 1988: 0.33, 1989: 0.5, 2008: null}
# 1993-2007: the state income tax deduction is reduced by the federal-style
# limitation above the threshold times the index (halved on separate returns).
itemized_limit_threshold: {1993: 100000.0, 2008: null}
itemized_limit_index:
  1991: 1.0
  1992: 1.0525
  1993: 1.0845
  1994: 1.118
  1995: 1.147
  1996: 1.1795
  1997: 1.212
  1998: 1.245
  1999: 1.266
  2000: 1.2895
  2001: 1.3295
  2002: 1.373
  2003: 1.395
  2004: 1.427
  2005: 1.4595
  2006: 1.505
  2007: 1.564
itemized_limit_share: 0.8
itemized_limit_rate: 0.03
# Retirement income deduction through 2007. Retirement income is pensions and
# taxable Social Security, plus interest and dividends when a taxpayer is 65 or
# older. Through 1987: up to the under-65 amount per taxpayer, or the
# 65-or-older amount for each such taxpayer. From 1988: the under-65 amount per
# taxpayer (limited to retirement income) or the 65-or-older amount per such
# taxpayer, less a share of federal AGI over the phaseout start.
retirement_deduction_under65: {1977: 4800, 1987: 2500, 1988: 4800, 2008: null}
retirement_deduction_aged: {1977: 6000, 1987: 3600, 1988: 6000, 1989: 7500, 2008: null}
retirement_deduction_phaseout_rate: 0.5
# AGI above which the retirement deduction and credits phase out (`other` halved
# on separate returns).
retirement_phaseout_start: {single: 25000, other: 32000}

# --- From 2008: flat tax with credits ---
# Source from 2022: PolicyEngine-US gov.states.ut.tax.income.rate.
flat_rate: {2008: 0.05, 2018: 0.0495, 2022: 0.0485, 2023: 0.0465, 2024: 0.0455, 2025: 0.045}
salt_cap: {2018: 10000.0}
# Taxpayer credit: a share of deductions and exemptions (from 2022 the
# deduction plus the personal exemption per dependent), less a share of income
# above the phaseout threshold (2008-2021 for heads of household, or per
# taxpayer otherwise, times the index; from 2022 by filing status). Source from
# 2022: PolicyEngine-US gov.states.ut.tax.income.credits.taxpayer.
taxpayer_credit_rate: 0.06
taxpayer_credit_phaseout_rate: 0.013
taxpayer_credit_phaseout_threshold:
  2008: {head_of_household: 18000.0, per_taxpayer: 12000.0}
  2022: {single: 15548, married_joint: 31096, married_separate: 15548, head_of_household: 23322}
  2023: {single: 16742, married_joint: 33484, married_separate: 16742, head_of_household: 25114}
  2024: {single: 17652, married_joint: 35304, married_separate: 17652, head_of_household: 26478}
  2025: {single: 18213, married_joint: 36426, married_separate: 18213, head_of_household: 27320}
taxpayer_credit_index:
  2008: 1.0
  2009: 1.0426
  2010: 1.0446
  2011: 1.06
  2012: 1.0857
  2013: 1.114
  2014: 1.1325
  2015: 1.1504
  2016: 1.1556111
  2017: 1.164833
  2018: 1.188
  2019: 1.21675
  2020: 1.2399
  2021: 1.258
  2022: 1.0
taxpayer_credit_personal_exemption: {2022: 1802, 2023: 1941, 2024: 2046, 2025: 2111}
# Retirement credit per qualifying taxpayer (2008-2021 65 or older; from 2022 at
# least `retirement_credit_age`), less a share of AGI over the phaseout start.
# 2008-2021 plus a share of taxable Social Security up to an amount per taxpayer
# under 65; from 2022 the larger of the retirement credit and the Social
# Security credit (a share of taxable benefits less the phaseout share of AGI
# over its own start). Source from 2022: PolicyEngine-US
# gov.states.ut.tax.income.credits.retirement and ss_benefits.
retirement_credit_max: {2008: 450}
retirement_credit_phaseout_rate: 0.025
retirement_credit_age: {2022: 70, 2023: 71, 2024: 72, 2025: 73}
social_security_credit_rate: 0.06
social_security_credit_per_taxpayer: {2008: 288, 2022: null}
social_security_credit_phaseout_start:
  2022: {single: 37000, married_joint: 62000, married_separate: 31000, head_of_household: 62000}
  2023: {single: 45000, married_joint: 75000, married_separate: 37500, head_of_household: 75000}
  2025: {single: 54000, married_joint: 90000, married_separate: 45000, head_of_household: 90000}
# From 2022, earned income credit: a share of the federal credit, up to wages.
# Source: PolicyEngine-US gov.states.ut.tax.income.credits.earned_income.
earned_income_credit_rate: {2022: 0.15, 2023: 0.2}
# From 2024 (UC 59-10-1047), child tax credit per child under the age limit,
# less the reduction rate times income above the phaseout start. Source:
# PolicyEngine-US gov.states.ut.tax.income.credits.ctc.
child_tax_credit:
  2024:
    amount: 1000
    reduction_rate: 0.1
    phaseout_start: {single: 43000, married_joint: 54000, married_separate: 27000, head_of_household: 43000}
    child_age_limit: 4
  2025:
    amount: 1000
    reduction_rate: 0.1
    phaseout_start: {single: 43000, married_joint: 54000, married_separate: 27000, head_of_household: 43000}
    child_age_limit: 6
