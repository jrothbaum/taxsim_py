# Retirement income deduction (through 2007). Retirement income is pensions
# and taxable Social Security, plus interest and dividends when a taxpayer
# is 65 or older. Through 1987: up to the under-65 amount per taxpayer, or
# the 65-or-older amount for each such taxpayer. From 1988: the under-65
# amount per taxpayer (limited to retirement income) or the 65-or-older
# amount per such taxpayer, less half of federal AGI over the phaseout start.
retirement_deduction_under65: {1977: 4800, 1987: 2500, 1988: 4800}
retirement_deduction_aged: {1977: 6000, 1987: 3600, 1988: 6000, 1989: 7500}
retirement_deduction_phaseout_start: {single: 25000, other: 32000}
retirement_deduction_phaseout_rate: 0.5
# 2008+ retirement credit: per taxpayer 65 or older, less 2.5% of AGI over
# the phaseout start (single returns; others the married amount halved for
# separate filers); plus 6% of taxable Social Security up to an amount per
# taxpayer under 65.
retirement_credit_per_aged_taxpayer: 450
retirement_credit_phaseout_rate: 0.025
social_security_credit_rate: 0.06
social_security_credit_per_taxpayer: 288
