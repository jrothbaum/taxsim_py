# District of Columbia individual income tax (`dctax`/`dcstax`,
# taxsim_2024_09_21.f:4168-4707, state id 9). See calculators/states/dc.py
# for the full mechanism - the richest state built so far (its own
# Low Income Credit interpolation tables 1987-2017, a separate EITC track,
# a property-tax-credit refund with its own "avoid notches" approximation,
# and a married-joint earner-split mechanic that uses a GENUINELY
# DIFFERENT bracket table than the main calculation for 2007 specifically
# - a real, confirmed-in-source staleness quirk, not a transcription bug).
#
# Confirmed inert given this project's input schema (not silent gaps):
# elderly/blind (`data(9)`/`data(10)`, both never assigned by the input
# reader for any field this project's schema drives - `data(9)` depends on
# `age1`/`age2` inputs this project never sets, `data(10)` is never
# assigned at all in this oracle vintage); the "dependent of another
# return" flag (`data(105)`, same situation); the "childless under 25"
# EITC disqualification (`data(205)`/`data(206)`, same age-input
# dependency); the political-contribution credit (`comnew(25)`, an old,
# pre-1989-only, capped-at-$25-50/exemption credit whose exact federal
# source column wasn't confidently traced - treated as $0, revisit if
# validation for years<=1988 shows it matters); the pre-1982 `data(60)`/
# `data(65)` itemized-deduction addback terms (same family as other
# states' already-confirmed-inert medical/casualty/political fields).
#
# `zbrack`/`exem` (DC's own shared references to federal's standard
# deduction/personal exemption arrays) are NOT re-derived here - reused
# directly from parameters/national/income_tax.yaml's own
# `standard_deduction` (single/married_joint/head_of_household) and
# parameters/national/personal_exemption.yaml's `amount`, which this
# project's own YAML comments already confirm are the literal same
# `zbrack`/`exem` arrays (same variable names, same values).
#
# Main-calculation brackets (`look`, applied to full `taxinc`) - these
# also serve as the married-joint earner-split brackets (`look2`) for
# every year EXCEPT 2007 (see `brackets_2007_split` below).
brackets_pre1987:  # `tab77`, 1977-1986
  - [0, 0.02]
  - [1000, 0.03]
  - [2000, 0.04]
  - [3000, 0.05]
  - [4000, 0.06]
  - [5000, 0.07]
  - [10000, 0.08]
  - [13000, 0.09]
  - [17000, 0.10]
  - [25000, 0.11]
brackets_1987:
  - [0, 0.06]
  - [10000, 0.08]
  - [20000, 0.10]
brackets_1988_1999:  # `tab88`
  - [0, 0.06]
  - [10000, 0.08]
  - [20000, 0.095]
brackets_2000:  # `tab00`
  - [0, 0.05]
  - [10000, 0.075]
  - [20000, 0.095]
brackets_2001_2004:  # `tab01`
  - [0, 0.05]
  - [10000, 0.075]
  - [30000, 0.093]
brackets_2005:  # `tab05`
  - [0, 0.05]
  - [10000, 0.075]
  - [30000, 0.09]
brackets_2006:  # `tab06`
  - [0, 0.045]
  - [10000, 0.07]
  - [40000, 0.087]
brackets_2007_2011:  # `tab07` (main calc only - see `brackets_2007_split`)
  - [0, 0.04]
  - [10000, 0.06]
  - [40000, 0.085]
brackets_2012_2014:  # `tab12`
  - [0, 0.04]
  - [10000, 0.06]
  - [40000, 0.085]
  - [350000, 0.0895]
brackets_2015:  # `tab15`
  - [0, 0.04]
  - [10000, 0.06]
  - [40000, 0.07]
  - [60000, 0.085]
  - [350000, 0.0895]
brackets_2016plus:  # `tab16`
  - [0, 0.04]
  - [10000, 0.06]
  - [40000, 0.065]
  - [60000, 0.085]
  - [350000, 0.0875]
  - [1000000, 0.0895]
# `dcstax`'s own 2007-only bracket table, genuinely DIFFERENT from (and
# staler than) the main calculation's `brackets_2007_2011` - a real,
# confirmed-in-source quirk (dcstax's own tab07 matches the MAIN
# calculation's 2006 rates, not 2007's; dcstax's own tab08, covering
# 2008-2011, matches the main calculation's tab07 exactly - so the
# divergence is real but confined to exactly one year).
brackets_2007_split:
  - [0, 0.045]
  - [10000, 0.07]
  - [40000, 0.085]

# Standard deduction - six genuinely different eras before settling on the
# 2018+ federal-linked formula.
standard_deduction_cap_pre1982:
  1960: 1000
standard_deduction_flat_1982_1986:
  1982: 1000
standard_deduction_flat_1987_2005:
  1987: 2000
standard_deduction_flat_2006_2007:
  2006: 2500
standard_deduction_flat_2008_2009:  # + min(proptax, texp*500) addback
  2008: 4000
standard_deduction_proptax_addback_per_exemption_unit_2008_2009:
  2008: 500
standard_deduction_flat_2010_2012:
  2010: 4000
standard_deduction_flat_2013:
  2013: 4100
standard_deduction_flat_2014:
  2014: 4150
# 2015-2017: flat by status - married_separate gets SINGLE's own amount
# (NOT half of joint - a real, replicated-as-found DC quirk, confirmed
# directly from the source's own status grouping: `mst.eq.2.or.mst.eq.5`
# for joint, `mst.eq.4.or.mst.eq.7` for HoH, married_separate/single both
# fall to the same "else" branch).
standard_deduction_2015_2016_joint:
  2015: 8350
standard_deduction_2015_2016_hoh:
  2015: 6500
standard_deduction_2015_2016_single_or_separate:
  2015: 5200
standard_deduction_2017_joint:
  2017: 10275
standard_deduction_2017_hoh:
  2017: 7800
standard_deduction_2017_single_or_separate:
  2017: 5650

# Itemized-deduction Pease-style phaseout threshold, 2018+ specifically -
# a SEPARATE, later, $200k/sep-based mechanism from the 1991-2017-era
# schedule other states use (DC's own `comnew(30)`-based SALT-feedback
# removal replaces that older mechanism outright by 2018).
itemized_agi_reduction_threshold:
  1960: 200000

# Personal exemption (`xmp(law)`) - flat by year, $0 starting 2018 (TCJA-
# era suspension, matching every other state's own personal exemption).
personal_exemption_amount:
  1977: 750
  1987: 885
  1988: 1025
  1989: 1160
  1990: 1270
  1991: 1370
  2006: 1500
  2008: 1675
  2014: 1725
  2015: 1775
  2018: 0

# 2015-2017 exemption phaseout (a real, DC-specific mechanism distinct
# from federal's own PEP - a straight-line ratio, not a per-$2,500-step
# function).
exemption_phaseout_2015_2017_floor:
  2015: 150000
exemption_phaseout_2015_2017_ceiling:
  2015: 275000
exemption_phaseout_2015_2017_band_per_sep:
  2015: 2500

# Child/Dependent Care Credit - a straight percentage of the FEDERAL
# credit BEFORE its own refundability/cap logic (`comnew(176)`, matching
# the same "pre-cap federal childcare credit" column CA's own 2000+
# formula reads).
child_care_credit_rate_1982_1988:
  1982: 0.30
child_care_credit_rate_1989plus:
  1989: 0.32

# Property Tax Credit ("Schedule H") - real refund mechanism with an
# "avoid notches" linear-interpolation approximation of the real
# published phase-down table (the source's own comment: this project
# replicates the SAME approximation the oracle itself uses, not the real
# published Schedule H table, matching this project's standing rule to
# match what taxsim does).
property_credit_cap_pre2014:
  1960: 750
property_credit_rate_pre2014:  # `.15` on rentpaid (confirmed inert, no
  # rentpaid input) or proptax directly - the ONLY reachable branch for
  # this project's schema is the `nqu==0` (no elderly/blind) case.
  1960: 0.15
property_credit_by_year_2014plus:  # prop(law)/pagi(law)/prlim(law)
  2014: [40000, 60000, 1000]
  2015: [40000, 60000, 1000]
  2016: [50000, 60000, 1000]
  2017: [50500, 61900, 1025]
  2018: [51000, 62600, 1025]
  2019: [55000, 75000, 1200]
  2020: [55700, 75900, 1200]
  2021: [56200, 76700, 1225]

