# Kentucky individual income tax (`kytax`, taxsim_2024_09_21.f:6945-7219,
# state id 18). See calculators/states/ky.py for the full mechanism.
#
# Not TAXSIM inputs, so always zero: blindness, self-employed health
# insurance (`data(124)`), IRA contributions (`data(29)`), non-itemizer
# charitable contributions (`data(58)`-`data(60)`), investment interest
# expense (`data(57)`), misc. 2018+ itemized components (`data(66)`), the
# solar credit (`data(38)`), `comnew(28)` and `comnew(23)`.
#
# The Income Gap Tax Credit (`gapcr`, 2019-2020) is included in TAXSIM's
# detailed `credit` output but is not subtracted from `statax`.
#
# The 2010-2012 itemized-deduction-phaseout suspension has a real,
# replicated-as-found BUG in the source's own condition:
# `if(law.eq.2010.and.law.le.2012) reduce=0.` - `law.eq.2010` AND
# `law.le.2012` can only both be true when `law==2010` exactly (almost
# certainly meant `law.ge.2010`), so the phaseout suspension only ever
# fires for 2010, not 2011-2012 too.

# Bracket tables (`look`'s own upper_bound/rate% pairs shifted into this
# project's own start/rate_fraction convention). 2018+ is a flat 5%.
brackets_pre2005:
  - [0, 0.02]
  - [3000, 0.03]
  - [4000, 0.04]
  - [5000, 0.05]
  - [8000, 0.06]
brackets_2005_2017:
  - [0, 0.02]
  - [3000, 0.03]
  - [4000, 0.04]
  - [5000, 0.05]
  - [8000, 0.058]
  - [75000, 0.06]
flat_rate_2018plus:
  1960: 0.05
  # PolicyEngine-US: gov.states.ky.tax.income.rate.
  2022: 0.05
  2023: 0.045
  2024: 0.04

