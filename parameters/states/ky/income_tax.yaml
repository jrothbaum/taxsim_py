# Kentucky individual income tax (`kytax`, taxsim_2024_09_21.f:6945-7219,
# state id 18). See calculators/states/ky.py for the full mechanism.
#
# Confirmed inert given this project's input schema (not silent gaps):
# elderly/blind (`data(9)`/`data(10)`, unpopulated page/sage); Social
# Security benefits (`comnew(79)`) and pension/retirement income
# (`data(20)`/`data(72)`, driving the ENTIRE retirement-income-exclusion
# table to a permanent no-op - `pensions` was never added to this
# project's own INPUT_COLUMNS, the same schema-level gap already
# documented for Iowa/Kansas); self-employed health insurance
# (`data(124)`), IRA contributions (`data(29)`), non-itemizer charitable
# cash/asset contributions (`data(58)`/`data(59)`/`data(60)`), investment
# interest expense (`data(57)`), misc. 2018+ itemized components
# (`data(66)`), solar credit (`data(38)`), and `comnew(28)`/`comnew(23)` -
# none ever assigned by the input reader.
#
# The Income Gap Tax Credit (`gapcr`, 2019-2020) is REAL but genuinely
# VESTIGIAL for this project's own observable output: the source computes
# it and folds it into `credit` (an internal reporting total this project
# never exposes as a column) but never actually subtracts it from
# `statax` - confirmed by direct source reading, not a gap.
#
# The 2010-2012 itemized-deduction-phaseout suspension has a real,
# replicated-as-found BUG in the source's own condition:
# `if(law.eq.2010.and.law.le.2012) reduce=0.` - `law.eq.2010` AND
# `law.le.2012` can only both be true when `law==2010` exactly (almost
# certainly meant `law.ge.2010`), so the phaseout suspension only ever
# fires for 2010, not 2011-2012 too.

# Bracket tables (`look`'s own upper_bound/rate% pairs shifted into this
# project's own start/rate_fraction convention). 2018+ is a flat 5%.
