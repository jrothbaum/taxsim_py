# Interest exclusion per taxpayer.
interest_exclusion_per_taxpayer: 100
# Capital losses offset Part A interest and dividend income up to this amount.
capital_loss_offset_limit: 1000
# Federal net capital loss limit (halved for separate returns) and the
# Schedule B limit on dividends offsetting short-term losses (1999+).
federal_capital_loss_limit: 3000
schedule_b_offset_limit: 2000

# Payroll tax and Social Security benefits deductions, each up to this amount.
payroll_tax_deduction_cap: 2000

# Dependent deduction: a flat amount per return, or per child under 13 (at
# most two); 1982 limits it per child.
dependent_deduction:
  1977: {flat: 600}
  1997: {flat: 1200}
  2001: {per_child: 2400}
  2002: {per_child: 3600}
  2021: {flat: 0}
dependent_deduction_cap_per_child: {1982: 2000, 1983: null}

# Child care deduction per child under 13 (through 2010); 2021+ credit.
child_care_deduction_per_child:
  1977: 2400
  2010: 4800
  2011: null
child_care_credit_per_child: {2021: 240}
# 2021-2022 dependent credit per dependent (the larger of it and the child
# care credit).
dependent_credit_per_dependent: {2021: 180}

# 1989: the Part B rate on the income taxed at the older rate.
part_b_rate_first_part: {1989: 0.05, 1990: null}
# 1984: the surtax applies to Part A and Part B income above this amount.
surtax_income_threshold: {1984: 60000, 1985: null}

# Limited Income Credit: tax above a share of income over the no-tax
# threshold, up to an income limit; thresholds rise per dependent from 1995.
limited_income_credit_rate: 0.1
limited_income_credit_limit_single: 14000
limited_income_credit_limit_joint: {1984: 21000, 1995: null}
no_tax_status_per_dependent: 1000
limited_income_credit_limit_per_dependent: 1750

# Credit before 1984: per taxpayer and per dependent.
personal_credit:
  1977: {per_taxpayer: 8, per_dependent: 4}
  1984: null

# From 2023 (PolicyEngine-US gov.states.ma.tax.income): a 4% surtax on
# taxable income above the indexed threshold, and the child and family
# credit per child under 13 in place of the dependent and child care
# credits.
additional_tax:
  2023: {rate: 0.04, threshold: 1000000}
  2024: {rate: 0.04, threshold: 1053750}
  2025: {rate: 0.04, threshold: 1083150}
child_and_family_credit_per_child: {2023: 310, 2024: 440}
