# Massachusetts individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`matax`); 2022 on, M.G.L. Chapter 62,
# Form 1 instructions and PolicyEngine-US `gov.states.ma.tax.income`. Not
# modeled (no TAXSIM input): blindness, medical expenses, capital-loss
# carryovers and the energy credit.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Part B (wages and other "basic" income) rate.
part_b_rate:
  1977: 0.05
  1989: 0.05375
  1990: 0.0595
  1991: 0.0625
  1992: 0.0595
  2000: 0.0585
  2001: 0.056
  2002: 0.053
  2012: 0.0525
  2014: 0.052
  2015: 0.0515
  2016: 0.051
  2019: 0.0505
  2020: 0.05

# Part A (interest/dividends/short-term gains) rate.
part_a_rate:
  1977: 0.10
  1990: 0.12
  # Short-term gains rate (PolicyEngine-US gov.states.ma.tax.income.rates.part_a).
  2023: 0.085

# Part C (long-term capital gains, 1997+) rate.
part_c_rate:
  1997: 0.05
  2003: 0.053
  2012: 0.0525
  2014: 0.052
  2015: 0.0515
  2016: 0.051
  2019: 0.0505
  2020: 0.05

# Surtax multiplier on the whole pre-credit tax (1984: applied only to a
# part whose income exceeds $60,000 - see ma.py).
surtax:
  1977: 1.075
  1986: 1.0

# Capital gains exclusion share (`gnx`), <=1996 Part A computation.
capital_gains_exclusion:
  1977: 0.0
  1980: 0.20
  1981: 0.40
  1982: 0.60
  1983: 0.50
  1997: 0.0

