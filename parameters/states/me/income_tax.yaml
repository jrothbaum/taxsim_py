# Maine individual income tax (`metax`, taxsim_2024_09_21.f:7437-7886,
# state id 20). See calculators/states/me.py for the full mechanism - the
# richest state built this session, exceeding even Iowa/Kansas/Kentucky.
#
# Not TAXSIM inputs, so always zero: IRA contributions (`data(42)`, the
# `iratax` add-on), the property-tax qualifier flag (`data(25)`), the
# solar/energy credit (`data(38)`), the jobs credit (`data(37)`, `xjobs`)
# and `data(34)`.
#
# `comnew(65)` is live-probe-confirmed to be TOTAL income - AGI PLUS
# whatever the half-self-employment-tax AGI deduction subtracted, NOT
# AGI itself (a genuinely different quantity from what this project
# established via Indiana, where a simple wage-only test case couldn't
# distinguish the two) - reconstructed as `agi + 0.5*setax`.
# `comnew(17)` is live-probe-confirmed to be exactly that same `0.5*setax`
# quantity directly (the half-SE-tax AGI deduction itself).
# `comnew(69)` matches Connecticut's own already-established
# reconstruction (`agi - mortgage if itemizing else 0`).
# `comnew(28)` is a real, era-dependent federal tax-liability figure
# (matching Louisiana's own already-established finding: `fiitax` for
# 1980-1990, `regular_tax` before/after that) - reused directly here,
# though the years this feeds (`txm`, the "Extra Tax"/minimum-tax add-on)
# only matter when federal AMT is already nonzero, which this project's
# own earlier finding already established is essentially always $0 for
# ordinary wage+SALT+mortgage returns - a low-materiality provision.
# `comnew(188)` (2020's own alternate childless-18-24 EITC eligibility
# figure) is a genuine, ACKNOWLEDGED GAP for that one year specifically -
# not identified within this build's scope, treated as the ordinary
# `comnew(59)` federal EITC figure instead (2020 is a single, narrow year).

# Bracket tables (`look`'s own upper_bound/rate% pairs shifted into this
# project's own start/rate_fraction convention). 1977-1987 apply a real,
# distinctive halve-then-multiply mechanic where head_of_household gets
