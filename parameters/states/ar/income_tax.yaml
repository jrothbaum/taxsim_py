# Arkansas individual income tax (`artax`, taxsim_2022_10_21.f:1172-2197,
# state id 4). Sixth state (alphabetical order) - by far the largest so
# far: a fully hand-coded, per-year "low income table" override for
# 1991-2021 (parameters/states/ar/low_income_table.csv, verified row-by-row
# against a live compiled probe of `artax` itself - see
# scripts/gen_ar_low_income_csv.py's own docstring for the verification
# method), on top of the usual bracket-table eras, a Personal Tax Credit
# (flat $/exemption, year-indexed `pcr` table), a Child/Dependent Care
# Credit (20%/10% of the FEDERAL credit), and a genuine "married filing
# splitting" relief mechanic (split AGI/deductions ~evenly between
# spouses, tax each half separately through the SAME single-filer bracket
# table, take whichever of {joint, split} is smaller) that runs through
# every bracket era from 1987 on.
#
# Given this project's schema, the following `data()` fields the source
# references in `artax` are NEVER assigned anywhere in the whole 29,414-
# line file (confirmed via grep) and so are always exactly $0 for every
# test case this project can construct: data(17), (19), (20), (21), (23),
# (24), (26), (62), (72), (91), (124). This collapses AR's own AGI formula
# (which nominally sums ~15 terms) down to just wages + (dividends+0.001)
# + interest + capgn (+ ui for 2018-2019 only), and collapses the whole
# 1983-1990 pension-income-exclusion mechanism to a permanent no-op.
# `comnew(8)` (Schedule E) and `comnew(14)` (Keogh) are federal-computed
# but likewise always $0 given no such input exists in this schema.
#
# Confirmed inert for the same reason: the 1982 two-earner-style addback
# (`comnew(12)`=ira, `comnew(14)`=keogh, both $0); the non-itemizer
# charitable deduction 1983-1986 (`comnew(81)`, gated on `charity_cash`,
# federal.py's own disclosed non-drivable gap); `data(9)`/`data(10)`
# (elderly/blind counts, never populated - matches every other state).

brackets_base:  # `tbase`, used 1987-2015 (thresholds year-overridden 1999+)
  - [0, 0.01]
  - [3000, 0.025]
  - [6000, 0.035]
  - [9000, 0.045]
  - [15000, 0.06]
  - [25000, 0.07]

# 1999-2015: same table/rates as brackets_base, only the first 5 bracket
# THRESHOLDS change by year (bracket 6 stays [25000, 0.07] throughout;
# 2014+ also drops bracket 1's rate to 0.9%, 2015 also drops brackets
# 2-4's rates to 2.4/3.4/4.4%).
bracket_thresholds_by_year:
  1999: [3100, 6100, 9200, 15300, 25400]
  2000: [3100, 6200, 9300, 15500, 25900]
  2001: [3200, 6400, 9600, 16000, 26700]
  2002: [3300, 6600, 9900, 16500, 27500]
  2003: [3300, 6700, 10000, 16700, 27900]
  # 2004 deliberately has NO entry: the source's own elseif chain has a
  # real bug (`else if(law.eq.2003) ...tab03...; else if(law.eq.2002)
  # ...tab04...` - the tab04 branch is gated on `law.eq.2002`, a duplicate
  # of the earlier, already-matched 2002 condition, not `law.eq.2004`).
  # Since elseif chains take the first match, this branch is dead code -
  # year 2004 falls through with NO threshold override at all, silently
  # using `brackets_base`'s default (1987-1997-era) thresholds instead of
  # tab04's. Confirmed via live oracle probe (single, wages=50000, 2004:
  # real siitax=$2750.70 matches the DEFAULT-threshold bracket calc
  # exactly, not tab04's). Replicated as found, not "fixed".
  2005: [3500, 7000, 10500, 17500, 29200]
  2006: [3600, 7200, 10800, 18000, 30100]
  2007: [3700, 7400, 11100, 18600, 31000]
  2008: [3800, 7600, 11400, 18900, 31700]
  2009: [3900, 7800, 11700, 19600, 32600]
  2010: [3900, 7800, 11800, 19600, 32700]
  2011: [4000, 8000, 11900, 19900, 33200]
  2012: [4100, 8200, 12200, 20400, 34000]
  2013: [4100, 8200, 12200, 20400, 34000]  # law.eq.2012.or.law.eq.2013 reuse tab12
  2014: [4200, 8300, 12400, 20700, 34600]
  2015: [4300, 8400, 12700, 21100, 35300]
bracket_rate1_override_2014plus: 0.009
bracket_rates_2_3_4_override_2015: [0.024, 0.034, 0.044]

brackets_2016:  # `tab16`, a real 8-bracket "bubble" table (16.9% spike
  # then back down to 6.9%, a genuine recapture bracket, not a typo)
  - [0, 0.009]
  - [4300, 0.024]
  - [8500, 0.034]
  - [12700, 0.044]
  - [21200, 0.05]
  - [35100, 0.06]
  - [75000, 0.169]
  - [80000, 0.069]

# 2017-2021: a direct rate/subtraction lookup (`tab17t`..`tab21t`), not a
