standard_deduction_flat_1998plus:  # per exemption unit (`data(7)`)
  1998: 2000
  2015: 2200

# Itemized-deduction Pease-style phaseout (1991-2017, AR's OWN, mirrors
# AZ's identical mechanism and the same national aif92/aif13 CPI tables -
# AR's own 2009 quirk: only 1% of the excess (not 3%) counts that year.
itemized_phaseout_income_pre2013: 100000  # /sepret, CPI-adjusted via aif92 1992-2012
itemized_phaseout_income_2013_2017:
  single: 250000
  married_joint: 300000
  head_of_household: 275000
  married_separate: 150000

# Capital gains: AR's own partial LTCG exclusion since 1999 (`pcrcg`),
# separate from (and, for our non-netting-loss schema, simpler than)
# federal's own preferential-RATE (not exclusion) treatment. 1987-1998
# capital gains are fully included in AR AGI (no state exclusion,
# matching federal's own full post-TRA86 AGI inclusion); pre-1987 reuses
# the federal `pre1987.yaml` LTCG exclusion rate directly (AR conformed to
# federal's own exclusion in that era).
capital_gains_ltcg_exclusion_rate_1999plus:
  1999: 0.30  # AR excludes (1 - pcrcg) of LTCG from taxable capital gain -> pcrcg=0.7 included
  2015: 0.45
  2016: 0.50
capital_gains_cap_2014plus: 10000000

# 2003-2004 Act imposed a temporary 3% income tax surcharge.
surcharge_2003_2004: 0.03

# 1998-2002 Working Taxpayer Credit - a small refundable credit (0.125%
# of the LOWER earner's wages+UI+other-property income for a two-earner
# household, or of total such income for a single earner, min'd at $50,
# gated on that income base exceeding $400).
working_taxpayer_credit_rate: 0.00125
working_taxpayer_credit_cap: 50
working_taxpayer_credit_floor: 400

# Personal Tax Credit (`pcr`, flat $/exemption unit - `data(7)` count,
# `depx`, and +1 more for head_of_household) - $17.50/exemption pre-1987
# (a different, smaller flat rate), then the year-indexed `pcr` table.
personal_credit_rate_pre1987: 17.50
personal_credit_rate_by_year:  # `pcr(law)`, dimensioned 1987:2021
  1987: 20
  2005: 21
  2006: 22
  2007: 23
  2013: 26
  2020: 29

# Child/Dependent Care Credit: 20% of the federal credit (10% pre-1998).
child_care_credit_rate_1998plus: 0.20
child_care_credit_rate_pre1998: 0.10
