exemption_per_person: {1977: 650, 1979: 700, 1980: 750, 1982: 800, 1985: 850, 1987: 900, 1988: 1000}

# --- Income ---
# Share of positive net capital gains added back (the federal exclusion).
capital_gains_addback: {1977: 0.2, 1978: 0.1, 1983: 0.0}
# Federal charitable deduction for nonitemizers added back: 2020 per return
# (halved on separate returns), 2021 per taxpayer.
charity_nonitemizer_addback: {2020: 300, 2022: null}
# Pension exclusion per taxpayer 65 or older.
pension_exclusion_per_aged_taxpayer: 20000

# --- Itemized deductions ---
# 2018-2024 the federal SALT cap; from 2025 the state and local taxes the
# federal return actually deducted are backed out instead.
salt_cap: {2018: 10000, 2025: null}
# From 2018: limitation above these federal AGI thresholds (married separate
# gets half the married amount).
itemized_limit_threshold:
  single: {2018: 266700, 2019: 273150, 2020: 278300, 2021: 282400}
  head_of_household: {2018: 293350, 2019: 300450, 2020: 306150, 2021: 310600}
  married: {2018: 320000, 2019: 327750, 2020: 334000, 2021: 338850}
itemized_limit_rate: {2018: 0.03}
itemized_limit_max_share: {2018: 0.8}
# 1988-1990 reduction: a share of itemized deductions times a factor that rises
# from 0 to 1 over `itemized_reduction_range` of AGI above the status
# threshold, then to 2 from the upper start to the upper end.
itemized_reduction_threshold: {single: 100000, married_joint: 200000, married_separate: 100000, head_of_household: 150000}
itemized_reduction_share: {1988: 0.1, 1989: 0.25, 1991: null}
itemized_reduction_range: 50000
itemized_reduction_upper_start: 475000
itemized_reduction_upper_end: 525000
itemized_reduction_top_factor: 2.0
itemized_reduction_start: 100000
# Itemized deduction adjustment (every year): 25% of itemized deductions
# phased in over `itemized_reduction_range` of AGI above the status threshold,
# rising to 50% above the upper end.
itemized_adjustment_threshold: {single: 100000, married_separate: 100000, head_of_household: 150000, married_joint: 200000}
itemized_adjustment_rate: 0.25
itemized_adjustment_top_rate: 0.5

