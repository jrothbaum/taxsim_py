# --- Empire State child credit (refundable, 2006 on) ---
empire_child_credit:
  income_limit:  # married amounts halved for married separate
    married: 110000
    single: 75000
  minimum_per_child: 100
  federal_share: 0.33
  # 2018 on: rebuilt from the pre-2018 federal child credit.
  per_child: 1000
  phaseout_rate: 0.05
  earned_income_floor: 3000
  refundable_rate: 0.15
  payroll_rate: 0.0765
  many_children: 3
payroll_wage_base: {2018: 128400, 2019: 135900, 2020: 142500, 2021: 148800, 2022: 155100, 2023: 161700}

# --- 2015-2016 family tax relief credit ---
family_tax_relief:
  amount: {1977: 0, 2015: 350, 2017: 0}
  income_min: 40000
  income_max: 300000

# --- Minimum income tax: rate on New York tax preference items above the
# specific deduction (halved for married separate), less the tax ---
minimum_tax_rate: {1977: 0.06}
minimum_tax_deduction: 5000

# --- 2021 on: real-law tax computation worksheets (IT-201-I 2021, pages
# 52-57), used instead of TAXSIM's 2012-style worksheets, which lack the
# 9.65%/10.3%/10.9% tiers and use a 0.0695 top rate. Each tier is
# [taxable income upper bound, flat rate, amount added, AGI phase-in start];
# the flat rate applies in full once AGI reaches the phase-in start plus
# `phase`. Above `top_agi`, the top worksheet uses `top_rate` with the
# amount added chosen by taxable income from `top_additions`. Phase-in
# ratios are rounded to four decimal places.
recapture_real_2021:
  base_agi: 107650
  phase: 50000
  ratio_decimals: 4
  top_agi: 25000000
  top_rate: 0.109
  married:
    tiers:
      - [161550, 0.0597, 0, 107650]
      - [323200, 0.0633, 474, 161550]
      - [2155350, 0.0685, 1056, 323200]
      - [5000000, 0.0965, 2736, 2155350]
      - [1.0e+20, 0.103, 63086, 5000000]
    top_additions: [[161550, 474], [323200, 1056], [2155350, 2736], [5000000, 63086], [1.0e+20, 95586]]
  single:  # also married filing separately
    tiers:
      - [215400, 0.0633, 0, 107650]
      - [1077550, 0.0685, 526, 215400]
      - [5000000, 0.0965, 1646, 1077550]
      - [1.0e+20, 0.103, 31817, 5000000]
    top_additions: [[215400, 526], [1077550, 1646], [5000000, 31817], [1.0e+20, 64317]]
  head_of_household:
    tiers:
      - [269300, 0.0633, 0, 107650]
      - [1616450, 0.0685, 742, 269300]
      - [5000000, 0.0965, 2143, 1616450]
      - [1.0e+20, 0.103, 47403, 5000000]
    top_additions: [[269300, 742], [1616450, 2143], [5000000, 47403], [1.0e+20, 79903]]
