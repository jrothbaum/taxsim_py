# Sources: 1977-2021 NBER TAXSIM (`nytax`); 2022 on, N.Y. Tax Law Article 22,
# IT-201 instructions and PolicyEngine-US `gov.states.ny.tax.income`. The
# energy credit, college tuition credit and minimum tax preferences have no
# TAXSIM input.

# Statutory mode uses actual law through this year.
