# Dependent filers: at most earned income plus an addition, with a floor.
dependent_standard_deduction: {floor: 1050, earned_addition: 350}

# --- Itemized deductions (from 1986 a credit) ---
itemized_credit_rate: 0.05

# --- Tax adjustments ---
tax_reduction_1979: {rate: 0.16, cap: 900}
surtax_1983: 1.1

# --- Credits ---
# Personal exemption credits through 1985, per taxpayer, taxpayer 65 or
# older and dependent, plus one for heads of household.
exemption_credit_1985: {taxpayer: 20, aged: 5, dependent: 20, head_of_household: 20}
exemption_credit_1996: {aged: 25, dependent: 50}
# 1997-1999: the aged credit phases out over `width` of household income
# above a limit (joint returns: per aged taxpayer, phased out once).
exemption_credit_1999:
  dependent: 50
  aged: 25
  phaseout_rate: 0.025
  width: 1000
  income_limit: {single: 30000, head_of_household: 30000, married_joint: 40000, married_separate: 20000}
# School property tax credit. 1978: renters get the minimum; owners a share
# of property tax between the minimum and maximum. From 1979 the renter
# credit multiplies the renter indicator, not rent (as TAXSIM does).
school_property_credit_1978: {renter: 40, rate: 0.1, minimum: 40, maximum: 100}
school_property_credit_renter_divisor: 100
school_property_credit_owner_divisor: 10
child_care_credit_share_1984: 0.3
# Working families credit (1998 on): the whole tax up to an income limit per
# taxpayer, then (intercept - slope * AGI) times tax after other credits.
working_families_credit:
  full_income_per_taxpayer: 9000
  income_limit: {other: 10000, married_joint: 19000}
  intercept: {other: 10, married_joint: 19}
  slope: 0.001
# State EITC as a share of the federal credit by number of dependents
# (1984-1985 one share for all).
eitc_share_1984: 0.3
eitc_share:
  1: {1989: 0.05, 1995: 0.04}
  2: {1989: 0.25, 1995: 0.16, 1996: 0.14, 2011: 0.11}
  3: {1989: 0.75, 1995: 0.50, 1996: 0.43, 2011: 0.34}
# 1994: an own schedule on earned income, phased out above a start.
eitc_1994:
  phaseout_start: 12570
  1: {rate: 0.012, maximum: 92, phaseout_rate: 0.008}
  2: {rate: 0.063, maximum: 499, phaseout_rate: 0.045}
  3: {rate: 0.188, maximum: 1496, phaseout_rate: 0.134}

# --- Minimum tax ---
# 1981-1985, when itemized deductions exceed the threshold: a rate on
# preferences (excluded capital gains and deductions above a share of AGI)
# above an exemption.
minimum_tax_1985: {itemized_threshold: 10000, agi_share: 0.6, exemption: 10000, rate: 0.05}
minimum_tax_1986_federal_share: 0.55
# 1987-2018: a flat rate on federal AMT income adjusted to Wisconsin, less an
# exemption phased out at `amt_phaseout_rate` (separate returns get the
# married exemption with a halved phase-out threshold).
amt_rate: 0.065
amt_phaseout_rate: 0.25

# --- Married couple credit (1986 on): rate on the lower earner's earnings, capped ---
married_couple_credit:
  1986: {rate: 0.025, cap: 18000}
  1989: {rate: 0.02, cap: 15000}
  1998: {rate: 0.0217, cap: 14010}
  1999: {rate: 0.025, cap: 14000}
  2000: {rate: 0.0275, cap: 16000}
  2001: {rate: 0.03, cap: 16000}

# --- Homestead credit (refundable) ---
# Household income up to `income_limit` (from 1989 net of `dependent_deduction`
# per dependent); property tax plus `rent_share` of rent, capped, less
# `income_rate` of income above `income_floor`; the excess is multiplied by
# `small_rate` up to `small_limit` and by `rate` above it.
homestead_credit:
  1977: {income_limit: 9300, tax_cap: 800, rent_share: 0.25, income_floor: 4000, income_rate: 0.15, small_limit: 15, small_rate: 0.667, rate: 0.8, dependent_deduction: 0}
  1979: {income_limit: 14000, tax_cap: 1000, rent_share: 0.25, income_floor: 5000, income_rate: 0.111, small_limit: 15, small_rate: 0.667, rate: 0.8, dependent_deduction: 0}
  # TAXSIM's 1983 test repeats the small-excess condition, so excesses above
  # the limit get no credit.
  1983: {income_limit: 15500, tax_cap: 1100, rent_share: 0.2, income_floor: 7000, income_rate: 0.1294, small_limit: 10, small_rate: 1.1, rate: 0.0, dependent_deduction: 0}
  1984: {income_limit: 16500, tax_cap: 1200, rent_share: 0.25, income_floor: 7400, income_rate: 0.13167, small_limit: 10, small_rate: 1.1, rate: 0.8, dependent_deduction: 0}
  1989: {income_limit: 18000, tax_cap: 1350, rent_share: 0.25, income_floor: 8000, income_rate: 0.135, small_limit: 10, small_rate: 1.1, rate: 0.8, dependent_deduction: 250}
