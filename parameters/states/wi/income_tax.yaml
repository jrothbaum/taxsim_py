# --- Income ---
# Through 1981 a net capital loss is reduced: for losses above -`range` per
# taxpayer, AGI changes by min(loss floored at -`limit` per taxpayer, minus
# `share` of the loss, 0). TAXSIM uses only the long-term loss when the
# short-term result is a loss.
capital_loss_1981: {range_per_taxpayer: 2000, limit_per_taxpayer: 1000, share: 0.5}
# Share of the federal capital gain exclusion added back to AGI.
capital_gain_exclusion_addback: {1977: 1.0, 1982: 0.6666666666666666, 1983: 0.3333333333333333, 1984: 0.0}
# From 1987 net capital losses above this amount are added back.
capital_loss_limit_1987: 500
# Unemployment compensation is taxable up to half of federal AGI above a base.
unemployment_base: {single: 12000, married_joint: 18000, married_separate: 0, head_of_household: 12000}
unemployment_share: 0.5
# 2021: unemployment above half of federal AGI over this base is subtracted.
unemployment_base_2021: {married_joint: 18000, other: 12000}

# --- Standard deduction ---
# 1978 and before: a share of AGI, capped, plus the dependent add-on.
standard_deduction_1978: {rate: 0.15, cap: 2000}
# 1986 on: rows of [AGI upper bound, amount, reduction rate, reduction start];
# the first row whose bound is at least AGI applies, as
# max(0, amount - rate * (AGI - start)). From 2000 bounds, amounts and
