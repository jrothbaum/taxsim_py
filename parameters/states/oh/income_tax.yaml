exemption_low_income_agi: 40000.0
exemption_middle_income_agi: 80000.0

# 2005-2016: no tax when taxable income is at or below this.
low_income_exemption_2005_2016: 10000.0

# Child care credit: share of the federal credit before its tax limit, by Ohio AGI.
child_care_1989_1992: {agi_limit: 30000.0, rate: 0.25, cap: 360.0}
child_care_1993_1996: {agi_limit: 40000.0, low_agi: 20000.0, low_rate: 0.35, rate: 0.25}
child_care_1997: {agi_limit: 40000.0, low_agi: 20000.0, low_rate: 1.0, rate: 0.25}

# Exemption credit per exemption (1983-2012; 2013 on only below the income limit).
exemption_credit: 20.0
exemption_credit_income_limit_2013: 30000.0
# 1983-1988 alternative: a deduction per exemption instead of the credit.
exemption_deduction_1983_1988: 350.0

# Earned income credit share of the federal credit (2013 on), limited to half
# the tax when taxable income exceeds the limit (through 2018).
eitc_rate: {2013: 0.05, 2014: 0.10, 2019: 0.30, 2022: 0.30, 2023: 0.30, 2024: 0.30, 2025: 0.30}
eitc_tax_share_limit: 0.5
eitc_income_limit: 20000.0

