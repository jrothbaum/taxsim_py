# Ohio individual income tax (TAXSIM `ohtax`/`ohjoin`; 2021 values from the
# newer `ohtax21` routine in the archived 2026 NBER source).
# Brackets are [start, rate] rows converted from TAXSIM's `look2` upper-bound
# tables (the last rate continues beyond the table).

# Business income deduction (2015 on): share of positive self-employment
# income, capped (halved for married filing separately); the rest is taxed on
# its own schedule and left out of taxable income.
business_deduction_share: {2015: 0.75, 2016: 1.0}
business_deduction_cap: {2015: 187500.0, 2016: 250000.0}
business_brackets: [[0, 0.00495], [5200, 0.0099], [10400, 0.0198], [15650, 0.02476], [20900, 0.02969], [41700, 0.03]]

# Exemption per taxpayer and dependent (dependents get their own amount 1996-1998).
