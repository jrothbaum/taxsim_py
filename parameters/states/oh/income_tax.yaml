# exemptions.personal.amount and credits.joint_filing.rate).
income_limit_2025plus: {2025: 750000.0}
exemption_low_income: {2014: 2200.0, 2016: 2250.0, 2017: 2300.0, 2018: 2350.0, 2020: 2400.0, 2021: 2400.0, 2022: 2400.0, 2023: 2400.0, 2024: 2400.0, 2025: 2400.0}
