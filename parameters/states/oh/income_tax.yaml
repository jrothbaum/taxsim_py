# Joint filing credit (`ohjoin`): share of tax by taxable income, when each
# spouse has at least $500 of income and earned income is at least $1,000.
joint_credit_min_spouse_income: 500.0
joint_credit_min_earned: 1000.0
# Through 1983: `tablki` interpolated rows; 1984 on: `tablk` steps [below, share].
