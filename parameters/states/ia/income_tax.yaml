# Iowa individual income tax (`iatax`, taxsim_2024_09_21.f:6085-6503,
# state id 16). See calculators/states/ia.py for the full mechanism.
#
# Not TAXSIM inputs, so always zero: blindness, `data(34)` in the
# personal-exemption-credit section, and casualty, medical, misc-itemized,
# investment-interest, political and charitable amounts (`data(47)`-`(49)`,
# `(53)`, `(57)`-`(61)`, `(63)`, `(65)`, `(66)`, `(81)`, `(168)`), which
# leaves the 2018-2019 itemized worksheet as property tax, other itemized
# deductions and mortgage interest. `comnew(20)` and `comnew(97)` are $0 in
# the oracle.
#
# `comnew(34)` in the AMT section (`addprf`) is a genuine, ACKNOWLEDGED
# GAP, not confirmed inert - a live probe showed it real and nonzero
# ($6,632 in one high-income/large-LTCG probe) but its exact source-level
# meaning wasn't identified within this build's scope; treated as $0
# here (a real simplification, not a silent one) since Iowa's own AMT is
# already a narrow, high-preference-income-only provision the source's
# own comments flag as partly a "guess" (`rat(law)` for 1986-1995).
# `comnew(181)` (QBI deduction, `dedbus`) inherits the same acknowledged
# federal-level scope gap already documented for Idaho - federal.py has
# never implemented QBI at all, so `dedbus` is always $0 here too.

