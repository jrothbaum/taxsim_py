# Alternate tax income floor for returns with an aged taxpayer.
alternate_tax_aged_floor: {2007: 24000, 2009: 32000}
# Minimum tax exempt below these incomes for returns with an aged taxpayer.
amt_aged_exempt_income: {single: 24000, other: 32000}
# 2019+: share of the federal QBI deduction allowed.
qbi_deduction_share: {2019: 0.25, 2021: 0.5}

# 2013+ itemized limitation threshold multiple of the base (times the
