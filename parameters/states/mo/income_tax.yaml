# Working Family Tax Credit (2023+; PolicyEngine-US gov.states.mo.tax.income.credits.wftc): a share of the
# federal EITC, nonrefundable, unavailable above the investment income limit.
working_family_credit_2023plus:
  match: {2023: 0.1, 2024: 0.2}
  investment_income_limit: {2023: 4050, 2024: 4300}
