# Arizona individual income tax (`aztax`, taxsim_2022_10_21.f:809-1168,
# state id 3). Fifth state (alphabetical order). Comparable in scope to
# Alabama: 10 real bracket vintages, its OWN Pease-style itemized-
# deduction phaseout (independent of federal's), a federal-tax-as-AGI-
# subtraction mechanism for years <=1989 (not an itemized addition like
# Alabama's `fedtax` - AZ subtracts it straight from AGI), a 2019+
# Dependent Tax Credit, an Excise Tax Credit (2001+, refundable), and a
# Family Income Credit (1995+, non-refundable).
#
# married_separate uses SINGLE's bracket table + SINGLE's exemption/
# deduction formulas throughout (the source's own dispatch only ever
# branches on `mst.eq.2` (joint) or `mst.eq.4/7` (HoH) as the "richer"
# cases - married_separate (mst=6) always falls into the same branch as
# single). head_of_household gets its OWN, separate bracket table for
# every vintage from 1990 on (before that, no separate HoH table exists -
# HoH uses the SAME table as single/joint, just its own `txp` exemption
# count).
#
# Confirmed inert given this project's schema (not silent gaps): the
# refundable property-tax credit and the renters' credit (both gated on
# `data(9)>0`, the elderly count, or `data(160)`, rentpaid - neither ever
# populated by this project's input reader given the schema doesn't
# include ages or rent paid); medical/health itemized components (data
# 47-49, unpopulated); the solar energy credit (data 38, unpopulated);
# `data(22)` (a generic override field several states share, never
# assigned - same finding as Alabama/Illinois).
#
# 2019+ is a genuinely simpler regime than everything before it: AZ
# repealed BOTH the personal exemption AND the per-dependent exemption
# starting 2019 (`xmps`/`xmph`'s own table zeroes out for 2019-2021, and
# the 2020+ exemption formula's only surviving term - the per-child
# amount - is itself forced to $0 by `nchild=0` for law>=2019) - so
# `exemp` is genuinely $0 for every year 2019 on, confirmed directly from
# the source's own arrays, not assumed.
