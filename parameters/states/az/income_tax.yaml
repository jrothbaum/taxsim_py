# Standard deduction: 3 eras. <=1989: 10% of AGI (CPI-adjusted), capped at
# $500/exemption-unit (CPI-adjusted). 1990-2018: a flat, year-specific
# dollar amount PER exemption unit (`txp`). 2019+: a flat, year-specific
# amount with a STATUS-based multiplier (1/1.5/2 for single-or-separate/
# HoH/joint) - no longer scaled by exemption count at all.
standard_deduction_pct_pre1990:
  1977: 0.10
standard_deduction_cap_per_exemption_pre1990:
  1977: 500
standard_deduction_per_exemption:  # 1990-2018
  1990: 3500
  1995: 3600
  2001: 4050
  2005: 4125
  2006: 4247
  2007: 4373
  2008: 4521
  2009: 4677
  2011: 4703
  2012: 4833
  2013: 4945
  2014: 5009
  2015: 5091
  2016: 5099
  2017: 5183
  2018: 5312
standard_deduction_flat:  # 2019+, multiplied by the status coefficient
  2019: 12200
  2020: 12400
  2021: 12550
  2022: 12950

# Personal/dependent exemption: 5 genuinely different formula eras - see
# calculators/states/az.py. All $0 for 2019+ (confirmed above).
personal_exemption_amount_pre1990:  # per exemption unit, CPI-adjusted
  1977: 1000
dependent_exemption_amount_pre1990:
  1977: 600
hoh_exemption_backout_pre1979:  # a real, one-time-era back-out for HoH only
  1977: 600
personal_exemption_amount_1990_1991:
  1990: 2000
personal_exemption_amount_1992:
  1992: 2100
dependent_exemption_amount_1992:
  1992: 0  # nchild folded into the same 2100 rate as personal that year
personal_exemption_amount_1993_1996:
  1993: 2100
dependent_exemption_amount_1993_1996:
  1993: 2300
personal_exemption_amount_1997_2018_single:
  1997: 2100
  2017: 2150
  2018: 2200
personal_exemption_amount_1997_2018_joint_with_kids:
  1997: 3150
  2017: 3225
  2018: 3300
dependent_exemption_amount_1997_2018:
  1997: 2300

# Family Income Credit (1995+, non-refundable) - AGI-threshold gated, flat
# per-exemption amount capped. Real, distinct AGI thresholds/caps for
# single-or-separate vs joint-or-HoH, with married_joint (1998+) and HoH
# (1998+) further refined by dependent count into their own small tables.
family_credit_per_exemption:  # `data ex/3*30.0d0,24*40.0d0/` (1995:2021)
  1995: 30
  1998: 40
family_credit_agi_threshold_single_or_separate:
  1995: 10000
family_credit_agi_threshold_joint_or_hoh:
  1995: 20000
family_credit_cap_single_or_separate:
  1995: 60
  1998: 120
family_credit_cap_joint_or_hoh:
  1995: 120
  1998: 240
family_credit_agi_threshold_joint_by_dep_count_1998plus:  # depx: 0-1,2,3,4+
  1998: [20000, 23600, 27300, 31000]
family_credit_agi_threshold_hoh_by_dep_count_1998plus:  # depx: 0,1,2,3,4+
  1998: [20000, 20135, 23800, 25200, 26575]

# 2019+ Dependent Tax Credit (non-refundable) - $100/CTC-eligible child
# (`data(208)`), $25/other dependent, phased out above $200,000 AGI per
# exemption unit at $50/$1,000 of excess.
dependent_tax_credit_per_ctc_child:
  2019: 100
dependent_tax_credit_per_other_dependent:
  2019: 25
dependent_tax_credit_phaseout_agi_per_exemption:
  2019: 200000
dependent_tax_credit_phaseout_rate_per_1000:
  2019: 50

# Credit For Increased Excise Taxes (2001+, refundable) - a small, flat
# per-exemption/dependent amount, gated on AGI relative to a per-exemption-
# count threshold.
excise_credit_agi_threshold_per_exemption:
  2001: 12500
excise_credit_per_exemption_or_dependent:
  2001: 25
excise_credit_cap:
  2001: 100

# Itemized-deduction Pease-style phaseout (1991-2017, AZ's OWN, separate
# from federal's) - a real 4-step gradual-repeal schedule paralleling
# federal's own 2006-2012 Pease phase-down, but on AZ's OWN reduction
# formula (3% of AGI over the threshold, capped at 80% of the itemized
# total): full strength 1991-2005 and 2013-2017, 2/3 strength 2006-2007,
# 1/3 strength 2008-2009, fully repealed 2010-2012.
itemized_phaseout_income_pre2013:
  1991: 100000  # /sepret, CPI-adjusted via aif92 1992-2012
itemized_phaseout_income_2013_2017:  # by status, CPI-adjusted via aif13
  single: 250000
  married_joint: 300000
  head_of_household: 275000
  married_separate: 150000
