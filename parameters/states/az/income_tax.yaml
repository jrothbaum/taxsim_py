# Arizona individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`aztax`); 2022 on, Arizona Revised
# Statutes Title 43 and PolicyEngine-US `gov.states.az.tax.income`. The
# solar energy credit and other items with no TAXSIM input are not modeled.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Rate schedules, [start of bracket, rate], applied to taxable income
# divided by `bracket_inflation` (the tax is then multiplied back).
# Through 1989 one schedule for everyone. 1990-2018 separate schedules for
# single and separate returns and for joint and head-of-household returns.
# From 2019 one schedule; joint and head-of-household returns are taxed on
# half their income and the tax doubled. One 2.5% rate from 2023.
brackets:
  1977: [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.05], [4000, 0.06], [5000, 0.07], [6000, 0.08]]
  1990:
    single: [[0, 0.038], [10000, 0.044], [25000, 0.0525], [50000, 0.065], [150000, 0.07]]
    joint_or_hoh: [[0, 0.038], [20000, 0.044], [50000, 0.0525], [100000, 0.065], [300000, 0.07]]
  1994:
    single: [[0, 0.0325], [10000, 0.04], [25000, 0.0505], [50000, 0.064], [150000, 0.069]]
    joint_or_hoh: [[0, 0.0325], [20000, 0.04], [50000, 0.0505], [100000, 0.064], [300000, 0.069]]
  1995:
    single: [[0, 0.03], [10000, 0.035], [25000, 0.042], [50000, 0.052], [150000, 0.056]]
    joint_or_hoh: [[0, 0.03], [20000, 0.035], [50000, 0.042], [100000, 0.052], [300000, 0.056]]
  1997:
    single: [[0, 0.029], [10000, 0.033], [25000, 0.039], [50000, 0.048], [150000, 0.0517]]
    joint_or_hoh: [[0, 0.029], [20000, 0.033], [50000, 0.039], [100000, 0.048], [300000, 0.0517]]
  1998:
    single: [[0, 0.0288], [10000, 0.0324], [25000, 0.0382], [50000, 0.0474], [150000, 0.051]]
    joint_or_hoh: [[0, 0.0288], [20000, 0.0324], [50000, 0.0382], [100000, 0.0474], [300000, 0.051]]
  1999:
    single: [[0, 0.0287], [10000, 0.032], [25000, 0.0374], [50000, 0.0472], [150000, 0.0504]]
    joint_or_hoh: [[0, 0.0287], [20000, 0.032], [50000, 0.0374], [100000, 0.0472], [300000, 0.0504]]
  2006:
    single: [[0, 0.0273], [10000, 0.0304], [25000, 0.0355], [50000, 0.0448], [150000, 0.0479]]
    joint_or_hoh: [[0, 0.0273], [20000, 0.0304], [50000, 0.0355], [100000, 0.0448], [300000, 0.0479]]
  2007:
    single: [[0, 0.0259], [10000, 0.0288], [25000, 0.0336], [50000, 0.0424], [150000, 0.0454]]
    joint_or_hoh: [[0, 0.0259], [20000, 0.0288], [50000, 0.0336], [100000, 0.0424], [300000, 0.0454]]
  2019: [[0, 0.0259], [26500, 0.0334], [53000, 0.0417], [159000, 0.045]]
  # Source: PolicyEngine-US gov.states.az.tax.income.main.
  2022: [[0, 0.0255], [28653, 0.0298], [1000000000000, 0.0417], [1000000000000, 0.045]]
  2023: [[0, 0.025], [1000000000000, 0.025]]
bracket_inflation: {1977: 1.0, 1983: 1.1017, 1984: 1.061, 1985: 1.123, 1986: 1.155, 1987: 1.183, 1988: 1.229, 1989: 1.29, 1990: 1.0, 2015: 1.0163, 2016: 1.01785, 2017: 1.0346, 2018: 1.0602, 2019: 1.0, 2020: 1.029132, 2021: 1.04935849}

# Through 1989 exemptions, the standard deduction and the property tax
# credit amounts are in 1977 dollars, multiplied by this index.
indexing_factor: {1977: 1.0, 1978: 1.1010, 1979: 1.2260, 1980: 1.4220, 1981: 1.5890, 1982: 1.7290, 1983: 1.7590, 1984: 1.8340, 1985: 1.9410, 1986: 1.9960, 1987: 2.0450, 1988: 2.1250, 1989: 2.2290, 1990: null}

# --- Exemptions ---
# Personal exemption per taxpayer (heads of household count as two).
# Repealed from 2019, with the dependent exemption.
personal_exemption: {1977: 1000, 1990: 2000, 1992: 2100, 2017: 2150, 2018: 2200, 2019: null}
# 1997-2018: personal exemption per taxpayer on joint and separate returns
# with dependents.
personal_exemption_married_with_dependents: {1997: 3150, 2017: 3225, 2018: 3300, 2019: null}
dependent_exemption: {1977: 600, 1990: 2000, 1992: 2100, 1993: 2300, 2019: null}
# Before 1979 a head of household gives back one dependent exemption.
head_of_household_exemption_backout: {1977: 600, 1979: null}
# Exemption per taxpayer 65 or older from 1990 (before 1990 it equals the
# personal exemption).
aged_exemption: {1990: 1500, 1992: 1750, 1993: 2100}

# --- Standard deduction ---
# Through 1989: a percentage of AGI, capped per exemption, both indexed.
standard_deduction_percent:
  1977: {rate: 0.10, cap_per_exemption: 500}
  1990: null
# 1990-2018: per exemption.
standard_deduction_per_exemption: {1990: 3500, 1995: 3600, 2001: 4050, 2005: 4125, 2006: 4247, 2007: 4373, 2008: 4521, 2009: 4677, 2011: 4703, 2012: 4833, 2013: 4945, 2014: 5009, 2015: 5091, 2016: 5099, 2017: 5183, 2018: 5312, 2019: null}
# From 2019: a flat amount times the filing-status multiple.
standard_deduction: {2019: 12200, 2020: 12400, 2021: 12550, 2022: 12950, 2023: 13850, 2024: 14600, 2025: 15750}
standard_deduction_multiple: {married_joint: 2, head_of_household: 1.5, other: 1}

# --- Itemized deductions ---
# Through 1990, a child care deduction up to `cap` when household income is
# below `income_limit` (halved on separate returns).
child_care_deduction:
  1977: {income_limit: 6000, cap: 1200}
  1991: null
# Itemized deduction limitation, 1991-2017: `rate` of AGI above the
# threshold, at most `cap_rate` of itemized deductions, times
# `reduction_share` (phased out 2006-2009, suspended 2010-2012). The
# threshold is indexed (state_adjustments.yaml itemized_phaseout_inflation);
# before 2013 a single amount halved on separate returns.
itemized_limitation:
  1991: {rate: 0.03, cap_rate: 0.8, reduction_share: 1.0, threshold: 100000}
  2006: {rate: 0.03, cap_rate: 0.8, reduction_share: 0.6666666666666666, threshold: 100000}
  2008: {rate: 0.03, cap_rate: 0.8, reduction_share: 0.3333333333333333, threshold: 100000}
  2010: {rate: 0.03, cap_rate: 0.8, reduction_share: 0.0, threshold: 100000}
  2013:
    rate: 0.03
    cap_rate: 0.8
    reduction_share: 1.0
    threshold: {single: 250000, married_joint: 300000, head_of_household: 275000, married_separate: 150000}
  2018: null

# --- Credits ---
# Family income credit (nonrefundable): `per_exemption` for each taxpayer
# and dependent, up to `cap`, when AGI is at most `agi_limit`. From 1998 the
# joint and head-of-household limits rise with dependents (0-1, 2, 3, 4,
# 5 or more).
family_income_credit:
  1995:
    per_exemption: 30
    cap: {single: 60, joint_or_hoh: 120}
    agi_limit: {single: 10000, joint_or_hoh: 20000}
  1998:
    per_exemption: 40
    cap: {single: 120, joint_or_hoh: 240}
    agi_limit:
      single: 10000
      married_joint: [20000, 23600, 27300, 31000]
      head_of_household: [20000, 20135, 23800, 25200, 26575]
# Dependent tax credit from 2019 (nonrefundable): per child under 17 and
# per other dependent, reduced by `reduction_per_1000` for each $1,000 of AGI
# above `phaseout_start` per taxpayer.
dependent_tax_credit:
  2019: {per_child: 100, per_other_dependent: 25, phaseout_start: 200000, reduction_per_1000: 50}
# Credit for increased excise taxes from 2001 (refundable): `amount` per
# taxpayer and dependent, up to `cap`, when federal AGI is at most
# `agi_limit` per taxpayer (heads of household count as two).
excise_credit:
  2001: {agi_limit: 12500, amount: 25, cap: 100}

# Refundable property tax credit for taxpayers 65 or older with pension or
# Social Security income, by household income, [threshold, amount]
# interpolated; thresholds rise by `property_tax_credit_family_addition`
# for all but single filers without dependents. Through 1989 the amounts are
# indexed. The 1977 table's fourth amount (250) is as TAXSIM has it.
property_tax_credit_thresholds: [1750, 1850, 1950, 2050, 2150, 2250, 2350, 2450, 2550, 2650, 2750, 2850, 2950, 3050, 3150, 3250, 3350, 3450, 3550, 3650, 3750]
property_tax_credit_amounts:
  1977: [225, 215, 206, 250, 185, 175, 165, 155, 145, 135, 125, 115, 105, 95, 86, 75, 65, 55, 45, 35, 25]
  1990: [502, 479, 457, 435, 412, 390, 368, 345, 323, 301, 279, 256, 234, 212, 189, 167, 145, 123, 100, 78, 56]
property_tax_credit_family_addition: 750
# Statutory mode limits the credit to property tax paid, counting this share
# of rent (Form 140PTC).
property_tax_credit_rent_factor: 0.15

# Renter credit through 1991: `renter_credit_rate` of rent up to the cap;
# 1990-1991 only at AGI up to `agi_limit` and at most `max`.
renter_credit_rate: {1977: 0.10, 1984: 0.05, 1992: null}
renter_credit_cap: {1977: 50, 1978: 83, 1979: 92, 1980: 107, 1981: 120, 1982: 130, 1983: 132, 1984: 100, 1988: 85, 1989: 70}
renter_credit_limit:
  1990: {agi_limit: 25000, max: 55}
