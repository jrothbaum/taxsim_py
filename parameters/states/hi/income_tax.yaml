  1977: 750
  1980: 1000
  1985: 1040
  2013: 1144
# 2009-2015 personal exemption phaseout - a real, HI-specific mechanism
# (not federal's own PEP), with three genuinely different threshold
# multipliers by status.
personal_exemption_phaseout_base:
  2009: 119963
personal_exemption_phaseout_step:
  2009: 2500

# Itemized-deduction AGI thresholds (2011+ SALT allowance, 1991-2010/2011+
# Pease-style reductions, 2011-2015 absolute dollar caps).
