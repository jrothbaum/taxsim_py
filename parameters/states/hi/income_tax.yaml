    single: [[0, 0.0225], [500, 0.0325], [1000, 0.045], [1500, 0.05], [2000, 0.065], [3000, 0.075], [5000, 0.085], [10000, 0.095], [14000, 0.1], [20000, 0.105], [30000, 0.11], [100000, 0.11]]
    head_of_household: [[0, 0.0225], [500, 0.0275], [1000, 0.039], [1500, 0.041], [2000, 0.055], [3000, 0.066], [5000, 0.079], [10000, 0.0915], [20000, 0.1005], [30000, 0.105], [40000, 0.1075], [60000, 0.11]]
  1987:
