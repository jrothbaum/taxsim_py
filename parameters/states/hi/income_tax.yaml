# Hawaii individual income tax (`hitax`, taxsim_2024_09_21.f:4960-5503,
# state id 12). See calculators/states/hi.py for the full mechanism - the
# richest, most elaborate state built so far (a real capital-gains
# alternative tax, FIVE separate/stacking itemized-deduction reductions,
# and half a dozen credits each with their own era-specific formula or
# interpolation table).
#
# Not TAXSIM inputs, so always zero: blindness (the disability exemption),
# medical expenses (`comnew(20)`, `data(47)`-`data(49)`, the 2017+ itemized
# adjustment), the pre-1980 `data(35)` general-credit addback, the
# 1981-1986 solar/energy addback (`data(38)`), `data(52)` (a second SALT
# component in the 2011+ phaseout) and `data(34)`.
#
# Bracket tables are transcribed directly from the source's own (upper_
# bound, rate%) DATA statements, converted to this project's (start,
# rate) convention the same way every other state's tables are. Married_
# joint runs HALF its taxable income through the single table then
# doubles the result (`if(mst.eq.2) taxy=taxinc/2 ... statax=statax*2`);
# married_separate uses the single table directly on its own full taxable
# income (no halving, no doubling); head_of_household gets its own,
# separate table entirely.
