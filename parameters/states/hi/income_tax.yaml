    head_of_household: [[0, 0.014], [14400, 0.032], [21600, 0.055], [28800, 0.064], [36000, 0.068], [54000, 0.072], [72000, 0.076], [187500, 0.079], [262500, 0.0825], [337500, 0.09], [412500, 0.1], [487500, 0.11]]
# Capital gains alternative tax: gains above the ordinary-income floor
# (per taxpayer, or for a head of household) are taxed at a flat rate.
capital_gains_floor_per_taxpayer: 24000
capital_gains_floor_hoh: 36000
capital_gains_rate: 0.0725

# --- Exemptions and deductions ---
# Per taxpayer, dependent and taxpayer 65 or older; none for dependent
# filers.
personal_exemption: {1977: 750, 1980: 1000, 1985: 1040, 2013: 1144}
# 2009-2015: exemptions fall by `share_per_step` for each `step` (halved on
# separate returns) of AGI above `base` (times the head-of-household or
# married multiplier; married halved on separate returns).
personal_exemption_phaseout:
  2009: {base: 119963, step: 2500, multiplier_hoh: 1.25, multiplier_married: 1.5, share_per_step: 0.02}
  2016: null
standard_deduction:
  single: {1977: 1000, 1982: 800, 1987: 1000, 1989: 1500, 2007: 2000, 2013: 2200, 2024: 4400}
  married_joint: {1977: 1000, 1987: 1700, 1989: 1900, 2007: 4000, 2013: 4400, 2024: 8800}
  married_separate: {1977: 500, 1987: 850, 1989: 950, 2007: 2000, 2013: 2200, 2024: 4400}
  head_of_household: {1977: 1000, 1982: 800, 1987: 1500, 1989: 1650, 2007: 2920, 2013: 3212, 2024: 6424}
# 1980: the standard deduction is at most this share of AGI.
standard_deduction_agi_share: {1980: 0.1, 1981: null}
# From 2011 the state tax deduction is removed above these federal AGI
# limits.
state_tax_deduction_agi_limit:
  2011: {head_of_household: 150000, single_or_separate: 100000, married_joint: 200000}
# Itemized deduction limitation from 1991: `itemized_phaseout_rate` of AGI
# above the threshold (halved on separate returns), at most
# `itemized_phaseout_cap_rate` of itemized deductions, times
# `reduction_share` (phased out 2006-2009, none in 2010).
itemized_limitation:
  1991: {threshold: 100000, reduction_share: 1.0}
  2006: {threshold: 100000, reduction_share: 0.6666666666666666}
  2008: {threshold: 100000, reduction_share: 0.3333333333333333}
  2010: {threshold: 100000, reduction_share: 0.0}
  2011: {threshold: 166800, reduction_share: 1.0}
itemized_phaseout_rate: 0.03
itemized_phaseout_cap_rate: 0.8
# 2011-2015: above a federal AGI threshold itemized deductions are capped
# (per taxpayer, or for a head of household).
itemized_cap:
  2011: {threshold_hoh: 150000, threshold_per_taxpayer: 100000, amount_hoh: 37500, amount_per_taxpayer: 25000}
  2016: null

# --- Credits ---
# Child and dependent care credit: expenses up to `child_care_credit_cap_per_dependent`
# for up to `child_care_credit_max_dependents` (joint returns: up to the
# lower wage), times a rate of `max_pct` less one point per `step` of AGI
# above `start`, at least `min_pct`.
child_care_credit_cap_per_dependent: {1977: 2400, 2016: 2500}
child_care_credit_max_dependents: 2
child_care_credit_rate:
  1977: {min_pct: 10, max_pct: 15, start: 21000, step: 2000}
  1990: {min_pct: 15, max_pct: 25, start: 22000, step: 2000}
  2016: {min_pct: 15, max_pct: 25, start: 25000, step: 5000}
# General income tax credit per taxpayer and dependent; in 2007 instead
# `max - slope * agi / limit` below the limit.
general_credit_per_exemption: {1977: 0, 1981: 100, 1982: 25, 1983: 1, 1989: 125, 1990: 60, 1991: 1, 1996: 0, 2001: 1, 2008: 1, 2010: 0}
general_credit_phaseout:
  2007:
    head_of_household: {max: 140, slope: 70, limit: 60000}
    married_joint: {max: 160, slope: 90, limit: 60000}
    other: {max: 65, slope: 25, limit: 30000}
  2008: null
# Renter's credit per exemption (taxpayers, dependents and taxpayers 65 or
# older) for rent of at least the minimum and AGI under the limit, times the
# number of aged taxpayers (at least one), as TAXSIM has it.
renter_credit_per_exemption: {1977: 20, 1981: 50}
renter_credit_min_rent: 1000
renter_credit_agi_limit: {1977: 20000, 1989: 30000}
# Excise tax credit through 1994, per taxpayer (times the aged count, at
# least one) by Hawaii AGI, [AGI, amount] interpolated.
excise_credit:
  1977: [[5000, 40], [6000, 32], [7000, 28], [8000, 26], [9000, 22], [10000, 20], [11000, 17], [12000, 14], [13000, 11], [14000, 8], [20000, 6], [100000000, 0]]
  1980: [[5000, 48], [6000, 39], [7000, 34], [8000, 32], [9000, 27], [10000, 24], [11000, 20], [12000, 17], [13000, 14], [14000, 10], [20000, 8], [100000000, 0]]
  1988: [[6000, 55], [8000, 45], [10000, 35], [12000, 25], [15000, 20], [20000, 15], [30000, 10], [100000000, 0]]
  1995: null
# Refundable food/excise tax credit from 2008, per taxpayer and dependent by
# federal AGI, [AGI, amount] interpolated. Source for 2023 on: the
# Department of Taxation's credit schedule.
food_excise_credit:
  2008:
    single: [[5000, 85], [10000, 75], [15000, 65], [20000, 55], [30000, 45], [40000, 35], [50000, 25], [100000000, 0]]
    other: [[5000, 85], [10000, 75], [15000, 65], [20000, 55], [30000, 45], [40000, 35], [50000, 25], [100000000, 0]]
  2016:
    single: [[4999, 110], [9999, 100], [14999, 85], [19999, 70], [29999, 55], [100000000, 0]]
    other: [[4999, 110], [9999, 100], [14999, 85], [19999, 70], [29999, 55], [39999, 45], [49999, 35], [100000000, 0]]
  2023:
    single: [[14999, 220], [19999, 200], [24999, 170], [29999, 140], [39999, 110], [100000000, 0]]
    other: [[14999, 220], [19999, 200], [24999, 170], [29999, 140], [39999, 110], [49999, 90], [59999, 70], [100000000, 0]]
# Food tax credit through 1998, per taxpayer and dependent.
food_credit: {1977: 0, 1987: 45, 1990: 55, 1995: 27, 1999: null}
# Refundable low-income credit 1999-2007, per taxpayer and dependent: the
# amount for the first AGI ceiling not exceeded (the last inclusive).
low_income_credit:
  1999: {amounts: [35, 25, 10], ceilings: [10000, 15000, 20000]}
  2008: null
# Earned income credit from 2018: a share of the federal credit,
# nonrefundable until 2023.
eitc_federal_share: {2018: 0.20, 2023: 0.40}
eitc_refundable: {2018: false, 2023: true}
