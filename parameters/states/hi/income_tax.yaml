# Hawaii individual income tax.
#
# Sources: 1977-2021 NBER TAXSIM (`hitax`); 2022 on, HRS Chapter 235, N-11
# instructions and PolicyEngine-US `gov.states.hi.tax.income`. Not modeled
# (no TAXSIM input): the disability exemption, medical expenses and the
# charitable additions.

# Statutory mode uses actual law through this year.
law_coded_through: 2025

# Rate schedules, [start of bracket, rate]. Joint returns are taxed on half
# their income on the `single` schedule and the tax doubled; heads of
# household have their own schedule. Source for 2025 on (Act 46 of 2024):
# PolicyEngine-US gov.states.hi.tax.income.rates.
