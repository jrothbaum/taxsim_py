  2011: 100000
itemized_cap_2011_2015_amount_hoh:
  2011: 37500
itemized_cap_2011_2015_amount_other_base:  # `*data(7)`
  2011: 25000

# Child/Dependent Care Credit - real cap by year, plus a real, sliding
# percentage-of-expense rate (by AGI) that ALSO changes shape by era.
