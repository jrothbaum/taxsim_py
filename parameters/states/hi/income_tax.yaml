# Standard deduction (`std(law,mst)`) - by status, sparse year keys.
standard_deduction_single:
  1977: 1000
  1982: 800
  1987: 1000
  1989: 1500
  2007: 2000
  2013: 2200
  2024: 4400
standard_deduction_married_joint:
  1977: 1000
  1987: 1700
  1989: 1900
  2007: 4000
  2013: 4400
  2024: 8800
standard_deduction_married_separate:
  1977: 500
  1987: 850
  1989: 950
  2007: 2000
  2013: 2200
  2024: 4400
standard_deduction_hoh:
  1977: 1000
  1982: 800
  1987: 1500
  1989: 1650
  2007: 2920
  2013: 3212
  2024: 6424
# 1983-1986 general-credit-era standard-deduction addback (`data(58)+
# data(59)`, both confirmed inert - no charity/misc input this schema
# populates - so this addback is always $0; documented, not implemented).

# Personal exemption (`xmp(law)`, per person: self+spouse+dependents).
personal_exemption_amount:
  1977: 750
  1980: 1000
  1985: 1040
  2013: 1144
# 2009-2015 personal exemption phaseout - a real, HI-specific mechanism
# (not federal's own PEP), with three genuinely different threshold
# multipliers by status.
personal_exemption_phaseout_base:
  2009: 119963
personal_exemption_phaseout_step:
  2009: 2500

# Itemized-deduction AGI thresholds (2011+ SALT allowance, 1991-2010/2011+
# Pease-style reductions, 2011-2015 absolute dollar caps).
salt_allowance_threshold_hoh:
  2011: 150000
salt_allowance_threshold_single_or_separate:
  2011: 100000
salt_allowance_threshold_joint:
  2011: 200000
itemized_phaseout_threshold_1991_2010:
  1991: 100000
itemized_phaseout_threshold_2011plus:  # `hiphas`
  2011: 166800
itemized_cap_2011_2015_threshold_hoh:
  2011: 150000
itemized_cap_2011_2015_threshold_other_base:  # `*data(7)`
  2011: 100000
itemized_cap_2011_2015_amount_hoh:
  2011: 37500
itemized_cap_2011_2015_amount_other_base:  # `*data(7)`
  2011: 25000

# Child/Dependent Care Credit - real cap by year, plus a real, sliding
# percentage-of-expense rate (by AGI) that ALSO changes shape by era.
child_care_credit_cap_per_dependent:
  1960: 2400
  2016: 2500
child_care_credit_max_dependents:
  1960: 2

# General Income Tax Credit - four genuinely different eras/formulas.
general_credit_amount_by_year_pre1996:  # `gencrd(law)`, per (data7+depx)
  1977: 0
  1981: 100
  1982: 25
  1983: 1
  1989: 125
  1990: 60
  1991: 1
general_credit_flat_2001_2009:  # $1/exemption, 2001-2006 & 2008-2009
  2001: 1

# Excise Tax Credit - repealed after 1994, real interpolation tables
# (`tablki`) for three sub-eras, each a real per-exemption dollar amount
# (multiplied by depx+texp). The trailing (huge, $0) row in each table is
# real (matches the source's own `1.e20,0.d0` sentinel row) - dropping it
# would wrongly hold the last real rate forever past the top threshold.
