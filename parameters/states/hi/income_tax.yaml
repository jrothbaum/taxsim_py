  1977: 0
  1981: 100
  1982: 25
  1983: 1
  1989: 125
  1990: 60
  1991: 1
general_credit_flat_2001_2009:  # $1/exemption, 2001-2006 & 2008-2009
  2001: 1

# Renter's Credit - confirmed permanently inert for this project's schema
# (gated on `data(160)`=rentpaid>=$1,000, the SAME field California's own
# Renter's Credit already confirmed is never populated - no `rentpaid`
# input this schema drives). Not implemented; `rtab`/the two AGI ceilings
# are left undocumented in code, this note is the record of the finding.

