# Hawaii individual income tax (`hitax`, taxsim_2024_09_21.f:4960-5503,
# state id 12). See calculators/states/hi.py for the full mechanism - the
# richest, most elaborate state built so far (a real capital-gains
# alternative tax, FIVE separate/stacking itemized-deduction reductions,
# and half a dozen credits each with their own era-specific formula or
# interpolation table).
#
# Confirmed inert given this project's input schema (not silent gaps):
# elderly/blind (`data(9)`/`data(10)`, same unpopulated-by-the-reader
# fields already confirmed for AL/AZ/CT/DC/DE/GA) - makes the disability
# exemption (`n10.gt.0`) and every `max(data(9),1.0)` multiplier a no-op;
# the "dependent of another return" flag (`data(105)`, same field already
# confirmed inert elsewhere); the 2017+ medical-expense itemized
# adjustment (`comnew(20)`, `data(47)/(48)/(49)` - same medical-expense
# fields AL/GA already confirmed inert, and `comnew(20)` itself is never
# assigned by the input reader either); the pre-1980 `data(35)` general-
# credit addback and the 1981-1986 `data(38)` addback (same solar/energy
# field AZ/CA/CT/DC/GA already confirmed inert); `data(52)` (a second,
# unmodeled SALT component in the 2011+ phaseout - this project's schema
# doesn't drive a HI-specific sales-tax-deduction election the way TX's
# own dedicated mechanism does, so this term is $0); `data(34)` (never
# assigned by the input reader at all, confirmed while building Delaware).
#
# Bracket tables are transcribed directly from the source's own (upper_
# bound, rate%) DATA statements, converted to this project's (start,
# rate) convention the same way every other state's tables are. Married_
# joint runs HALF its taxable income through the single table then
# doubles the result (`if(mst.eq.2) taxy=taxinc/2 ... statax=statax*2`);
# married_separate uses the single table directly on its own full taxable
# income (no halving, no doubling); head_of_household gets its own,
# separate table entirely.
