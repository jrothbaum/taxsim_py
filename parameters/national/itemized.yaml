# Federal itemized deductions: state and local taxes, mortgage interest and
# cash charitable contributions (no medical, casualty, miscellaneous or
# non-cash charitable deductions).
#
# Sources: 1987-2021 NBER TAXSIM (`law87`); 2022 on, Internal Revenue Code
# sections 63, 68, 164 and 170 and Schedule A instructions, checked against
# PolicyEngine-US `gov.irs.deductions`.

# State and local tax deduction cap per return from 2018 (halved for married
# separate); none before.
salt_cap: {2018: 10000, 2025: 40000}
# 2025-2029 (P.L. 119-21 sec. 70120): the SALT cap falls by the rate times AGI
# over the threshold, but not below the floor (all halved for married separate).
salt_phaseout:
  2025: {rate: 0.3, threshold: 500000, floor: 10000}
  2030: null
# Limitation on itemized deductions (1991-2009 and 2013-2017): reduced by the
# lesser of `pease_reduction_rate` of AGI over the threshold and
# `pease_cap_rate` of itemized deductions, times `limitation_phasedown_share`.
# Through 2009 one threshold (half for married separate); from 2013 by filing
# status.
pease_limitation_threshold:
  1991: {single: 100000, married_joint: 100000, married_separate: 50000, head_of_household: 100000}
  1992: {single: 105250, married_joint: 105250, married_separate: 52625, head_of_household: 105250}
  1993: {single: 108450, married_joint: 108450, married_separate: 54225, head_of_household: 108450}
  1994: {single: 111800, married_joint: 111800, married_separate: 55900, head_of_household: 111800}
  1995: {single: 114700, married_joint: 114700, married_separate: 57350, head_of_household: 114700}
  1996: {single: 117950, married_joint: 117950, married_separate: 58975, head_of_household: 117950}
  1997: {single: 121200, married_joint: 121200, married_separate: 60600, head_of_household: 121200}
  1998: {single: 124500, married_joint: 124500, married_separate: 62250, head_of_household: 124500}
  1999: {single: 126600, married_joint: 126600, married_separate: 63300, head_of_household: 126600}
  2000: {single: 128950, married_joint: 128950, married_separate: 64475, head_of_household: 128950}
  2001: {single: 132950, married_joint: 132950, married_separate: 66475, head_of_household: 132950}
  2002: {single: 137300, married_joint: 137300, married_separate: 68650, head_of_household: 137300}
  2003: {single: 139500, married_joint: 139500, married_separate: 69750, head_of_household: 139500}
  2004: {single: 142700, married_joint: 142700, married_separate: 71350, head_of_household: 142700}
  2005: {single: 145950, married_joint: 145950, married_separate: 72975, head_of_household: 145950}
  2006: {single: 150500, married_joint: 150500, married_separate: 75250, head_of_household: 150500}
  2007: {single: 156400, married_joint: 156400, married_separate: 78200, head_of_household: 156400}
  2008: {single: 159950, married_joint: 159950, married_separate: 79975, head_of_household: 159950}
  2009: {single: 166800, married_joint: 166800, married_separate: 83400, head_of_household: 166800}
  2010: null
  2013: {single: 250000, married_joint: 300000, married_separate: 150000, head_of_household: 275000}
  2014: {single: 254200, married_joint: 305050, married_separate: 152525, head_of_household: 279650}
  2015: {single: 258250, married_joint: 309900, married_separate: 154950, head_of_household: 284050}
  2016: {single: 259400, married_joint: 311300, married_separate: 155650, head_of_household: 285350}
  2017: {single: 261500, married_joint: 313800, married_separate: 156900, head_of_household: 287650}
  2018: null
pease_reduction_rate: {1991: 0.03}
pease_cap_rate: {1991: 0.8}
# Share of the limitation (and of the personal exemption phaseout) that applies
# while both were being repealed.
limitation_phasedown_share: {1991: 1.0, 2006: 0.6666666666666666, 2008: 0.3333333333333333, 2010: 1.0}
# Cash charitable deduction for nonitemizers: 2020 per return (halved for
# separate returns), 2021 per taxpayer.
nonitemizer_charity_deduction: {2020: 300, 2022: null}
# Cash charitable contributions are limited to this share of AGI; no limit in
# 2020-2021 (a very large share).
cash_charity_agi_limit_share: {1987: 0.5, 2020: 1.0e+20, 2022: 0.5}
