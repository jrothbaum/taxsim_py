# `xndxa` (taxsim_2022_10_21.f:28956-28968, common /xndxac/) - the CPI-index
# table `statax` (taxsim_2022_10_21.f:4-90, the state-tax dispatcher) uses to
# extrapolate every state's tax law for any year beyond its own hardcoded
# `lastat` constant (2021 in this source vintage - "DO NOT FORGET TO UPDATE
# parameter(lastat=2021) EVERY YEAR", taxsim_2022_10_21.f:14). For year>lastat,
# `statax` does NOT use real statutory values for that year at all: it
# deflates every relevant federal-computed input by `xndxa(year)/xndxa(lastat)`,
# runs the REAL `lastat`-year law on the deflated figures, then inflates the
# resulting state tax back up by that same ratio (taxsim_2022_10_21.f:44-50,
# 62-65, comnew(74)=stax*flate at :82). Values 2018+ are a flat, ASSUMED 2.5%/
# year inflation rate (confirmed: 2.512278*1.025 = 2.5750850, matching
# xndxa(2022)=2.5750849 to within float rounding - not real CPI data), per the
# source's own comment "2018+ inflation rate 2.5%".
#
# This project replicates this extrapolation mechanism exactly (see
# engine/state_extrapolation.py) rather than researching real 2022+ state
# statutes, per the project's standing "match what taxsim does" rule - the
# oracle itself is only approximating 2022+, so real statutory values
# wouldn't match it either.
lastat: 2021
xndxa:
