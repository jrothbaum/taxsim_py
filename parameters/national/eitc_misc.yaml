# Federal earned income credit rules other than the schedule (eitc.csv:
# rate_in, max_credit, phaseout_start and rate_out by year, filing status and
# number of children).
#
# Sources: 1975-2021 NBER TAXSIM; 2022 on, Internal Revenue Code section 32
# and Revenue Procedures, checked against PolicyEngine-US
# `gov.irs.credits.eitc`.

# Disqualified (investment) income limit: income above it reduces the credit
# dollar for dollar. 2022-2023 use the published limits ($10,300, $11,000);
# TAXSIM has $10,300 and an extrapolated 2023 value. Source 2024-2025: Rev.
# Proc. 2023-34 and 2024-40.
dylim:
  1996: 2200
  1997: 2250
  1998: 2300
  1999: 2350
  2000: 2400
  2001: 2450
  2002: 2550
  2003: 2600
  2004: 2650
  2005: 2700
  2006: 2800
  2007: 2900
  2008: 2950
  2009: 3100
  2011: 3150
  2012: 3200
  2013: 3300
  2014: 3350
  2015: 3400
  2017: 3450
  2018: 3500
  2019: 3600
  2020: 3650
  2021: 10000
  2022: 10300
  2023: 11000
  2024: 11600
  2025: 11950
# Filers without qualifying children (from 1994): the youngest age at which at
# least one taxpayer qualifies. TAXSIM keeps 2021's 19 for 2022 on; the
# published law returns to 25.
childless_minimum_age: {1994: 25, 2021: 19, 2022: 25}
# Above this age a childless taxpayer does not qualify (not in 2021); TAXSIM
# tests "65 or older" for everyone on the return, and "over 65" together with a
# spouse under the minimum age.
childless_aged_age: 65
# 1997-2002: business losses are added back to the phaseout income at this
# share, as are capital and Schedule E losses (through 2002).
loss_addback_share: {1997: 0.5, 1998: 0.75, 2003: 0.0}
