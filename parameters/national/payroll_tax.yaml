  # bisecting `ficar`'s own OASDI-cap boundary directly against
  # taxsim2024.exe: full 15.3% rate through exactly $153,600 of wages,
  # 2.9%-HI-only at $153,601) - NOT the real, final SSA-published 2023
  # wage base of $160,200. Likely a projection baked into the source
  # before the real figure was finalized, never corrected. Per user
  # direction ("if the model is wrong, use the real parameters that are
  # known"), this project uses the REAL $160,200 here instead of matching
  # the oracle's own stale figure - a deliberate, documented departure
  # from "replicate taxsim exactly," not a bug. Expect `taxsim2024.exe`
  # itself to disagree with this project for any 2023 wages between
  # $153,601 and $160,200 (the OASDI cap lands at a different point) -
  # that mismatch is intentional, not something to chase back into
  # agreement with the oracle.
  2023: 160200
# owrate = 2*(trate-hrate). Flat at 12.4% since 1990 EXCEPT the 2011-2012
# "payroll tax holiday" (Tax Relief Act of 2010): `trate`'s own data array
# has an explicit two-year carve-out (taxsim_2022_10_21.f:22198-22207,
# "...8*.07650, 2*.06650, 11*.07650..." - 2011-2012 sit in the 2-year
# 0.0665 segment), cutting the wage-side combined rate to 10.4% those two
# years only. Confirmed via a live oracle probe (wages=$100,000, single:
# fica=$13,300 for 2011/2012 vs $15,300 for 2010/2013 - exactly the
# implied 13.3%/15.3% combined OASDI+HI rate).
