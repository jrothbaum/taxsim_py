# Social Security (OASDI) + Medicare (HI) payroll tax, wages-only scope.
# Rates are combined employer+employee (TAXSIM's convention: it reports the
# full economic burden, not just the employee's withheld half - see
# taxsim_2022_10_21.f:22166-22457, function `sstax`).
#
# The HI (Medicare) side had its OWN, separate wage base cap through 1993
# ($135,000 that year) before being eliminated entirely starting 1994 -
# the source's own `himax` array runs $4,800 (1960) up to $135,000 (1993),
# then `9e10` (i.e. uncapped) for 1994 on (taxsim_2022_10_21.f:22183-
# 22192). A large sentinel reproduces "uncapped" with no code branch for
# every year this project has otherwise modeled.
