# `divexc`: 50/status, doubled `if(mstat.eq.2)` (married_joint only), then
# doubled again unconditionally `if(lawyr.gt.1964)` - real for 1965+; 1960-
# 1964 keeps the smaller, undoubled base ($50 single/HoH/married_separate,
# $100 married_joint). taxsim_2022_10_21.f:22509-22517.
dividend_exclusion:
  single:
    1960: 50
    1965: 100
  married_joint:
    1960: 100
    1965: 200
  married_separate:
    1960: 50
    1965: 100
  head_of_household:
    1960: 50
    1965: 100

# `caprat` - capital gains EXCLUSION rate (not a preferential rate), flat
# 50% for lawyr<1978 (real for all of 1960-1977). taxsim_2022_10_21.f:22521-
# 22522.
capital_gains_exclusion_rate:
  1960: 0.5

# Personal exemption dollar amount per exemption unit (`exemps` = self/
# spouse count + depx; elderly/blind additions are inert here - see module
# docstring). taxsim_2022_10_21.f:22643-22653.
personal_exemption_amount:
  1960: 600
  1970: 625
  1971: 675
  1972: 750

# Percentage-of-AGI standard deduction ("zbr") - a genuinely different
# formula shape every few years, not just different parameter values within
# one shared shape:
# - <=1963: `zbr = min(ceiling/sepret, pct*agix)` - straight percentage
#   capped at a flat ceiling, NO floor term at all.
# - 1964-1970: `zbr = max(min(ceiling/sepret,pct*agix),
#   min(ceiling/sepret, per_exemption_base/sepret +
#   per_exemption_amount*exemps))` - same percentage/ceiling term as
#   <=1963, now floored at a per-exemption-count amount (itself also capped
#   at the ceiling) rather than a flat dollar floor.
# - 1971-1974: `zbr = max(min(ceiling/sepret,pct*agix), floor/sepret)` -
#   flat dollar floor, one shared formula for every status.
# - 1975+: same shape as 1971-1974 but with separate joint/other
#   ceiling+floor pairs.
# taxsim_2022_10_21.f:22660-22675.
standard_deduction_pct:
  1960: 0.10
  1971: 0.13
  1972: 0.15
  1975: 0.16
standard_deduction_ceiling_other:
  1960: 1000
  1971: 1500
  1972: 2000
  1975: 2300
  1976: 2400
standard_deduction_per_exemption_base:  # 1964-1970 only
  1964: 200
standard_deduction_per_exemption_amount:  # 1964-1970 only
  1964: 100
standard_deduction_floor_other:
  1971: 1050
  1972: 1300
  1975: 1600
  1976: 1700
standard_deduction_ceiling_joint:
  1971: 1500
  1972: 2000
  1975: 2600
  1976: 2800
standard_deduction_floor_joint:
  1971: 1050
  1972: 1300
  1975: 1900
  1976: 2100

# Capital-gains "alternative tax" (a real, distinct provision 1970-1975 -
# see federal_law60.py for the full formula, which is genuinely different
# in shape year to year and not reducible to simple parameters alone).
# `cgtx3`'s flat component and the `$50,000` gate threshold are the same
# every year 1970-1975; only the `cgtx2` blend's cap differs (see
# `alt_capital_gains_cap_rate` below).
alt_capital_gains_threshold:
  1970: 50000
alt_capital_gains_cap_rate:  # 1970: 29.5%, 1971: 32.5%, 1972-1975: uncapped
  1970: 0.295
  1971: 0.325
  1972: 1.0e+9
alt_capital_gains_flat_component:
  1970: 12500

# Vietnam-era surtax (1968-1970 only) - a flat multiplier on the whole
# already-combined `tax`, applied once BEFORE credits, not threaded into
# any sub-computation. taxsim_2022_10_21.f:23047-23056.
surtax_multiplier:
  1968: 1.075
  1969: 1.10
  1970: 1.025

# "Maximum tax on earned income" (1971-1976 in this phase; the source's own
# arrays are dimensioned 1971:1979, real through 1981 - law79 carries
# 1977-1981 forward). `ebot`/`eacc` by status; both flat across 1971-1976
# (the arrays only step at 1977 and 1979). taxsim_2022_10_21.f:22461-22496.
# The 60%/50% multiplier on `etop` is itself year-specific: 60% for 1971
# only (the provision's first, partial-phase-in year), 50% from 1972 on.
max_tax_earned_income_floor:
  single:
    1971: 38000
  married_joint:
    1971: 52000
  married_separate:
    1971: 38000
  head_of_household:
    1971: 38000
max_tax_earned_income_accumulated:
  single:
    1971: 13290
  married_joint:
    1971: 18060
  married_separate:
    1971: 13290
  head_of_household:
    1971: 12240
max_tax_earned_income_etop_multiplier:
  1971: 0.6
  1972: 0.5

# EITC - real 1975-1976 only (created by the Tax Reduction Act of 1975), a
# single flat trapezoid schedule (no status/children distinction beyond
# eligibility itself). taxsim_2022_10_21.f:23166-23205.
eitc_rate_in:
  1975: 0.10
eitc_max_credit:
  1975: 400
eitc_phaseout_start:
  1975: 4000
eitc_rate_out:
  1975: 0.10

# Child and Dependent Care Credit - real 1976 only in this phase (flat 20%,
# $2,000/$4,000 expense cap by number of qualifying children up to 2).
# taxsim_2022_10_21.f:23067-23080.
child_care_credit_expense_cap:
  1976: 2000
child_care_credit_flat_rate:
  1976: 0.20

# $30-per-exemption credit, 1975 only (a one-year-only provision, distinct
# from 1976's General Tax Credit below). taxsim_2022_10_21.f:23059-23062.
personal_exemption_credit_amount:
  1975: 30

# General Tax Credit, 1976 only in this phase (real through 1978, law79
# doesn't need to carry it since law79 starts 1977... note: law79 itself
# does NOT implement this - it belongs entirely to law60's real 1976 case
# plus law79's own dead range). `max(35*exemps, min($180, 2%*taxable_income))`.
# taxsim_2022_10_21.f:23063-23065.
general_tax_credit_per_exemption:
  1976: 35
general_tax_credit_cap:
  1976: 180
general_tax_credit_rate:
  1976: 0.02

# Add-on minimum tax (`addmin`) - genuinely ADDITIVE to tax (not a floor
# like law79/law87's minimum tax). The formula itself (the `.le.1975`
# branch below) is computed identically all the way back to 1960 - it's
# only ever ADDED to `tax` for 1969-1978 (federal_law60.py handles that
# year gate, not this file - `addmin` still needs to resolve for every
# year<=1975 since it's computed unconditionally). Two offset-formula eras
# within that: 1960-1975 use a $30,000/sepret flat offset; 1976 switches to
# a 50%-of-tax offset with a $10,000/sepret floor and a 15% (not 10%) rate.
# taxsim_2022_10_21.f:23206-23264.
addmin_offset_flat:
  1960: 30000
addmin_offset_pct_floor:
  1976: 10000
addmin_rate_pre1976:
  1960: 0.10
addmin_rate_1976to1978:
  1976: 0.15
