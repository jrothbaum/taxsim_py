# Federal income tax, 1960-1976 (`law60`, taxsim_2022_10_21.f:22458-23281) - a
# third, entirely separate top-level federal calculator (dispatched
# `if(lawyr.le.1976) call law60`, taxsim_2022_10_21.f:22151, at the SAME level
# `law79`/`law87` are dispatched from - not a plug-in vintage within either).
#
# Built in two phases (matching the natural `tax74` bracket-vintage boundary,
# which also happens to be where nearly every real mechanism below is
# gated in): Phase 1 = 1971-1976, Phase 2 = 1960-1970 (added later).
#
# As with pre1987.yaml, most of law60's real mechanisms are provably
# unreachable given this project's actual INPUT_COLUMNS schema - confirmed
# directly via `grep -n "data(N)\s*="` against taxsim_2022_10_21.f for every
# `data()` slot law60 reads, not assumed. Confirmed genuinely inert for
# Phase 1 (1971-1976): medical deduction (data 47-49), charitable
# contributions (cash/asset, data 59-60), casualty loss (data 61), political
# contributions credit (data 35, always $0 - `candid` computes but its input
# is never populated), the pre-1979 add-on minimum tax's extra preference
# terms (data 18, 81, 83, 84, 87, 95 - all unassigned), income averaging
# (`avrtax`, gated on `data(96)`, which the input reader explicitly
# initializes to `-1.d0` at taxsim_2022_10_21.f:21136 - a genuine sentinel,
# not an oversight - confirmed via a debug-instrumented oracle build rather
# than assumed, since the naive reading of the gate condition
# `if(data(96).lt.0.) go to 462` looks like it could activate by default if
# the field were merely zero rather than negative), Keogh/IRA deductions
# (data 28/29, unassigned), Schedule E / business-property income (data
# 72-75/77/79, unassigned - schede is always 0), and every misc. credit
# (investment/foreign-tax/win/jobs/energy/elderly, data 32-38, all
# unassigned). Unemployment compensation (`ui`) is NOT part of AGI at all in
# law60's scope (unlike law79's post-1978 partial-inclusion formula) - it
# only ever appears as a preference-income addback (`data(82) =
# max(ui,pui+sui)`) inside the "maximum tax on earned income" computation.
#
# One genuinely different-shaped mechanism vs law79: for ALL of law60's
# range (the `if(lawyr.ge.1977)` branch at taxsim_2022_10_21.f:22688 is never
# taken), taxable income is simply `agi - (itemized if itemizing else zbr) -
# exemption`, clipped at 0 - there is no separate "excess itemized
# deductions over the standard deduction" add-back concept the way law79 has
# (law79's `excess` variable literally never gets set away from its 0 init
# in law60).
#
# Childcare expenses are an UNCAPPED ITEMIZED DEDUCTION for 1971-1975 (added
# directly into `deduc` via `data(64)`, the `childcare` input -
# taxsim_2022_10_21.f:22629), not a credit - the Child Care Credit (chcr,
# flat 20%) only exists starting 1976. Both are real, replicated as found;
# no historical "should have been capped" correction applied.

brackets:
  # `tax74` (taxsim_2022_10_21.f:26192-26206, block data `bl74` at
  # :28068-28116) - a single, flat bracket table covering all of 1971-1976
  # (no CPI blowup, no year variation at all within this vintage - confirmed
  # directly from the block data, which has no year dimension). Extracted
  # via a compiled subroutine sweep (income 0-300000 by $1, watching for
  # rate changes), not hand-transcribed from the dense DATA statement.
  # IMPORTANT: the source's own DATA statement leads each status's table
  # with a `[threshold=0, rate=0.0]` pair that is NOT a real 0% bracket -
  # it's a loop-start sentinel the lookup subroutine's `itab=itab+1` skips
  # past (same pattern already found for `tax87`'s bracket table). The real
  # bracket starting at $0 uses the SECOND entry's rate (0.14 for every
  # status here) - confirmed by the sweep itself (income=$1 already shows
  # rate=0.14, not 0.0) and by hand-verifying bracket_tax($275, these
  # brackets) == $38.50 against a live oracle probe (1971, single, $2,000
  # wages: taxable income $275 after the $1,050 standard deduction floor
  # and $675 exemption, real fiitax=$38.36 - the 16-cent gap is $30's
  # worth of avrtax/addmin noise at this income level, not the bracket
  # itself, confirmed separately). No terminal `1.0e+29` sentinel is needed
  # either - bracket_tax's own last bracket already extends to infinity.
  # married_separate reuses married_joint's own table at sepret=2 (income
  # doubled before lookup, tax halved after - `faster=taxinc*sepret` in the
  # source) for 1971-1976 - Phase 2 (1960-1970) is different again: `tax62`/
  # `tax64`/`tax70` take NO `sepret` argument at all, and the source's own
  # `nfile1` resolution explicitly redirects married_separate to nfile=1
  # (SINGLE's own table, no scaling) for `lawyr.le.1970`
  # (taxsim_2022_10_21.f:22720-22723) - a genuinely different, simpler
  # mechanism for Phase 2, handled in federal_law60.py's own status
  # resolution rather than here.
  #
  # `tax70` (1965-1970) turns out to have the EXACT SAME bracket table as
  # `tax74` (1971-1976) - confirmed by the sweep, not assumed from the
  # "TRA69 didn't change base brackets" prior - real law: TRA69's rate cut
  # took effect via the separate Vietnam-era surtax's own phase-down
  # (10%/2.5% 1969-1970) layered on TOP of an unchanged base table, not by
  # editing the table itself. Reproduced by giving `single`/`married_joint`/
  # `head_of_household` a `1965:` anchor with `tax74`'s own real values
  # (not duplicated by hand - copied via the same sweep) so 1965-1970
  # forward-fills correctly without a second literal copy.
