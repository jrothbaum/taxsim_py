# 1968-1970 surtax: tax before credits is multiplied by this.
surtax_multiplier: {1968: 1.075, 1969: 1.1, 1970: 1.025, 1971: null}
# --- Income and deductions ---
dividend_exclusion:
  single: {1960: 50, 1965: 100}
  married_joint: {1960: 100, 1965: 200}
  married_separate: {1960: 50, 1965: 100}
  head_of_household: {1960: 50, 1965: 100}
# Excluded share of net long-term gain; a net loss is deductible up to the limit
# (married separate from 1971 its own).
capital_gains_exclusion_rate: {1960: 0.5}
net_capital_loss_limit: {1960: 1000}
net_capital_loss_limit_married_separate: {1960: 1000, 1971: 500}
# Exemption per taxpayer and dependent.
personal_exemption_amount: {1960: 600, 1970: 625, 1971: 675, 1972: 750}
# Standard deduction: the share of AGI up to the ceiling (halved for married
# separate); 1964-1970 at least the per-exemption base plus amount per exemption
# (up to the ceiling), 1970 plus the low income allowance; 1971-1974 at least
# the floor; from 1975 joint returns have their own ceiling and floor. Through
# 1975 child care expenses are an itemized deduction.
standard_deduction_pct: {1960: 0.1, 1971: 0.13, 1972: 0.15, 1975: 0.16}
standard_deduction_ceiling_other: {1960: 1000, 1971: 1500, 1972: 2000, 1975: 2300, 1976: 2400}
standard_deduction_per_exemption_base: {1964: 200, 1971: null}
standard_deduction_per_exemption_amount: {1964: 100, 1971: null}
standard_deduction_floor_other: {1971: 1050, 1972: 1300, 1975: 1600, 1976: 1700}
standard_deduction_ceiling_joint: {1971: 1500, 1972: 2000, 1975: 2600, 1976: 2800}
standard_deduction_floor_joint: {1971: 1050, 1972: 1300, 1975: 1900, 1976: 2100}
# 1970 additional allowance for low incomes: `base` less an amount per
# exemption, less `phaseout_rate` of AGI above `income_base` plus an amount per
# exemption.
low_income_allowance:
  1970: {base: 900, per_exemption: 100, income_base: 1100, income_per_exemption: 625, phaseout_rate: 0.5}
  1971: null
# --- Alternative taxes ---
# 1970-1975 alternative tax on capital gains: on long-term gains above the
# threshold (halved for married separate), the bracket tax on the excess capped
# at the cap rate, plus the flat component.
alt_capital_gains_threshold: {1970: 50000, 1976: null}
alt_capital_gains_cap_rate: {1970: 0.295, 1971: 0.325, 1972: 1000000000.0}
alt_capital_gains_flat_component: {1970: 12500}
# Maximum tax on earned income from 1971 (not for married separate): tax on
# personal-service taxable income (less preferences above the exemption) above
# the floor at the multiplier, plus the accumulated tax up to the floor and the
# tax on other income.
max_tax_earned_income_floor:
  1971: {single: 38000, married_joint: 52000, married_separate: 38000, head_of_household: 38000}
max_tax_earned_income_accumulated:
  1971: {single: 13290, married_joint: 18060, married_separate: 13290, head_of_household: 12240}
max_tax_earned_income_etop_multiplier: {1971: 0.6, 1972: 0.5}
# Excess itemized deductions (a preference): deductions above a share of AGI, at
# most a share of AGI.
excess_itemized_preference: {agi_floor_share: 0.6, cap_share: 0.4}
preference_exemption: 30000
# Add-on minimum tax, added to tax from 1969: the rate on preferences (excluded
# gains) above the offset, less the credits; the offset is the flat amount
# (halved for married separate) plus tax through 1975, and from 1976 half of
# tax, at least the floor.
addmin_rate: {1960: 0.1, 1976: 0.15}
addmin_offset_flat: {1960: 30000, 1976: null}
addmin_offset_pct_floor: {1976: 10000}
# --- Credits ---
# 1976 child care credit: the rate times expenses up to the cap per child (two)
# and wages.
child_care_credit_expense_cap: {1976: 2000}
child_care_credit_flat_rate: {1976: 0.2}
# 1975 credit per exemption.
personal_exemption_credit_amount: {1975: 30, 1976: null}
# 1976 general tax credit: the larger of an amount per exemption and a share of
# taxable income up to the cap.
general_tax_credit:
  1976: {per_exemption: 35, cap: 180, rate: 0.02}
# Earned income credit from 1975: one schedule, for returns with dependents
# (none for married separate or dependent filers).
eitc_rate_in: {1975: 0.1}
eitc_max_credit: {1975: 400}
eitc_phaseout_start: {1975: 4000}
eitc_rate_out: {1975: 0.1}
