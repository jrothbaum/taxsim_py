# AMT's own 15%/20% capital-gains breakpoint (`topbrk`, Form 6251 Part
# III) - a separate copy in the source (taxsim_2022_10_21.f:25397-25453)
# from the regular-tax one in capital_gains.yaml. Identical for
# head_of_household/married_joint/married_separate for every year checked
# so far, but $100 higher for single specifically in 2022 ($459,750 vs
# $459,650). Genuinely used (not inert, despite an earlier investigation
# concluding otherwise): it marks where AMT's ltg treatment steps from a
# flat 15% up to an effective ~20% (implemented as 15% plus a further 5%
# surtax on the slice above this breakpoint - see engine/amt.py's
# docstring). Only shows up once ltg is large enough to reach that top
# slice, which is rare enough that it took a specific high-income,
# multi-source-of-preferential-income 2017 test case to expose it.
#
# Before 2013, this whole mechanism doesn't exist: the source's `alm20`/
# `addamt` block (and, in the regular-tax worksheet, its `addtax` twin -
# see capital_gains.yaml) is gated behind `lawyr.ge.2013` outright - there
# was no 20% capital-gains rate in law at all before ATRA. A large
# sentinel ceiling (never reached) reproduces that with no code branch:
# `top_slice` in engine/amt.py's formula is always 0 below it.
