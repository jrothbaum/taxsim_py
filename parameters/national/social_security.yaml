# Taxation of Social Security benefits, from 1984.
#
# Sources: Internal Revenue Code section 86 (as in NBER TAXSIM).

# Taxable share of benefits: `first_tier_rate` of the lesser of benefits and
# provisional income over the base amount; from 1994 a second tier at
# `second_tier_rate` above the first tier's width. Provisional income is AGI
# plus half the benefits plus tax-exempt interest (`transfers`), and in 2020
# also unemployment benefits. Married filing separately has no base amounts.
first_tier_rate: 0.5
second_tier_rate: {1994: 0.85}
base_amount: {single: 25000, head_of_household: 25000, married_joint: 32000, married_separate: 0}
first_tier_width: {single: 9000, head_of_household: 9000, married_joint: 12000, married_separate: 0}
