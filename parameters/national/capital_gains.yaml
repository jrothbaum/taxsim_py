# Pre-2003 (2001-2002): the old, pre-JGTRRA flat two-tier LTCG system -
# 10% up to the rate_0_ceiling breakpoint, 20% above it, no third tier at
# all. Reuses this same three-tier engine (rate_0/rate_15/rate_0_ceiling)
# rather than new code: rate_0=0.10 (not the 2003+ 5%), rate_15 holds the
# TOP rate (0.20, not 0.15) since rate_15_ceiling's sentinel means tier 2
# never ends, so rate_20 is simply never reached - taxsim_2022_10_21.f:
# 27199-27200 (default cgrat1=.1*cgmul, cgrate=.2*cgmul, only overridden by
# `if(lawyr.ge.2003)` to the newer 5%/15% rates). Also note: dividends did
# NOT get preferential-rate treatment at all before 2003 (JGTRRA introduced
# it) - `ltg` itself excludes dividends for year<2003 in calculators/
# federal.py (taxsim_2022_10_21.f:24317-24323: `if(lawyr.ge.2003) ltg = ltg
# + divq` - unconditionally excluded before that).
rate_0:  # bottom-bracket ltg/qualified-dividend rate - 10% pre-2003, 5%
  # through 2007 (TIPRA 2005), cut to 0% starting 2008 -
  # taxsim_2022_10_21.f:27202-27206. 1994-1996 entries exist only for
  # AMT's own cg_rate_0 lookup (calculators/federal.py's year<=1996 branch
  # for the REGULAR tax doesn't touch rate_0/rate_15/rate_20 at all - see
  # the note above) - AMT's ltg treatment uses this same unconditional
  # default (`cgrat1=.1*amtmul`) regardless of the regular-tax vintage
  # boundary, taxsim_2022_10_21.f:25342-25348.
