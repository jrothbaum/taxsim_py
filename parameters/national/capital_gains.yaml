# Federal tax on capital gains and qualified dividends.
#
# Sources: 1987-2021 NBER TAXSIM (`law87`); 2022 on, Internal Revenue Code
# section 1(h) and the Qualified Dividends and Capital Gain Tax Worksheet,
# checked against PolicyEngine-US `gov.irs.capital_gains`.

# Net capital loss deductible against other income (halved for married
# separate).
net_capital_loss_limit: {1987: 3000}
# --- Regular tax on long-term gains ---
# 1987-1996 maximum rate on long-term gains: in 1987 above `rate_28_ceiling`;
# 1988-1990 none (gains taxed as ordinary income); 1991-1996 an alternative tax
# at this rate on gains above the start of the 28% bracket (`rate_0_ceiling`),
# 1991-1993 only when taxable income exceeds the top of that bracket
# (`rate_15_ceiling`).
maximum_rate: {1987: 0.28, 1997: null}
# 1987: the top of the 28% bracket.
rate_28_ceiling:
  1987: {single: 27000, married_joint: 45000, married_separate: 22500, head_of_household: 38000}
  1988: null
# From 1997, worksheet for net long-term gains (and from 2003 qualified
# dividends): `rate_0` up to the first ceiling, `rate_15` up to the second and
# `rate_20` above (the second ceiling is a large sentinel before 2013, when
# there was no 20% rate). 1997-2002 `rate_0` is 10% and `rate_15` the 20% top
# rate; 2003 dividends and gains have their own `transition_rates`. Dividends
# are treated as qualified. TAXSIM's single 2022 second ceiling is $459,650 here
# and $459,750 in amt.yaml; both kept as found. Source 2024-2025: Rev. Proc.
# 2023-34 and 2024-40.
