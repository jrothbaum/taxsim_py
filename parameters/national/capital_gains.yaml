# Qualified dividends + net long-term capital gains preferential rates
# (the "Qualified Dividends and Capital Gain Tax Worksheet"), 0%/15%/20%.
# Verified against taxsim_2022_10_21.f:26866-27440 (subroutine `tax01`) -
# the actual 2022 breakpoints match known published figures exactly for
# the 0/15% line ($41,675/$55,800/$83,350) and for the HoH/joint/separate
# 15/20% lines ($488,500/$517,200/$258,600). The SINGLE-filer 15/20% line
# is $459,650 here (taxsim_2022_10_21.f:27391) - not $459,750, which is
# what AMT's *own*, separately-coded copy of this same breakpoint uses
# (taxsim_2022_10_21.f:25410; see amt.yaml's cg_rate_15_ceiling). Every
# other year 2013-2021 matches exactly between the two copies - this genuinely
# looks like a $100 typo somewhere in the original source, not an
# intentional dual breakpoint, but it's real and deterministic (confirmed
# by a live test mismatch), so both values are replicated as found rather
# than "corrected" to agree with each other.
#
# Scope: dividends are treated as fully qualified (matches the source's own
# default when no separate "non-qualified dividends" split is given -
# taxsim_2022_10_21.f:24307-24315). Short- and long-term gains and losses
# are netted, with a net loss limited by `net_capital_loss_limit` below.
# Other-property gains (a further, separately-deferred input) are not
# included.
# 1994-1996 use yet another, genuinely different vintage subroutine
# (`tax94`, taxsim_2022_10_21.f:26568-26668) - not a tiered preferential
# rate at all, but a "cap the marginal rate on net long-term gain at 28%"
# ALTERNATIVE tax: `tax = min(plain_bracket_tax(taxable_income),
# bracket_tax(max(bot28, taxable_income-ltg)) + 0.28*(taxable_income - that
# ordinary-equivalent amount))`, where `bot28` is exactly this same
# rate_0_ceiling breakpoint (the 15%/28% bracket boundary - `bot28 =
# toptab(itab+1)`, taxsim_2022_10_21.f:26612). Real, historical law: the
# 28%-cap alternative tax on LTCG applied 1991-1996 (TRA1986's original
# scheme), before 1997's Taxpayer Relief Act introduced the modern
# 10%/20% tiered rates `tax97`/`tax01` use. Implemented as its own
# `year <= 1996` branch in calculators/federal.py, reusing this same
# rate_0_ceiling value as `bot28` rather than a new parameter. rate_0/
# rate_15/rate_20 have no 1994-1996 values on purpose, since that branch
# doesn't call `preferential_rate_tax()` at all - rate_15_ceiling DOES
# carry the same inert sentinel back to 1994 only because it (unlike
# rate_0/15/20) gets resolved unconditionally before the year branch,
# never actually used by this one.
# `ttab` (`toptab(itab+3)`) for `tax87` ONLY (`taxsim_2022_10_21.f:
# 26347-26391`) - the 28%/35% bracket boundary that gates 1987's own,
# structurally distinct 3-case capital-gains alternative tax (see
# calculators/federal.py's `year == 1987` branch). Not the same value as
# rate_0_ceiling/rate_15_ceiling - 1987's bracket schedule has 5 real
# tiers (11/15/28/35/38.5%), so this is the bracket table's 4th threshold,
# not its 2nd or 3rd. A large sentinel (never reached) reproduces "this
# mechanism doesn't exist" for every other year with no extra code branch,
# same convention as rate_15_ceiling's own inert-elsewhere sentinel.
rate_28_ceiling:
  single: {1987: 27000, 1988: 1.0e+15}
  head_of_household: {1987: 38000, 1988: 1.0e+15}
  married_separate: {1987: 22500, 1988: 1.0e+15}
  married_joint: {1987: 45000, 1988: 1.0e+15}

