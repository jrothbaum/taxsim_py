# "Surtax on 15% rate savings", 1988-1990 ONLY (`taxsim_2022_10_21.f:
# 24913-24931, "difference4") - a SEPARATE bubble mechanism from the
# Exemption Surtax in personal_exemption.yaml (that one runs 1988-1996;
# this one is exclusive to TRA1986's original 3-year 15%/28% bracket
# design and does not recur once tax91's 3-rate schedule arrives in 1991).
# Real law: a 5% surtax on taxable income above `bubble_surtax_threshold`,
# capped in dollars at `bubble_surtax_cap` - together these claw back the
# tax savings a filer got from having their first bracket taxed at 15%
# instead of the top 28% rate (the "bubble" that gave TRA1986's 2-bracket
# design its informal "hidden third bracket" reputation). Both are
# `filing(mstat,...)*xndx` real dollar amounts, computed via the same
# xndx-driver technique as personal_exemption.yaml's exemption_surtax_
# threshold. NOTE: `bubble_surtax_cap`'s own married_separate value equals
# married_joint's OWN value directly in the source
# (`filing(mstat,2320.5,3867.5,3107.0,3867.5)` - the 4th argument, V4,
# repeats V2) - NOT married_joint/2 like every other per-status parameter
# in this project. Replicated as found, not "corrected".
bubble_surtax_threshold:
  single: {1988: 43150, 1989: 44919.15, 1990: 47076.65}
  married_joint: {1988: 71900, 1989: 74847.90, 1990: 78442.90}
  head_of_household: {1988: 61650, 1989: 64177.65, 1990: 67260.15}
  married_separate: {1988: 35950, 1989: 37423.95, 1990: 39221.45}
bubble_surtax_cap:
  single: {1988: 2320.50, 1989: 2415.6405, 1990: 2531.6655}
  married_joint: {1988: 3867.50, 1989: 4026.0675, 1990: 4219.4425}
  head_of_household: {1988: 3107.00, 1989: 3234.3870, 1990: 3389.7370}
  married_separate: {1988: 3867.50, 1989: 4026.0675, 1990: 4219.4425}

