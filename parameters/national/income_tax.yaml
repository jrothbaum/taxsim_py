# Federal regular income tax parameters.
# Bracket lists are [threshold, rate] pairs, threshold = start of that rate's range.
# Year keys are sparse: only present when the value changes from the prior coded year.
# Verified against taxsim.exe (2022_10_21 build) for state=44 (TX, no state income tax).

# married_separate's brackets: married_joint's thresholds divided by 2 at
# EVERY bracket, not "single's own thresholds with just the top one
# halved" - the per-year bracket tables only carry single/joint/HoH (3
# groups of 8, no separate 4th group for MFS: `nfile=2` for BOTH
# married_joint and married_separate, taxsim_2022_10_21.f:2399,
# distinguished only by dividing by `sepret`). TCJA-era brackets (2018+)
# happen to make single equal exactly half of joint for every bracket
# except the top one, so both readings agree there; pre-2018 brackets
# don't share that property, and only "joint/2 at every threshold" matches
# the source (confirmed via live oracle probe - see the note on the 2017
# entry below).
brackets:
  # 1987 (`tax87`, taxsim_2022_10_21.f:26347-26391) is TRA1986's very
  # first, transition-year schedule: a real 5-rate structure (11/15/28/
  # 35/38.5%, `block data bloc87`) - genuinely different again from
  # 1988-1990's simpler 2-rate 15/28% schedule (the "0%" tmrtab entry at
  # each group's start is a loop-start sentinel, never an actual bracket -
  # confirmed by hand-verifying `bracket_tax(45000, joint's 5 real tiers)
  # == 8840`, exactly the source's own `acctab` entry at that boundary).
  # No CPI blowup needed - unlike tax91, `xndx` is never multiplied into
  # `toptab` anywhere in tax87's body, and 1987 is the only year this
  # subroutine is ever called for.
  #
  # 1988-1990 (`tax88`, taxsim_2022_10_21.f:26395-26412) is TRA1986's
  # original, even simpler 2-rate schedule (15/28%, no 31% tier at all -
  # that came with tax91 in 1991). `block data bloc88`'s own toptab values
  # are already real 1988 dollars (`xndxa(1988)==1.0` exactly, confirmed in
  # the source's own CPI table) and get inflation-scaled for 1989/1990 via
  # a direct `xndx*toptab(itab)` multiply inside the subroutine (not the
  # `blowup=xndx/xndxa(base)` ratio tax91 uses - same effect here since the
  # base year already has xndx==1.0). Extracted via the same standalone
  # driver technique.
  #
  # 1991-1992 (`tax91`, taxsim_2022_10_21.f:26416-26478) is a genuinely
  # different, 3-rate schedule (15/28/31%, no 36%/39.6% top tiers at all -
  # those were added by OBRA93 for 1993+). The bracket table itself
  # (`block data bloc91`, taxsim_2022_10_21.f:28385-28402) is denominated
  # in 1991 dollars and inflation-adjusted for 1992 via `blowup =
  # xndx/xndxa(1991)` (confirmed blowup=1.0 for 1991 itself, 1.052447552...
  # for 1992) - extracted via a standalone driver linking that block data
  # plus the source's own `xndxa` CPI table, not hand-computed.
