# Federal regular income tax parameters.
# Bracket lists are [threshold, rate] pairs, threshold = start of that rate's range.
# Year keys are sparse: only present when the value changes from the prior coded year.
# Verified against taxsim.exe (2022_10_21 build) for state=44 (TX, no state income tax).

# married_separate's brackets: married_joint's thresholds divided by 2 at
# EVERY bracket, not "single's own thresholds with just the top one
# halved" - the per-year bracket tables only carry single/joint/HoH (3
# groups of 8, no separate 4th group for MFS: `nfile=2` for BOTH
# married_joint and married_separate, taxsim_2022_10_21.f:2399,
# distinguished only by dividing by `sepret`). TCJA-era brackets (2018+)
# happen to make single equal exactly half of joint for every bracket
# except the top one, so both readings agree there; pre-2018 brackets
# don't share that property, and only "joint/2 at every threshold" matches
# the source (confirmed via live oracle probe - see the note on the 2017
# entry below).
