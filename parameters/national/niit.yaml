# Net Investment Income Tax (NIIT), 3.8% on the lesser of net investment
# income (interest + dividends + all capital gains) or AGI over a
# threshold. Confirmed against taxsim_2022_10_21.f:25999-26026 (local
# variable name in that subroutine's version of the shared common block is
# `dicare`, not a name containing "niit" - found by counting position 173
# in the named common-block list, not by searching for "niit" text).
# Statutorily fixed (not inflation-indexed) since 2013 inception - didn't
# exist before, so rate=0 (not omitted: calculators/federal.py fetches
# this unconditionally) for any earlier year already built.
