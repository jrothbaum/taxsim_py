# The state/local tax deduction attributable to investment income is
# subtracted from net investment income before applying the rate, capped
# at $10,000 per return (2018+) and pro-rated by the investment-income
# share of AGI. Uncapped pre-2018 (taxsim_2022_10_21.f:26010-26018,
# `if(lawyr.le.2017) expnse=data(50)*min(1,dinc/agi)` - no cap term at all)
# - `expense_cap` has no 2017-or-earlier entry on purpose; the cap is
# skipped entirely in calculators/federal.py for year<2018.
expense_cap:
  2018: 10000
  2019: 10000
  2022: 10000
