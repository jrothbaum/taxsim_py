# Personal/dependent exemptions (Form 1040) - suspended entirely 2018-2025
# by TCJA (`if(lawyr.ge.2018) amex=0.` - taxsim_2022_10_21.f:24750), so this
# was never needed until the port reached 2017. Scope: the filer + spouse
# (if married_joint) + dependents (`depx`) - `extnd(74)`/`extnd(85)`-style
# overrides (no exemption for a spouse, dependent-return special case) are
# not modeled, matching this project's existing scope decisions elsewhere.
# Verified against taxsim_2022_10_21.f:24738-24816.
amount:  # exem(lawyr): a flat per-exemption dollar amount
  2009: 3650
  2010: 3650
  2011: 3700
  2012: 3800
  2013: 3900
  2014: 3950
  2015: 4000
  2016: 4050
  2017: 4050

# Personal Exemption Phaseout (PEP): the exemption amount phases down 2%
# per $2,500 of AGI over this threshold (uncapped except at a full 100%
# phaseout, i.e. amex never goes negative). Shares its threshold with the
# Pease itemized-deduction limitation in itemized.yaml (both reinstated by
# ATRA 2013 on the same year-by-year schedule) - taxsim_2022_10_21.f:24761.
# PEP was temporarily fully repealed 2010-2012 (`ratio` forced to 0
# unconditionally, taxsim_2022_10_21.f:24798-24800) - calculators/
# federal.py special-cases that range directly (amex = amex_base, this
# threshold/rate never even fetched for those years), so no 2010-2012
# entry is needed here. 2009 (like 2008) is on the tail end of a gradual
# phase-out that preceded the 2010-2012 repeal - the ratio computed from
# this same threshold/rate only counts for 1/3 of its normal effect that
# year (calculators/federal.py's own year==2009 special case). 2013 is
# ATRA's reinstatement, back to the full, un-fractioned formula.
high_income_phaseout_threshold:
  # 2009 only (2010-2012 skip this entirely - see the code's own
  # 2010<=year<=2012 branch), a genuinely different, only-33%-applied
  # phaseout - taxsim_2022_10_21.f:24783-24784.
  single: {2009: 166800, 2013: 250000, 2014: 254200, 2015: 258250, 2016: 259400, 2017: 261500}
  head_of_household: {2009: 208500, 2013: 275000, 2014: 279650, 2015: 284050, 2016: 285350, 2017: 287650}
  married_separate: {2009: 125000, 2013: 150000, 2014: 152525, 2015: 154950, 2016: 155650, 2017: 156900}
  married_joint: {2009: 250200, 2013: 300000, 2014: 305050, 2015: 309900, 2016: 311300, 2017: 313800}
phaseout_rate:  # 2% per bracket
  2009: 0.02
phaseout_bracket_size:  # $2,500, divided by sepret for a married_separate half-return
  2009: 2500
