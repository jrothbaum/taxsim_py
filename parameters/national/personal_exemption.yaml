# Personal Exemption Phaseout (PEP): the exemption amount phases down 2%
# per $2,500 of AGI over this threshold (uncapped except at a full 100%
# phaseout, i.e. amex never goes negative). Shares its threshold with the
# Pease itemized-deduction limitation in itemized.yaml (both reinstated by
# ATRA 2013 on the same year-by-year schedule) - taxsim_2022_10_21.f:24761.
# PEP was temporarily fully repealed 2010-2012 (`ratio` forced to 0
# unconditionally, taxsim_2022_10_21.f:24798-24800) - calculators/
# federal.py special-cases that range directly (amex = amex_base, this
# threshold/rate never even fetched for those years), so no 2010-2012
# entry is needed here. 2008-2009 are on the tail end of a gradual
# phase-out that preceded the 2010-2012 repeal - the ratio computed from
# this same threshold/rate only counts for 1/3 of its normal effect those
# two years (calculators/federal.py's own year-in-(2008,2009) special
# case). 2013 is ATRA's reinstatement, back to the full, un-fractioned
# formula.
high_income_phaseout_threshold:
  # 2006-2007 apply the ratio at 2/3 strength, 2008-2009 at 1/3 strength
  # (2010-2012 skip this entirely - see the code's own 2010<=year<=2012
  # branch) - taxsim_2022_10_21.f:24780-24810.
  # 1997-1998 share the same value (the source's own condition is
  # `lawyr.le.1998`, not per-year) - taxsim_2022_10_21.f's exmphl table.
  # 1994-1996 (this project's `year<=1996` branch) use a genuinely
  # different, older formula (`exmphl = filing(...)*xndx/1.143`,
  # taxsim_2022_10_21.f:24754-24760) - precomputed into plain dollar
  # values here via a standalone driver against the source's own `xndxa`
  # CPI table (same extraction technique as every other parameter):
  # single=$111,898.51/$114,785.65/$117,847.77, married_joint=
  # $167,847.77/$172,178.48/$176,771.65, head_of_household=$139,873.14/
  # $143,482.06/$147,309.71, married_separate=$83,923.88/$86,089.24/
  # $88,385.83 for 1994/1995/1996 respectively.
  single: {1991: 100087.49, 1992: 105336.83, 1993: 108573.93, 1994: 111898.51, 1995: 114785.65, 1996: 117847.77, 1997: 124500, 1998: 124500, 1999: 126600, 2000: 128950, 2001: 132950, 2002: 137300, 2003: 139500, 2004: 142700, 2005: 145950, 2006: 150500, 2007: 156400, 2008: 159950, 2009: 166800, 2013: 250000, 2014: 254200, 2015: 258250, 2016: 259400, 2017: 261500}
