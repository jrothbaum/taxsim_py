# "Exemption Surtax" (`tax3`), 1988-1996 (this project's scope now covers
# 1991-1996) - a SEPARATE, additional mechanism from the PEP exemption
# reduction above, not a duplicate: a flat 5% surtax on taxable income
# above its own threshold, capped at 28% of the (already PEP-reduced)
# exemption amount - taxsim_2022_10_21.f:24933-24952. Precomputed into
# plain dollar values via a standalone driver against the source's own
# `xndxa` CPI table (`phase = filing(...)*xndx`, no /1.143 divisor this
