# Federal income tax, 1977-1986 (`law79`, taxsim_2022_10_21.f:23286-24111) - a
# genuinely separate top-level calculator from `law87` (parameters/national/
# income_tax.yaml etc.), not a plug-in vintage. Dispatched
# `if(lawyr.ge.1977.and.lawyr.le.1986) call law79` (taxsim_2022_10_21.f:22152),
# at the SAME level `law87` itself is dispatched from - a different AGI
# computation, a capital-gains EXCLUSION (not a preferential rate or 28%-cap
# alt-tax), three distinct minimum-tax formulas across the decade, and its
# own bracket vintages (tax77/79/82/83/84). See calculators/federal_pre1987.py.
#
# Scope note: several real law79 mechanisms are UNREACHABLE through this
# project's actual input schema (INPUT_COLUMNS in scripts/validate_federal.py)
# and so are correctly always-zero/inert here, not unmodeled gaps: medical
# expense deduction (edical - no input field for it), charitable contributions
# (char/charni - same "no named input column" gap already known from
# law87's own charity_cash), casualty losses (data(61)), the pre-1979 add-on
# minimum tax (addmin - gated on data(155)/data(81), neither populated),
# income averaging (avrtax - gated on data(96), not populated), political
# campaign/elderly/foreign-tax/investment/jobs/energy credits (all read
# data() fields with no corresponding named input column), Keogh/IRA
# deductions (data(28)/data(29), no input fields), and the elderly-specific
# unemployment/SS provisions (data(9), driven by page/sage ages - not in
# this project's INPUT_COLUMNS).
#
# Year keys are sparse with forward-fill, same convention as every other
# parameter file - a year with no entry here reuses the largest earlier
# coded year's value. Bracket lists follow income_tax.yaml's own convention
# too: status-first, then sparse year -> [threshold, rate] pairs.

