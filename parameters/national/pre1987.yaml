standard_deduction:  # zbr - head_of_household uses the SAME formula as
  # single for this entire era (the source's own zbr formula never branches
  # on nfile==3 at all, only nfile==2 for joint) - not a repeat of a separate
  # HoH value, genuinely identical to single every year 1977-1986.
  single:
    1977: 2200
    1979: 2300
    1985: 2392
    1986: 2484
  head_of_household:
    1977: 2200
    1979: 2300
    1985: 2392
    1986: 2484
  married_joint:
    1977: 3200
    1979: 3400
    1985: 3536
    1986: 3672
  married_separate:  # joint/2, via the source's own /sepret divisor
    1977: 1600
    1979: 1700
    1985: 1768
    1986: 1836

personal_exemption_amount:  # amex = this * exemps. $750 flat pre-1979, then
  # $1,000 inflation-indexed (`xndx`, law79's own LOCAL CPI multiplier -
  # 1.0 through 1984, 1.04 in 1985, 1.08 in 1986 - not the global `xndxa`
  # table law87 uses).
  1977: 750
  1979: 1000
  1985: 1040
  1986: 1080

# Dividend exclusion (`divexc`, taxsim_2022_10_21.f:23344-23366). married_
# separate gets the SAME (smaller) exclusion as single - the source checks
# `mstat.eq.2` (joint specifically), not a joint/2 halving.
# 1979 is a genuine, replicated-as-found quirk: `divexc = data(13)`, and
# data(13) is never assigned anywhere in the source's input-population code
# (confirmed by grep) - it silently stays at its zero-initialized default,
# so the 1979 exclusion is effectively $0 (dividends fully taxable that
# year, not the usual $100/$200). 1981 is a real, different one-year
# provision: a $200/$400 exclusion applied against COMBINED interest+
# dividends (not dividends alone) - implemented as its own code branch in
# calculators/federal_pre1987.py, not a plain parameter swap.
dividend_exclusion:
  single: {1977: 100, 1979: 0, 1980: 100, 1981: 200, 1982: 100}
  head_of_household: {1977: 100, 1979: 0, 1980: 100, 1981: 200, 1982: 100}
  married_separate: {1977: 100, 1979: 0, 1980: 100, 1981: 200, 1982: 100}
  married_joint: {1977: 200, 1979: 0, 1980: 200, 1981: 400, 1982: 200}

# Capital gains EXCLUSION rate (`caprat`) - the excluded SHARE of net
# long-term gain, not a preferential rate on the remainder (the remainder
# is ordinary income, taxed at the regular bracket schedule). 50% through
# 1977, 60% from 1978 on (Revenue Act of 1978 raised it).
# taxsim_2022_10_21.f:23370-23387.
capital_gains_exclusion_rate:
  1977: 0.5
  1978: 0.6

# Two-earner deduction (1982+, ERTA 1981's "marriage penalty relief") -
# 10% of the lesser-earning spouse's own wages, capped in dollars. 1982
# ONLY used a smaller, transitional 5%/$1,500 version (taxsim_2022_10_21.f:
# 23421-23425) before the full 10%/$3,000 version took effect 1983+.
# Net capital loss deductible against other income (`clslim`, divided by
# `sepret` for married filing separately), and the share of a net
# long-term loss that counts toward it.
net_capital_loss_limit:
  1977: 2000
  1978: 3000
long_term_loss_share: {1977: 0.5}

two_earner_deduction_rate:
  1982: 0.05
  1983: 0.10
two_earner_deduction_cap:
  1982: 1500
  1983: 3000

# Unemployment compensation exclusion threshold (`uxemp1`/`uxemp2`,
# taxsim_2022_10_21.f:23319-23320,23439-23443) - AGI (plus the UI itself)
# below this threshold means UI stays fully excluded; above it, half the
# excess (capped at the UI amount itself) becomes taxable. married_separate
# gets a real $0 threshold both eras (the source's own uxemp1(6)/uxemp2(6)
# array entries are 0, not a fraction of joint's) - so separate filers'
# UI is effectively taxable from the first dollar once this mechanism
# applies at all. Genuinely different threshold table 1982+ (smaller
# thresholds - ERTA 1981 expanded UI taxability) vs 1977-1981's larger,
# original ones. UNAVAILABLE entirely for 1977-1978 specifically (`if
# (lawyr.le.1978) untax = 0.` - UI wasn't taxable at all yet) - handled as
# its own year gate in calculators/federal_pre1987.py, not via this table.
unemployment_exclusion_threshold:
  single: {1977: 20000, 1982: 12000}
  head_of_household: {1977: 20000, 1982: 12000}
  married_separate: {1977: 0, 1982: 0}
  married_joint: {1977: 25000, 1982: 18000}

# EITC (`earncr`, taxsim_2022_10_21.f:23909-23960) - a SINGLE flat schedule
# regardless of filing status or number of qualifying children (unlike
# law87-era EITC, which varies phaseout_start by status and rates by child
# count) - only the eligibility gate (`data(8).eq.0` -> 0, i.e. no children
# at all) and married-separate's own exclusion (`sepret.eq.2` -> 0) create
# any variation. Three real rate/amount steps across the decade (Tax
# Reduction Act 1975's original credit, its 1978 extension, and the 1984
# Deficit Reduction Act's increase) - not the same table stretched by
# inflation.
eitc_rate_in:
  1977: 0.10
  1985: 0.11
eitc_max_credit:
  1977: 400
  1979: 500
  1985: 550
eitc_phaseout_start:
  1977: 4000
  1979: 6000
  1985: 6500
eitc_rate_out:
  1977: 0.10
  1979: 0.125
  1985: 0.1222

# Child and Dependent Care Credit (`chcr`, taxsim_2022_10_21.f:23838-23862).
# Expense cap per qualifying person: $2,000 through 1981, $2,400 from 1982
# on. Rate: a flat 20% through 1981; 1982+ introduces AGI-based phase-down
# (`chr = max(.2, .3 - max((agi-8000)/200000, 0))`) - implemented directly
# in calculators/federal_pre1987.py (same shape as engine/credits.py's
# later pre-2021 CCC rate function, but with genuinely different constants
# and no separate max-expense distinction, so not reusing that function).
child_care_credit_expense_cap:
  1977: 2000
  1982: 2400
child_care_credit_flat_rate:  # only real for lawyr<=1981; 1982+ uses the
  # AGI-phase-down formula above instead, this value unused those years.
  1977: 0.20

# Minimum tax - three genuinely different formulas across the decade, all
# using capital gains' EXCLUDED share (`capded`) as their core preference
# item (the one preference item this project's scope can actually make
# nonzero). taxsim_2022_10_21.f:23961-24065.
#
# 1979-1981 (in addition to a pre-1979 "add-on" tax that's always $0 in
# this project's scope - gated on unpopulated data(155)/data(81)): a real,
# separate GRADUATED minimum tax layered alongside it - 10% of preference
# income (`alminy` = taxable income + capded) over $20,000/sepret, another
# 10% over $60,000/sepret, another 5% over $100,000/sepret. Combines with
# regular tax as `tax = max(regular_tax, tier_sum)` in this project's
# scope (the source's own `almtax = max(0, tier_sum - tax); tax = tax +
# almtax` reduces to exactly that once the unpopulated offset/addmin terms
# drop out).
minimum_tax_tier1_threshold: {1979: 20000}
minimum_tax_tier2_threshold: {1979: 60000}
minimum_tax_tier3_threshold: {1979: 100000}  # 1979-1981 only; no tier 3 in 1982
minimum_tax_tier1_rate: {1979: 0.10}
minimum_tax_tier2_rate: {1979: 0.10}
minimum_tax_tier3_rate: {1979: 0.05}  # not used for 1982 in code (2-tier only that year)

# 1983+: a single flat-rate minimum tax replaces the graduated one - 20%
# of preference income over a flat-dollar offset ($30,000 single/HoH,
# $40,000/sepret joint/separate - note this offset is NOT inflation-
# indexed and NOT the same shape as the 1979-1981 tiers). `alminy` here
# adds capital gains' excluded share directly to AGI (not taxable income)
# minus itemized deductions when itemizing - taxsim_2022_10_21.f:24042-24065.
minimum_tax_flat_rate: {1983: 0.20}
# 1982: itemized deductions above this share of AGI are a minimum tax
# preference (`exded`).
excess_itemized_agi_share_1982: 0.6
minimum_tax_offset_single_hoh: {1983: 30000}
minimum_tax_offset_joint_sep: {1983: 40000}  # divided by sepret for separate

# "Maximum tax on earned income" (`etax`), 1977-1981 ONLY - a real, well-
# known provision capping the marginal rate on personal-service income at
# 50%, phased out by TEFRA 1982 (which cut the top ORDINARY rate to 50%
# too, making this redundant). Not available for married-separate filers
# at all (`if(sepret.eq.2) goto 444` - the whole mechanism is skipped).
# `ebot`/`eacc` (taxsim_2022_10_21.f:23319-23328) are dimensioned
# (1977:1981) with `2*X, 3*Y` - i.e. 1977-1978 share one value, 1979-1981
# share a different one, not five independent numbers.
max_tax_earned_income_floor:  # ebot
  single: {1977: 40200, 1979: 41500}
  head_of_household: {1977: 40200, 1979: 44700}
  married_separate: {1977: 26000, 1979: 28300}
  married_joint: {1977: 55200, 1979: 60000}
max_tax_earned_income_accumulated:  # eacc - tax already paid through ebot
  single: {1977: 13290, 1979: 13392}
  head_of_household: {1977: 12240, 1979: 13961}
  married_separate: {1977: 9030, 1979: 9839}
  married_joint: {1977: 18060, 1979: 19678}

# Rate Reduction Credit, 1981 ONLY (ERTA 1981's mid-year 1.25% cut,
# `taxsim_2022_10_21.f:23575-23580` - applies to `tax77`), applied as a
# flat multiplier to the regular tax AND threaded into both the capital-
# gains alternative tax and the maximum-tax-on-earned-income computations
# for that one year specifically (see calculators/federal_pre1987.py -
# not a uniform final multiplier, each alternative gets it applied at its
# own specific point, matching the source line by line).
rate_reduction_credit_multiplier: {1981: 0.9875}

# Alternative tax on capital gains threshold, pre-1979 only (the $50,000/
# sepret breakpoint in the source's own $50k-threshold blended 25%/50%
# formula, taxsim_2022_10_21.f:23658-23675) - kept as its own named
# constant since it's genuinely different from every other dollar
# threshold in this file, not reused anywhere else.
alt_capital_gains_tax_threshold_pre1979: {1977: 50000}

# 1981's own one-year alternative tax on capital gains (a flat effective
# 20% cap via `0.4*top_ordinary_rate`, taxsim_2022_10_21.f:23676-23682) -
# the 0.4 fraction and 0.2 flat-add rate are both structural constants of
# that one-year formula, not separately time-varying, so left as literals
# in calculators/federal_pre1987.py rather than parameterized here.

# 1977-1978 alternative capital gains tax: the rate on `subd` when gated,
# otherwise the rate on the excluded gain.
alternative_capital_gains_1977_1978:
  subd_rate: 0.25
  capded_rate: 0.5
# 1981 alternative tax: tax on income less the excluded share of long-term
# gains, plus the maximum rate on those gains.
alternative_capital_gains_1981:
  excluded_share: 0.4
  rate: 0.2

# Excess itemized deductions (preference income): deductions above a share
# of AGI, at most a share of AGI.
excess_itemized_preference:
  agi_floor_share: 0.6
  cap_share: 0.4

# 1982-1986 child care credit rate: the maximum less one point per step of
# AGI above the floor, at least the minimum.
child_care_credit_rate_1982_1986:
  max_rate: 0.30
  min_rate: 0.20
  agi_floor: 8000
  agi_step: 200000

# 1977-1978 General Tax Credit: the larger of an amount per exemption and a
# share of taxable income up to a maximum.
general_tax_credit_1977_1978:
  per_exemption: 35
  maximum: 180
  taxable_income_rate: 0.02
