# Zero bracket amount (heads of household as single; married separate half of
# joint). Itemizers deduct only the excess of itemized deductions over it.
standard_deduction:
  single: {1977: 2200, 1979: 2300, 1985: 2392, 1986: 2484}
  head_of_household: {1977: 2200, 1979: 2300, 1985: 2392, 1986: 2484}
  married_joint: {1977: 3200, 1979: 3400, 1985: 3536, 1986: 3672}
  married_separate: {1977: 1600, 1979: 1700, 1985: 1768, 1986: 1836}
# Exemption per taxpayer, dependent and taxpayer 65 or older.
personal_exemption_amount: {1977: 750, 1979: 1000, 1985: 1040, 1986: 1080}
# 1981 rate reduction credit: regular tax, and the alternative capital gains and
# maximum taxes, are multiplied by this.
rate_reduction_credit_multiplier: {1981: 0.9875, 1982: null}
# --- Income ---
# Dividend exclusion (married separate as single); 1981 against interest and
# dividends combined. 1979 is 0: TAXSIM reads an input it never sets.
dividend_exclusion:
  single: {1977: 100, 1979: 0, 1980: 100, 1981: 200, 1982: 100}
  head_of_household: {1977: 100, 1979: 0, 1980: 100, 1981: 200, 1982: 100}
  married_separate: {1977: 100, 1979: 0, 1980: 100, 1981: 200, 1982: 100}
  married_joint: {1977: 200, 1979: 0, 1980: 200, 1981: 400, 1982: 200}
# Excluded share of net long-term gain (the rest is ordinary income). A net loss
# counts short-term losses in full and long-term losses at
# `long_term_loss_share`, up to the limit (halved for married separate) and
# other income.
capital_gains_exclusion_rate: {1977: 0.5, 1978: 0.6}
net_capital_loss_limit: {1977: 2000, 1978: 3000}
long_term_loss_share: {1977: 0.5}
# From 1982, two-earner deduction: a share of the lower earner's wages, capped.
two_earner_deduction_rate: {1982: 0.05, 1983: 0.1}
two_earner_deduction_cap: {1982: 1500, 1983: 3000}
# From 1979 half the excess of AGI plus unemployment compensation over the
# threshold is taxable, up to the benefit (excluded entirely before).
unemployment_exclusion_threshold:
  1979: {single: 20000, married_joint: 25000, married_separate: 0, head_of_household: 20000}
  1982: {single: 12000, married_joint: 18000, married_separate: 0, head_of_household: 12000}
# --- Alternative taxes ---
# Alternative tax on capital gains, used when lower: 1977-1978 tax on income
# without the excluded gain plus `subd_rate` on gains up to the threshold
# (halved for married separate) or `capded_rate` on the excluded gain; 1981 tax
# on income less `excluded_share` of long-term gains plus `rate` on them.
alternative_capital_gains:
  1977: {threshold: 50000, subd_rate: 0.25, capded_rate: 0.5}
  1979: null
  1981: {excluded_share: 0.4, rate: 0.2}
  1982: null
# Maximum tax on earned income through 1981 (not for married separate): tax on
# personal-service taxable income above the floor at 50%, plus the accumulated
# tax up to the floor and the tax on other income.
max_tax_earned_income_floor:
  1977: {single: 40200, married_joint: 55200, married_separate: 26000, head_of_household: 40200}
  1979: {single: 41500, married_joint: 60000, married_separate: 28300, head_of_household: 44700}
  1982: null
max_tax_earned_income_accumulated:
  1977: {single: 13290, married_joint: 18060, married_separate: 9030, head_of_household: 12240}
  1979: {single: 13392, married_joint: 19678, married_separate: 9839, head_of_household: 13961}
  1982: null
# Excess itemized deductions (a preference): deductions above a share of AGI, at
# most a share of AGI.
excess_itemized_preference: {agi_floor_share: 0.6, cap_share: 0.4}
# --- Minimum tax (a floor under tax after credits) ---
# 1979-1982: graduated rates on taxable income plus the excluded gain (1982 also
# excess itemized deductions) above each threshold (halved for married
# separate); three tiers through 1981, two in 1982.
minimum_tax_tier1_threshold: {1979: 20000, 1983: null}
minimum_tax_tier2_threshold: {1979: 60000, 1983: null}
minimum_tax_tier3_threshold: {1979: 100000, 1982: null}
minimum_tax_tier1_rate: {1979: 0.1, 1983: null}
minimum_tax_tier2_rate: {1979: 0.1, 1983: null}
minimum_tax_tier3_rate: {1979: 0.05, 1982: null}
# 1982: the analytic rate nets out this share for the excess itemized
# preference.
minimum_tax_excess_itemized_share: {1982: 0.6, 1983: null}
# From 1983: a flat rate on AGI plus preferences above the offset (joint, and
# married separate halved).
minimum_tax_flat_rate: {1983: 0.2}
minimum_tax_offset_single_hoh: {1983: 30000}
minimum_tax_offset_joint_sep: {1983: 40000}
# --- Credits ---
# Child and dependent care credit: the rate times expenses up to the cap per
# child (two), wages and actual expenses. Through 1981 a flat rate; from 1982
# the maximum less one point per step of AGI above the floor, at least the
# minimum.
child_care_credit_expense_cap: {1977: 2000, 1982: 2400}
child_care_credit_rate:
  1977: 0.2
  1982: {max_rate: 0.3, min_rate: 0.2, agi_floor: 8000, agi_step: 200000}
# 1977-1978 general tax credit: the larger of an amount per exemption and a
# share of taxable income up to a maximum.
general_tax_credit:
  1977: {per_exemption: 35, maximum: 180, taxable_income_rate: 0.02}
  1979: null
# Earned income credit: one schedule for every filing status, for returns with
# children (none for married separate or dependent filers).
eitc_rate_in: {1977: 0.1, 1985: 0.11}
eitc_max_credit: {1977: 400, 1979: 500, 1985: 550}
eitc_phaseout_start: {1977: 4000, 1979: 6000, 1985: 6500}
eitc_rate_out: {1977: 0.1, 1979: 0.125, 1985: 0.1222}
