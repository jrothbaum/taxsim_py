# Credit for Other Dependents (ODC): $500 nonrefundable credit per dependent
# not eligible for the Child Tax Credit, phased out above an AGI threshold.
# Verified directly against taxsim_2022_10_21.f:25619-25668.
other_dependent_credit:
  amount:
    2018: 500
    2019: 500
    2022: 500
  phaseout_threshold:
    single:
      2018: 200000
      2019: 200000
      2022: 200000
    head_of_household:
      2018: 200000
      2019: 200000
      2022: 200000
    married_separate:
      2018: 200000
      2019: 200000
      2022: 200000
    married_joint:
      2018: 400000
      2019: 400000
      2022: 400000
  phaseout_rate_per_1000:
    2018: 50
    2019: 50
    2022: 50

# Child Tax Credit + Additional (refundable) CTC, for 0-2 CTC-qualifying
# children (dep17). 3+ children uses a different alternate ACTC formula
# (an SS-tax-based floor) not implemented here - see calculators/federal.py.
# Verified against taxsim_2022_10_21.f:25619-25668 (nonrefundable base,
# two-tier phaseout) and :25918-25940 (refundable ACTC top-up).
child_tax_credit:
  young_child_amount:  # dep6: qualifying children under 6
    2021: 3600
    2022: 3600
  older_child_amount:  # dep17 - dep6: qualifying children 6-16
    2021: 3000
    2022: 3000
  base_amount_offset:  # ccrmax - base_amount_offset*ideps = "enhanced" amount above the $2000 base
    2021: 2000
    2022: 2000
  enhanced_cap:  # crfile in the source: caps the enhanced amount before the low-income phaseout
    single: {2021: 6250, 2022: 6250}
    head_of_household: {2021: 4375, 2022: 4375}
    married_separate: {2021: 6250, 2022: 6250}
    married_joint: {2021: 12500, 2022: 12500}
  low_income_phaseout_threshold:  # thresh: phases the enhanced amount back toward the $2000 base
    single: {2021: 75000, 2022: 75000}
    head_of_household: {2021: 112500, 2022: 112500}
    married_separate: {2021: 75000, 2022: 75000}
    married_joint: {2021: 150000, 2022: 150000}
  low_income_phaseout_rate:
    2021: 0.05
    2022: 0.05
  # For lawyr<=2020 (pre-ARPA), the nonrefundable base is a flat per-child
  # amount with no young/old-child distinction and no low-income phaseout
  # mechanism at all: precrd = flat_amount_pre2021(year)*ideps + odcred.
  # Verified against taxsim_2022_10_21.f:25619-25637.
  flat_amount_pre2021:  # chmax(lawyr): $600/child 2001-2002 (EGTRRA's
    # original level), JGTRRA accelerated the increase to $1,000 starting
    # 2003 (originally scheduled for 2010) - confirmed via the source's own
    # `chmax` array. The Child Tax Credit itself didn't exist before 1998
    # (TRA1997 created it) - `chmax` has no 1997 entry in the source at all
    # (dimensioned `chmax(1998:2023)`, and the whole CTC section is gated
    # `if(lawyr.ge.1998)`) - 0 here reproduces that with no extra code
    # branch. $400/child for 1998 (its first, partial-phase-in year),
    # $500/child 1999-2000.
    1987: 0
    1988: 0
    1991: 0
    1992: 0
    1993: 0
    1994: 0
    1995: 0
    1996: 0
    1997: 0
    1998: 400
    1999: 500
    2000: 500
    2001: 600
    2002: 600
    2003: 1000
    2004: 1000
    2005: 1000
    2006: 1000
    2007: 1000
    2008: 1000
    2009: 1000
    2018: 2000
    2019: 2000
  # earlim: $8,500 for 2008 specifically (the pre-ARRA level - confirmed
  # via the source's own `ealim` array, taxsim_2022_10_21.f, genuinely
  # different from every other year checked so far, not a typo), ARRA
  # lowered it to $3,000 starting 2009 (made permanent by PATH), TCJA set
  # it to $2,500 starting 2018.
  actc_earned_income_floor:
    2001: 10000
    2002: 10350
    2003: 10500
    2004: 10750
    2005: 11000
    2006: 11300
    2007: 11750
    2008: 8500
    2009: 3000
    2018: 2500
    2019: 2500
    2022: 2500
  actc_rate:  # eapct(2001:2023): 3*.10 (2001-2003) then .15 (2004+) - the
    # ACTC rate was 10% for 2001-2003, raised to 15% starting 2004 (Working
    # Families Tax Relief Act of 2004) - confirmed via a live oracle probe
    # (2003, $15,000 wages, 1 kid: refundable ACTC = $450.00 = 10% of
    # ($15,000-$10,500), not $675 = 15% of the same).
    2001: 0.10
    2002: 0.10
    2003: 0.10
    2004: 0.15
    2005: 0.15
    2006: 0.15
    2007: 0.15
    2008: 0.15
    2009: 0.15
    2022: 0.15
  # refch: 1500 only for lawyr.eq.2022, else 1400 - but this per-child
  # refundable cap doesn't exist at all pre-2018 (taxsim_2022_10_21.f:
  # 25924-25928: the lawyr.le.2017 branch is just
  # chcr1=min(precrd-chcred,tenpct), no refch*ideps term whatsoever) - not
  # fetched for year<2018 in calculators/federal.py, so no 2017 entry here.
  actc_max_refundable_per_child:
    2018: 1400
    2019: 1400
    2022: 1500
    2023: 1600
  # Pre-2018: no Credit for Other Dependents at all (TCJA introduced it) -
  # CTC alone phases out above a FLAT, never-inflation-indexed threshold
  # that was unchanged 2001-2017 (the `cphas` array,
  # taxsim_2022_10_21.f:29040 - NOT the $200k/$400k TCJA-era ODC/CTC
  # combined threshold in other_dependent_credit above). Same 5%-per-$1000
  # reduction rate as the TCJA-era phaseout - taxsim_2022_10_21.f:24696-24710.
  pre2018_phaseout_threshold:
    single: {1987: 75000, 1988: 75000, 1991: 75000, 1992: 75000, 1993: 75000, 1994: 75000, 1995: 75000, 1996: 75000, 1997: 75000, 1998: 75000, 1999: 75000, 2000: 75000, 2001: 75000, 2002: 75000, 2003: 75000, 2004: 75000, 2005: 75000, 2006: 75000, 2007: 75000, 2008: 75000, 2009: 75000}
    head_of_household: {1987: 75000, 1988: 75000, 1991: 75000, 1992: 75000, 1993: 75000, 1994: 75000, 1995: 75000, 1996: 75000, 1997: 75000, 1998: 75000, 1999: 75000, 2000: 75000, 2001: 75000, 2002: 75000, 2003: 75000, 2004: 75000, 2005: 75000, 2006: 75000, 2007: 75000, 2008: 75000, 2009: 75000}
    married_separate: {1987: 55000, 1988: 55000, 1991: 55000, 1992: 55000, 1993: 55000, 1994: 55000, 1995: 55000, 1996: 55000, 1997: 55000, 1998: 55000, 1999: 55000, 2000: 55000, 2001: 55000, 2002: 55000, 2003: 55000, 2004: 55000, 2005: 55000, 2006: 55000, 2007: 55000, 2008: 55000, 2009: 55000}
    married_joint: {1987: 110000, 1988: 110000, 1991: 110000, 1992: 110000, 1993: 110000, 1994: 110000, 1995: 110000, 1996: 110000, 1997: 110000, 1998: 110000, 1999: 110000, 2000: 110000, 2001: 110000, 2002: 110000, 2003: 110000, 2004: 110000, 2005: 110000, 2006: 110000, 2007: 110000, 2008: 110000, 2009: 110000}
  pre2018_phaseout_rate_per_1000:
    1987: 50
    1994: 50
    1995: 50
    1996: 50
    1997: 50
    1998: 50
    1999: 50
    2000: 50
    2001: 50
    2002: 50
    2003: 50
    2004: 50
    2005: 50
    2006: 50
    2007: 50
    2008: 50
    2009: 50

# Child and Dependent Care Credit, nonrefundable (confirmed empirically:
# taxsim2022.exe caps it exactly at regular tax - the source's own "2021
# chcr is refundable" comment does not carry over to 2022 despite the
# 2021-style expanded rate/expense-cap schedule below applying to 2022 too,
# per taxsim_2022_10_21.f:25486-25525).
child_care_credit:
  max_qualifying_persons:  # ncccr cap - unchanged across all years
    1987: 2
    1994: 2
    1995: 2
    1996: 2
    1997: 2
    1998: 2
    1999: 2
    2000: 2
    2001: 2
    2002: 2
    2003: 2
    2004: 2
    2005: 2
    2006: 2
    2007: 2
    2008: 2
    2009: 2
    2022: 2
  max_expense_per_person:
    2021: 8000
    2022: 8000
  # Rate is a step-down formula, not a smooth interpolation - it really is
  # discontinuous at the two upper thresholds exactly as coded (e.g. at
  # AGI=183000 the phase-down formula gives 21%, but AGI=183000.01 gets a
  # flat 20% - a small real jump in the source, not a rounding artifact).
  # rate = top_rate - max(0, (agi - phase_start)/step_amount * step_rate),
  # floored at floor_rate, for agi <= phase_ceiling; else flat_rate below
  # the ceiling or 0 above it. See calculators/federal.py for the exact
  # piecewise structure (taxsim_2022_10_21.f:25519-25530).
  first_phase_start:
    2021: 125000
    2022: 125000
  first_phase_ceiling:
    2021: 183000
    2022: 183000
  first_phase_step_amount:
    2021: 2000
    2022: 2000
  top_rate:
    2021: 0.5
    2022: 0.5
  mid_rate:
    2021: 0.2
    2022: 0.2
  second_phase_start:
    2021: 400000
    2022: 400000
  second_phase_ceiling:
    2021: 438000
    2022: 438000
  second_phase_step_amount:
    2021: 2000
    2022: 2000

  # For lawyr 2003-2020 (pre-2021), the credit uses a completely different
  # shape: a single continuous step-down from a 35% ceiling to a 20% floor
  # (1 percentage point per $2000 of AGI above $15,000), which the floor
  # holds forever - it never phases down further or reaches 0%. There is
  # no $400k-income second phase-down at all in this era.
  # rate = max(floor_rate, top_rate - max(0, (agi-phase_start)/step_amount)*0.01)
  # Verified against taxsim_2022_10_21.f:25488-25525.
  #
  # 2001-2002 (pre-EGTRRA-2003-expansion) used a SMALLER, genuinely
  # different version of this same shape: $2,400/person expense cap (not
  # $3,000), 30% ceiling (not 35%), and the step-down started at $10,000 of
  # AGI (not $15,000) - taxsim_2022_10_21.f:25489-25497 (`if(lawyr.le.2002)
  # child = min(data(64),2400.0*ncccr) ... chr = .01*max(20.,30.-
