# Federal credits other than the EITC (eitc.csv, eitc_misc.yaml).
#
# Sources: 1987-2021 NBER TAXSIM (`law87`); 2022 on, Internal Revenue Code
# sections 21, 24, 6428 and 6428B, Form 1040 instructions and Revenue
# Procedures, checked against PolicyEngine-US `gov.irs.credits`.

# Child and dependent care credit: the rate times expenses up to the cap per
# qualifying person (at most two), limited to the lower earner's wages. The rate
# falls one point per `step_amount` of AGI above `phase_start` from `top_rate`
# to `floor_rate`; in 2021 (refundable) from `top_rate` to `mid_rate` over the
# first phase and from `mid_rate` to zero over the second. TAXSIM does not apply
# the credit before 1998.
child_care_credit:
  max_qualifying_persons: 2
  max_expense_per_person: {1987: 2400, 2003: 3000, 2021: 8000, 2022: 3000}
  rate:
    1987: {top_rate: 0.3, floor_rate: 0.2, phase_start: 10000, step_amount: 2000}
    2003: {top_rate: 0.35, floor_rate: 0.2, phase_start: 15000, step_amount: 2000}
    2021:
      top_rate: 0.5
      mid_rate: 0.2
      first_phase_start: 125000
      first_phase_ceiling: 183000
      first_phase_step_amount: 2000
      second_phase_start: 400000
      second_phase_ceiling: 438000
      second_phase_step_amount: 2000
    2022: {top_rate: 0.35, floor_rate: 0.2, phase_start: 15000, step_amount: 2000}
  refundable: {1987: false, 2021: true, 2022: false}
# Child tax credit from 1998 per qualifying child (under 17), and from 2018 the
# other dependent credit, reduced together by `phaseout_rate_per_1000` per
# $1,000 of AGI over the threshold. 2021 (ARPA, fully refundable): `enhanced`
# amounts for children under 6 and 6-16, with the part above
# `base_amount_offset` reduced by `low_income_phaseout_rate` of AGI over its
# threshold, up to the cap. The additional (refundable) credit from 2001:
# `actc_rate` of earned income above the floor, from 2018 at most the refundable
# amount per child. 2025 per-child amount from P.L. 119-21 sec. 70104.
child_tax_credit:
  amount_per_child: {1998: 400, 1999: 500, 2001: 600, 2003: 1000, 2018: 2000, 2025: 2200}
  enhanced:
    2021:
      young_child_amount: 3600
      older_child_amount: 3000
      base_amount_offset: 2000
      low_income_phaseout_rate: 0.05
      enhanced_cap: {single: 6250, married_joint: 12500, married_separate: 6250, head_of_household: 4375}
      low_income_phaseout_threshold: {single: 75000, married_joint: 150000, married_separate: 75000, head_of_household: 112500}
    2022: null
  phaseout_threshold:
    1987: {single: 75000, married_joint: 110000, married_separate: 55000, head_of_household: 75000}
    2018: {single: 200000, married_joint: 400000, married_separate: 200000, head_of_household: 200000}
  phaseout_rate_per_1000: 50
  actc_earned_income_floor:
    2001: 10000
    2002: 10350
    2003: 10500
    2004: 10750
    2005: 11000
    2006: 11300
    2007: 11750
    2008: 8500
    2009: 3000
    2018: 2500
  actc_rate: {2001: 0.1, 2004: 0.15}
  actc_max_refundable_per_child: {2018: 1400, 2022: 1500, 2023: 1600, 2024: 1700}
# Other dependent credit from 2018 per dependent not eligible for the child tax
# credit (phased out with it).
other_dependent_credit:
  amount: {2018: 500}
# 2020-2021 recovery rebate credits per adult and per child (2020 children under
# 13, 2021 all dependents). 2020 each payment falls by `phaseout_rate` of AGI
# above the start; 2021 phases out linearly between start and end.
recovery_rebate:
  2020:
    phaseout_start: {single: 75000, married_joint: 150000, head_of_household: 112500, married_separate: 75000}
    phaseout_rate: 0.05
    payments: [{per_adult: 1200, per_child: 500}, {per_adult: 600, per_child: 600}]
  2021:
    phaseout_start: {single: 75000, married_joint: 150000, head_of_household: 112500, married_separate: 75000}
    phaseout_end: {single: 80000, married_joint: 160000, head_of_household: 120000, married_separate: 80000}
    payment: {per_adult: 1400, per_dependent: 1400}
  2022: null
# 2009-2010 Making Work Pay credit per taxpayer: a rate on earned income up to
# the maximum, less a rate on AGI above the start, none at the ceiling, less
# Social Security benefits up to the offset.
making_work_pay:
  2009:
    rate: 0.062
    max_credit: 400
    phaseout_start: 75000
    phaseout_rate: 0.02
    income_ceiling: 95000
    benefit_offset: 250
  2011: null
# 2006 telephone excise tax refund: an amount per exemption up to a maximum,
# plus `base_exemptions` more.
telephone_excise_credit:
  2006: {per_exemption: 10, max_exemptions: 4, base_exemptions: 2}
  2007: null
