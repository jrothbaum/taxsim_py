name: Stata files

# Runs when a GitHub release is published: zips the Stata files from the
# release's tag and adds the zip to the release's assets. To add it to an
# earlier release, run it from the Actions tab and enter that release's tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.0"
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # The Stata files for SSC and `net from`: everything in stata/ that users install
  # (.ado, .sthlp, .pkg, stata.toc), without the tests and development scripts.
  stata-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Check the Stata file versions match the package
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=0
          for file in stata/*.ado; do
            if ! grep -q "^\*! taxsim_py $version " "$file"; then
              echo "::error file=$file::header is not '*! taxsim_py $version'"
              status=1
            fi
          done
          if ! grep -q "^{\* \*! version $version}" stata/taxsim_py.sthlp; then
            echo "::error file=stata/taxsim_py.sthlp::header is not '{* *! version $version}'"
            status=1
          fi
          if ! grep -q "return local version $version\$" stata/taxsim_py.ado; then
            echo "::error file=stata/taxsim_py.ado::_taxsim_py_minimum_version is not $version"
            status=1
          fi
          exit $status
      - name: Zip the Stata files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cd stata
          zip "../dist/taxsim_py-stata-$VERSION.zip" $(ls *.ado *.sthlp *.pkg *.toc 2>/dev/null)
          unzip -l "../dist/taxsim_py-stata-$VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: taxsim_py-stata-${{ steps.version.outputs.version }}
          path: dist/taxsim_py-stata-${{ steps.version.outputs.version }}.zip
      - name: Attach the zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="dist/taxsim_py-stata-$VERSION.zip"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
          else
            # No release yet: a draft holds the zip until its notes are written and it is published.
            gh release create "$TAG" "$zip" --verify-tag --draft --title "$TAG" --notes ""
            echo "Created a draft release for $TAG with the Stata zip; add notes and publish it."
          fi
