[package]
name = "taxsim_py_rust"
version = "0.4.0"
edition = "2021"
description = "Compiled Polars expression plugins for taxsim_py state calculators"
license = "MIT"
repository = "https://github.com/jrothbaum/taxsim_py"

[lib]
name = "taxsim_py_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
pyo3-polars = { version = "0.28.0", features = ["derive", "dtype-struct"] }
polars = { version = "0.55.1", default-features = false, features = ["dtype-struct"] }
polars-core = { version = "0.55.1", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
